<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:1274px;height:329px;background:#FFFFFF;" width="1274px" height="329px" viewBox="0 0 1274 329" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--class attachment--><g class="entity" data-qualified-name="attachment" id="ent0001" data-source-line="4"><rect x="498.35" y="7" width="210.256" height="140.078" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="562.319" y="24.995" fill="#000" font-size="14" textLength="82.318">Attachment</text><line x1="499.35" y1="33.297" x2="707.606" y2="33.297" style="stroke:#181818;stroke-width:0.5;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="509.35" cy="46.945" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="518.35" y="50.292" fill="#000" font-size="14" textLength="183.962">ContentHash : string «PK»</text><line x1="499.35" y1="57.594" x2="707.606" y2="57.594" style="stroke:#181818;stroke-width:1;"/><text x="504.35" y="74.589" fill="#000" font-size="14" textLength="92.757">Bytes : bytea</text><text x="504.35" y="90.886" fill="#000" font-size="14" textLength="126.362">MimeType : string</text><text x="504.35" y="107.183" fill="#000" font-size="14" textLength="121.557">SizeBytes : bigint</text><text x="504.35" y="123.479" fill="#000" font-size="14" textLength="196.629">FileName : string «nullable»</text><text x="504.35" y="139.776" fill="#000" font-size="14" textLength="198.256">UploadedAt : datetimeoffset</text></g><!--class ref--><g class="entity" data-qualified-name="ref" id="ent0002" data-source-line="14"><rect x="55.81" y="207.08" width="237.34" height="107.484" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="121.686" y="225.075" fill="#000" font-size="14" textLength="105.588">AttachmentRef</text><line x1="56.81" y1="233.377" x2="292.15" y2="233.377" style="stroke:#181818;stroke-width:0.5;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="66.81" cy="247.025" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="75.81" y="250.372" fill="#000" font-size="14" textLength="211.34">AttachmentRefId : bigint «PK»</text><line x1="56.81" y1="257.674" x2="292.15" y2="257.674" style="stroke:#181818;stroke-width:1;"/><text x="61.81" y="274.669" fill="#000" font-size="14" textLength="183.572">ContentHash : string «FK»</text><text x="61.81" y="290.966" fill="#000" font-size="14" textLength="184.769">EntityId : string «nullable»</text><text x="61.81" y="307.263" fill="#000" font-size="14" textLength="174.337">EventId : uuid «nullable»</text></g><g class="entity" data-qualified-name="GMN4" id="ent0005" data-source-line="25"><path d="M328.55,210.42 L328.55,256.56 L293.45,260.56 L328.55,264.56 L328.55,311.217 A0,0 0 0 0 328.55,311.217 L772.412,311.217 A0,0 0 0 0 772.412,311.217 L772.412,220.42 L762.412,210.42 L328.55,210.42 A0,0 0 0 0 328.55,210.42" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M762.412,210.42 L762.412,220.42 L772.412,220.42 L762.412,210.42" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="334.55" y="227.487" fill="#000" font-size="13" textLength="382.275">EntityId (Entity Store, ADR-021) and EventId (StoredEvent,</text><text x="334.55" y="242.62" fill="#000" font-size="13" textLength="409.202">event-log.md) are references into two *other* data planes, not</text><text x="334.55" y="257.753" fill="#000" font-size="13" textLength="405.996">DB-enforced FKs across them -- either or both may be set, per</text><text x="334.55" y="272.885" fill="#000" font-size="13" textLength="414">ADR-032, but never neither (nothing to link the attachment to).</text><text x="334.55" y="288.018" fill="#000" font-size="13" textLength="394.761">EventId, when set, always resolves in practice: it's the event</text><text x="334.55" y="303.151" fill="#000" font-size="13" textLength="422.862">created in the same publish call that carried this AttachmentRef.</text></g><g class="entity" data-qualified-name="GMN7" id="ent0008" data-source-line="34"><path d="M807.91,217.99 L807.91,303.654 L1259.059,303.654 L1259.059,227.99 L1249.059,217.99 L807.91,217.99" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1249.059,217.99 L1249.059,227.99 L1259.059,227.99 L1249.059,217.99" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="813.91" y="235.057" fill="#000" font-size="13" textLength="430.149">ContentHash is the real primary key in spirit (SHA-256 of Bytes) --</text><text x="813.91" y="250.19" fill="#000" font-size="13" textLength="383.583">uploading identical bytes twice reuses this row rather than</text><text x="813.91" y="265.323" fill="#000" font-size="13" textLength="411.665">inserting a second one (ADR-032's dedup-by-content-equality).</text><text x="813.91" y="280.455" fill="#000" font-size="13" textLength="406.675">Never deleted or mutated once inserted. FileName is optional,</text><text x="813.91" y="295.588" fill="#000" font-size="13" textLength="306.814">display-name only -- never part of the address.</text></g><!--link attachment to ref--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk3" data-source-line="22" data-link-type="crowfoot"><path d="M489.99,76.56 C362.96,76.56 174.48,76.56 174.48,76.56 C174.48,76.56 174.48,134.64 174.48,189.03" style="stroke:#181818;stroke-width:1;" fill="none" id="attachment-ref" codeLine="22"/><line x1="493.99" y1="72.56" x2="493.99" y2="80.56" style="stroke:#181818;stroke-width:1;"/><line x1="490.99" y1="72.56" x2="490.99" y2="80.56" style="stroke:#181818;stroke-width:1;"/><line x1="489.99" y1="76.56" x2="497.99" y2="76.56" style="stroke:#181818;stroke-width:1;"/><line x1="174.48" y1="199.03" x2="180.48" y2="207.03" style="stroke:#181818;stroke-width:1;"/><line x1="174.48" y1="199.03" x2="168.48" y2="207.03" style="stroke:#181818;stroke-width:1;"/><line x1="174.48" y1="199.03" x2="174.48" y2="207.03" style="stroke:#181818;stroke-width:1;"/><ellipse cx="174.48" cy="193.03" rx="4" ry="4" fill="none" style="stroke:#181818;stroke-width:1;"/><text x="26.909" y="57.627" fill="#000" font-size="13" textLength="223.723">ContentHash -- real FK; the blob is</text><text x="7" y="72.76" fill="#000" font-size="13" textLength="263.542">always uploaded first (two-step handoff)</text></g><!--link attachment to GMN7--><g class="link" data-entity-1="ent0001" data-entity-2="ent0008" id="lnk9" data-source-line="34" data-link-type="association"><path d="M708.95,76.56 C836.26,76.56 1033.48,76.56 1033.48,76.56 C1033.48,76.56 1033.48,163.16 1033.48,217.62" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="attachment-GMN7"/></g><?plantuml-src TLHTRzCm57tlhxZg2-tKL3043sEQrB5LGnCJsk2D5oU-RQmvTh1lLeMD_ywnKzfk6Yz9xFlXSyyvJcqqKsL2PNaKxurhLL0DMUDO-fR91wdzQCHEZFGqNeYegcwm79EAf7PBUXmH7T5dxmIhAnLhEg4emRWrdPv-kpuxGxmey3ZlXIE29TuAww-cuU_fg7_vsBipltcNPzR62JQNnlADQlYmiUkiLQNbtFv7QxtIh1U25As41QtzQXLPHdzUc-6MLtcCmAij_cUnBtft_8iP_ZFcSaYvp0VbwjU1NZwWECUxpkZdKG0zOFNfgIZyOmPuGkF3Oui2kyhIyleJISrKMb-IYJ-TiXlLH-gsPD3AX2WqaOqled1BjN8Qf4p7ev7pmXJCkXRogtJ88VZ9y4LtuWFFQ75nMxmzVZSbbEy6cEIWpiiPYZbz5DQlvur6Pk3Kb0Ex2bA2Ha-0GKSUWCDHaaXHQvNZE2DWGOEByuBToeSAm9VNC5WLV8nfm2PDp2PLmfHKeWSrggUI2VhEgEM0-epo_V6Coax80Kx0SoYQu8GwYG4KiFTzPks0Ql7J-LwR6MrgTaFhBQE1exSFUH1gWwh4L7n2HjvaVCFiQ5115W5yPANjc1pRTgKr4ArIrc9N2Rv2CCW2fFZSTNCOLISwU2iGHXNV98NsQ5zuq0mGiY7QO1eLUhhdFc68hGa6-jzTBOhZ3nzJctopfeEJ1viaMl0VWE10c6yc6cum7rfsCIqIpE0t55Gc4pCuL1iNEKYgLg2gyW3k7TDaAmEOWGExjYZxeXhW5lohKnQ-ocJVP8KqMqwCGTQcaqoUXsEstLdFzrSVA7mhniFboM_QHFYdBroAUMVxP991Tlp7igkpobf3lBXdzYy0?></g></svg>