<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:868px;height:129px;background:#FFFFFF;" width="868px" height="129px" viewBox="0 0 868 129" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--class event--><g class="entity" data-qualified-name="event" id="ent0001" data-source-line="4"><rect x="7" y="7" width="244.032" height="107.484" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="85.864" y="24.995" fill="#000" font-size="14" textLength="86.304">StoredEvent</text><line x1="8" y1="33.297" x2="250.032" y2="33.297" style="stroke:#181818;stroke-width:0.5;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="18" cy="46.945" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="27" y="50.292" fill="#000" font-size="14" textLength="218.032">SequenceNumber : bigint «PK»</text><line x1="8" y1="57.594" x2="250.032" y2="57.594" style="stroke:#181818;stroke-width:1;"/><text x="13" y="74.589" fill="#000" font-size="14" textLength="166.852">EventId : uuid «unique»</text><text x="13" y="90.886" fill="#000" font-size="14" textLength="131.995">PayloadHash : text</text><text x="13" y="107.183" fill="#000" font-size="14" textLength="116.758">ChainHash : text</text></g><g class="entity" data-qualified-name="GMN2" id="ent0003" data-source-line="13"><path d="M286.3,25.47 L286.3,56.48 L251.27,60.48 L286.3,64.48 L286.3,96.001 A0,0 0 0 0 286.3,96.001 L853.725,96.001 A0,0 0 0 0 853.725,96.001 L853.725,35.47 L843.725,25.47 L286.3,25.47 A0,0 0 0 0 286.3,25.47" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M843.725,25.47 L843.725,35.47 L853.725,35.47 L843.725,25.47" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="292.3" y="42.537" fill="#000" font-size="13" textLength="546.425">ChainHash[n] = SHA-256(Cha