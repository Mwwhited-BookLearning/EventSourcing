stroke-miterlimit:10;"/><line x1="125.058" y1="115.43" x2="509.655" y2="115.43" style="stroke:#181818;stroke-width:1;"/><text x="132.058" y="110.364" fill="#000" font-size="13" font-weight="700">1</text><text x="145.104" y="110.364" fill="#000" font-size="13" textLength="330.154">GET /events/verify?throughSequenceNumber=122</text><polygon points="1184.249,155.695,1194.249,159.695,1184.249,163.695,1188.249,159.695" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="515.655" y1="159.695" x2="1190.249" y2="159.695" style="stroke:#181818;stroke-width:1;"/><text x="522.655" y="147.063" fill="#000" font-size="13" font-weight="700">2</text><text x="535.701" y="139.497" fill="#000" font-size="13" textLength="339.873">SELECT SequenceNumber, PayloadHash, ChainHash</text><text x="535.701" y="154.629" fill="#000" font-size="13" textLength="541.918">FROM StoredEvent WHERE SequenceNumber &lt;= 122 ORDER BY SequenceNumber</text><polygon points="526.655,184.828,516.655,188.828,526.655,192.828,522.655,188.828" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="520.655" y1="188.828" x2="1195.249" y2="188.828" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="532.655" y="183.762" fill="#000" font-size="13" font-weight="700">3</text><text x="545.701" y="183.762" fill="#000" font-size="13" textLength="76.185">rows 1..122</text><line x1="515.655" y1="233.094" x2="557.655" y2="233.094" style="stroke:#181818;stroke-width:1;"/><line x1="557.655" y1="233.094" x2="557.655" y2="246.094" style="stroke:#181818;stroke-width:1;"/><line x1="516.655" y1="246.094" x2="557.655" y2="246.094" style="stroke:#181818;stroke-width:1;"/><polygon points="526.655,242.094,516.655,246.094,526.655,250.094,522.655,246.094" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="522.655" y="220.461" fill="#000" font-size="13" font-weight="700">4</text><text x="535.701" y="212.895" fill="#000" font-size="13" textLength="411.074">recompute the chain from the fixed SequenceNumber=1 seed:</text><text x="535.701" y="228.028" fill="#000" font-size="13" textLength="653.548">for n in 1..122, ChainHash'[n] = SHA-256(ChainHash'[n-1] || PayloadHash[n] || SequenceNumber[n])</text><path d="M109.058,258.094 L173.501,258.094 L173.501,265.227 L163.501,275.227 L109.058,275.227 L109.058,258.094" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="109.058" y="258.094" width="962.317" height="174.406" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="124.058" y="271.161" fill="#000" font-size="13" textLength="19.443" font-weight="700">alt</text><text x="188.501" y="270.304" fill="#000" font-size="11" textLength="415.03" font-weight="700">[every recomputed ChainHash'[n] equals the stored ChainHash[n]]</text><polygon points="136.058,302.359,126.058,306.359,136.058,310.359,132.058,306.359" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="130.058" y1="306.359" x2="514.655" y2="306.359" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="142.058" y="301.293" fill="#000" font-size="13" font-weight="700">5</text><text x="155.104" y="301.293" fill="#000" font-size="13" textLength="347.331">200 { verified: true, throughSequenceNumber: 122 }</text><path d="M520.655,290.227 L520.655,330.227 L1049.655,330.227 L1049.655,300.227 L1039.655,290.227 L520.655,290.227" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1039.655,290.227 L1039.655,300.227 L1049.655,300.227 L1039.655,290.227" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="526.655" y="307.293" fill="#000" font-size="13" textLength="379.825">"Chain integrity verified through SequenceNumber 122" --</text><text x="526.655" y="322.426" fill="#000" font-size="13" textLength="508.72">the exact display trade-order-lifecycle.md's badge sources from this response</text><line x1="109.058" y1="336.492" x2="1071.375" y2="336.492" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="114.058" y="348.703" fill="#000" font-size="11" textLength="392.842" font-weight="700">[recomputed ChainHash'[n] diverges from stored ChainHash[n]</text><text x="114.058" y="361.507" fill="#000" font-size="11" textLength="451.349" font-weight="700">at some n &lt;= 122 (a past Payload/PayloadHash/ChainHash was altered)]</text><polygon points="136.058,384.234,126.058,388.234,136.058,392.234,132.058,388.234" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="130.058" y1="388.234" x2="514.655" y2="388.234" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="142.058" y="383.168" fill="#000" font-size="13" font-weight="700">6</text><text x="155.104" y="383.168" fill="#000" font-size="13" textLength="353.552">200 { verified: false, divergesAtSequenceNumber: n }</text><path d="M520.655,372.102 L520.655,427.102 L954.655,427.102 L954.655,382.102 L944.655,372.102 L520.655,372.102" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M944.655,372.102 L944.655,382.102 L954.655,382.102 L944.655,372.102" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="526.655" y="389.168" fill="#000" font-size="13" textLength="352.308">tamper-evidence, not tamper-prevention (ADR-019) --</text><text x="526.655" y="404.301" fill="#000" font-size="13" textLength="413.677">this reports WHERE the chain first breaks, it can't undo the edit</text><text x="526.655" y="419.434" fill="#000" font-size="13" textLength="139.483">or prove who made it</text><?plantuml-src ZLHDRzf04BtxLuou12GC0QcLYffMAN7B8GqLHAggaiFW7V2gzgwxEuQWfl-zumKdXAPIRxlp-TwRsSMAhQcA9Ra8KxOEMjEI7DQdFenjKUOQJKhWQADfIwu5w275F9U44XthL9Te65h9XWpF9Ozw4-kvDvRJmhGtvFHAfyZQ6Y2ZIgiDTq8LB7Maa769dWxvS6tNmKVrJIvHjEy5yRiwVWIVable1w_lXzgxzvmvMwspEVsiIA3U13ONW-4maemwiIasWdbodOnluNbe5xxWBhUe9kYpBemprAO-Bip7sVG