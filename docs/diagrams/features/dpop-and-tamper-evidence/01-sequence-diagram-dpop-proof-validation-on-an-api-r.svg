<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SEQUENCE" style="width:1627px;height:1162px;background:#FFFFFF;" width="1627px" height="1162px" viewBox="0 0 1627 1162" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="132.871" y="392.188" width="1443.601" height="501.43" fill="none" style="stroke:#000;stroke-width:1.5;"/><g><title>Publishing System</title><rect x="145.371" y="102.594" width="8" height="956.086" fill="#000" fill-opacity="0"/><line x1="148.871" y1="102.594" x2="148.871" y2="1058.68" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>EventStore.DevIdp</title><rect x="756.365" y="102.594" width="8" height="956.086" fill="#000" fill-opacity="0"/><line x1="759.865" y1="102.594" x2="759.865" y2="1058.68" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>EventStore.Host.Core</title><rect x="1130.888" y="102.594" width="8" height="956.086" fill="#000" fill-opacity="0"/><line x1="1134.388" y1="102.594" x2="1134.388" y2="1058.68" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><text x="81.644" y="82.995" fill="#000" font-size="14" textLength="128.454">Publishing System</text><text x="10" y="99.292" fill="#000" font-size="14" textLength="271.742">(publisher-client, holds private key K1)</text><ellipse cx="148.871" cy="18.5" rx="8" ry="8" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;"/><path d="M148.871,26.5 L148.871,53.5 M135.871,34.5 L161.871,34.5 M148.871,53.5 L135.871,68.5 M148.871,53.5 L161.871,68.5" style="stroke:#181818;stroke-width:0.5;" fill="none"/><rect x="668.807" y="55" width="182.116" height="46.594" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="694.141" y="74.995" fill="#000" font-size="14" textLength="131.448">EventStore.DevIdp</text><text x="675.807" y="91.292" fill="#000" font-size="14" textLength="168.116">(OpenIddict, in-process)</text><rect x="1051.936" y="55" width="164.903" height="46.594" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1058.936" y="74.995" fill="#000" font-size="14" textLength="150.903">EventStore.Host.Core</text><text x="1073.958" y="91.292" fill="#000" font-size="14" textLength="120.859">(resource server)</text><text x="81.644" y="1071.675" fill="#000" font-size="14" textLength="128.454">Publishing System</text><text x="10" y="1087.972" fill="#000" font-size="14" textLength="271.742">(publisher-client, holds private key K1)</text><ellipse cx="148.871" cy="1099.773" rx="8" ry="8" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;"/><path d="M148.871,1107.773 L148.871,1134.773 M135.871,1115.773 L161.871,1115.773 M148.871,1134.773 L135.871,1149.773 M148.871,1134.773 L161.871,1149.773" style="stroke:#181818;stroke-width:0.5;" fill="none"/><rect x="668.807" y="1058.68" width="182.116" height="46.594" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="694.141" y="1078.675" fill="#000" font-size="14" textLength="131.448">EventStore.DevIdp</text><text x="675.807" y="1094.972" fill="#000" font-size="14" textLength="168.116">(OpenIddict, in-process)</text><rect x="1051.936" y="1058.68" width="164.903" height="46.594" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1058.936" y="1078.675" fill="#000" font-size="14" textLength="150.903">EventStore.Host.Core</text><text x="1073.958" y="1094.972" fill="#000" font-size="14" textLength="120.859">(resource server)</text><polygon points="747.865,173.125,757.865,177.125,747.865,181.125,751.865,177.125" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="148.871" y1="177.125" x2="753.865" y2="177.125" style="stroke:#181818;stroke-width:1;"/><text x="155.871" y="149.36" fill="#000" font-size="13" font-weight="700">1</text><text x="168.917" y="126.661" fill="#000" font-size="13" textLength="135.795">POST /connect/token</text><text x="168.917" y="141.793" fill="#000" font-size="13" textLength="348.74">grant_type=client_credentials, client_id, client_secret</text><text x="168.917" y="156.926" fill="#000" font-size="13" textLength="327.196">DPoP: &lt;proof JWT, typ=dpop+jwt, signed with K1,</text><text x="177.181" y="172.059" fill="#000" font-size="13" textLength="404.377">jwk=K1's public key, htm=POST, htu=/connect/token, iat, jti></text><line x1="759.865" y1="221.391" x2="801.865" y2="221.391" style="stroke:#181818;stroke-width:1;"/><line x1="801.865" y1="221.391" x2="801.865" y2="234.391" style="stroke:#181818;stroke-width:1;"/><line x1="760.865" y1="234.391" x2="801.865" y2="234.391" style="stroke:#181818;stroke-width:1;"/><polygon points="770.865,230.391,760.865,234.391,770.865,238.391,766.865,234.391" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="766.865" y="208.758" fill="#000" font-size="13" font-weight="700">2</text><text x="779.911" y="201.192" fill="#000" font-size="13" textLength="347.477">verify proof signature against its own embedded jwk;</text><text x="779.911" y="216.325" fill="#000" font-size="13" textLength="221.083">check htm/htu match this request</text><polygon points="159.871,259.523,149.871,263.523,159.871,267.523,155.871,263.523" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="153.871" y1="263.523" x2="758.865" y2="263.523" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="165.871" y="258.458" fill="#000" font-size="13" font-weight="700">3</text><text x="178.917" y="258.458" fill="#000" font-size="13" textLength="573.949">200 { access_token (JWT, cnf.jkt = SHA-256 thumbprint of K1's public key), expires_in }</text><polygon points="1122.388,334.055,1132.388,338.055,1122.388,342.055,1126.388,338.055" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="148.871" y1="338.055" x2="1128.388" y2="338.055" style="stroke:#181818;stroke-width:1;"/><text x="155.871" y="310.29" fill="#000" font-size="13" font-weight="700">4</text><text x="168.917" y="287.59" fill="#000" font-size="13" textLength="266.748">request (e.g. POST /publish/OrderPlaced)</text><text x="168.917" y="302.723" fill="#000" font-size="13" textLength="252.192">Authorization: Bearer &lt;access_token></text><text x="168.917" y="317.856" fill="#000" font-size="13" textLength="399.788">DPoP: &lt;fresh proof JWT, signed with K1, jwk=K1's public key,</text><text x="177.181" y="332.989" fill="#000" font-size="13" textLength="476.861">htm=POST, htu=&lt;this request's URL>, iat, jti, ath=hash(access_token)></text><line x1="1134.388" y1="367.188" x2="1176.388" y2="367.188" style="stroke:#181818;stroke-width:1;"/><line x1="1176.388" y1="367.188" x2="1176.388" y2="380.188" style="stroke:#181818;stroke-width:1;"/><line x1="1135.388" y1="380.188" x2="1176.388" y2="380.188" style="stroke:#181818;stroke-width:1;"/><polygon points="1145.388,376.188,1135.388,380.188,1145.388,384.188,1141.388,380.188" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1141.388" y="362.122" fill="#000" font-size="13" font-weight="700">5</text><text x="1154.433" y="362.122" fill="#000" font-size="13" textLength="455.254">validate JWT signature/expiry (existing check, ADR-006 -- unchanged)</text><path d="M132.871,392.188 L197.314,392.188 L197.314,399.32 L187.314,409.32 L132.871,409.32 L132.871,392.188" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="132.871" y="392.188" width="1443.601" height="501.43" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="147.871" y="405.254" fill="#000" font-size="13" textLength="19.443" font-weight="700">alt</text><text x="212.314" y="404.398" fill="#000" font-size="11" textLength="334.206" font-weight="700">[Authorization header missing or JWT invalid/expired]</text><polygon points="159.871,436.453,149.871,440.453,159.871,444.453,155.871,440.453" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="153.871" y1="440.453" x2="1133.388" y2="440.453" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="165.871" y="435.387" fill="#000" font-size="13" font-weight="700">6</text><text x="178.917" y="435.387" fill="#000" font-size="13" textLength="184.069">401 (type: unauthenticated)</text><line x1="132.871" y1="449.453" x2="1576.472" y2="449.453" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="137.871" y="461.664" fill="#000" font-size="11" textLength="193.778" font-weight="700">[DPoP header missing entirely]</text><polygon points="159.871,499.523,149.871,503.523,159.871,507.523,155.871,503.523" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="153.871" y1="503.523" x2="1133.388" y2="503.523" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="165.871" y="490.891" fill="#000" font-size="13" font-weight="700">7</text><text x="178.917" y="483.325" fill="#000" font-size="13" textLength="497.897">401 (type: dpop-proof-invalid, reason: "missing Authorization: Bearer token"</text><text x="178.917" y="498.458" fill="#000" font-size="13" textLength="351.222">or "access token is not DPoP-bound (missing cnf.jkt)")</text><line x1="132.871" y1="512.523" x2="1576.472" y2="512.523" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="137.871" y="524.734" fill="#000" font-size="11" textLength="433.49" font-weight="700">[DPoP proof signature does not verify against its own embedded jwk]</text><polygon points="159.871,547.461,149.871,551.461,159.871,555.461,155.871,551.461" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="153.871" y1="551.461" x2="1133.388" y2="551.461" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="165.871" y="546.395" fill="#000" font-size="13" font-weight="700">8</text><text x="178.917" y="546.395" fill="#000" font-size="13" textLength="474.348">401 (type: dpop-proof-invalid, reason: "DPoP proof signature invalid: ...")</text><line x1="132.871" y1="560.461" x2="1576.472" y2="560.461" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="137.871" y="572.671" fill="#000" font-size="11" textLength="375.096" font-weight="700">[proof's htm/htu does not match this request's method/URL]</text><polygon points="159.871,610.531,149.871,614.531,159.871,618.531,155.871,614.531" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="153.871" y1="614.531" x2="1133.388" y2="614.531" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="165.871" y="601.899" fill="#000" font-size="13" font-weight="700">9</text><text x="178.917" y="594.333" fill="#000" font-size="13" textLength="487.671">401 (type: dpop-proof-invalid, reason: "DPoP proof \"htm\"/\"htu\" does not</text><text x="178.917" y="609.465" fill="#000" font-size="13" textLength="222.708">match the request (expected ...)")</text><line x1="132.871" y1="623.531" x2="1576.472" y2="623.531" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="137.871" y="635.742" fill="#000" font-size="11" textLength="415.637" font-weight="700">[proof's ath does not match a hash of the presented access_token]</text><polygon points="159.871,673.602,149.871,677.602,159.871,681.602,155.871,677.602" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="153.871" y1="677.602" x2="1133.388" y2="677.602" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="165.871" y="664.969" fill="#000" font-size="13" textLength="18.091" font-weight="700">10</text><text x="187.962" y="657.403" fill="#000" font-size="13" textLength="481.546">401 (type: dpop-proof-invalid, reason: "DPoP proof \"ath\" does not match</text><text x="187.962" y="672.536" fill="#000" font-size="13" textLength="191.356">the presented access token")</text><line x1="132.871" y1="686.602" x2="1576.472" y2="686.602" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="137.871" y="698.812" fill="#000" font-size="11" textLength="369.596" font-weight="700">[proof's jwk thumbprint does not match the token's cnf.jkt]</text><polygon points="159.871,736.672,149.871,740.672,159.871,744.672,155.871,740.672" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="153.871" y1="740.672" x2="1133.388" y2="740.672" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="165.871" y="728.04" fill="#000" font-size="13" textLength="18.091" font-weight="700">11</text><text x="187.962" y="720.473" fill="#000" font-size="13" textLength="462.744">401 (type: dpop-proof-invalid, reason: "DPoP proof key does not match</text><text x="187.962" y="735.606" fill="#000" font-size="13" textLength="176.084">the access token's cnf.jkt")</text><path d="M1139.388,709.406 L1139.388,749.406 L1555.388,749.406 L1555.388,719.406 L1545.388,709.406 L1139.388,709.406" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1545.388,709.406 L1545.388,719.406 L1555.388,719.406 L1545.388,709.406" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="1145.388" y="726.473" fill="#000" font-size="13" textLength="315.618">this is the actual value this ADR buys -- a leaked</text><text x="1145.388" y="741.606" fill="#000" font-size="13" textLength="395.084">access_token replayed with a different key fails exactly here</text><line x1="132.871" y1="755.672" x2="1576.472" y2="755.672" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="137.871" y="767.882" fill="#000" font-size="11" textLength="373.828" font-weight="700">[proof's jti was already seen within its iat freshness window</text><text x="137.871" y="780.687" fill="#000" font-size="11" textLength="54.205" font-weight="700">(replay)]</text><polygon points="159.871,818.547,149.871,822.547,159.871,826.547,155.871,822.547" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="153.871" y1="822.547" x2="1133.388" y2="822.547" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="165.871" y="809.915" fill="#000" font-size="13" textLength="18.091" font-weight="700">12</text><text x="187.962" y="802.348" fill="#000" font-size="13" textLength="446.862">401 (type: dpop-proof-invalid, reason: "DPoP proof \"jti\" has already</text><text x="187.962" y="817.481" fill="#000" font-size="13" textLength="134.075">been used (replay)")</text><line x1="132.871" y1="831.547" x2="1576.472" y2="831.547" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="137.871" y="843.757" fill="#000" font-size="11" textLength="130.448" font-weight="700">[every check passes]</text><polygon points="159.871,881.617,149.871,885.617,159.871,889.617,155.871,885.617" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="153.871" y1="885.617" x2="1133.388" y2="885.617" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="165.871" y="872.985" fill="#000" font-size="13" textLength="18.091" font-weight="700">13</text><text x="187.962" y="865.418" fill="#000" font-size="13" textLength="284.166">normal response for the underlying request</text><text x="187.962" y="880.551" fill="#000" font-size="13" textLength="412.375">(e.g. 202 + SchemaStatus, ADR-023 -- unchanged by this ADR)</text><path d="M908.934,912.617 L908.934,1043.617 L1358.934,1043.617 L1358.934,922.617 L1348.934,912.617 L908.934,912.617" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1348.934,912.617 L1348.934,922.617 L1358.934,922.617 L1348.934,912.617" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="914.934" y="929.684" fill="#000" font-size="13" textLength="402.765">Every "reason" string above is illustrative, not a fixed enum --</text><text x="914.934" y="944.817" fill="#000" font-size="13" textLength="429.59">DpopProofValidator/DpopValidationMiddleware (EventStore.Dpop,</text><text x="914.934" y="959.95" fill="#000" font-size="13" textLength="428.295">EventStore.Host.Core) return free-text sentences describing what</text><text x="914.934" y="975.083" fill="#000" font-size="13" textLength="429.908">failed, not short machine-matchable codes like "missing_proof" or</text><text x="914.934" y="990.215" fill="#000" font-size="13" textLength="409.805">"signature_invalid". AuthScenarioAssertions.cs (the integration</text><text x="914.934" y="1005.348" fill="#000" font-size="13" textLength="426.086">tests exercising these branches) only ever asserts the 401 status</text><text x="914.934" y="1020.481" fill="#000" font-size="13" textLength="397.681">code, never a specific reason string -- no test locks the exact</text><text x="914.934" y="1035.614" fill="#000" font-size="13" textLength="425.16">wording in place, so it should not be treated as a stable contract.</text><?plantuml-src hLPDRnit4BthLmpsKWlHX-EsEQYH0RSEa3GjR4HfUrb0e9OZBQqLkIMvbjMY_xrlk2jPLjnSQi20fFNicpVpPXwfckXiircmxwaYEa_PRREeJ2YDNT5i5o9lSdjMjy_O3ulAi8q3Absb0zNUtAl8jEOTVNpTpqW5QYDwjVBH5APMDbBsxXwFPe3dqJNVVz0rC6zgjX-qDWNGZ1tMtXKSGejXTFsV0EzTYAEVy0qOdeDhVC4KsD-pRrzMjUdrMXOql1Ii2TtUp3xJk73MSX77qQtPvdRbWJsFkvgdRVYyyApnQLGL1bqXSwCFNmCZ8ERs-jRTJkWjABib_Vp7vm41PAfhLx-wswASO5QMDMrDBD6MGMw9xhRhwSVNtw1bqif2EeOcnirKcCctPlgK7fgY07KNpMKF9HmgGPbckQCsjoHIiV5CQgMC3P5C3EIsbXYIQWqIIFn3RekIYxNa6oCJRLGiIegb2UJvpuP3R5CWHrlfX2xEp-blKeLeCa-4w2nLMjZbw6uTQKgpzrV3Y-_V00VpWqb0kq7ffCZ-WFYXDX1gRYpzSwGBP9hiqzCPZrQZJgLksCOtNhE_hLJ1kf_RgoQMpfk_L3JEJkX7LfuzlJrcU7bGPeby9HtfSwB8itA8J4yLUNlS8WJ_zkcNoqTT1gHYEIrLAC-EMVGlUoZjKE6zgeoM7G6FHxt6gIaxrFrWGfHTImeDwEh