" y1="226.258" x2="739.532" y2="239.258" style="stroke:#181818;stroke-width:1;"/><line x1="698.532" y1="239.258" x2="739.532" y2="239.258" style="stroke:#181818;stroke-width:1;"/><polygon points="708.532,235.258,698.532,239.258,708.532,243.258,704.532,239.258" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="704.532" y="221.192" fill="#000" font-size="13" font-weight="700">3</text><text x="717.578" y="221.192" fill="#000" font-size="13" textLength="440.299">requested version (1) &lt; current version (2) -- a downcast is needed</text><path d="M121.865,251.258 L186.308,251.258 L186.308,258.391 L176.308,268.391 L121.865,268.391 L121.865,251.258" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="121.865" y="251.258" width="1879.044" height="300.07" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="136.865" y="264.325" fill="#000" font-size="13" textLength="19.443" font-weight="700">alt</text><text x="201.308" y="263.468" fill="#000" font-size="11" textLength="586.518" font-weight="700">[every hop from current down to the requested version has a registered downcastToPrevious]</text><polygon points="1152.876,295.523,1162.876,299.523,1152.876,303.523,1156.876,299.523" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="697.532" y1="299.523" x2="1158.876" y2="299.523" style="stroke:#181818;stroke-width:1;"/><text x="704.532" y="294.458" fill="#000" font-size="13" font-weight="700">4</text><text x="717.578" y="294.458" fill="#000" font-size="13" textLength="292.798">downcast(data, fromVersion: 2, toVersion: 1)</text><polygon points="1592.998,339.789,1602.998,343.789,1592.998,347.789,1596.998,343.789" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1164.876" y1="343.789" x2="1598.998" y2="343.789" style="stroke:#181818;stroke-width:1;"/><text x="1171.876" y="331.157" fill="#000" font-size="13" font-weight="700">5</text><text x="1184.922" y="323.59" fill="#000" font-size="13" textLength="291.732">evaluate v2's downcastToPrevious "Amount"</text><text x="1184.922" y="338.723" fill="#000" font-size="13" textLength="403.076">against { OrderId: "o-1", Amount: 42.00, Status: "Unknown" }</text><polygon points="1175.876,368.922,1165.876,372.922,1175.876,376.922,1171.876,372.922" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1169.876" y1="372.922" x2="1603.998" y2="372.922" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="1181.876" y="367.856" fill="#000" font-size="13" font-weight="700">6</text><text x="1194.922" y="367.856" fill="#000" font-size="13" textLength="220.53">{ OrderId: "o-1", Amount: 42.00 }</text><path d="M1609.998,356.789 L1609.998,396.789 L1978.998,396.789 L1978.998,366.789 L1968.998,356.789 L1609.998,356.789" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1968.998,356.789 L1968.998,366.789 L1978.998,366.789 L1968.998,356.789" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="1615.998" y="373.856" fill="#000" font-size="13" textLength="348.912">Status is dropped -- v1 never had it, and v1's schema</text><text x="1615.998" y="388.989" fill="#000" font-size="13" textLength="330.897">would reject an unexpected field it doesn't declare</text><polygon points="708.532,419.188,698.532,423.188,708.532,427.188,704.532,423.188" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="702.532" y1="423.188" x2="1163.876" y2="423.188" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="714.532" y="418.122" fill="#000" font-size="13" font-weight="700">7</text><text x="727.578" y="418.122" fill="#000" font-size="13" textLength="297.502">{ OrderId: "o-1", Amount: 42.00 } -- v1 shape</text><polygon points="148.865,448.32,138.865,452.32,148.865,456.32,144.865,452.32" fill=