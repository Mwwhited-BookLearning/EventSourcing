<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:811px;height:610px;background:#FFFFFF;" width="811px" height="610px" viewBox="0 0 811 610" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--class event--><g class="entity" data-qualified-name="event" id="ent0001" data-source-line="4"><rect x="15.1" y="30.843" width="374.202" height="188.969" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="159.049" y="48.838" fill="#000" font-size="14" textLength="86.304">StoredEvent</text><line x1="16.1" y1="57.14" x2="388.302" y2="57.14" style="stroke:#181818;stroke-width:0.5;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="26.1" cy="70.788" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="35.1" y="74.135" fill="#000" font-size="14" textLength="218.032">SequenceNumber : bigint «PK»</text><line x1="16.1" y1="81.436" x2="388.302" y2="81.436" style="stroke:#181818;stroke-width:1;"/><text x="21.1" y="98.432" fill="#000" font-size="14" textLength="166.852">EventId : uuid «unique»</text><text x="21.1" y="114.728" fill="#000" font-size="14" textLength="107.693">EntityId : string</text><text x="21.1" y="131.025" fill="#000" font-size="14" textLength="128.249">EventType : string</text><text x="21.1" y="147.322" fill="#000" font-size="14" textLength="140.725">SchemaVersion : int</text><text x="21.1" y="163.619" fill="#000" font-size="14" textLength="362.202">EventKind : enum {Original, UpcastMaterialization}</text><text x="21.1" y="179.916" fill="#000" font-size="14" textLength="224.15">MaterializationOfEventId : uuid?</text><text x="21.1" y="196.213" fill="#000" font-size="14" textLength="96.722">Payload : text</text><text x="21.1" y="212.51" fill="#000" font-size="14" textLength="196">OccurredAt : datetimeoffset</text></g><!--class etd--><g class="entity" data-qualified-name="etd" id="ent0002" data-source-line="17"><rect x="92.8" y="279.813" width="218.801" height="140.078" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="131.083" y="297.808" fill="#000" font-size="14" textLength="142.235">EventTypeDefinition</text><line x1="93.8" y1="306.11" x2="310.601" y2="306.11" style="stroke:#181818;stroke-width:0.5;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="103.8" cy="319.758" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="112.8" y="323.105" fill="#000" font-size="14" textLength="133.376">AppId : string «PK»</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="103.8" cy="336.055" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="112.8" y="339.402" fill="#000" font-size="14" textLength="134.313">Name : string «PK»</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="103.8" cy="352.352" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="112.8" y="355.698" fill="#000" font-size="14" textLength="123.642">Version : int «PK»</text><line x1="93.8" y1="363" x2="310.601" y2="363" style="stroke:#181818;stroke-width:1;"/><text x="98.8" y="379.995" fill="#000" font-size="14" textLength="98.499">IsActive : bool</text><text x="98.8" y="396.292" fill="#000" font-size="14" textLength="205.16">UpcastFromPrevious : string?</text><text x="98.8" y="412.589" fill="#000" font-size="14" textLength="206.801">DowncastToPrevious : string?</text></g><g class="entity" data-qualified-name="GMN5" id="ent0006" data-source-line="31"><path d="M441.94,97.633 L441.94,121.823 L389.66,125.823 L441.94,129.823 L441.94,153.031 A0,0 0 0 0 441.94,153.031 L796.459,153.031 A0,0 0 0 0 796.459,153.031 L796.459,107.633 L786.459,97.633 L441.94,97.633 A0,0 0 0 0 441.94,97.633" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M786.459,97.633 L786.459,107.633 L796.459,107.633 L786.459,97.633" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="447.94" y="114.7" fill="#000" font-size="13" textLength="333.519">Fold (ADR-021, entity-concept.md) reads only rows</text><text x="447.94" y="129.832" fill="#000" font-size="13" textLength="329.374">where EventKind = Original. UpcastMaterialization</text><text x="447.94" y="144.965" fill="#000" font-size="13" textLength="312.349">rows are never in the fold step's input set at all.</text></g><g class="entity" data-qualified-name="GMN8" id="ent0009" data-source-line="37"><path d="M6,479.893 L6,595.822 A0,0 0 0 0 6,595.822 L398.401,595.822 A0,0 0 0 0 398.401,595.822 L398.401,489.893 L388.401,479.893 L206.2,479.893 L202.2,420.123 L198.2,479.893 L6,479.893 A0,0 0 0 0 6,479.893" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M388.401,479.893 L388.401,489.893 L398.401,489.893 L388.401,479.893" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="12" y="496.96" fill="#000" font-size="13" textLength="339.314">UpcastFromPrevious drives UpcastChain (ADR-018),</text><text x="12" y="512.092" fill="#000" font-size="13" textLength="371.401">materialized on success (ADR-027). DowncastToPrevious</text><text x="12" y="527.225" fill="#000" font-size="13" textLength="365.53">drives DowncastChain (ADR-028), read-time only, never</text><text x="12" y="542.358" fill="#000" font-size="13" textLength="279.1">materialized. Full column list (ChangeKind,</text><text x="12" y="557.491" fill="#000" font-size="13" textLength="247.92">EntityIdField, RequiredClaims, ...) is in</text><text x="12" y="572.624" fill="#000" font-size="13" textLength="352.638">../data/schema-registry.md -- this diagram shows only</text><text x="12" y="587.756" fill="#000" font-size="13" textLength="239.459">what this doc's own scenarios touch.</text></g><!--link event to event--><g class="link" data-entity-1="ent0001" data-entity-2="ent0001" id="lnk3" data-source-line="27" data-link-type="dependency"><path d="M202.2