nt</text><rect x="776.924" y="646.32" width="122.199" height="30.297" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="783.924" y="666.315" fill="#000" font-size="14" textLength="108.199">EventAppender</text><text x="1044.609" y="659.315" fill="#000" font-size="14" textLength="157.972">Event &amp; Schema Store</text><path d="M1108.595,672.617 C1108.595,662.617 1126.595,662.617 1126.595,662.617 C1126.595,662.617 1144.595,662.617 1144.595,672.617 L1144.595,698.617 C1144.595,708.617 1126.595,708.617 1126.595,708.617 C1126.595,708.617 1108.595,708.617 1108.595,698.617 L1108.595,672.617" style="stroke:#181818;stroke-width:0.5;" fill="#E2E2F0"/><path d="M1108.595,672.617 C1108.595,682.617 1126.595,682.617 1126.595,682.617 C1126.595,682.617 1144.595,682.617 1144.595,672.617" style="stroke:#181818;stroke-width:0.5;" fill="none"/><rect x="1423.164" y="646.32" width="136.411" height="46.594" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1467.857" y="666.315" fill="#000" font-size="14" textLength="47.024">Router</text><text x="1430.164" y="682.612" fill="#000" font-size="14" textLength="122.411">(async, ADR-023)</text><polygon points="408.709,142.859,418.709,146.859,408.709,150.859,412.709,146.859" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="91.849" y1="146.859" x2="414.709" y2="146.859" style="stroke:#181818;stroke-width:1;"/><text x="98.849" y="134.227" fill="#000" font-size="13" font-weight="700">1</text><text x="111.895" y="126.661" fill="#000" font-size="13" textLength="192.048">POST /publish/SensorReading</text><text x="111.895" y="141.793" fill="#000" font-size="13" textLength="291.814">{ payload, attestedActorId, attestedClaims }</text><polygon points="826.023,187.125,836.023,191.125,826.023,195.125,830.023,191.125" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="420.709" y1="191.125" x2="832.023" y2="191.125" style="stroke:#181818;stroke-width:1;"/><text x="427.709" y="178.493" fill="#000" font-size="13" font-weight="700">2</text><text x="440.754" y="170.926" fill="#000" font-size="13" textLength="380.269">append(StoredEvent{ ..., AttestedActorId, AttestedClaims,</text><text x="449.019" y="186.059" fill="#000" font-size="13" textLength="210.298">AuthorityStatus: "unattested" })</text><polygon points="1114.595,216.258,1124.595,220.258,1114.595,224.258,1118.595,220.258" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="838.023" y1="220.258" x2="1120.595" y2="220.258" style="stroke:#181818;stroke-width:1;"/><text x="845.023" y="215.192" fill="#000" font-size="13" font-weight="700">3</text><text x="858.069" y="215.192" fill="#000" font-size="13" textLength="251.526">INSERT StoredEvent (Status: received)</text><polygon points="102.849,260.523,92.849,264.523,102.849,268.523,98.849,264.523" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="96.849" y1="264.523" x2="837.023" y2="264.523" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="108.849" y="251.891" fill="#000" font-size="13" font-weight="700">4</text><text x="121.895" y="244.325" fill="#000" font-size="13" textLength="252.561">202 { correlationId, status: "received",</text><text x="130.159" y="259.458" fill="#000" font-size="13" textLength="357.652">authorityStatus: "unattested", schemaStatus: null, ... }</text><path d="M96.849,277.523 L96.849,362.523 L429.849,362.523 L429.849,287.523 L419.849,277.523 L96.849,277.523" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M419.849,277.523 L419.849,287.523 L429.849,287.523 L419.849,277.523" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="102.849" y="294.59" fill="#000" font-size="13" textLength="294.138">Persisted immediately, exactly like any other</text><text x="102.849" y="309.723" fill="#000" font-size="13" textLength="312.165">publish (ADR-023). A submitter whose authority</text><text x="102.849" y="324.856" fill="#000" font-size="13" textLength="299.819">can't be checked synchronously never blocks,</text><text x="102.849" y="339.989" fill="#000" font-size="13" textLength="290.5">delays, or gets treated differently at capture</text><text x="102.849" y="355.122" fill="#000" font-size="13" textLength="228.922">time -- the whole point of this ADR.</text><text x="748.512" y="392.398" fill="#000" font-size="11" textLength="86.195">asynchronously</text><polygon points="1137.595,426.125,1127.595,430.125,1137.595,434.125,1133.595,430.125" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1131.595" y1="430.125" x2="1490.37" y2="430.125" style="stroke:#181818;stroke-width:1;"/><text x="1143.595" y="425.059" fill="#000" font-size="13" font-weight="700">5</text><text x="1156.64" y="425.059" fill="#000" font-size="13" textLength="160.456">pick up "received" event</text><polygon points="1137.595,455.258,1127.595,459.258,1137.595,463.258,1133.595,459.258" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1131.595" y1="459.258" x2="1490.37" y2="459.258" style="stroke:#181818;stroke-width:1;"/><text x="1143.595" y="454.192" fill="#000" font-size="13" font-weight="700">6</text><text x="1156.64" y="454.192" fill="#000" font-size="13" textLength="216.925">validate schema, resolve EntityId</text><polygon points="1137.595,484.391,1127.595,488.391,1137.595,492.391,1133.595,488.391" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1131.595" y1="488.391" x2="1490.37" y2="488.391" style="stroke:#181818;stroke-width:1;"/><text x="1143.595" y="483.325" fill="#000" font-size="13" font-weight="700">7</text><text x="1156.64" y="483.325" fill="#000" font-size="13" textLength="327.729">fold into LiveEntityStoreRow (ungated -- ADR-042)</text><polygon points="1137.595,513.523,1127.595,517.523,1137.595,521.523,1133.595,517.523" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1131.595" y1="517.523" x2="1490.37" y2="517.523" style="stroke:#181818;stroke-width:1;"/><text x="1143.595" y="512.458" fill="#000" font-size="13" font-weight="700">8</text><text x="1156.64" y="512.458" fill="#000" font-size="13" textLength="289.84">UPDATE StoredEvent SET Status = "applied"</text><path d="M1496.37,530.523 L1496.37,630.523 L1832.37,630.523 L1832.37,540.523 L1822.37,530.523 L1496.37,530.523" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1822.37,530.523 L1822.37,540.523 L1832.37,540.523 L1822.37,530.523" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="1502.37" y="547.59" fill="#000" font-size="13" textLength="299.571">AuthorityStatus stays "unattested" here -- the</text><text x="1502.37" y="562.723" fill="#000" font-size="13" textLength="254.782">router's job is schema/entity resolution</text><text x="1502.37" y="577.856" fill="#000" font-size="13" textLength="256.35">(ADR-023), never authority review. The</text><text x="1502.37" y="592.989" fill="#000" font-size="13" textLength="315.459">AUTHORITATIVE Entity Store is NOT updated yet</text><text x="1502.37" y="608.122" fill="#000" font-size="13" textLength="285.251">(ADR-042) -- only the Live View is, explicitly</text><text x="1502.37" y="623.254" fill="#000" font-size="13" textLength="263.555">labeled isAuthoritative: false when read.</text><?plantuml-src VLJ1Rjim3BtxAmWVrXHmqwBRAS0666k61HZQ8d5xweMsc5YB8XcIdDOe-k-ZP3jBCc2to7gFV7ny2hRUw7PNaasmyiP2-aEI4f27mukUcFLQIKrN5JPOAe9AITB-CWLqqBIbagvcQeFMoqesg3sa2rsQDvXhqHYfVKJIS3W5plTSAcyQlYKRSJWS4e4UItGqWE0JhAgQTWWhbaKHAyhJQalJUWgIqNMwoY2_MrxTt7xkfTfucIG7oN3rxQ1g1eyFgmAkXylh5Mbdx99GIBrvqU_GOASCYWpGUtAUH7HdSVJXkqAvS_2HZ3L3_N6QsV1h4iMBED4xJATJ5dbUC3yfcBreWBprjR7ITokFldKpI5izzatXup8P-u