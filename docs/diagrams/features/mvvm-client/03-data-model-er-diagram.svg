.403" fill="#000" font-size="13" textLength="192.854">(ADR-011) dedups on -- same</text><text x="298.69" y="120.535" fill="#000" font-size="13" textLength="199.907">mechanism, not a second one.</text></g><g class="entity" data-qualified-name="GMN9" id="ent0010" data-source-line="59"><path d="M303.48,488.64 L303.48,574.304 A0,0 0 0 0 303.48,574.304 L567.322,574.304 A0,0 0 0 0 567.322,574.304 L567.322,498.64 L557.322,488.64 L439.4,488.64 L435.4,429.05 L431.4,488.64 L303.48,488.64 A0,0 0 0 0 303.48,488.64" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M557.322,488.64 L557.322,498.64 L567.322,498.64 L557.322,488.64" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="309.48" y="505.707" fill="#000" font-size="13" textLength="226.154">InstanceId is the whole reason two</text><text x="309.48" y="520.84" fill="#000" font-size="13" textLength="242.728">concurrently-running client instances</text><text x="309.48" y="535.973" fill="#000" font-size="13" textLength="218.41">(different EntityType/subscription</text><text x="309.48" y="551.105" fill="#000" font-size="13" textLength="242.842">targets) never share outbox or cache</text><text x="309.48" y="566.238" fill="#000" font-size="13" textLength="128.496">state, per ADR-039.</text></g><g class="entity" data-qualified-name="GMN12" id="ent0013" data-source-line="67"><path d="M924.77,27.8 L924.77,89.3 L889.96,93.3 L924.77,97.3 L924.77,158.862 A0,0 0 0 0 924.77,158.862 L1192.015,158.862 A0,0 0 0 0 1192.015,158.862 L1192.015,37.8 L1182.015,27.8 L924.77,27.8 A0,0 0 0 0 924.77,27.8" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1182.015,27.8 L1182.015,37.8 L1192.015,37.8 L1182.015,27.8" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="930.77" y="44.867" fill="#000" font-size="13" textLength="231.67">TemplateContent's rendered text is</text><text x="930.77" y="60" fill="#000" font-size="13" textLength="225.132">required to reference a translation</text><text x="930.77" y="75.133" fill="#000" font-size="13" textLength="209.282">key, never a hardcoded literal --</text><text x="930.77" y="90.265" fill="#000" font-size="13" textLength="246.245">ADR-087. The string a key resolves to</text><text x="930.77" y="105.398" fill="#000" font-size="13" textLength="227.424">for a given locale is domain-owned</text><text x="930.77" y="120.531" fill="#000" font-size="13" textLength="228.776">content, not part of this framework</text><text x="930.77" y="135.664" fill="#000" font-size="13" textLength="231.156">schema (no TMS/resource format is</text><text x="930.77" y="150.797" fill="#000" font-size="13" textLength="96.688">adopted here).</text></g><!--link outbox to cache--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk4" data-source-line="48" data-link-type="crowfoot"><path d="M276.06,162.3 C346.65,162.3 402.71,162.3 402.71,162.3 C402.71,162.3 402.71,191.43 402.71,231.18" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="outbox-cache" codeLine="48"/><line x1="266.06" y1="162.3" x2="258.06" y2="168.3" style="stroke:#181818;stroke-width:1;"/><line x1="266.06" y1="162.3" x2="258.06" y2="156.3" style="stroke:#181818;stroke-width:1;"/><line x1="266.06" y1="162.3" x2="258.06" y2="162.3" style="stroke:#181818;stroke-width:1;"/><ellipse cx="272.06" cy="162.3" rx="4" ry="4" fill="none" style="stroke:#181818;stroke-width:1;"/><line x1="406.71" y1="235.18" x2="398.71" y2="235.18" style="stroke:#181818;stroke-width:1;"/><line x1="406.71" y1="232.18" x2="398.71" y2="232.18" style="stroke:#181818;stroke-width:1;"/><line x1="402.71" y1="231.18" x2="402.71" y2="239.18" style="stroke:#181818;stroke-width:1;"/><text x="340.031" y="175.367" fill="#000" font-size="13" textLength="190.43">same InstanceId namespace;</text><text x="303.57" y="190.5" fill="#000" font-size="13" textLength="263.352">no shared outbox state across instances</text></g><!--link viewdef to cache--><g class="link" data-entity-1="ent0001" 