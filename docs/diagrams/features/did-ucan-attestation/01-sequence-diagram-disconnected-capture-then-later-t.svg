<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SEQUENCE" style="width:1687px;height:1084px;background:#FFFFFF;" width="1687px" height="1084px" viewBox="0 0 1687 1084" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="804.408" y="606.547" width="813.687" height="238.133" fill="none" style="stroke:#000;stroke-width:1.5;"/><g><title>Field Client</title><rect x="104.126" y="118.891" width="8" height="845.453" fill="#000" fill-opacity="0"/><line x1="107.626" y1="118.891" x2="107.626" y2="964.344" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>Inbox . Publish Endpoint</title><rect x="609.705" y="118.891" width="8" height="845.453" fill="#000" fill-opacity="0"/><line x1="613.205" y1="118.891" x2="613.205" y2="964.344" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>Router</title><rect x="816.908" y="118.891" width="8" height="845.453" fill="#000" fill-opacity="0"/><line x1="820.408" y1="118.891" x2="820.408" y2="964.344" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>EventStore.DevIdp</title><rect x="1267.154" y="118.891" width="8" height="845.453" fill="#000" fill-opacity="0"/><line x1="1270.654" y1="118.891" x2="1270.654" y2="964.344" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>Event . Entity Store</title><rect x="1598.595" y="118.891" width="8" height="845.453" fill="#000" fill-opacity="0"/><line x1="1602.095" y1="118.891" x2="1602.095" y2="964.344" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><text x="65.47" y="82.995" fill="#000" font-size="14" textLength="78.313">Field Client</text><text x="28.071" y="99.292" fill="#000" font-size="14" textLength="153.111">(offline, holds a UCAN</text><text x="10" y="115.589" fill="#000" font-size="14" textLength="189.253">delegated from a root DID)</text><ellipse cx="107.626" cy="18.5" rx="8" ry="8" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;"/><path d="M107.626,26.5 L107.626,53.5 M94.626,34.5 L120.626,34.5 M107.626,53.5 L94.626,68.5 M107.626,53.5 L120.626,68.5" style="stroke:#181818;stroke-width:0.5;" fill="none"/><rect x="521.573" y="87.594" width="183.265" height="30.297" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="528.573" y="107.589" fill="#000" font-size="14" textLength="169.265">Inbox / Publish Endpoint</text><rect x="714.837" y="71.297" width="211.142" height="46.594" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="796.896" y="91.292" fill="#000" font-size="14" textLength="47.024">Router</text><text x="721.837" y="107.589" fill="#000" font-size="14" textLength="197.142">(background, advisory-only)</text><rect x="1151.459" y="71.297" width="238.39" height="46.594" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1204.93" y="91.292" fill="#000" font-size="14" textLength="131.448">EventStore.DevIdp</text><text x="1158.459" y="107.589" fill="#000" font-size="14" textLength="224.39">(OAuth Token Exchange bridge)</text><text x="1527.817" y="115.589" fill="#000" font-size="14" textLength="142.557">Event &amp; Entity Store</text><path d="M1584.095,66.594 C1584.095,56.594 1602.095,56.594 1602.095,56.594 C1602.095,56.594 1620.095,56.594 1620.095,66.594 L1620.095,92.594 C1620.095,102.594 1602.095,102.594 1602.095,102.594 C1602.095,102.594 1584.095,102.594 1584.095,92.594 L1584.095,66.594" style="stroke:#181818;stroke-width:0.5;" fill="#E2E2F0"/><path d="M1584.095,66.594 C1584.095,76.594 1602.095,76.594 1602.095,76.594 C1602.095,76.594 1620.095,76.594 1620.095,66.594" style="stroke:#181818;stroke-width:0.5;" fill="none"/><text x="65.47" y="977.339" fill="#000" font-size="14" textLength="78.313">Field Client</text><text x="28.071" y="993.636" fill="#000" font-size="14" textLength="153.111">(offline, holds a UCAN</text><text x="10" y="1009.933" fill="#000" font-size="14" textLength="189.253">delegated from a root DID)</text><ellipse cx="107.626" cy="1021.734" rx="8" ry="8" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;"/><path d="M107.626,1029.734 L107.626,1056.734 M94.626,1037.734 L120.626,1037.734 M107.626,1056.734 L94.626,1071.734 M107.626,1056.734 L120.626,1071.734" style="stroke:#181818;stroke-width:0.5;" fill="none"/><rect x="521.573" y="964.344" width="183.265" height="30.297" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="528.573" y="984.339" fill="#000" font-size="14" textLength="169.265">Inbox / Publish Endpoint</text><rect x="714.837" y="964.344" width="211.142" height="46.594" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="796.896" y="984.339" fill="#000" font-size="14" textLength="47.024">Router</text><text x="721.837" y="1000.636" fill="#000" font-size="14" textLength="197.142">(background, advisory-only)</text><rect x="1151.459" y="964.344" width="238.39" height="46.594" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1204.93" y="984.339" fill="#000" font-size="14" textLength="131.448">EventStore.DevIdp</text><text x="1158.459" y="1000.636" fill="#000" font-size="14" textLength="224.39">(OAuth Token Exchange bridge)</text><text x="1527.817" y="977.339" fill="#000" font-size="14" textLength="142.557">Event &amp; Entity Store</text><path d="M1584.095,990.641 C1584.095,980.641 1602.095,980.641 1602.095,980.641 C1602.095,980.641 1620.095,980.641 1620.095,990.641 L1620.095,1016.641 C1620.095,1026.641 1602.095,1026.641 1602.095,1026.641 C1602.095,1026.641 1584.095,1026.641 1584.095,1016.641 L1584.095,990.641" style="stroke:#181818;stroke-width:0.5;" fill="#E2E2F0"/><path d="M1584.095,990.641 C1584.095,1000.641 1602.095,1000.641 1602.095,1000.641 C1602.095,1000.641 1620.095,1000.641 1620.095,990.641" style="stroke:#181818;stroke-width:0.5;" fill="none"/><rect x="10" y="147.457" width="1666.374" height="3" fill="#EEE" style="stroke:#EEE;stroke-width:1;"/><line x1="10" y1="147.457" x2="1676.374" y2="147.457" style="stroke:#000;stroke-width:1;"/><line x1="10" y1="150.457" x2="1676.374" y2="150.457" style="stroke:#000;stroke-width:1;"/><rect x="664.127" y="136.891" width="358.119" height="23.133" fill="#EEE" style="stroke:#000;stroke-width:2;"/><text x="670.127" y="152.958" fill="#000" font-size="13" textLength="339.593" font-weight="700">While disconnected from the identity provider</text><polygon points="601.205,217.422,611.205,221.422,601.205,225.422,605.205,221.422" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="107.626" y1="221.422" x2="607.205" y2="221.422" style="stroke:#181818;stroke-width:1;"/><text x="114.626" y="201.223" fill="#000" font-size="13" font-weight="700">1</text><text x="127.672" y="186.09" fill="#000" font-size="13" textLength="266.227">POST /publish/FieldObservationRecorded</text><text x="127.672" y="201.223" fill="#000" font-size="13" textLength="468.533">{ payload, attestedClaims: { type: "ucan", invocation: &lt;raw UCAN> } }</text><text x="127.672" y="216.356" fill="#000" font-size="13" textLength="269.991">(no bearer JWT -- none obtainable offline)</text><polygon points="1590.095,261.688,1600.095,265.688,1590.095,269.688,1594.095,265.688" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="613.205" y1="265.688" x2="1596.095" y2="265.688" style="stroke:#181818;stroke-width:1;"/><text x="620.205" y="253.055" fill="#000" font-size="13" font-weight="700">2</text><text x="633.25" y="245.489" fill="#000" font-size="13" textLength="131.27">INSERT StoredEvent</text><text x="633.25" y="260.622" fill="#000" font-size="13" textLength="405.228">(AttestedClaims = raw UCAN, AuthorityStatus = "unattested")</text><polygon points="118.626,290.82,108.626,294.82,118.626,298.82,114.626,294.82" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="112.626" y1="294.82" x2="612.205" y2="294.82" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="124.626" y="289.754" fill="#000" font-size="13" font-weight="700">3</text><text x="137.672" y="289.754" fill="#000" font-size="13" textLength="370.373">202 { status: "received", authorityStatus: "unattested" }</text><path d="M535.25,307.82 L535.25,362.82 L1679.25,362.82 L1679.25,317.82 L1669.25,307.82 L535.25,307.82" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1669.25,307.82 L1669.25,317.82 L1679.25,317.82 L1669.25,307.82" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="896.613" y="324.887" fill="#000" font-size="13" textLength="402.422">Persisted immediately, same as any other publish (ADR-023's</text><text x="896.613" y="340.02" fill="#000" font-size="13" textLength="413.074">Inbox pattern, ADR-011's Idempotent Receiver). Nothing above</text><text x="896.613" y="355.153" fill="#000" font-size="13" textLength="347.883">this line ever blocks on identity-provider reachability.</text><rect x="10" y="388.785" width="1666.374" height="3" fill="#EEE" style="stroke:#EEE;stroke-width:1;"/><line x1="10" y1="388.785" x2="1676.374" y2="388.785" style="stroke:#000;stroke-width:1;"/><line x1="10" y1="391.785" x2="1676.374" y2="391.785" style="stroke:#000;stroke-width:1;"/><rect x="627.612" y="378.219" width="431.149" height="23.133" fill="#EEE" style="stroke:#000;stroke-width:2;"/><text x="633.612" y="394.286" fill="#000" font-size="13" textLength="412.623" font-weight="700">Later, once connectivity to the identity provider returns</text><polygon points="1590.095,443.617,1600.095,447.617,1590.095,451.617,1594.095,447.617" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="820.408" y1="447.617" x2="1596.095" y2="447.617" style="stroke:#181818;stroke-width:1;"/><text x="827.408" y="434.985" fill="#000" font-size="13" font-weight="700">4</text><text x="840.454" y="427.418" fill="#000" font-size="13" textLength="334.407">pick up events with AuthorityStatus = "unattested"</text><text x="840.454" y="442.551" fill="#000" font-size="13" textLength="333.658">and a raw AttestedClaims UCAN pending exchange</text><polygon points="1258.654,533.281,1268.654,537.281,1258.654,541.281,1262.654,537.281" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="820.408" y1="537.281" x2="1264.654" y2="537.281" style="stroke:#181818;stroke-width:1;"/><text x="827.408" y="501.95" fill="#000" font-size="13" font-weight="700">5</text><text x="840.454" y="471.684" fill="#000" font-size="13" textLength="121.469">POST /oauth/token</text><text x="840.454" y="486.817" fill="#000" font-size="13" textLength="406.472">grant_type=urn:ietf:params:oauth:grant-type:token-exchange</text><text x="840.454" y="501.95" fill="#000" font-size="13" textLength="231.969">subject_token=&lt;UCAN invocation></text><text x="840.454" y="517.083" fill="#000" font-size="13" textLength="329.443">subject_token_type=urn:your-org:token-type:ucan</text><text x="840.454" y="532.215" fill="#000" font-size="13" textLength="397.059">requested_token_type=urn:ietf:params:oauth:token-type:jwt</text><line x1="1270.654" y1="581.547" x2="1312.654" y2="581.547" style="stroke:#181818;stroke-width:1;"/><line x1="1312.654" y1="581.547" x2="1312.654" y2="594.547" style="stroke:#181818;stroke-width:1;"/><line x1="1271.654" y1="594.547" x2="1312.654" y2="594.547" style="stroke:#181818;stroke-width:1;"/><polygon points="1281.654,590.547,1271.654,594.547,1281.654,598.547,1277.654,594.547" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1277.654" y="568.915" fill="#000" font-size="13" font-weight="700">6</text><text x="1290.7" y="561.348" fill="#000" font-size="13" textLength="205.988">validate UCAN delegation chain</text><text x="1290.7" y="576.481" fill="#000" font-size="13" textLength="304.396">(self-verifying -- no callback to any third party)</text><path d="M804.408,606.547 L868.851,606.547 L868.851,613.68 L858.851,623.68 L804.408,623.68 L804.408,606.547" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="804.408" y="606.547" width="813.687" height="238.133" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="819.408" y="619.614" fill="#000" font-size="13" textLength="19.443" font-weight="700">alt</text><text x="883.851" y="618.757" fill="#000" font-size="11" textLength="310.761" font-weight="700">[UCAN chain cryptographically/syntactically valid]</text><polygon points="831.408,665.945,821.408,669.945,831.408,673.945,827.408,669.945" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="825.408" y1="669.945" x2="1269.654" y2="669.945" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="837.408" y="657.313" fill="#000" font-size="13" font-weight="700">7</text><text x="850.454" y="649.747" fill="#000" font-size="13" textLength="179.778">200 { access_token (JWT) }</text><text x="850.454" y="664.879" fill="#000" font-size="13" textLength="413.201">JWT claims: provenance, authority_status, delegation_chain_ref</text><polygon points="1590.095,740.477,1600.095,744.477,1590.095,748.477,1594.095,744.477" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="820.408" y1="744.477" x2="1596.095" y2="744.477" style="stroke:#181818;stroke-width:1;"/><text x="827.408" y="716.711" fill="#000" font-size="13" font-weight="700">8</text><text x="840.454" y="694.012" fill="#000" font-size="13" textLength="136.684">UPDATE StoredEvent</text><text x="840.454" y="709.145" fill="#000" font-size="13" textLength="197.114">AttestedClaims := JWT claims,</text><text x="840.454" y="724.278" fill="#000" font-size="13" textLength="388.807">AuthorityStatus := "pending_review" (still NOT "accepted"),</text><text x="840.454" y="739.411" fill="#000" font-size="13" textLength="322.296">DelegationChainRef := attachment ref (ADR-032)</text><line x1="804.408" y1="753.477" x2="1618.095" y2="753.477" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="809.408" y="765.687" fill="#000" font-size="11" textLength="411.592" font-weight="700">[UCAN chain invalid (malformed, expired, broken delegation link)]</text><polygon points="831.408,788.414,821.408,792.414,831.408,796.414,827.408,792.414" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="825.408" y1="792.414" x2="1269.654" y2="792.414" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="837.408" y="787.348" fill="#000" font-size="13" font-weight="700">9</text><text x="850.454" y="787.348" fill="#000" font-size="13" textLength="113.331">400 invalid_grant</text><polygon points="1590.095,832.68,1600.095,836.68,1590.095,840.68,1594.095,836.68" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="820.408" y1="836.68" x2="1596.095" y2="836.68" style="stroke:#181818;stroke-width:1;"/><text x="827.408" y="824.047" fill="#000" font-size="13" textLength="18.091" font-weight="700">10</text><text x="849.499" y="816.481" fill="#000" font-size="13" textLength="196.244">leave StoredEvent unchanged</text><text x="849.499" y="831.614" fill="#000" font-size="13" textLength="615.894">(AuthorityStatus stays "unattested" -- exchange attempt itself is not persisted as failure state)</text><path d="M735.484,863.68 L735.484,948.68 L1686.484,948.68 L1686.484,873.68 L1676.484,863.68 L735.484,863.68" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1676.484,863.68 L1676.484,873.68 L1686.484,873.68 L1676.484,863.68" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="992.506" y="880.747" fill="#000" font-size="13" textLength="405.038">Either branch: the event that was persisted in the first section</text><text x="992.506" y="895.879" fill="#000" font-size="13" textLength="428.492">is never deleted, rejected, or blocked on this outcome (ADR-023).</text><text x="992.506" y="911.012" fill="#000" font-size="13" textLength="425.204">A separate, later authorityDecision event (ADR-035) -- not shown</text><text x="992.506" y="926.145" fill="#000" font-size="13" textLength="371.04">here, not triggered by this exchange -- is what can move</text><text x="992.506" y="941.278" fill="#000" font-size="13" textLength="285.829">AuthorityStatus to "accepted" or "rejected".</text><?plantuml-src VLLDRnit4BthLmnqQ2n0iXEdlGXH0CDo0HU5RTWESX5WS7T74cEAt99SAOl0_prloDLdsjx49MVcpPitJwg9pZQhWdrFbT5vwl-fsLHqRJJREBDdRZutslAGbivKWHHzkRwwczcA3IzKv8hctgtmsJiNQNex7VH91IfJUAzMFkfIryf6wj_Qmdsd2tfe2gF3acviLJjjOmhGSddy_j4raJqW5AfyNNZNs6f8gbhhu7mxSjQqkPPFxuvZRzOe_uH--7pAwzkgHfhxgoOkwTczigMRx-LIsGLJuNMru9n8LtMlKb4LAd2NWdu3pAXZIobPUbOLlTvaGb-NsZ1LEfJEMYvtLCGb8nFdgDgxDGwU9fDUveH6dtEpOtguVtgcYphJSP5uloy2-xMAsjb7Bfslk9hP7rIhrZWbxSV80QMkZTAhCAOV5DkQnzHlIcNxGsHUkpA5Z-cJLviqhS_qHcyWm3egM7cW-UlhCur6P9rbSaLKsge2pNIp7lGIG45Q5MEwlNkwUNpE15I95UIwEW924zeM6vBGx3owVuegDdBNR-mMU7-N7Dap8sEwV7-9Ja9wZbuybwpNU8j-ZtEDZrBHMy-w2DXhj9Io3cKuH0_iWvOdf5ShhZHqQjeX1RLY6Q2oBJcCoLF7FPrTJHz7xoy_lWk8pZgjfOotQ4UkFdnu5-YsubMDWXZYOuRe1-TqXrJQBaWLm85md089ZSI2gp2kV0tax4uKevqeF2l8iD06NyzxR2kIVfAw_WPcFqHOoTG9JAz5KT7zXy8ynyRR84hB6x6TNwtBLsfgWMDZe8t65lp_Z6PM0OjACpqPj8oOQa2LbhdReeE2sA6ji9qCxoBAlitimcClNqIi4w0SQuxpCJPMGSJftJWz62Krfv3HDldCXgRuXlvVqlV9fmHXB_JF9m_sHLhN-97pYovXoYrxChEU_sbILwSXl-8wYFssYJtqjsjphOo6Nt0cfND48280rwXo5jZCHn21dhT2LzeuAfKnucWoIL4YzE8h4lTg1prbOiwMKb3fspewK5CljSIr5w6r4KQTJna1D9TG0LQUWopKUooKAaiE8RT8PzZvWTY0x7xPsOU8Xp7iaWzMxIKlul2WevS4vyNp7CMErVNbONhrV7Fi3YUQ6KzeNtI8wnFnuRxVIGebrfetVJeBKHj3T_VFr9S-wkGT29xkG5qBfaUUIpoaYrLQoMe2PBVF7oy7FJQ13nc5ReGpEbifCtSUxZ24Z6ljvKVX4rK7ayGUlmx-XU3VGN2Nw