 y="375.479" fill="#000" font-size="14" textLength="226.646">Peer's local Event &amp; Entity Store</text><path d="M1235.824,388.781 C1235.824,378.781 1253.824,378.781 1253.824,378.781 C1253.824,378.781 1271.824,378.781 1271.824,388.781 L1271.824,414.781 C1271.824,424.781 1253.824,424.781 1253.824,424.781 C1253.824,424.781 1235.824,424.781 1235.824,414.781 L1235.824,388.781" style="stroke:#181818;stroke-width:0.5;" fill="#E2E2F0"/><path d="M1235.824,388.781 C1235.824,398.781 1253.824,398.781 1253.824,398.781 C1253.824,398.781 1271.824,398.781 1271.824,388.781" style="stroke:#181818;stroke-width:0.5;" fill="none"/><polygon points="533.712,114.156,543.712,118.156,533.712,122.156,537.712,118.156" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="62.541" y1="118.156" x2="539.712" y2="118.156" style="stroke:#181818;stroke-width:1;"/><text x="69.541" y="105.524" fill="#000" font-size="13" font-weight="700">1</text><text x="82.586" y="97.958" fill="#000" font-size="13" textLength="141.299">replicate StoredEvent</text><text x="82.586" y="113.09" fill="#000" font-size="13" textLength="446.126">(AttestedClaims = raw UCAN or exchanged JWT, AuthorityStatus, ...)</text><polygon points="870.9,143.289,880.9,147.289,870.9,151.289,874.9,147.289" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="545.712" y1="147.289" x2="876.9" y2="147.289" style="stroke:#181818;stroke-width:1;"/><text x="552.712" y="142.223" fill="#000" font-size="13" font-weight="700">2</text><text x="565.758" y="142.223" fill="#000" font-size="13" textLength="300.143">deliver (gossip topology, fault/abend-tolerant)</text><line x1="882.9" y1="191.555" x2="924.9" y2="191.555" style="stroke:#181818;stroke-width:1;"/><line x1="924.9" y1="191.555" x2="924.9" y2="204.555" style="stroke:#181818;stroke-width:1;"/><line x1="883.9" y1="204.555" x2="924.9" y2="204.555" style="stroke:#181818;stroke-width:1;"/><polygon points="893.9,200.555,883.9,204.555,893.9,208.555,889.9,204.555" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="889.9" y="178.922" fill="#000" font-size="13" font-weight="700">3</text><text x="902.946" y="171.356" fill="#000" font-size="13" textLength="251.716">validate UCAN delegation chain locally</text><text x="902.946" y="186.489" fill="#000" font-size="13" textLength="343.878">(self-verifying signature chain -- no callback needed)</text><polygon points="1241.824,244.82,1251.824,248.82,1241.824,252.82,1245.824,248.82" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="882.9" y1="248.82" x2="1247.824" y2="248.82" style="stroke:#181818;stroke-width:1;"/><text x="889.9" y="236.188" fill="#000" font-size="13" font-weight="700">4</text><text x="902.946" y="228.622" fill="#000" font-size="13" textLength="257.728">fold event; peer may independently set</text><text x="902.946" y="243.754" fill="#000" font-size="13" textLength="271.312">its own local AuthorityStatus/review state</text><path d="M782.556,261.82 L782.556,346.82 L1353.556,346.82 L1353.556,271.82 L1343.556,261.82 L782.556,261.82" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1343.556,261.82 L1343.556,271.82 L1353.556,271.82 L1343.556,261.82" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="856.662" y="278.887" fill="#000" font-size="13" textLength="405.793">The peer never needs to reach EventStore.DevIdp to do this --</text><text x="856.662" y="294.02" fill="#000" font-size="13" textLength="414.4">the whole point of UCAN over a plain OAuth token (ADR-036). If</text><text x="856.662" y="309.153" fill="#000" font-size="13" textLength="388.559">the peer's local judgment differs from the origin's, that's an</text><text x="856.662" y="324.286" fill="#000" font-size="13" textLength="378.6">ordinary divergence, resolved like any other (ConflictFlag,</text><t