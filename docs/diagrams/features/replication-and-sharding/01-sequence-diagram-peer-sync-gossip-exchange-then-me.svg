63.948,303.656,1673.948,307.656,1663.948,311.656,1667.948,307.656" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1310.526" y1="307.656" x2="1669.948" y2="307.656" style="stroke:#181818;stroke-width:1;"/><text x="1317.526" y="287.458" fill="#000" font-size="13" font-weight="700">5</text><text x="1330.571" y="272.325" fill="#000" font-size="13" textLength="275.761">append each event to the local Event Log,</text><text x="1330.571" y="287.458" fill="#000" font-size="13" textLength="328.377">exactly as if it arrived via Site B's own client Inbox</text><text x="1330.571" y="302.59" fill="#000" font-size="13" textLength="188.214">(no special-casing, ADR-033)</text><line x1="1675.948" y1="351.922" x2="1717.948" y2="351.922" style="stroke:#181818;stroke-width:1;"/><line x1="1717.948" y1="351.922" x2="1717.948" y2="364.922" style="stroke:#181818;stroke-width:1;"/><line x1="1676.948" y1="364.922" x2="1717.948" y2="364.922" style="stroke:#181818;stroke-width:1;"/><polygon points="1686.948,360.922,1676.948,364.922,1686.948,368.922,1682.948,364.922" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1682.948" y="339.29" fill="#000" font-size="13" font-weight="700">6</text><text x="1695.994" y="331.723" fill="#000" font-size="13" textLength="229.277">fold as usual (ADR-024/ADR-029) --</text><text x="1695.994" y="346.856" fill="#000" font-size="13" textLength="235.536">may set ConflictFlag/LateArrivalFlag</text><polygon points="597.898,390.055,587.898,394.055,597.898,398.055,593.898,394.055" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="591.898" y1="394.055" x2="918.599" y2="394.055" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="603.898" y="388.989" fill="#000" font-size="13" font-weight="700">7</text><text x="616.944" y="388.989" fill="#000" font-size="13" textLength="194.784">ack up to SequenceNumber N</text><polygon points="90.593,419.188,80.593,423.188,90.593,427.188,86.593,423.188" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="84.593" y1="423.188" x2="585.898" y2="423.188" style="stroke:#181818;stroke-width:1;"/><text x="96.593" y="418.122" fill="#000" font-size="13" font-weight="700">8</text><text x="109.639" y="418.122" fill="#000" font-size="13" textLength="439.01">advance PeerSyncCursor["Site B"].LastAckedSequenceNumber = N</text><rect x="10" y="451.754" width="1928.53" height="3" fill="#EEE" style="stroke:#EEE;stroke-width:1;"/><line x1="10" y1="451.754" x2="1938.53" y2="451.754" style="stroke:#000;stroke-width:1;"/><line x1="10" y1="454.754" x2="1938.53" y2="454.754" style="stroke:#000;stroke-width:1;"/><rect x="913.246" y="441.188" width="122.037" height="23.133" fill="#EEE" style="stroke:#000;stroke-width:2;"/><text x="919.246" y="457.254" fill="#000" font-size="13" textLength="103.511" font-weight="700">Disconnection</text><line x1="901.599" y1="490.453" x2="911.599" y2="500.453" style="stroke:#181818;stroke-width:2;"/><line x1="901.599" y1="500.453" x2="911.599" y2="490.453" style="stroke:#181818;stroke-width:2;"/><line x1="586.898" y1="495.453" x2="906.599" y2="495.453" style="stroke:#181818;stroke-width:1;"/><text x="593.898" y="490.387" fill="#000" font-size="13" font-weight="700">9</text><text x="606.944" y="490.387" fill="#000" font-size="13" textLength="202.966">push fails -- Site B unreachable</text><path d="M521.994,508.453 L521.994,563.453 L983.994,563.453 L983.994,518.453 L973.994,508.453 L521.994,508.453" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M973.994,508.453 L973.994,518.453 L983.994,518.453 L973.994,508.453" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="576.654" y="525.52" fill="#000" font-size="13" textLength="344.189">Site A keeps appending to its own durable Peer Sync</text><text x="576.654" y="540.653" fill="#000" font-size="13" textLength="330.929">Outbox for Site B; nothing queued is lost, sync just</text><text x="576.654" y="555.786" fill="#000" font-size="13" textLength="337.956">falls behind (fault/abend/restart-tolerant, ADR-033).</text><rect x="10" y="589.418" width="1928.53" height="3" fill="#EEE" style="stroke:#EEE;stroke-width:1;"/><line x1="10" y1="589.418" x2="1938.53" y2="589.418" style="stroke:#000;stroke-width:1;"/><line x1="10" y1="592.418" x2="1938.53" y2="592.418" style="stroke:#000;stroke-width:1;"/><rect x="769.307" y="578.852" width="409.916" height="23.133" fill="#EEE" style="stroke:#000;stroke-width:2;"/><text x="775.307" y="594.918" fill="#000" font-size="13" textLength="391.39" font-weight="700">Reconnection: Merkle-tree catch-up, not a full resync</text><polygon points="907.599,644.25,917.599,648.25,907.599,652.25,911.599,648.25" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="586.898" y1="648.25" x2="913.599" y2="648.25" style="stroke:#181818;stroke-width:1;"/><text x="593.898" y="635.618" fill="#000" font-size="13" textLength="18.091" font-weight="700">10</text><text x="615.989" y="628.051" fill="#000" font-size="13" textLength="281.646">reconnect; exchange Merkle-tree summary</text><text x="615.989" y="643.184" fill="#000" font-size="13" textLength="213.764">(hash per event range, per peer)</text><polygon points="597.898,673.383,587.898,677.383,597.898,681.383,593.898,677.383" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="591.898" y1="677.383" x2="918.599" y2="677.383" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="603.898" y="672.317" fill="#000" font-size="13" textLength="18.091" font-weight="700">11</text><text x="625.989" y="672.317" fill="#000" font-size="13" textLength="190.874">its own Merkle-tree summary</text><line x1="586.898" y1="721.648" x2="628.898" y2="721.648" style="stroke:#181818;stroke-width:1;"/><line x1="628.898" y1="721.648" x2="628.898" y2="734.648" style="stroke:#181818;stroke-width:1;"/><line x1="587.898" y1="734.648" x2="628.898" y2="734.648" style="stroke:#181818;stroke-width:1;"/><polygon points="597.898,730.648,587.898,734.648,597.898,738.648,593.898,734.648" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="593.898" y="709.016" fill="#000" font-size="13" textLength="18.091" font-weight="700">12</text><text x="615.989" y="701.45" fill="#000" font-size="13" textLength="235.466">diff the two trees -- identify only the</text><text x="615.989" y="716.583" fill="#000" font-size="13" textLength="200.751">ranges whose hashes disagree</text><polygon points="907.599,774.914,917.599,778.914,907.599,782.914,911.599,778.914" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="586.898" y1="778.914" x2="913.599" y2="778.914" style="stroke:#181818;stroke-width:1;"/><text x="593.898" y="766.282" fill="#000" font-size="13" textLength="18.091" font-weight="700">13</text><text x="615.989" y="758.715" fill="#000" font-size="13" textLength="195.901">push only the differing ranges</text><text x="615.989" y="773.848" fill="#000" font-size="13" textLength="286.609">(not the whole backlog since disconnection)</text><polygon points="1298.526,804.047,1308.526,808.047,1298.526,812.047,1302.526,808.047" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="919.599" y1="808.047" x2="1304.526" y2="808.047" style="stroke:#181818;stroke-width:1;"/><text x="926.599" y="802.981" fill="#000" font-size="13" textLength="18.091" font-weight="700">14</text><text x="948.689" y="802.981" fill="#000" font-size="13" textLength="155.378">append + fold as above</text><polygon points="597.898,833.18,587.898,837.18,597.898,841.18,593.898,837.18" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linej