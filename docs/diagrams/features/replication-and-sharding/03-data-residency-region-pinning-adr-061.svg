ce</text><rect x="899.578" y="26.297" width="125.692" height="30.297" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="906.578" y="46.292" fill="#000" font-size="14" textLength="111.692">Site B (eu-west)</text><rect x="1035.271" y="26.297" width="121.673" height="30.297" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1042.271" y="46.292" fill="#000" font-size="14" textLength="107.673">Site C (us-east)</text><rect x="160.45" y="337.055" width="139.187" height="46.594" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="174.211" y="357.05" fill="#000" font-size="14" textLength="111.665">Site A (eu-west)</text><text x="167.45" y="373.347" fill="#000" font-size="14" textLength="125.187">Peer Sync Outbox</text><rect x="531.192" y="337.055" width="139.809" height="46.594" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="580.643" y="357.05" fill="#000" font-size="14" textLength="40.906">Site A</text><text x="538.192" y="373.347" fill="#000" font-size="14" textLength="125.809">Peer Sync Service</text><rect x="899.578" y="337.055" width="125.692" height="30.297" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="906.578" y="357.05" fill="#000" font-size="14" textLength="111.692">Site B (eu-west)</text><rect x="1035.271" y="337.055" width="121.673" height="30.297" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1042.271" y="357.05" fill="#000" font-size="14" textLength="107.673">Site C (us-east)</text><path d="M15,70.594 L15,125.594 L445,125.594 L445,80.594 L435,70.594 L15,70.594" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M435,70.594 L435,80.594 L445,80.594 L435,70.594" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="21" y="87.661" fill="#000" font-size="13" textLength="409.087">AppId "eu-tenant" has AllowedRegions: ["eu-west"] (ADR-061).</text><text x="21" y="102.793" fill="#000" font-size="13" textLength="368.17">Site A, Site B, and Site C are all configured gossip peers,</text><text x="21" y="117.926" fill="#000" font-size="13" textLength="296.588">tagged eu-west/eu-west/us-east respectively.</text><polygon points="241.044,148.125,231.044,152.125,241.044,156.125,237.044,152.125" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="235.044" y1="152.125" x2="600.096" y2="152.125" style="stroke:#181818;stroke-width:1;"/><text x="247.044" y="147.059" fill="#000" font-size="13" font-weight="700">1</text><text x="260.089" y="147.059" fill="#000" font-size="13" textLength="334.007">read events queued for sync, for AppId "eu-tenant"</text><line x1="230.044" y1="196.391" x2="272.044" y2="196.391" style="stroke:#181818;stroke-width:1;"/><line x1="272.044" y1="196.391" x2="272.044" y2="209.391" style="stroke:#181818;stroke-width:1;"/><line x1="231.044" y1="209.391" x2="272.044" y2="209.391" style="stroke:#181818;stroke-width:1;"/><polygon points="241.044,205.391,231.044,209.391,241.044,213.391,237.044,209.391" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="237.044" y="183.758" fill="#000" font-size="13" font-weight="700">2</text><text x="250.089" y="176.192" fill="#000" font-size="13" textLength="246.727">filter candidate peers to those tagged</text><text x="250.089" y="191.325" fill="#000" font-size="13" textLength="278.059">with an AllowedRegions region ("eu-west")</text><polygon points="950.425,234.523,960.425,238.523,950.425,242.523,954.425,238.523" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="601.096" y1="238.523" x2="956.425" y2="238.523" style="stroke:#181818;stroke-width:1;"/><text x="608.096" y="233.458" fill="#000" font-size="13" font-weight="700">3</text><text x="621.142" y="233.458" fill="#000" font-size="13" textLength="324.283">push batch (Site B is tagged "eu-west" -- allowed)</text><path d="M540.726,251.523 L540.726,321.523 L1155.726,321.523 L1155.726,261.523 L1145.726,251.523 L540.726,251.523" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1145.726,251.523 L1145.726,261.523 L1155.726,261.523 L1145.726,251.523" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="671.611" y="268.59" fill="#000" font-size="13" textLength="332.262">Site C is tagged "us-east", not in AllowedRegions --</text><text x="671.611" y="283.723" fill="#000" font-size="13" textLength="344.982">"eu-tenant"'s events are never included in any batch</text><text x="671.611" y="298.856" fill="#000" font-size="13" textLength="293.154">bound for Site C. This is a filtering rule at the</text><text x="671.611" y="313.989" fill="#000" font-size="13" textLength="334.648">existing outbox, not a rejected/failed sync attempt.</text><?plantuml-src RL4zRzim4DtrAmvQAWEIaomTF1HmcgLJWpXRqu6YpX83XcJ9ent_-nv5AdOR0m98KFVUlGyHoPhurgEldF2af7B24DGxHGXRQ31sHmoqUZ6FY1vs9oFXPwJUljSW0eXyluQzHEpG7vJ434alLm3tvsNpN9zUhynzXoQ63iKo9-UvobZ-Pm-yST44i7Nknm0rqn8QPgXXOi1MQtl4uGb7PKtOmA-wxAr_GxDzUEfklzwjrWpFFjfythSWp015Wl08GckGrkpL63qECDeGb0F7faFBQ1BZoC-5-sOvYtRm61nAKWVKftM5J9qSL7Cwq7rRN6nuK33B0Gq5-1CnCkVUUWWyrywtJowhWls7PgyqSJYIJQX1i8bPA905ccp08lV571LDxFI_b5X5Eg7vo6frbZetjG4NmmIz83b1KnfLOOdX0mTTbv9BtAlBqdQpdrmcB35Vu4jkTPjo0lL9ODSnx2A4Bs49BNLbC2rHHkeuC1l3XJbbiGphRJGvrRnt3SyJh-PFbDoK6S57pQKJvvKKuhiAb9xj772M9JYdLsuLXvkzK9etfPeOHFZcw5ppNm00?></g></svg>