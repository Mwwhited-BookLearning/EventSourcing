<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SEQUENCE" style="width:1838px;height:681px;background:#FFFFFF;" width="1838px" height="681px" viewBox="0 0 1838 681" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g><title>Hospital EMR</title><rect x="67.418" y="73.891" width="8" height="533.188" fill="#000" fill-opacity="0"/><line x1="70.918" y1="73.891" x2="70.918" y2="607.078" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>Hl7V2MllpListener</title><rect x="454.302" y="73.891" width="8" height="533.188" fill="#000" fill-opacity="0"/><line x1="457.802" y1="73.891" x2="457.802" y2="607.078" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>Hl7V2Adapter</title><rect x="879.443" y="73.891" width="8" height="533.188" fill="#000" fill-opacity="0"/><line x1="882.943" y1="73.891" x2="882.943" y2="607.078" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>PublishService</title><rect x="1318.521" y="73.891" width="8" height="533.188" fill="#000" fill-opacity="0"/><line x1="1322.021" y1="73.891" x2="1322.021" y2="607.078" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>Event . Schema Store</title><rect x="1742.304" y="73.891" width="8" height="533.188" fill="#000" fill-opacity="0"/><line x1="1745.804" y1="73.891" x2="1745.804" y2="607.078" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><rect x="10" y="26.297" width="121.837" height="46.594" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="24.807" y="46.292" fill="#000" font-size="14" textLength="92.224">Hospital EMR</text><text x="17" y="62.589" fill="#000" font-size="14" textLength="107.837">(HL7v2 sender)</text><rect x="337.032" y="10" width="241.541" height="62.891" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="394.361" y="29.995" fill="#000" font-size="14" textLength="126.882">Hl7V2MllpListener</text><text x="367.226" y="46.292" fill="#000" font-size="14" textLength="181.152">(BackgroundService, TCP,</text><text x="344.032" y="62.589" fill="#000" font-size="14" textLength="227.541">no inherent security -- ADR-072)</text><rect x="773.797" y="10" width="218.292" height="62.891" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="834.145" y="29.995" fill="#000" font-size="14" textLength="97.597">Hl7V2Adapter</text><text x="780.797" y="46.292" fill="#000" font-size="14" textLength="204.292">(IInterchangeFormatAdapter,</text><text x="805.349" y="62.589" fill="#000" font-size="14" textLength="155.189">keyed DI, key 'Hl7V2')</text><rect x="1264.077" y="42.594" width="115.89" height="30.297" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1271.077" y="62.589" fill="#000" font-size="14" textLength="101.89">PublishService</text><text x="1663.818" y="70.589" fill="#000" font-size="14" textLength="157.972">Event &amp; Schema Store</text><path d="M1727.804,21.594 C1727.804,11.594 1745.804,11.594 1745.804,11.594 C1745.804,11.594 1763.804,11.594 1763.804,21.594 L1763.804,47.594 C1763.804,57.594 1745.804,57.594 1745.804,57.594 C1745.804,57.594 1727.804,57.594 1727.804,47.594 L1727.804,21.594" style="stroke:#181818;stroke-width:0.5;" fill="#E2E2F0"/><path d="M1727.804,21.594 C1727.804,31.594 1745.804,31.594 1745.804,31.594 C1745.804,31.594 1763.804,31.594 1763.804,21.594" style="stroke:#181818;stroke-width:0.5;" fill="none"/><rect x="10" y="607.078" width="121.837" height="46.594" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="24.807" y="627.073" fill="#000" font-size="14" textLength="92.224">Hospital EMR</text><text x="17" y="643.37" fill="#000" font-size="14" textLength="107.837">(HL7v2 sender)</text><rect x="337.032" y="607.078" width="241.541" height="62.891" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="394.361" y="627.073" fill="#000" font-size="14" textLength="126.882">Hl7V2MllpListener</text><text x="367.226" y="643.37" fill="#000" font-size="14" textLength="181.152">(BackgroundService, TCP,</text><text x="344.032" y="659.667" fill="#000" font-size="14" textLength="227.541">no inherent security -- ADR-072)</text><rect x="773.797" y="607.078" width="218.292" height="62.891" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="834.145" y="627.073" fill="#000" font-size="14" textLength="97.597">Hl7V2Adapter</text><text x="780.797" y="643.37" fill="#000" font-size="14" textLength="204.292">(IInterchangeFormatAdapter,</text><text x="805.349" y="659.667" fill="#000" font-size="14" textLength="155.189">keyed DI, key 'Hl7V2')</text><rect x="1264.077" y="607.078" width="115.89" height="30.297" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1271.077" y="627.073" fill="#000" font-size="14" textLength="101.89">PublishService</text><text x="1663.818" y="620.073" fill="#000" font-size="14" textLength="157.972">Event &amp; Schema Store</text><path d="M1727.804,633.375 C1727.804,623.375 1745.804,623.375 1745.804,623.375 C1745.804,623.375 1763.804,623.375 1763.804,633.375 L1763.804,659.375 C1763.804,669.375 1745.804,669.375 1745.804,669.375 C1745.804,669.375 1727.804,669.375 1727.804,659.375 L1727.804,633.375" style="stroke:#181818;stroke-width:0.5;" fill="#E2E2F0"/><path d="M1727.804,633.375 C1727.804,643.375 1745.804,643.375 1745.804,643.375 C1745.804,643.375 1763.804,643.375 1763.804,633.375" style="stroke:#181818;stroke-width:0.5;" fill="none"/><polygon points="445.802,129.289,455.802,133.289,445.802,137.289,449.802,133.289" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="70.918" y1="133.289" x2="451.802" y2="133.289" style="stroke:#181818;stroke-width:1;"/><text x="77.918" y="113.09" fill="#000" font-size="13" font-weight="700">1</text><text x="90.964" y="97.958" fill="#000" font-size="13" textLength="312.895">HL7v2 ADT^A01 message, over TLS-terminated</text><text x="90.964" y="113.09" fill="#000" font-size="13" textLength="331.125">MLLP/TCP (transport security is the DEPLOYMENT's</text><text x="90.964" y="128.223" fill="#000" font-size="13" textLength="308.261">responsibility -- MLLP itself has none, ADR-072)</text><line x1="457.802" y1="177.555" x2="499.802" y2="177.555" style="stroke:#181818;stroke-width:1;"/><line x1="499.802" y1="177.555" x2="499.802" y2="190.555" style="stroke:#181818;stroke-width:1;"/><line x1="458.802" y1="190.555" x2="499.802" y2="190.555" style="stroke:#181818;stroke-width:1;"/><polygon points="468.802,186.555,458.802,190.555,468.802,194.555,464.802,190.555" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="464.802" y="164.922" fill="#000" font-size="13" font-weight="700">2</text><text x="477.848" y="157.356" fill="#000" font-size="13" textLength="318.132">parse MLLP framing (start/end block characters),</text><text x="477.848" y="172.489" fill="#000" font-size="13" textLength="207.829">extract the raw HL7v2 message</text><polygon points="870.943,245.953,880.943,249.953,870.943,253.953,874.943,249.953" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="457.802" y1="249.953" x2="876.943" y2="249.953" style="stroke:#181818;stroke-width:1;"/><text x="464.802" y="229.754" fill="#000" font-size="13" font-weight="700">3</text><text x="477.848" y="214.622" fill="#000" font-size="13" textLength="301.184">ParseInboundAsync(appId, rawHl7v2Message)</text><text x="477.848" y="229.754" fill="#000" font-size="13" textLength="370.176">-- resolved via GetRequiredKeyedService, not hardcoded</text><text x="477.848" y="244.887" fill="#000" font-size="13" textLength="227.506">to the concrete Hl7V2Adapter type</text><line x1="882.943" y1="294.219" x2="924.943" y2="294.219" style="stroke:#181818;stroke-width:1;"/><line x1="924.943" y1="294.219" x2="924.943" y2="307.219" style="stroke:#181818;stroke-width:1;"/><line x1="883.943" y1="307.219" x2="924.943" y2="307.219" style="stroke:#181818;stroke-width:1;"/><polygon points="893.943,303.219,883.943,307.219,893.943,311.219,889.943,307.219" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="889.943" y="281.586" fill="#000" font-size="13" font-weight="700">4</text><text x="902.989" y="274.02" fill="#000" font-size="13" textLength="279.271">map HL7v2 segments/fields (e.g. PID, PV1)</text><text x="902.989" y="289.153" fill="#000" font-size="13" textLength="412.033">to this AppId's registered "PatientAdmitted" JsonSchema shape</text><polygon points="468.802,347.484,458.802,351.484,468.802,355.484,464.802,351.484" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="462.802" y1="351.484" x2="881.943" y2="351.484" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="474.802" y="338.852" fill="#000" font-size="13" font-weight="700">5</text><text x="487.848" y="331.286" fill="#000" font-size="13" textLength="388.096">InterchangeInboundResult { EventType: "PatientAdmitted",</text><text x="496.112" y="346.418" fill="#000" font-size="13" textLength="317.046">Payload: &lt;transformed>, ReviewPending: true }</text><polygon points="1310.021,437.148,1320.021,441.148,1310.021,445.148,1314.021,441.148" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="457.802" y1="441.148" x2="1316.021" y2="441.148" style="stroke:#181818;stroke-width:1;"/><text x="464.802" y="405.817" fill="#000" font-size="13" font-weight="700">6</text><text x="477.848" y="375.551" fill="#000" font-size="13" textLength="233.791">PublishAsync("PatientAdmitted", ...)</text><text x="481.98" y="390.684" fill="#000" font-size="13" textLength="284.312" text-decoration="line-through">an IN-PROCESS call, not a second HTTP hop</text><text x="477.848" y="405.817" fill="#000" font-size="13" textLength="354.085">authenticated as an empty SystemPrincipal (MLLP has</text><text x="477.848" y="420.95" fill="#000" font-size="13" textLength="334.001">no bearer token of its own; TLS/network isolation is</text><text x="477.848" y="436.083" fill="#000" font-size="13" textLength="217.515">the real gate here, ADR-035/042)</text><polygon points="1733.804,496.547,1743.804,500.547,1733.804,504.547,1737.804,500.547" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1322.021" y1="500.547" x2="1739.804" y2="500.547" style="stroke:#181818;stroke-width:1;"/><text x="1329.021" y="480.348" fill="#000" font-size="13" font-weight="700">7</text><text x="1342.067" y="465.215" fill="#000" font-size="13" textLength="250.586">INSERT StoredEvent (Status: received,</text><text x="1342.067" y="480.348" fill="#000" font-size="13" textLength="310.121">AuthorityStatus: "pending_review" -- ADR-035's</text><text x="1342.067" y="495.481" fill="#000" font-size="13" textLength="386.737">reasonable default for EMR-sourced, interface-engine data)</text><polygon points="468.802,525.68,458.802,529.68,468.802,533.68,464.802,529.68" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="462.802" y1="529.68" x2="1321.021" y2="529.68" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="474.802" y="524.614" fill="#000" font-size="13" font-weight="700">8</text><text x="487.848" y="524.614" fill="#000" font-size="13" textLength="390.07">PublishResult.Accepted { CorrelationId, SequenceNumber }</text><polygon points="81.918,585.078,71.918,589.078,81.918,593.078,77.918,589.078" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="75.918" y1="589.078" x2="456.802" y2="589.078" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="87.918" y="568.879" fill="#000" font-size="13" font-weight="700">9</text><text x="100.964" y="553.747" fill="#000" font-size="13" textLength="300.53">MLLP ACK (application-level acknowledgment,</text><text x="100.964" y="568.879" fill="#000" font-size="13" textLength="286.863">HL7v2's own convention -- distinct from this</text><text x="100.964" y="584.012" fill="#000" font-size="13" textLength="349.838">framework's PublishResult, translated by the listener)</text><?plantuml-src RLHjZ-8s4FxEhnZneR0IWRszdbQYrKdfGhlqO2yYwAHAg9KJ3s3XZ5FRWQ9J_tl7JfQolNxBBfwPPvwN4Oqtr5G5sbujh5UbgWLvw3yRLoilDCnNwoqDdvUFfmTmI1BjNH-40wp-Mw4VlpoijAwNodaaj5psaoYFUsiQaZdQaofn19kdRBGbCg3eW1Qvqc7PMEKla2IGpjR9_UD3EwBYPlyp8vMYzh7zOa7yKHu4xV5dOolXkzzumX4lA66s605_mI1M3jg-edtqjdNM55gvGuSplglRV_MayA8G3g4_FmN0tq5U7h0Ia7jZswUowFMO4KW-HjHJQ0bBPvlVq_jtKA5pOi_RcnDQs2ppXETNYeH7kQNLSfbDc1SOUYl8rSRUaA8S-0F2R9ujF_-schzi1cvB5laLELKetH4NUe3o3lKE3Wo83F6uLpfx0TI_u7XntYQMxAnW77iOEiziJ5XWABGfZy2iMb4oJ7V7RE9VFlmLeLXnxjRhrhfsxuYTGXO6BAW8ogVkGkLGrFL2Za8jAt5wMBMLTrjYxBoDqITMwwG4_89-ZNysogBy52Iy6eUCvysiB8qCf7aJmPI6IeiUuTOQu2yrzZeqRu1LeePNB-yh5jDDTWgrT334yNuCsM8sWkpBkxjk0BEV1kG3noZtmTYCYyqYlEBYL5RAiuHz-DKPwapX3k9s-9Nq6wzspApHDTh3LuYssZ3cwRUjcNnWFY_Q23c57wD3Tknrb1z7iCQJmdF6gh66K_2sGVZxAaVdNvQZ_MYL-7O2ZCVZLWb1i7X9ilNdftcUGocqRdaNmO-6lV6ysMHmCDm-sP9eM07Y20KRns0HduMQ3PbVcAagiuf2l3GCezVObp7v1GeRH397932xO5imP_eX16D2wC_67jdtHZDGG_p5OWJV8NVQyom8XwCpz_iFa_llsU3Thc5jMJ3PB_bylMa3AjlK3dClVEEctAT4nNPZPbFUm8IOlVxMhrik_x2HsVxr9ht_qEPEiD2Yq0WIToAenrg46vauqzYIc_9TOvrteiG4QQ-8N_Bvk05uDKIdIkk2SLgMM0SUlyAJiHRRvKDcSeu3KealyKnVzUK-V76cROpJfqyGCgQ365oNQ3oX1Zw_PCuQPVGwBnozFuXqX-W4OWB5lALaSxDSl90rLNJ-bi9nmA06Lxn1EuBeGns5BounYRex-tV_0000?></g></svg>