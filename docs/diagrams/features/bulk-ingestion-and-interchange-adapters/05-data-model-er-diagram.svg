<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:1224px;height:345px;background:#FFFFFF;" width="1224px" height="345px" viewBox="0 0 1224 345" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--class event--><g class="entity" data-qualified-name="event" id="ent0001" data-source-line="4"><rect x="7" y="141.89" width="404.882" height="188.969" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="166.289" y="159.885" fill="#000" font-size="14" textLength="86.304">StoredEvent</text><line x1="8" y1="168.187" x2="410.882" y2="168.187" style="stroke:#181818;stroke-width:0.5;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="18" cy="181.835" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="27" y="185.182" fill="#000" font-size="14" textLength="218.032">SequenceNumber : bigint «PK»</text><line x1="8" y1="192.484" x2="410.882" y2="192.484" style="stroke:#181818;stroke-width:1;"/><text x="13" y="209.479" fill="#000" font-size="14" textLength="166.852">EventId : uuid «unique»</text><text x="13" y="225.776" fill="#000" font-size="14" textLength="115.124">EntityId : string?</text><text x="13" y="242.073" fill="#000" font-size="14" textLength="128.249">EventType : string</text><text x="13" y="258.369" fill="#000" font-size="14" textLength="96.722">Payload : text</text><text x="13" y="274.666" fill="#000" font-size="14" textLength="392.492">Status : enum {received, processing, applied, rejected}</text><text x="13" y="290.963" fill="#000" font-size="14" textLength="392.882">SchemaStatus : enum {unknown, invalid, conformant}?</text><text x="13" y="307.26" fill="#000" font-size="14" textLength="163.215">AuthorityStatus : string</text><text x="13" y="323.557" fill="#000" font-size="14" textLength="170.789">AttestedActorId : string?</text></g><g class="entity" data-qualified-name="GMN2" id="ent0003" data-source-line="20"><path d="M446.69,193.54 L446.69,232.86 L412.31,236.86 L446.69,240.86 L446.69,279.204 A0,0 0 0 0 446.69,279.204 L798.193,279.204 A0,0 0 0 0 798.193,279.204 L798.193,203.54 L788.193,193.54 L446.69,193.54 A0,0 0 0 0 446.69,193.54" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M788.193,193.54 L788.193,203.54 L798.193,203.54 L788.193,193.54" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="452.69" y="210.607" fill="#000" font-size="13" textLength="299.495">A batch submission leaves NO trace of having</text><text x="452.69" y="225.74" fill="#000" font-size="13" textLength="299.063">arrived together -- there is no BatchId column</text><text x="452.69" y="240.873" fill="#000" font-size="13" textLength="330.503">anywhere on StoredEvent, deliberately (ADR-072):</text><text x="452.69" y="256.005" fill="#000" font-size="13" textLength="290.272">batching is a transport optimization, never a</text><text x="452.69" y="271.138" fill="#000" font-size="13" textLength="182.476">persisted grouping concept.</text></g><!--class external--><g class="entity" data-qualified-name="external" id="ent0005" data-source-line="27"><rect x="468.64" y="7" width="293.608" height="74.891" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="552.595" y="24.995" fill="#000" font-size="14" textLength="125.699">External message</text><text x="471.64" y="41.292" fill="#000" font-size="14" textLength="287.608">(HL7v2 / FHIR / ICH E2B(R3) / GS1 EPCIS)</text><line x1="469.64" y1="49.594" x2="761.248" y2="49.594" style="stroke:#181818;stroke-width:0.5;"/><text x="474.64" y="66.589" fill="#000" font-size="14" textLength="183.36">raw external-format bytes</text><line x1="469.64" y1="73.891" x2="761.248" y2="73.891" style="stroke:#181818;stroke-width:0.5;"/></g><g class="entity" data-qualified-name="GMN6" id="ent0007" data-source-line="32"><path d="M833.62,178.41 L833.62,294.34 L1209.264,294.34 L1209.264,188.41 L1199.264,178.41 L833.62,178.41" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1199.264,178.41 L1199.264,188.41 L1209.264,188.41 L1199.264,178.41" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="839.62" y="195.477" fill="#000" font-size="13" textLength="306.268">Never persisted in its original external shape --</text><text x="839.62" y="210.61" fill="#000" font-size="13" textLength="313.238">IInterchangeFormatAdapter transforms it to this</text><text x="839.62" y="225.743" fill="#000" font-size="13" textLength="336.584">framework's registered JsonSchema BEFORE it ever</text><text x="839.62" y="240.875" fill="#000" font-size="13" textLength="354.644">reaches StoredEvent.Payload (inbound), or transforms</text><text x="839.62" y="256.008" fill="#000" font-size="13" textLength="339.473">a StoredEvent's already-persisted Payload INTO this</text><text x="839.62" y="271.141" fill="#000" font-size="13" textLength="298.302">shape only at delivery time, never storing the</text><text x="839.62" y="286.274" fill="#000" font-size="13" textLength="238.443">transformed copy either (outbound).</text></g><!--link external to GMN6--><g class="link" data-entity-1="ent0005" data-entity-2="ent0007" id="lnk8" data-source-line="32" data-link-type="association"><path d="M664.38,82.34 C664.38,124.23 664.38,185.86 664.38,185.86 C664.38,185.86 747.31,185.86 833.24,185.86" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="external-GMN6"/></g><!--link external to event--><g class="link" data-entity-1="ent0005" data-entity-2="ent0001" id="lnk9" data-source-line="41" data-link-type="dependency"><path d="M566.51,82.24 C566.51,115.9 566.51,159.86 566.51,159.86 C566.51,159.86 497.72,159.86 417.23,159.86" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="external-to-event" codeLine="41"/><polygon points="412.23,159.86,421.23,163.86,417.23,159.86,421.23,155.86,412.23,159.86" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="559.607" y="125.927" fill="#000" font-size="13" textLength="253.824">Transform() -- application code against</text><text x="529.18" y="141.06" fill="#000" font-size="13" textLength="314.679">IInterchangeFormatAdapter, no schema-registry</text><text x="600.305" y="156.193" fill="#000" font-size="13" textLength="172.428">change needed (ADR-072)</text></g><?plantuml-src TLHTRzj647pdhrZenL8XsQs38e0HkB1JkLRRs8RaHx-iZYloQlAElGyfRE3_dhbZg0W1-cBvFcPsRcQNjIw5b7QgaSA_QjEnuvOQRIJqdP1reRP58IReqDDa4woJShd7UaBiIT9_zAKW-easycyKe-GXjbjnT4LRNMcSVlZmzDVrDQui5lYJiQiInp7g4eVHQE3oXMMkaWzzSDfKlus0vwHbtCNc4_UDvNGnoEU0ZKtW43tMOc9BNvmeqNifvzGvgyHxmER4NTVejEda7r51ohU4LBMq_0C-cbTZ3sPEskovqO0eQtRMjMp2Mr9r4-6BWzeZyAZjZ4hPSMo2fwqqza0JLaewb9iGA8XBni8jl8rEIJbuwAc3PpU_hnS_l_iryOSW7f0R1ST_SEIC3BVYATGoabqq6hUDk3DFq4rUt5uh8OIRFPsJiI41NimPnGvSWfINdzONmN49tWLo3y2Jxq7KaWvUcbtnLXG02ZbTrO7iRX2RzD6MWwh9nsshOQyrr0ZleUhXaS29shXTytxmX9rBSL2mbK25GoyaDGuAFQJHRIB3CvLjOciImFI7V0xYawQRmzj6exquIDFJD1ls_d9s1KWMX7A9afC6upkqBzakw5R_nm4YuGDUW0nm7uRxv5f9bREnIqY4d98wHx-NoJ4f2jMmzpHPVeRBXXk2yPuh-3Yz__lz_f8kwEv-jSRFwkCzBIzlf-jtCwp-sFn2owUFgyric9CHdaR5yU6uiSXD5MZR8--ZtLiRWcsptz_k0VQGbNzNhKrA2HEQnWpKnng-PanBdhRLoc1JrMmgkSkLReQ66Vn9nJrOa0lYq1w87SPV3jQzefESLAaKpAS_lJN3fD3jykvnlKoe92YzHnWd_ZIdyt50fzfiRJJbR0wX9qLJnAS0LEC6H6M_-Fx2aMJryFmuwXiUPmtIXssf6o2Y9qGiOxWUj2bDD1W0nvgIsglhINJkmAcDOP1s6lVHnFFpwszVjokQF8ySqrdgtFmTKRcXG8dl9rUiZGylvd_zJWD8FXku66nr_OiPBaAsb51txER9Lm00?></g></svg>