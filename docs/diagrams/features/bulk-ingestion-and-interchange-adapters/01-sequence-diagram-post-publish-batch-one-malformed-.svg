.5"/><text x="843.063" y="778.69" fill="#000" font-size="14" textLength="101.049">InboxEndpoint</text><text x="818.655" y="794.987" fill="#000" font-size="14" textLength="149.864">(per-event, ADR-023)</text><text x="1218.709" y="771.69" fill="#000" font-size="14" textLength="157.972">Event &amp; Schema Store</text><path d="M1282.695,784.992 C1282.695,774.992 1300.695,774.992 1300.695,774.992 C1300.695,774.992 1318.695,774.992 1318.695,784.992 L1318.695,810.992 C1318.695,820.992 1300.695,820.992 1300.695,820.992 C1300.695,820.992 1282.695,820.992 1282.695,810.992 L1282.695,784.992" style="stroke:#181818;stroke-width:0.5;" fill="#E2E2F0"/><path d="M1282.695,784.992 C1282.695,794.992 1300.695,794.992 1300.695,794.992 C1300.695,794.992 1318.695,794.992 1318.695,784.992" style="stroke:#181818;stroke-width:0.5;" fill="none"/><polygon points="538.877,187.094,548.877,191.094,538.877,195.094,542.877,191.094" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="77.227" y1="191.094" x2="544.877" y2="191.094" style="stroke:#181818;stroke-width:1;"/><text x="84.227" y="148.196" fill="#000" font-size="13" font-weight="700">1</text><text x="97.272" y="110.364" fill="#000" font-size="13" textLength="130.838">POST /publish/batch</text><text x="97.272" y="125.497" fill="#000" font-size="13" textLength="228.332">Content-Type: application/x-ndjson</text><text x="97.272" y="140.629" fill="#000" font-size="13" textLength="65.971">{event 1}</text><text x="97.272" y="155.762" fill="#000" font-size="13" textLength="65.971">{event 2}</text><text x="97.272" y="170.895" fill="#000" font-size="13" textLength="209.143">{event 3, malformed envelope}</text><text x="97.272" y="186.028" fill="#000" font-size="13" textLength="65.971">{event 4}</text><line x1="550.877" y1="250.492" x2="592.877" y2="250.492" style="stroke:#181818;stroke-width:1;"/><line x1="592.877" y1="250.492" x2="592.877" y2="263.492" style="stroke:#181818;stroke-width:1;"/><line x1="551.877" y1="263.492" x2="592.877" y2="263.492" style="stroke:#181818;stroke-width:1;"/><polygon points="561.877,259.492,551.877,263.492,561.877,267.492,557.877,263.492" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="557.877" y="230.293" fill="#000" font-size="13" font-weight="700">2</text><text x="570.922" y="215.161" fill="#000" font-size="13" textLength="246.848">parse NDJSON/JSON-array body into N</text><text x="570.922" y="230.293" fill="#000" font-size="13" textLength="252.58">individual publish requests, preserving</text><text x="570.922" y="245.426" fill="#000" font-size="13" textLength="111.916">submission order</text><path d="M515.877,275.492 L592.501,275.492 L592.501,282.625 L582.501,292.625 L515.877,292.625 L515.877,275.492" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="515.877" y="275.492" width="825.818" height="309.008" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="530.877" y="288.559" fill="#000" font-size="13" textLength="31.624" font-weight="700">loop</text><text x="607.501" y="287.703" fill="#000" font-size="11" textLength="289.754" font-weight="700">[for each parsed request, in submission order]</text><polygon points="881.587,334.891,891.587,338.891,881.587,342.891,885.587,338.891" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="550.877" y1="338.891" x2="887.587" y2="338.891" style="stroke:#181818;stroke-width:1;"/><text x="557.877" y="326.258" fill="#000" font-size="13" font-weight="700">3</text><text x="570.922" y="318.692" fill="#000" font-size="13" textLength="169.908">delegate exactly as a solo</text><text x="570.922" y="333.825" fill="#000" font-size="13" textLength="289.021">POST /publish/{event-type} would receive it</text><path d="M534.877,350.891 L599.32,350.891 L599.32,358.023 L589.32,368.023 L534.877,368.023 L534.877,350.891" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="534.877" y="350.891" width="781.818" height="219.609" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="549.877" y="363.958" fill="#000" font-size="13" textLength="19.443" font-weight="700">alt</text><text x="614.32" y="363.101" fill="#000" font-size="11" textLength="369.451" font-weight="700">[envelope itself unparseable (the one pre-storage rejection</text><text x="614.32" y="375.906" fill="#000" font-size="11" textLength="275.059" font-weight="700">ADR-023 still allows, per publish-event.md)]</text><polygon points="561.877,420.898,551.877,424.898,561.877,428.898,557.877,424.898" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="555.877" y1="424.898" x2="892.587" y2="424.898" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="567.877" y="412.266" fill="#000" font-size="13" font-weight="700">4</text><text x="580.922" y="404.7" fill="#000" font-size="13" textLength="184.939">400-shaped status envelope</text><text x="580.922" y="419.833" fill="#000" font-size="13" textLength="126.42">for THIS ITEM ONLY</text><line x1="534.877" y1="433.898" x2="1316.695" y2="433.898" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="539.877" y="446.109" fill="#000" font-size="11" textLength="352.489" font-weight="700">[parseable (whatever its SchemaStatus turns out to be)]</text><polygon points="1288.695,499.102,1298.695,503.102,1288.695,507.102,1292.695,503.102" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="893.587" y1="503.102" x2="1294.695" y2="503.102" style="stroke:#181818;stroke-width:1;"/><text x="900.587" y="482.903" fill="#000" font-size="13" font-weight="700">5</text><text x="913.633" y="467.77" fill="#000" font-size="13" textLength="370.062">INSERT StoredEvent (own SequenceNumber, ChainHash,</text><text x="913.633" y="482.903" fill="#000" font-size="13" textLength="324.359">ADR-011 idempotency check) -- same transaction</text><text x="913.633" y="498.036" fill="#000" font-size="13" textLength="360.496">shape as a solo publish, not a shared batch transaction</text><polygon points="561.877,558.5,551.877,562.5,561.877,566.5,557.877,562.5" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="555.877" y1="562.5" x2="892.587" y2="562.5" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="567.877" y="542.301" fill="#000" font-size="13" font-weight="700">6</text><text x="580.922" y="527.168" fill="#000" font-size="13" textLength="184.939">202-shaped status envelope</text><text x="580.922" y="542.301" fill="#000" font-size="13" textLength="305.665">{ correlationId, status, entityId, schemaStatus,</text><text x="589.187" y="557.434" fill="#000" font-size="13" textLength="236.203">authorityStatus, sequenceNumber }</text><polygon points="88.227,736.695,78.227,740.695,88.227,744.695,84.227,740.695" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="82.227" y1="740.695" x2="549.877" y2="740.695" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="94.227" y="675.098" fill="#000" font-size="13" font-weight="700">7</text><text x="107.272" y="614.567" fill="#000" font-size="13" textLength="34.017">202 [</text><text x="115.537" y="629.7" fill="#000" font-size="13" textLength="241.255">{ ...event 1's envelope, "received" },</text><text x="115.537" y="644.833" fill="#000" font-size="13" textLength="241.255">{ ...event 2's envelope, "received" },</text><text x="115.537" y="659.965" fill="#000" font-size="13" textLength="428.34">{ ...event 3's envelope, 400-shaped malformed-envelope entry },</text><text x="115.537" y="675.098" fill="#000" font-size="13" textLength="246.327">{ ...event 4's envelope, "received" } ]</text><text x="107.272" y="690.231" fill="#000" font-size="13" textLength="382.707">-- ARRAY body, one entry per submitted event, submis