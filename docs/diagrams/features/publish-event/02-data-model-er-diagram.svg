<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:1158px;height:411px;background:#FFFFFF;" width="1158px" height="411px" viewBox="0 0 1158 411" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--class etd--><g class="entity" data-qualified-name="etd" id="ent0001" data-source-line="4"><rect x="256.09" y="7" width="363.818" height="123.781" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="366.882" y="24.995" fill="#000" font-size="14" textLength="142.235">EventTypeDefinition</text><line x1="257.09" y1="33.297" x2="618.908" y2="33.297" style="stroke:#181818;stroke-width:0.5;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="267.09" cy="46.945" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="276.09" y="50.292" fill="#000" font-size="14" textLength="134.313">Name : string «PK»</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="267.09" cy="63.242" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="276.09" y="66.589" fill="#000" font-size="14" textLength="123.642">Version : int «PK»</text><line x1="257.09" y1="73.891" x2="618.908" y2="73.891" style="stroke:#181818;stroke-width:1;"/><text x="262.09" y="90.886" fill="#000" font-size="14" textLength="126.643">JsonSchema : text</text><text x="262.09" y="107.183" fill="#000" font-size="14" textLength="98.499">IsActive : bool</text><text x="262.09" y="123.479" fill="#000" font-size="14" textLength="351.818">ParentValidationMode : enum {Strict, Permissive}</text></g><!--class event--><g class="entity" data-qualified-name="event" id="ent0002" data-source-line="13"><rect x="75.84" y="190.78" width="724.325" height="205.266" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="394.851" y="208.775" fill="#000" font-size="14" textLength="86.304">StoredEvent</text><line x1="76.84" y1="217.077" x2="799.165" y2="217.077" style="stroke:#181818;stroke-width:0.5;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="86.84" cy="230.725" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="95.84" y="234.072" fill="#000" font-size="14" textLength="218.032">SequenceNumber : bigint «PK»</text><line x1="76.84" y1="241.374" x2="799.165" y2="241.374" style="stroke:#181818;stroke-width:1;"/><text x="81.84" y="258.369" fill="#000" font-size="14" textLength="166.852">EventId : uuid «unique»</text><text x="81.84" y="274.666" fill="#000" font-size="14" textLength="556.719">EntityId : string?   -- {appId}:{entityType}:{uniqueId}, required once resolved;</text><text x="81.84" y="290.963" fill="#000" font-size="14" textLength="565.838">null until the Router resolves it (ADR-021); supersedes the old optional StreamId</text><text x="81.84" y="307.259" fill="#000" font-size="14" textLength="128.249">EventType : string</text><text x="81.84" y="323.556" fill="#000" font-size="14" textLength="140.725">SchemaVersion : int</text><text x="81.84" y="339.853" fill="#000" font-size="14" textLength="96.722">Payload : text</text><text x="81.84" y="356.15" fill="#000" font-size="14" textLength="625.823">Status : enum {received, processing, applied, rejected} -- transport-level only (ADR-023)</text><text x="81.84" y="372.447" fill="#000" font-size="14" textLength="712.325">SchemaStatus : enum {unknown, invalid, conformant}?      -- advisory, never gates Status (ADR-023)</text><text x="81.84" y="388.744" fill="#000" font-size="14" textLength="196">OccurredAt : datetimeoffset</text></g><g class="entity" data-qualified-name="GMN4" id="ent0005" data-source-line="29"><path d="M834.9,250.59 L834.9,289.05 L800.53,293.05 L834.9,297.05 L834.9,336.254 A0,0 0 0 0 834.9,336.254 L1143.1,336.254 A0,0 0 0 0 1143.1,336.254 L1143.1,260.59 L1133.1,250.59 L834.9,250.59 A0,0 0 0 0 834.9,250.59" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1133.1,250.59 L1133.1,260.59 L1143.1,260.59 L1133.1,250.59" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="840.9" y="267.657" fill="#000" font-size="13" textLength="268.068">Every append starts Status = "received",</text><text x="840.9" y="282.79" fill="#000" font-size="13" textLength="251.228">SchemaStatus = null, EntityId = null --</text><text x="840.9" y="297.923" fill="#000" font-size="13" textLength="287.2">regardless of whether the payload turns out</text><text x="840.9" y="313.055" fill="#000" font-size="13" textLength="281.696">schema-valid. The Router updates all three</text><text x="840.9" y="328.188" fill="#000" font-size="13" textLength="244.436">once validation/resolution completes.</text></g><g class="entity" data-qualified-name="GMN7" id="ent0008" data-source-line="37"><path d="M654.41,48.76 L654.41,65.05 L620.37,69.05 L654.41,73.05 L654.41,89.026 A0,0 0 0 0 654.41,89.026 L941.586,89.026 A0,0 0 0 0 941.586,89.026 L941.586,58.76 L931.586,48.76 L654.41,48.76 A0,0 0 0 0 654.41,48.76" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M931.586,48.76 L931.586,58.76 L941.586,58.76 L931.586,48.76" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="660.41" y="65.827" fill="#000" font-size="13" textLength="184.907">Publish reads the row where</text><text x="660.41" y="80.96" fill="#000" font-size="13" textLength="266.176">Name = event-type AND IsActive = true.</text></g><!--link etd to event--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk3" data-source-line="26" data-link-type="dependency"><path d="M438,131.14 C438,149.57 438,165.26 438,185.53" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="etd-to-event" codeLine="26"/><polygon points="438,190.53,442,181.53,438,185.53,434,181.53,438,190.53" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="6