32" y1="115.43" x2="527.377" y2="115.43" style="stroke:#181818;stroke-width:1;"/><text x="136.932" y="110.364" fill="#000" font-size="13" font-weight="700">1</text><text x="149.978" y="110.364" fill="#000" font-size="13" textLength="366.399">erasure request for EntityId "demo:PolicyApproval:pa-1"</text><polygon points="894.937,155.695,904.937,159.695,894.937,163.695,898.937,159.695" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="533.377" y1="159.695" x2="900.937" y2="159.695" style="stroke:#181818;stroke-width:1;"/><text x="540.377" y="147.063" fill="#000" font-size="13" font-weight="700">2</text><text x="553.422" y="139.497" fill="#000" font-size="13" textLength="254.509">identify classified (x-masking) fields on</text><text x="553.422" y="154.629" fill="#000" font-size="13" textLength="284.356">matching StoredEvent rows for this EntityId</text><path d="M517.377,171.695 L594.001,171.695 L594.001,178.828 L584.001,188.828 L517.377,188.828 L517.377,171.695" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="517.377" y="171.695" width="405.56" height="56.266" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="532.377" y="184.762" fill="#000" font-size="13" textLength="31.624" font-weight="700">loop</text><text x="609.001" y="183.906" fill="#000" font-size="11" textLength="207.786" font-weight="700">[for each classified Payload field]</text><polygon points="894.937,215.961,904.937,219.961,894.937,223.961,898.937,219.961" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="533.377" y1="219.961" x2="900.937" y2="219.961" style="stroke:#181818;stroke-width:1;"/><text x="540.377" y="214.895" fill="#000" font-size="13" font-weight="700">3</text><text x="553.422" y="214.895" fill="#000" font-size="13" textLength="336.515">destroy that field's crypto-shredding key (ADR-057)</text><line x1="533.377" y1="293.359" x2="575.377" y2="293.359" style="stroke:#181818;stroke-width:1;"/><line x1="575.377" y1="293.359" x2="575.377" y2="306.359" style="stroke:#181818;stroke-width:1;"/><line x1="534.377" y1="306.359" x2="575.377" y2="306.359" style="stroke:#181818;stroke-width:1;"/><polygon points="544.377,302.359,534.377,306.359,544.377,310.359,540.377,306.359" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="540.377" y="273.161" fill="#000" font-size="13" font-weight="700">4</text><text x="553.422" y="258.028" fill="#000" font-size="13" textLength="218.747">SignerId / Signature are envelope</text><text x="553.422" y="273.161" fill="#000" font-size="13" textLength="222.022">metadata, categorically exempt --</text><text x="553.422" y="288.293" fill="#000" font-size="13" textLength="310.21">never enumerated as erasable in the first place</text><polygon points="140.932,361.758,130.932,365.758,140.932,369.758,136.932,365.758" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="134.932" y1="365.758" x2="532.377" y2="365.758" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="146.932" y="345.559" fill="#000" font-size="13" font-weight="700">5</text><text x="159.978" y="330.426" fill="#000" font-size="13" textLength="225.837">200 -- erasure applied to classified</text><text x="159.978" y="345.559" fill="#000" font-size="13" textLength="282.687">Payload fields; SignerId/Signature retained,</text><text x="159.978" y="360.692" fill="#000" font-size="13" textLength="170.289">per GDPR Art. 17(3)(b)/(e)</text><path d="M538.377,378.758 L538.377,493.758 L891.377,493.758 L891.377,388.758 L881.377,378.758 L538.377,378.758" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M881.377,378.758 L881.377,388.758 L891.377,388.758 L881.377,378.758" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="544.377" y="395.825" fill="#000" font-size="13" textLength="297.369">Not an accident of scope -- ADR-057's crypto-</text><text x="544.377" y="410.958" fill="#000" font-size="13" textLength="323.077">shredding structurally can't reach envelope fields</text><text x="544.377" y="426.09" fill="#000" font-size="13" textLength="326.619">regardless, but ADR-066 states the RIGHT reason:</text><text x="544.377" y="441.223" fill="#000" font-size="13" textLength="328.396">17(3)(b) legal-obligation retention (21 CFR Part 11</text><text x="544.377" y="456.356" fill="#000" font-size="13" textLength="323.343">record-retention duties) and 17(3)(e) legal-claims</text><text x="544.377" y="471.489" fill="#000" font-size="13" textLength="327.139">defence -- a signature has evidentiary value ONLY</text><text x="544.377" y="486.622" fill="#000" font-size="13" textLength="332.395">because it's tied to a specific, un-erasable identity.</text><?plantuml-src TLFVRzCm47xFNt7g0skbPbs7sAGY8KriZ4a8feuNfBvSx6jZvjZ6lfJbl-UIDEdOu25Iujnzz_quOytUrLL1CKF5FiBa6XdXeIv-ac9Om4t4L4U2DVsgAJ752M22E7nb0ICRPG8wXibGVEDqyCRnnaslhjVvsRlBMTT6_V_XTwPbLe69f7DF0l067bH9bSmNAjIrw2BBnccGVtY9iHeE1awm5HKtZWqtTneccYg_klVMgEOgXEZtQ5S1y-KaUm7KOkjY1KOB4xDjG5bCoMmDQPW-vHMcH-DsCv03gnDujt4LiYhbiAUhUmtH_quT1ovD6ebarllG7HEgyZdsFJRMe-vnCu3_qD8YBVf6K97xsfC4AZQ1VPvAcQvR8e_Km6XvHax_I-Kh1n_Cpb4KjnRTAt9h9yf3Ra_M1nAfnDYcDGU5J3iVZK9h6w0dgeAWvXldQ2y9aMoJ361HTWWS2qjWd30d8HubeM1HqMjcGcrCUWNdPsToDAQB8TZMBlRFpDkulznBxqSfYwEGADID8ptVk204Rw_lrt0L-HIMbzEtisanMqnfbZdFKcfs9OFVlbfKWA-U0HsWKjs2j4L9YJKjnuFXnq2a_fY9v5OhOTBvfT2To8vqIp2uUo0lJP5s6BMbbEPGrDm3Nrm8X1YQEWVNTxUVlxS0oRkLj0mYm4glpNrXpGxPUDVgRZTPtgRdI_ZuQIsh5XcMoswGyb7dnn9Tiw4q4udw04a3fDXjgfQTfYqvrIb6IAE_PPlplhys61kG6rOJVFlwvOVq5AImbWjkMDpXGu3I7KX9WceEjSkFIz9XS7FQRYwqYVm1?></g></svg>