ox Endpoint</text><rect x="809.462" y="895.898" width="168.759" height="30.297" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="816.462" y="915.894" fill="#000" font-size="14" textLength="154.759">SchemaRegistryClient</text><rect x="988.221" y="895.898" width="180.229" height="46.594" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1012.612" y="915.894" fill="#000" font-size="14" textLength="131.448">EventStore.DevIdp</text><text x="995.221" y="932.19" fill="#000" font-size="14" textLength="166.229">(or a real IdP, ADR-006)</text><text x="1178.451" y="908.894" fill="#000" font-size="14" textLength="157.972">Event &amp; Schema Store</text><path d="M1242.437,922.195 C1242.437,912.195 1260.437,912.195 1260.437,912.195 C1260.437,912.195 1278.437,912.195 1278.437,922.195 L1278.437,948.195 C1278.437,958.195 1260.437,958.195 1260.437,958.195 C1260.437,958.195 1242.437,958.195 1242.437,948.195 L1242.437,922.195" style="stroke:#181818;stroke-width:0.5;" fill="#E2E2F0"/><path d="M1242.437,922.195 C1242.437,932.195 1260.437,932.195 1260.437,932.195 C1260.437,932.195 1278.437,932.195 1278.437,922.195" style="stroke:#181818;stroke-width:0.5;" fill="none"/><polygon points="443.453,141.695,453.453,145.695,443.453,149.695,447.453,145.695" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="59.86" y1="145.695" x2="449.453" y2="145.695" style="stroke:#181818;stroke-width:1;"/><text x="66.86" y="125.497" fill="#000" font-size="13" font-weight="700">1</text><text x="79.906" y="110.364" fill="#000" font-size="13" textLength="189.96">POST /publish/PolicyApproval</text><text x="79.906" y="125.497" fill="#000" font-size="13" textLength="234.521">Bearer &lt;JWT, acr insufficient/stale></text><text x="79.906" y="140.629" fill="#000" font-size="13" textLength="261.371">{ payload: {...}, meaning: "approved" }</text><polygon points="881.842,170.828,891.842,174.828,881.842,178.828,885.842,174.828" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="455.453" y1="174.828" x2="887.842" y2="174.828" style="stroke:#181818;stroke-width:1;"/><text x="462.453" y="169.762" fill="#000" font-size="13" font-weight="700">2</text><text x="475.499" y="169.762" fill="#000" font-size="13" textLength="401.343">get EventTypeDefinition("PolicyApproval").RequiredSignature</text><path d="M43.86,186.828 L108.303,186.828 L108.303,193.961 L98.303,203.961 L43.86,203.961 L43.86,186.828" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="43.86" y="186.828" width="1589.458" height="685.07" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="58.86" y="199.895" fill="#000" font-size="13" textLength="19.443" font-weight="700">alt</text><text x="123.303" y="199.039" fill="#000" font-size="11" textLength="353.912" font-weight="700">[RequiredSignature is null (not configured for this type)]</text><line x1="455.453" y1="250.227" x2="497.453" y2="250.227" style="stroke:#181818;stroke-width:1;"/><line x1="497.453" y1="250.227" x2="497.453" y2="263.227" style="stroke:#181818;stroke-width:1;"/><line x1="456.453" y1="263.227" x2="497.453" y2="263.227" style="stroke:#181818;stroke-width:1;"/><polygon points="466.453,259.227,456.453,263.227,466.453,267.227,462.453,263.227" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="462.453" y="237.594" fill="#000" font-size="13" font-weight="700">3</text><text x="475.499" y="230.028" fill="#000" font-size="13" textLength="253.145">proceed exactly as an ordinary publish</text><text x="475.499" y="245.161" fill="#000" font-size="13" textLength="337.499">(ADR-023) -- completely unaffected, purely additive</text><line x1="43.86" y1="272.227" x2="1633.319" y2="272.227" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="48.86" y="284.437" fill="#000" font-size="11" textLength="395.833" font-weight="700">[RequiredSignature = { AcrValues, MaxAge } and caller's token</text><text x="48.86" y="297.242" fill="#000" font-size="11" textLength="366.663" font-weight="700">doesn't carry a satisfying "acr" claim / isn't recent enough]</text><polygon points="70.86,350.234,60.86,354.234,70.86,358.234,66.86,354.234" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="64.86" y1="354.234" x2="454.453" y2="354.234" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="76.86" y="334.036" fill="#000" font-size="13" font-weight="700">4</text><text x="89.906" y="318.903" fill="#000" font-size="13" textLength="24.813">401</text><text x="89.906" y="334.036" fill="#000" font-size="13" textLength="243.864">WWW-Authenticate: step-up required</text><text x="89.906" y="349.168" fill="#000" font-size="13" textLength="297.527">(acr_values="urn:...:step-up", max_age=300)</text><path d="M460.453,367.234 L460.453,452.234 L775.453,452.234 L775.453,377.234 L765.453,367.234 L460.453,367.234" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M765.453,367.234 L765.453,377.234 L775.453,377.234 L765.453,367.234" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="466.453" y="384.301" fill="#000" font-size="13" textLength="292.449">Turned away BEFORE storage -- the one new</text><text x="466.453" y="399.434" fill="#000" font-size="13" textLength="284.299">pre-storage rejection case ADR-066 names,</text><text x="466.453" y="414.567" fill="#000" font-size="13" textLength="294.887">alongside ADR-023's existing envelope-parse</text><text x="466.453" y="429.7" fill="#000" font-size="13" textLength="274.688">exception. The event's own DATA is never</text><text x="466.453" y="444.833" fill="#000" font-size="13" textLength="232.28">rejected for shape/content reasons.</text><polygon points="1066.336,490.164,1076.336,494.164,1066.336,498.164,1070.336,494.164" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="59.86" y1="494.164" x2="1072.336" y2="494.164" style="stroke:#181818;stroke-width:1;"/><text x="66.86" y="481.532" fill="#000" font-size="13" font-weight="700">5</text><text x="79.906" y="473.965" fill="#000" font-size="13" textLength="361.048">re-authenticate (password re-entry / OTP / WebAuthn --</text><text x="79.906" y="489.098" fill="#000" font-size="13" textLength="394.786">the IdP's own mechanism, never this framework's, ADR-066)</text><polygon points="70.86,519.297,60.86,523.297,70.86,527.297,66.86,523.297" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="64.86" y1="523.297" x2="1077.336" y2="523.297" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="76.86" y="518.231" fill="#000" font-size="13" font-weight="700">6</text><text x="89.906" y="518.231" fill="#000" font-size="13" textLength="339.574">new token, acr = "urn:...:step-up", auth_time recent</text><polygon points="443.453,563.563,453.453,567.563,443.453,571.563,447.453,567.563" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="59.86" y1="567.563" x2="449.453" y2="567.563" style="stroke:#181818;stroke-width:1;"/><text x="66.86" y="554.93" fill="#000" font-size="13" font-weight="700">7</text><text x="79.906" y="547.364" fill="#000" font-size="13" textLength="225.57">retry POST /publish/PolicyApproval</text><text x="79.906" y="562.497" fill="#000" font-size="13" textLength="224.39">(same payload, stepped-up token)</text><line x1="43.86" y1="576.563" x2="1633.319" y2="576.563" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="48.86" y="588.773" fill="#000" font-size="11" textLength="451.693" font-weight="700">[RequiredSignature satisfied, but "meaning" is absent from the request]</text><polygon points="70.86,656.898,60.86,660.898,70.86,664.898,66.86,660.898" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="64.86" y1="660.898" x2="454.453" y2="660.898" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="76.86" y="633.133" fill="#000" font-size="13" font-weight="700">8</text><text x="89.906" y="610.434" fill="#000" font-size="13" textLength="238.805">400 -- Signature.Meaning is required</text><text x="89.906" y="625.567" fill="#000" font-size="13" textLength="337.238">(envelope metadata, not Payload -- treated like any</text><text x="89.906" y="640.7" fill="#000" font-size="13" textLength="286.451">other missing required transport field under</text><text x="89.906" y="655.833" fill="#000" font-size="13" textLength="358.547">ADR-023's envelope-shape exception, never persisted)</text><line x1="43.86" y1="669.898" x2="1633.319" y2="669.898" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="48.86" y="682.109" fill="#000" font-size="11" textLength="320.407" font-weight="700">[RequiredSignature satisfied and meaning present]</text><polygon points="1248.437,750.234,1258.437,754.234,1248.437,758.234,1252.437,754.234" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="455.453" y1="754.234" x2="1254.437" y2="754.234" style="stroke:#181818;stroke-width:1;"/><text x="462.453" y="726.469" fill="#000" font-size="13" font-weight="700">9</text><text x="475.499" y="703.77" fill="#000" font-size="13" textLength="131.27">INSERT StoredEvent</text><text x="475.499" y="718.903" fill="#000" font-size="13" textLength="223.412">{ ..., ActorId: signer's verified sub,</text><text x="483.763" y="734.036" fill="#000" font-size="13" textLength="299.063">Signature: { SignerId: ActorId, SignedAt: now,</text><text x="492.028" y="749.168" fill="#000" font-size="13" textLength="304.916">Meaning: "approved", Acr: "urn:...:step-up" } }</text><polygon points="70.86,779.367,60.86,783.367,70.86,787.367,66.86,783.367" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="64.86" y1="783.367" x2="454.453" y2="783.367" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="76.86" y="778.301" fill="#000" font-size="13" textLength="18.091" font-weight="700">10</text><text x="98.951" y="778.301" fill="#000" font-size="13" textLength="170.212">202 { status: "received" }</text><path d="M1265.437,796.367 L1265.437,866.367 L1611.437,866.367 L1611.437,806.367 L1601.437,796.367 L1265.437,796.367" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1601.437,796.367 L1601.437,806.367 L1611.437,806.367 L1601.437,796.367" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="1271.437" y="813.434" fill="#000" font-size="13" textLength="295.033">Signature is envelope metadata on the SAME</text><text x="1271.437" y="828.567" fill="#000" font-size="13" textLength="325.882">StoredEvent ChainHash already covers (ADR-019)</text><text x="1271.437" y="843.7" fill="#000" font-size="13" textLength="308.312">-- exactly as tamper-evident as everything else</text><text x="1271.437" y="858.833" fill="#000" font-size="13" textLength="270.074">in the log, no separately-secured artifact.</text><?plantuml-src XLLTJoit47tFhnZbeO2q-RXG8JKgLygzf2gLk20IbPT8QBAUJLmszjRsXaI8_zvZxmP8kRVDGvJOuvdnEMUEkGxMrEk5k0xdmJhgJlNIQBEaSVpR9VRaiOBzYbtGkQxO1EfUcONTqiIeoceJKfYEIuTHqtmbQxwJfVR1xRwMMjfOrouTXayss9-YhFGlPNEbghavHakCS2xfIjrcDBwywms7voTDHLLr50TUi9VsDFr4JL5AULAOMdGwpHsezxbfSqItDzCP3QfwKMg_6jpQKkUxSLKvk-5oRhu8EuJ_-iVzB2FE7KxvkYZGAMeCVE1IFi_DCrMyAosh4Jtt-_sNZDR24RmHTJdb4jMbbqug6MllhpsYfGHA3SzsbLnAeOqEsfhZxc4dtPF-dVnTQoSgyiAXTjBXCj27LTAUJ5sMT6nieDoQGY-nhAW0Wc65tO1A9nsYrsvQ950f5mJA5WeeTn4nDcITqeRTZbg8G4N2_lJiX7ez55XNfGH1V6suA2GFeZ84kxZ4Ik4w6-b82MO-zdf1pz2N-vFBMdn6rxmTBuLUK5THpcKfxWZzsaSnSwEiU7E4Ax53DqoUW_R5Bagq2sQwb9UirpG0037CIHvb8CRMozNRRN7THW8Z-dduQMxkx-zxupgi4Ajp3Z8Y7wJgrHKIDDtYmaZ_i4azNdHhPqRWUDI6TS4rRnzuAHTdms645R0BERrS1R95Emo4pmmdWIu_yOw-J7wxkPkWb7Ku6N541sIDa96d