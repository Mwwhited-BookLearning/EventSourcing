text x="971.43" y="331.856" fill="#000" font-size="14" textLength="196">OccurredAt : datetimeoffset</text></g><g class="entity" data-qualified-name="GMN6" id="ent0007" data-source-line="35"><path d="M548.39,158.19 L548.39,265.05 L513.45,269.05 L548.39,273.05 L548.39,380.049 A0,0 0 0 0 548.39,380.049 L930.502,380.049 A0,0 0 0 0 930.502,380.049 L930.502,168.19 L920.502,158.19 L548.39,158.19 A0,0 0 0 0 548.39,158.19" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M920.502,158.19 L920.502,168.19 L930.502,168.19 L920.502,158.19" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="554.39" y="175.257" fill="#000" font-size="13" textLength="329.697">A where argument's field name is checked against</text><text x="554.39" y="190.39" fill="#000" font-size="13" textLength="361.112">JsonPaths declared here, but at RESOLVER RUNTIME by</text><text x="554.39" y="205.523" fill="#000" font-size="13" textLength="330.675">GraphQlFilterPredicateBuilder, not by the GraphQL</text><text x="554.39" y="220.655" fill="#000" font-size="13" textLength="304.237">schema itself -- EventFilterInput is a static, flat</text><text x="554.39" y="235.788" fill="#000" font-size="13" textLength="299.762">{ field, eq, neq, gt, gte, lt, lte, contains } type</text><text x="554.39" y="250.921" fill="#000" font-size="13" textLength="274.117">that can syntactically name anything (see</text><text x="554.39" y="266.054" fill="#000" font-size="13" textLength="351.565">filter-pushdown.md's own note on why: no bound CLR</text><text x="554.39" y="281.187" fill="#000" font-size="13" textLength="303.247">type for [UseFiltering] to reflect over here). An</text><text x="554.39" y="296.319" fill="#000" font-size="13" textLength="329.589">honest, narrower guarantee than ADR-037's literal</text><text x="554.39" y="311.452" fill="#000" font-size="13" textLength="317.002">schema-shape claim for FILTERING specifically --</text><text x="554.39" y="326.585" fill="#000" font-size="13" textLength="269.28">still literally true for the subscription field</text><text x="554.39" y="341.718" fill="#000" font-size="13" textLength="314.729">NAME and its payload fields, which this dynamic</text><text x="554.39" y="356.851" fill="#000" font-size="13" textLength="337.829">schema module genuinely composes per registered</text><text x="554.39" y="371.983" fill="#000" font-size="13" textLength="74.331">event type.</text></g><!--link etd to ff--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk4" data-source-line="31" data-link-type="crowfoot"><path d="M600.18,53.05 C483.66,53.05 289.44,53.05 289.44,53.05 C289.44,53.05 289.44,117.62 289.44,180.67" style="stroke:#181818;stroke-width:1;" fill="none" id="etd-ff" codeLine="31"/><line x1="604.18" y1="49.05" x2="604.18" y2="57.05" style="stroke:#181818;stroke-width:1;"/><line x1="601.18" y1="49.05" x2="601.18" y2="57.05" style="stroke:#181818;stroke-width:1;"/><line x1="600.18" y1="53.05" x2="608.18" y2="53.05" style="stroke:#181818;stroke-width:1;"/><line x1="289.44" y1="190.67" x2="295.44" y2="198.67" style="stroke:#181818;stroke-width:1;"/><line x1="289.44" y1="190.67" x2="283.44" y2="198.67" style="stroke:#181818;stroke-width:1;"/><line x1="289.44" y1="190.67" x2="289.44" y2="198.67" style="stroke:#181818;stroke-width:1;"/><ellipse cx="289.44" cy="184.67" rx="4" ry="4" fill="none" style="stroke:#181818;stroke-width:1;"/><text x="7" y="49.117" fill="#000" font-size="13" textLength="368.558">(Name, Version) = (EventTypeName, EventTypeVersion)</text></g><!--link etd to event--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk5" data-source-line="32" data-link-type="dependency"><path d="M768.71,53.05 C885.22,53.05 1087.44,53.05 1087.44,53.05 C1087.44,53.05 1087.44,130.62 1087.44,193.67" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="etd-to-event" codeLine="32"/><polygon points="1087.44,198.67,1091.44,189.67,1087.44,193.67,1083.44,189.67,1087.44,198.67" fill