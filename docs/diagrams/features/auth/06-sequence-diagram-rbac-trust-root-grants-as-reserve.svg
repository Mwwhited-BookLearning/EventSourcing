 font-size="14" textLength="156.017">Platform/App operator</text><ellipse cx="91.008" cy="22.391" rx="8" ry="8" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;"/><path d="M91.008,30.391 L91.008,57.391 M78.008,38.391 L104.008,38.391 M91.008,57.391 L78.008,72.391 M91.008,57.391 L104.008,72.391" style="stroke:#181818;stroke-width:0.5;" fill="none"/><rect x="268.532" y="26.297" width="321.576" height="62.891" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="418.246" y="46.292" fill="#000" font-size="14" textLength="22.148">API</text><text x="296.221" y="62.589" fill="#000" font-size="14" textLength="266.198">(EventStore.Rbac's RbacEndpoints.cs,</text><text x="275.532" y="78.886" fill="#000" font-size="14" textLength="307.576">Host-side, role/permission/trust-root admin)</text><rect x="748.696" y="42.594" width="210.171" height="46.594" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="837.375" y="62.589" fill="#000" font-size="14" textLength="32.813">Auth</text><text x="755.696" y="78.886" fill="#000" font-size="14" textLength="196.171">(JWT Bearer + scope policy)</text><text x="980.84" y="70.589" fill="#000" font-size="14" textLength="69.809">Event Log</text><text x="968.867" y="86.886" fill="#000" font-size="14" textLength="93.755">(core engine)</text><path d="M1000.745,21.594 C1000.745,11.594 1018.745,11.594 1018.745,11.594 C1018.745,11.594 1036.745,11.594 1036.745,21.594 L1036.745,47.594 C1036.745,57.594 1018.745,57.594 1018.745,57.594 C1018.745,57.594 1000.745,57.594 1000.745,47.594 L1000.745,21.594" style="stroke:#181818;stroke-width:0.5;" fill="#E2E2F0"/><path d="M1000.745,21.594 C1000.745,31.594 1018.745,31.594 1018.745,31.594 C1018.745,31.594 1036.745,31.594 1036.745,21.594" style="stroke:#181818;stroke-width:0.5;" fill="none"/><rect x="1226.047" y="10" width="239.941" height="79.188" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1274.722" y="29.995" fill="#000" font-size="14" textLength="142.591">EventStore.DevIdp's</text><text x="1268.361" y="46.292" fill="#000" font-size="14" textLength="155.313">RbacProjectionWorker</text><text x="1233.047" y="62.589" fill="#000" font-size="14" textLength="225.941">(BackgroundService, follows the</text><text x="1258.275" y="78.886" fill="#000" font-size="14" textLength="175.485">Event Log cross-process)</text><rect x="1568.54" y="26.297" width="286.029" height="62.891" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1580.625" y="46.292" fill="#000" font-size="14" textLength="261.857">Role / UserPermission / AppTrustRoot</text><text x="1603.885" y="62.589" fill="#000" font-size="14" textLength="215.339">(DevIdp-LOCAL tables, never a</text><text x="1575.54" y="78.886" fill="#000" font-size="14" textLength="272.029">core-engine EntityStoreRow, ADR-067)</text><text x="10" y="757.104" fill="#000" font-size="14" textLength="156.017">Platform/App operator</text><ellipse cx="91.008" cy="768.906" rx="8" ry="8" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;"/><path d="M91.008,776.906 L91.008,803.906 M78.008,784.906 L104.008,784.906 M91.008,803.906 L78.008,818.906 M91.008,803.906 L104.008,818.906" style="stroke:#181818;stroke-width:0.5;" fill="none"/><rect x="268.532" y="744.109" width="321.576" height="62.891" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="418.246" y="764.104" fill="#000" font-size="14" textLength="22.148">API</text><text x="296.221" y="780.401" fill="#000" font-size="14" textLength="266.198">(EventStore.Rbac's RbacEndpoints.cs,</text><text x="275.532" y="796.698" fill="#000" font-size="14" textLength="307.576">Host-side, role/permission/trust-root admin)</text><rect x="748.696" y="744.109" width="210.171" height="46.594" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="837.375" y="764.104" fill="#000" font-size="14" textLength="32.813">Auth</text><text x="755.696" y="780.401" fill="#000" font-size="14" textLength="196.171">(JWT Bearer + scope policy)</text><text x="980.84" y="757.104" fill="#000" font-size="14" textLength="69.809">Event Log</text><text x="968.867" y="773.401" fill="#000" font-size="14" textLength="93.755">(core engine)</text><path d="M1000.745,786.703 C1000.745,776.703 1018.745,776.703 1018.745,776.703 C1018.745,776.703 1036.745,776.703 1036.745,786.703 L1036.745,812.703 C1036.745,822.703 1018.745,822.703 1018.745,822.703 C1018.745,822.703 1000.745,822.703 1000.745,812.703 L1000.745,786.703" style="stroke:#181818;stroke-width:0.5;" fill="#E2E2F0"/><path d="M1000.745,786.703 C1000.745,796.703 1018.745,796.703 1018.745,796.703 C1018.745,796.703 1036.745,796.703 1036.745,786.703" style="stroke:#181818;stroke-width:0.5;" fill="none"/><rect x="1226.047" y="744.109" width="239.941" height="79.188" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1274.722" y="764.104" fill="#000" font-size="14" textLength="142.591">EventStore.DevIdp's</text><text x="1268.361" y="780.401" fill="#000" font-size="14" textLength="155.313">RbacProjectionWorker</text><text x="1233.047" y="796.698" fill="#000" font-size="14" textLength="225.941">(BackgroundService, follows the</text><text x="1258.275" y="812.995" fill="#000" font-size="14" textLength="175.485">Event Log cross-process)</text><rect x="1568.54" y="744.109" width="286.029" height="62.891" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1580.625" y="764.104" fill="#000" font-size="14" textLength="261.857">Role / UserPermission / AppTrustRoot</text><text x="1603.885" y="780.401" fill="#000" font-size="14" textLength="215.339">(DevIdp-LOCAL tables, never a</text><text x="1575.54" y="796.698" fill="#000" font-size="14" textLength="272.029">core-engine EntityStoreRow, ADR-067)</text><polygon points="417.32,130.453,427.32,134.453,417.32,138.453,421.32,134.453" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="91.008" y1="134.453" x2="423.32" y2="134.453" style="stroke:#181818;stroke-width:1;"/><text x="98.008" y="121.821" fill="#000" font-size="13" font-weight="700">1</text><text x="111.054" y="114.254" fill="#000" font-size="13" textLength="301.266">grant/revoke a role, grant a direct permission,</text><text x="111.054" y="129.387" fill="#000" font-size="13" textLength="181.149">or register an AppTrustRoot</text><polygon points="841.782,189.852,851.782,193.852,841.782,197.852,845.782,193.852" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="429.32" y1="193.852" x2="847.782" y2="193.852" style="stroke:#181818;stroke-width:1;"/><text x="436.32" y="173.653" fill="#000" font-size="13" font-weight="700">2</text><text x="449.365" y="158.52" fill="#000" font-size="13" textLength="320.963">validate token + registry:admin (RBAC grants) or</text><text x="449.365" y="173.653" fill="#000" font-size="13" textLength="319.82">registry:trust-admin (AppTrustRoot, ADR-044 -- a</text><text x="449.365" y="188.786" fill="#000" font-size="13" textLength="387.417">deliberately separate scope, not implied by registry:admin)</text><path d="M75.008,205.852 L139.451,205.852 L139.451,212.984 L129.451,222.984 L75.008,222.984 L75.008,205.852" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="75.008" y="205.852" width="1652.546" height="327.797" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="90.008" y="218.918" fill="#000" font-size="13" textLength="19.443" font-weight="700">alt</text><text x="154.451" y="218.062" fill="#000" font-size="11" textLength="199.337" font-weight="700">[missing/invalid token or scope]</text><polygon points="102.008,250.117,92.008,254.117,102.008,258.117,98.008,254.117" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="96.008" y1="254.117" x2="852.782" y2="254.117" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="108.008" y="249.051" fill="#000" font-size="13" font-weight="700">3</text><text x="121.054" y="249.051" fill="#000" font-size="13" textLength="62.271">401 / 403</text><line x1="75.008" y1="263.117" x2="1727.554" y2="263.117" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="80.008" y="275.328" fill="#000" font-size="11" textLength="76.887" font-weight="700">[authorized]</text><polygon points="1006.745,358.586,1016.745,362.586,1006.745,366.586,1010.745,362.586" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="429.32" y1="362.586" x2="1012.745" y2="362.586" style="stroke:#181818;stroke-width:1;"/><text x="436.32" y="327.254" fill="#000" font-size="13" font-weight="700">4</text><text x="449.365" y="296.989" fill="#000" font-size="13" textLength="326.32">append reserved "RoleGranted" / "RoleRevoked" /</text><text x="449.365" y="312.122" fill="#000" font-size="13" textLength="224.885">"PermissionGranted" (ADR-046) or</text><text x="449.365" y="327.254" fill="#000" font-size="13" textLength="284.02">"AppTrustRootRegistered" (ADR-044) event</text><text x="449.365" y="342.387" fill="#000" font-size="13" textLength="328.498">-- ActorId = operator's verified identity (ADR-064);</text><text x="449.365" y="357.52" fill="#000" font-size="13" textLength="382.294">same StoredEvent shape, same hash chain (ADR-019/067)</text><polygon points="102.008,387.719,92.008,391.719,102.008,395.719,98.008,391.719" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="96.008" y1="391.719" x2="428.32" y2="391.719" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="108.008" y="386.653" fill="#000" font-size="13" font-weight="700">5</text><text x="121.054" y="386.653" fill="#000" font-size="13" textLength="164.087">201 (or 200 for a revoke)</text><line x1="1344.018" y1="451.117" x2="1334.018" y2="447.117" style="stroke:#181818;stroke-width:1;"/><line x1="1344.018" y1="451.117" x2="1334.018" y2="455.117" style="stroke:#181818;stroke-width:1;"/><line x1="1018.745" y1="451.117" x2="1345.018" y2="451.117" style="stroke:#181818;stroke-width:1;"/><text x="1025.745" y="430.918" fill="#000" font-size="13" font-weight="700">6</text><text x="1038.79" y="415.786" fill="#000" font-size="13" textLength="277.958">TailAsync (core engine's own Follow API) --</text><text x="1038.79" y="430.918" fill="#000" font-size="13" textLength="290.228">asynchronous, cross-process, not part of the</text><text x="1038.79" y="446.051" fill="#000" font-size="13" textLength="130.216">request above at all</text><polygon points="1699.554,521.648,1709.554,525.648,1699.554,529.648,1703.554,525.648" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1346.018" y1="525.648" x2="1705.554" y2="525.648" style="stroke:#181818;stroke-width:1;"/><text x="1353.018" y="497.883" fill="#000" font-size="13" font-weight="700">7</text><text x="1366.063" y="475.184" fill="#000" font-size="13" textLength="285.733">fold via RoleService/TrustRootService's own</text><text x="1366.063" y="490.317" fill="#000" font-size="13" textLength="290.272">already-idempotent methods, entirely inside</text><text x="1366.063" y="505.45" fill="#000" font-size="13" textLength="328.491">EventStore.DevIdp -- no EntityStoreRow anywhere</text><text x="1366.063" y="520.583" fill="#000" font-size="13" textLength="73.392">in this path</text><path d="M927.299,552.648 L927.299,728.648 L1802.299,728.648 L1802.299,562.648 L1792.299,552.648 L927.299,552.648" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1792.299,552.648 L1792.299,562.648 L1802.299,562.648 L1792.299,552.648" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="1161.546" y="569.715" fill="#000" font-size="13" textLength="344.056">None of these four event types is ever registered via</text><text x="1161.546" y="584.848" fill="#000" font-size="13" textLength="346.074">PUT /registry/{event-type} -- reserved the same way</text><text x="1161.546" y="599.981" fill="#000" font-size="13" textLength="371.858">ADR-020's EventUpcastFailed already is (ADR-067). Each</text><text x="1161.546" y="615.114" fill="#000" font-size="13" textLength="324.13">is traceable through the ordinary Lineage API and</text><text x="1161.546" y="630.247" fill="#000" font-size="13" textLength="383.259">linkable via parentEventIds (ADR-005) wherever a genuine</text><text x="1161.546" y="645.379" fill="#000" font-size="13" textLength="356.814">causal relationship to a business event exists. The fold</text><text x="1161.546" y="660.512" fill="#000" font-size="13" textLength="398.208">into Role/UserPermission/AppTrustRoot happens one process</text><text x="1161.546" y="675.645" fill="#000" font-size="13" textLength="337.403">over, inside EventStore.DevIdp -- confirmed against</text><text x="1161.546" y="690.778" fill="#000" font-size="13" textLength="343.078">RbacProjectionWorker.cs -- not synchronously in this</text><text x="1161.546" y="705.911" fill="#000" font-size="13" textLength="300.834">request, and not via the core engine's generic</text><text x="1161.546" y="721.043" fill="#000" font-size="13" textLength="212.31">EntityStoreRow fold mechanism.</text><?plantuml-src RLLDR-Cs4BtxLmnysHYr8s_gfgYB1d1sizqKGHju4-p55reQMsmaKYKfkshH_zutfEpOmPuIIJESUL-qQeCrRRrcDr1vi8w6ZvKA6-lgRD4qP1js2g-7fFpnOT0e5tIk6sK23HUFzojpSRTZ4xxW8rykrof_vqd-t9cYiTe4VvdxySfyjZvCl2vuJCvMdE6yMdklhSc2Q_7DMHj85RKsepXHDVhDi3QKcFRRroUwPUNOqNVaSon6ZQrqtlLjg1eKAgYryap3k1izs2qwSsn8RBRQSAfb-OXlvtDEu7patNtHlFCh8uWUdVsJyu2LlrhtmWv7tghyPUjiQuelx7Ow1xgDhIgxznHANfdZUCgTzNxIE9kpzsdyFfvoFdm9RYYZPy_kySWGNa2G9w5f2POmDoqsUVZZm-A1WBLYFoO3F8xKoWZGIG9AToReq4KuIxiVq-BZSZAz_Z5ju81gC3XeIvCRONrEMuTTCiSx-yAaebxZz19FXNOWWLxrWxZeTRpLFiXySxRi02V6Ww7Bd7QgqX27AU1e0m5Jc-lcKNcwMDukFgHHVaGM51yBaalwijC9FQRPZ2OJGLzmfTU2YAkEF8DU6HYT0evWCbqtbU