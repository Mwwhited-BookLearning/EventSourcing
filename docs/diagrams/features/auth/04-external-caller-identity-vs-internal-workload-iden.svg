">(spiffe://&lt;trust-domain>/eventstore/router)</text><polygon points="104.231,171.258,94.231,175.258,104.231,179.258,100.231,175.258" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="98.231" y1="175.258" x2="697.563" y2="175.258" style="stroke:#181818;stroke-width:1;"/><text x="110.231" y="170.192" fill="#000" font-size="13" font-weight="700">3</text><text x="123.276" y="170.192" fill="#000" font-size="13" textLength="38.029">attest</text><polygon points="686.563,215.523,696.563,219.523,686.563,223.523,690.563,219.523" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="93.231" y1="219.523" x2="692.563" y2="219.523" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="100.231" y="206.891" fill="#000" font-size="13" font-weight="700">4</text><text x="113.276" y="199.325" fill="#000" font-size="13" textLength="146.929">short-lived X.509-SVID</text><text x="113.276" y="214.458" fill="#000" font-size="13" textLength="268.131">(spiffe://&lt;trust-domain>/eventstore/fold)</text><polygon points="686.563,259.789,696.563,263.789,686.563,267.789,690.563,263.789" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="442.956" y1="263.789" x2="692.563" y2="263.789" style="stroke:#181818;stroke-width:1;"/><text x="449.956" y="251.157" fill="#000" font-size="13" font-weight="700">5</text><text x="463.001" y="243.59" fill="#000" font-size="13" textLength="196.276">internal call, mTLS handshake</text><text x="463.001" y="258.723" fill="#000" font-size="13" textLength="218.563">(each side presents its own SVID)</text><line x1="698.563" y1="308.055" x2="740.563" y2="308.055" style="stroke:#181818;stroke-width:1;"/><line x1="740.563" y1="308.055" x2="740.563" y2="321.055" style="stroke:#181818;stroke-width:1;"/><line x1="699.563" y1="321.055" x2="740.563" y2="321.055" style="stroke:#181818;stroke-widt