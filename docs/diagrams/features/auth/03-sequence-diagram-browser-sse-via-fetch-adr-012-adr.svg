<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SEQUENCE" style="width:1059px;height:619px;background:#FFFFFF;" width="1059px" height="619px" viewBox="0 0 1059 619" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="174.606" y="387.453" width="446.141" height="104.203" fill="none" style="stroke:#000;stroke-width:1.5;"/><g><title>Browser</title><rect x="187.106" y="102.594" width="8" height="413.063" fill="#000" fill-opacity="0"/><line x1="190.606" y1="102.594" x2="190.606" y2="515.656" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>GraphQL Gateway</title><rect x="601.246" y="102.594" width="8" height="413.063" fill="#000" fill-opacity="0"/><line x1="604.746" y1="102.594" x2="604.746" y2="515.656" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><text x="159.086" y="82.995" fill="#000" font-size="14" textLength="57.039">Browser</text><text x="96.493" y="99.292" fill="#000" font-size="14" textLength="182.226">(fetch(), not EventSource)</text><ellipse cx="190.606" cy="18.5" rx="8" ry="8" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;"/><path d="M190.606,26.5 L190.606,53.5 M177.606,34.5 L203.606,34.5 M190.606,53.5 L177.606,68.5 M190.606,53.5 L203.606,68.5" style="stroke:#181818;stroke-width:0.5;" fill="none"/><rect x="466.144" y="55" width="277.204" height="46.594" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="540.718" y="74.995" fill="#000" font-size="14" textLength="128.058">GraphQL Gateway</text><text x="473.144" y="91.292" fill="#000" font-size="14" textLength="263.204">(HotChocolate, graphql-sse over SSE)</text><text x="159.086" y="528.651" fill="#000" font-size="14" textLength="57.039">Browser</text><text x="96.493" y="544.948" fill="#000" font-size="14" textLength="182.226">(fetch(), not EventSource)</text><ellipse cx="190.606" cy="556.75" rx="8" ry="8" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;"/><path d="M190.606,564.75 L190.606,591.75 M177.606,572.75 L203.606,572.75 M190.606,591.75 L177.606,606.75 M190.606,591.75 L203.606,606.75" style="stroke:#181818;stroke-width:0.5;" fill="none"/><rect x="466.144" y="515.656" width="277.204" height="46.594" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="540.718" y="535.651" fill="#000" font-size="14" textLength="128.058">GraphQL Gateway</text><text x="473.144" y="551.948" fill="#000" font-size="14" textLength="263.204">(HotChocolate, graphql-sse over SSE)</text><path d="M15,115.594 L15,261.594 L366,261.594 L366,125.594 L356,115.594 L15,115.594" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M356,115.594 L356,125.594 L366,125.594 L356,115.594" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="21" y="132.661" fill="#000" font-size="13" textLength="249.971">Follow is QUERY, not GET (ADR-012) --</text><text x="21" y="147.793" fill="#000" font-size="13" textLength="273.927">EventSource can only issue GET and can't</text><text x="21" y="162.926" fill="#000" font-size="13" textLength="255.246">set headers, so it can't be used here at</text><text x="21" y="178.059" fill="#000" font-size="13" textLength="267.535">all. fetch() can do both: a QUERY request</text><text x="21" y="193.192" fill="#000" font-size="13" textLength="267.795">with a real Authorization header, reading</text><text x="21" y="208.325" fill="#000" font-size="13" textLength="311.295">the text/event-stream response body manually.</text><text x="21" y="223.458" fill="#000" font-size="13" textLength="316.78">The request body is now a GraphQL subscription</text><text x="21" y="238.59" fill="#000" font-size="13" textLength="330.211">document, not an OData $filter string (ADR-037) --</text><text x="21" y="253.723" fill="#000" font-size="13" textLength="276.51">see follow-subscribe.md for the full shape.</text><polygon points="592.746,314.188,602.746,318.188,592.746,322.188,596.746,318.188" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="190.606" y1="318.188" x2="598.746" y2="318.188" style="stroke:#181818;stroke-width:1;"/><text x="197.606" y="297.989" fill="#000" font-size="13" font-weight="700">1</text><text x="210.651" y="282.856" fill="#000" font-size="13" textLength="103.365">QUERY /graphql</text><text x="210.651" y="297.989" fill="#000" font-size="13" textLength="189.7">Authorization: Bearer &lt;JWT></text><text x="210.651" y="313.122" fill="#000" font-size="13" textLength="374.22">body: subscription { onOrderPlaced(where: {...}) { ... } }</text><line x1="604.746" y1="362.453" x2="646.746" y2="362.453" style="stroke:#181818;stroke-width:1;"/><line x1="646.746" y1="362.453" x2="646.746" y2="375.453" style="stroke:#181818;stroke-width:1;"/><line x1="605.746" y1="375.453" x2="646.746" y2="375.453" style="stroke:#181818;stroke-width:1;"/><polygon points="615.746,371.453,605.746,375.453,615.746,379.453,611.746,375.453" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="611.746" y="349.821" fill="#000" font-size="13" font-weight="700">2</text><text x="624.792" y="342.254" fill="#000" font-size="13" textLength="241.078">validate token + events:follow scope</text><text x="624.792" y="357.387" fill="#000" font-size="13" textLength="416.679">(identical to every other caller -- no query-string fallback exists)</text><path d="M174.606,387.453 L239.049,387.453 L239.049,394.586 L229.049,404.586 L174.606,404.586 L174.606,387.453" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="174.606" y="387.453" width="446.141" height="104.203" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="189.606" y="400.52" fill="#000" font-size="13" textLength="19.443" font-weight="700">alt</text><text x="254.049" y="399.664" fill="#000" font-size="11" textLength="142.737" font-weight="700">[token missing/invalid]</text><polygon points="201.606,431.719,191.606,435.719,201.606,439.719,197.606,435.719" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="195.606" y1="435.719" x2="603.746" y2="435.719" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="207.606" y="430.653" fill="#000" font-size="13" font-weight="700">3</text><text x="220.651" y="430.653" fill="#000" font-size="13" textLength="158.152">connection rejected 401</text><line x1="174.606" y1="444.719" x2="620.746" y2="444.719" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="179.606" y="456.929" fill="#000" font-size="11" textLength="40.063" font-weight="700">[valid]</text><polygon points="201.606,479.656,191.606,483.656,201.606,487.656,197.606,483.656" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="195.606" y1="483.656" x2="603.746" y2="483.656" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="207.606" y="478.59" fill="#000" font-size="13" font-weight="700">4</text><text x="220.651" y="478.59" fill="#000" font-size="13" textLength="377.095">graphql-sse "distinct connections" SSE stream open (200)</text><?plantuml-src VLFHQjj047pNLoocK9jQYfCM2g84aiPDAOKqiKifv6LrMaVNdE-KkvKT9-JVkoUTY_FI9qaxSpkpioVisDbkNP7FKB7pC3htRXl8tzhnYbWruyaKh6EORyZomdLUqMG46A0QU5cBdhNIBLg6qQN7jhd-3fV8jCMTDFdg-7FZb3DIcS9Tn1zC7WA1sv27nM8-jBiRJcIPY2Lihm3mnHdZjg03NF-St_mU75tEbp0-kxZ9PySd4yXpuHsO18KMd3KxEHKwwjbewrX-oq8DnD0GrkJ35883pGC45K4Ng1RG4s2aeZ45f33wjhM3od5J0Wv-mDD3Ho5ojveRANj20sSTDyxh9sJjR1ARHgZMzawut10mFV8HHTjvO87MWeVMMScdSlKErcWxqTyLmbyAFoaDeEHX9HQ4VUoXguBokes2Sg1sgbjBwo4lCNvrWOpmPgKDIxuYA4PIXky_fWm34QpwlFFKhg9YNKlDzuvNdJ4G6cofo4W2ZVlAqgeWFzqliapH7AMLtzfNSPHmJkZbnATllvQdjpREKxxo3y-olYilcVqmgAWUR-D6IdWkYk9b8gWyuGLUiYJuIdk3HjVo0UpkoS8xw2CEvJ0O1ELQaikfQwbg9RjY5ob-1x9NSIKb4yV9PJoGnFqkJscj1AbGtGCzwi1Xag