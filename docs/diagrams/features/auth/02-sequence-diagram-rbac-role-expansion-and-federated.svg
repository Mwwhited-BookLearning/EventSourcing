" y="710.938" width="36.148" height="30.297" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1315.302" y="730.933" fill="#000" font-size="14" textLength="22.148">API</text><polygon points="414.914,131.617,424.914,135.617,414.914,139.617,418.914,135.617" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="114.38" y1="135.617" x2="420.914" y2="135.617" style="stroke:#181818;stroke-width:1;"/><text x="121.38" y="130.551" fill="#000" font-size="13" font-weight="700">1</text><text x="134.426" y="130.551" fill="#000" font-size="13" textLength="171.768">authenticate (out of band)</text><polygon points="125.38,175.883,115.38,179.883,125.38,183.883,121.38,179.883" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="119.38" y1="179.883" x2="425.914" y2="179.883" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="131.38" y="167.25" fill="#000" font-size="13" font-weight="700">2</text><text x="144.426" y="159.684" fill="#000" font-size="13" textLength="200.478">externally-issued access token</text><text x="144.426" y="174.817" fill="#000" font-size="13" textLength="275.488">(sub, email, ... -- authoritative for identity)</text><polygon points="677.974,235.281,687.974,239.281,677.974,243.281,681.974,239.281" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="114.38" y1="239.281" x2="683.974" y2="239.281" style="stroke:#181818;stroke-width:1;"/><text x="121.38" y="219.083" fill="#000" font-size="13" font-weight="700">3</text><text x="134.426" y="203.95" fill="#000" font-size="13" textLength="135.795">POST /connect/token</text><text x="134.426" y="219.083" fill="#000" font-size="13" textLength="483.552">grant_type=urn:ietf:params:oauth:grant-type:token-exchange (RFC 8693)</text><text x="134.426" y="234.215" fill="#000" font-size="13" textLength="275.653">subject_token=&lt;externally-issued token></text><line x1="689.974" y1="283.547" x2="731.974" y2="283.547" style="stroke:#181818;stroke-width:1;"/><line x1="731.974" y1="283.547" x2="731.974" y2="296.547" style="stroke:#181818;stroke-width:1;"/><line x1="690.974" y1="296.547" x2="731.974" y2="296.547" style="stroke:#181818;stroke-width:1;"/><polygon points="700.974,292.547,690.974,296.547,700.974,300.547,696.974,296.547" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="696.974" y="270.915" fill="#000" font-size="13" font-weight="700">4</text><text x="710.019" y="263.348" fill="#000" font-size="13" textLength="279.792">verify subject_token against the registered</text><text x="710.019" y="278.481" fill="#000" font-size="13" textLength="278.205">TrustedFederationIssuer's JWKS (ADR-047)</text><line x1="689.974" y1="340.813" x2="731.974" y2="340.813" style="stroke:#181818;stroke-width:1;"/><line x1="731.974" y1="340.813" x2="731.974" y2="353.813" style="stroke:#181818;stroke-width:1;"/><line x1="690.974" y1="353.813" x2="731.974" y2="353.813" style="stroke:#181818;stroke-width:1;"/><polygon points="700.974,349.813,690.974,353.813,700.974,357.813,696.974,353.813" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="696.974" y="328.18" fill="#000" font-size="13" font-weight="700">5</text><text x="710.019" y="320.614" fill="#000" font-size="13" textLength="203.988">resolve (Issuer, Sub) -> ActorId</text><text x="710.019" y="335.747" fill="#000" font-size="13" textLength="372.354">(FederatedIdentityMapping, JIT-provisioned on first sight)</text><polygon points="1095.453,439.477,1105.453,443.477,1095.453,447.477,1099.453,443.477" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="689.974" y1="443.477" x2="1101.453" y2="443.477" style="stroke:#181818;stroke-width:1;"/><text x="696.974" y="408.145" fill="#000" font-size="13" font-weight="700">6</text><text x="710.019" y="377.879" fill="#000" font-size="13" textLength="220.314">look up ActorId's assigned Role(s)</text><text x="710.019" y="393.012" fill="#000" font-size="13" textLength="340.057">and any direct UserPermission grants, for this AppId</text><text x="710.019" y="408.145" fill="#000" font-size="13" textLength="364.578">(RoleService's own already-idempotent read, in-process</text><text x="710.019" y="423.278" fill="#000" font-size="13" textLength="339.435">within DevIdp -- these tables are DevIdp-local, not a</text><text x="710.019" y="438.411" fill="#000" font-size="13" textLength="136.938">second network hop)</text><polygon points="700.974,483.742,690.974,487.742,700.974,491.742,696.974,487.742" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="694.974" y1="487.742" x2="1106.453" y2="487.742" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="706.974" y="475.11" fill="#000" font-size="13" font-weight="700">7</text><text x="720.019" y="467.543" fill="#000" font-size="13" textLength="198.041">flattened union of permissions</text><text x="720.019" y="482.676" fill="#000" font-size="13" textLength="380.434">(ADR-046 -- additive-only, no explicit-deny concept exists)</text><polygon points="125.38,543.141,115.38,547.141,125.38,551.141,121.38,547.141" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="119.38" y1="547.141" x2="688.974" y2="547.141" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="131.38" y="526.942" fill="#000" font-size="13" font-weight="700">8</text><text x="144.426" y="511.809" fill="#000" font-size="13" textLength="179.778">200 { access_token (JWT) }</text><text x="144.426" y="526.942" fill="#000" font-size="13" textLength="415.353">-- external identity claims (sub/email) pass through unchanged;</text><text x="144.426" y="542.075" fill="#000" font-size=