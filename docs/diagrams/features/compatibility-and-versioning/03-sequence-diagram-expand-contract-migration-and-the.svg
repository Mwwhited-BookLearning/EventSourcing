5.179" y="159.497" fill="#000" font-size="13" textLength="279.31">Deployment N (still running the old binary)</text><text x="1115.179" y="174.629" fill="#000" font-size="13" textLength="310.356">is unaffected -- it never selects the new column</text><rect x="10" y="208.262" width="1435.535" height="3" fill="#EEE" style="stroke:#EEE;stroke-width:1;"/><line x1="10" y1="208.262" x2="1445.535" y2="208.262" style="stroke:#000;stroke-width:1;"/><line x1="10" y1="211.262" x2="1445.535" y2="211.262" style="stroke:#000;stroke-width:1;"/><rect x="539.627" y="197.695" width="376.28" height="23.133" fill="#EEE" style="stroke:#000;stroke-width:2;"/><text x="545.627" y="213.762" fill="#000" font-size="13" textLength="357.754" font-weight="700">Migrate: deploy new code, old code kept serving</text><polygon points="586.676,247.961,596.676,251.961,586.676,255.961,590.676,251.961" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="74.065" y1="251.961" x2="592.676" y2="251.961" style="stroke:#181818;stroke-width:1;"/><text x="81.065" y="246.895" fill="#000" font-size="13" font-weight="700">2</text><text x="94.111" y="246.895" fill="#000" font-size="13" textLength="371.427">deploy new binary (writes RefundReason on new events)</text><polygon points="1092.179,277.094,1102.179,281.094,1092.179,285.094,1096.179,281.094" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="598.676" y1="281.094" x2="1098.179" y2="281.094" style="stroke:#181818;stroke-width:1;"/><text x="605.676" y="276.028" fill="#000" font-size="13" font-weight="700">3</text><text x="618.722" y="276.028" fill="#000" font-size="13" textLength="468.457">INSERT StoredEvent (..., SchemaVersion: 4, RefundReason: "damaged")</text><path d="M147.971,294.094 L147.971,349.094 L655.971,349.094 L655.971,304.094 L645.971,294.094 L147.971,294.094" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M645.971,294.0