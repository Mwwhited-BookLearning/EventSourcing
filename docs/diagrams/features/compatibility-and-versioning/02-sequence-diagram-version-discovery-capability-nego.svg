<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SEQUENCE" style="width:1215px;height:622px;background:#FFFFFF;" width="1215px" height="622px" viewBox="0 0 1215 622" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="64.662" y="292.789" width="950.708" height="202.344" fill="none" style="stroke:#000;stroke-width:1.5;"/><g><title>Consuming System</title><rect x="77.162" y="102.594" width="8" height="416.539" fill="#000" fill-opacity="0"/><line x1="80.662" y1="102.594" x2="80.662" y2="519.133" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>GraphQL Gateway</title><rect x="547.321" y="102.594" width="8" height="416.539" fill="#000" fill-opacity="0"/><line x1="550.821" y1="102.594" x2="550.821" y2="519.133" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>SchemaRegistryService</title><rect x="1110.854" y="102.594" width="8" height="416.539" fill="#000" fill-opacity="0"/><line x1="1114.354" y1="102.594" x2="1114.354" y2="519.133" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><text x="10" y="82.995" fill="#000" font-size="14" textLength="135.324">Consuming System</text><text x="34.907" y="99.292" fill="#000" font-size="14" textLength="85.511">(older build)</text><ellipse cx="80.662" cy="18.5" rx="8" ry="8" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;"/><path d="M80.662,26.5 L80.662,53.5 M67.662,34.5 L93.662,34.5 M80.662,53.5 L67.662,68.5 M80.662,53.5 L93.662,68.5" style="stroke:#181818;stroke-width:0.5;" fill="none"/><rect x="479.792" y="71.297" width="142.058" height="30.297" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="486.792" y="91.292" fill="#000" font-size="14" textLength="128.058">GraphQL Gateway</text><rect x="1024.37" y="71.297" width="179.97" height="30.297" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1031.37" y="91.292" fill="#000" font-size="14" textLength="165.97">SchemaRegistryService</text><text x="10" y="532.128" fill="#000" font-size="14" textLength="135.324">Consuming System</text><text x="34.907" y="548.425" fill="#000" font-size="14" textLength="85.511">(older build)</text><ellipse cx="80.662" cy="560.227" rx="8" ry="8" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;"/><path d="M80.662,568.227 L80.662,595.227 M67.662,576.227 L93.662,576.227 M80.662,595.227 L67.662,610.227 M80.662,595.227 L93.662,610.227" style="stroke:#181818;stroke-width:0.5;" fill="none"/><rect x="479.792" y="519.133" width="142.058" height="30.297" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="486.792" y="539.128" fill="#000" font-size="14" textLength="128.058">GraphQL Gateway</text><rect x="1024.37" y="519.133" width="179.97" height="30.297" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1031.37" y="539.128" fill="#000" font-size="14" textLength="165.97">SchemaRegistryService</text><polygon points="538.821,173.125,548.821,177.125,538.821,181.125,542.821,177.125" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="80.662" y1="177.125" x2="544.821" y2="177.125" style="stroke:#181818;stroke-width:1;"/><text x="87.662" y="149.36" fill="#000" font-size="13" font-weight="700">1</text><text x="100.708" y="126.661" fill="#000" font-size="13" textLength="219.832">QUERY /graphql, connection open</text><text x="100.708" y="141.793" fill="#000" font-size="13" textLength="394.786">declares supportedSchemaVersions: [2, 3] for "OrderPlaced"</text><text x="100.708" y="156.926" fill="#000" font-size="13" textLength="316.297">(this doc's own realization of ADR-038's abstract</text><text x="100.708" y="172.059" fill="#000" font-size="13" textLength="405.761">"declares supported schema version(s)... at connection start")</text><polygon points="1102.354,232.523,1112.354,236.523,1102.354,240.523,1106.354,236.523" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="550.821" y1="236.523" x2="1108.354" y2="236.523" style="stroke:#181818;stroke-width:1;"/><text x="557.821" y="216.325" fill="#000" font-size="13" font-weight="700">2</text><text x="570.866" y="201.192" fill="#000" font-size="13" textLength="307.404">what versions of "demo:OrderPlaced" does this</text><text x="570.866" y="216.325" fill="#000" font-size="13" textLength="341.618">deployment currently serve (active version, plus the</text><text x="570.866" y="231.458" fill="#000" font-size="13" textLength="298.213">N-1/N+1 window's still-supported neighbors)?</text><polygon points="561.821,276.789,551.821,280.789,561.821,284.789,557.821,280.789" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="555.821" y1="280.789" x2="1113.354" y2="280.789" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="567.821" y="268.157" fill="#000" font-size="13" font-weight="700">3</text><text x="580.866" y="260.59" fill="#000" font-size="13" textLength="291.078">activeVersion: 3, supportedWindow: [2, 3, 4]</text><text x="580.866" y="275.723" fill="#000" font-size="13" textLength="378.676">(version 4 not yet active; 2 kept per the N-1/N+1 window)</text><path d="M64.662,292.789 L129.105,292.789 L129.105,299.922 L119.105,309.922 L64.662,309.922 L64.662,292.789" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="64.662" y="292.789" width="950.708" height="202.344" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="79.662" y="305.856" fill="#000" font-size="13" textLength="19.443" font-weight="700">alt</text><text x="144.105" y="305" fill="#000" font-size="11" textLength="588.355" font-weight="700">[client's declared versions overlap supportedWindow (this scenario: {2,3} ∩ {2,3,4} = {2,3})]</text><polygon points="91.662,352.188,81.662,356.188,91.662,360.188,87.662,356.188" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="85.662" y1="356.188" x2="549.821" y2="356.188" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="97.662" y="343.555" fill="#000" font-size="13" font-weight="700">4</text><text x="110.708" y="335.989" fill="#000" font-size="13" textLength="135.618">connection accepted</text><text x="110.708" y="351.122" fill="#000" font-size="13" textLength="433.113">serverCapabilities: { activeVersion: 3, supportedWindow: [2,3,4] }</text><path d="M555.821,324.922 L555.821,379.922 L993.821,379.922 L993.821,334.922 L983.821,324.922 L555.821,324.922" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M983.821,324.922 L983.821,334.922 L993.821,334.922 L983.821,324.922" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="561.821" y="341.989" fill="#000" font-size="13" textLength="376.752">client can now choose to request either version's shape --</text><text x="561.821" y="357.122" fill="#000" font-size="13" textLength="417.549">self-describing payloads (SchemaVersion on every event/entity)</text><text x="561.821" y="372.254" fill="#000" font-size="13" textLength="341.644">mean it never has to guess which one it actually got</text><line x1="64.662" y1="386.32" x2="1015.37" y2="386.32" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="69.662" y="398.531" fill="#000" font-size="11" textLength="425.938" font-weight="700">[client's declared versions have zero overlap with supportedWindow</text><text x="69.662" y="411.335" fill="#000" font-size="11" textLength="381.885" font-weight="700">(e.g. client only knows version 1, already outside the window</text><text x="69.662" y="424.14" fill="#000" font-size="11" textLength="204.956" font-weight="700">and its upcaster since removed)]</text><polygon points="91.662,462,81.662,466,91.662,470,87.662,466" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="85.662" y1="466" x2="549.821" y2="466" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="97.662" y="453.368" fill="#000" font-size="13" font-weight="700">5</text><text x="110.708" y="445.801" fill="#000" font-size="13" textLength="278.357">connection rejected -- capability mismatch</text><text x="110.708" y="460.934" fill="#000" font-size="13" textLength="375.546">(no schema version this client understands is still served)</text><path d="M555.821,434.734 L555.821,489.734 L980.821,489.734 L980.821,444.734 L970.821,434.734 L555.821,434.734" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M970.821,434.734 L970.821,444.734 L980.821,444.734 L970.821,434.734" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="561.821" y="451.801" fill="#000" font-size="13" textLength="358.541">a genuine, no-longer-bridgeable gap -- distinct from an</text><text x="561.821" y="466.934" fill="#000" font-size="13" textLength="404.32">ordinary N-1/N+1 rollback, where the older version's upcaster</text><text x="561.821" y="482.067" fill="#000" font-size="13" textLength="372.519">is still guaranteed present and this branch never triggers</text><?plantuml-src ZLJBRYGr5DtNLrprXhIewf370ZK2X0Oq6pGmYGQ4w2nksJTL9YwxndQbLJFAdb_Xj-PBEAwgJZf1GYFrm_BhFEwvvY5vDtIrX89Lye5MhxoBGsTSGzTZJDBjt8ctMWBLWx5wlIAEfAmHbugUGpBAzEmIhLu7xjktFzDhJhBdSThNpEFd6wzLAnrVIMDY2kErX7kZPDeUbhcYc06e-kvmnPRUlllfwWywRJBCUrkIyiw9IiOxyhsudTEYB0U958U-zo69df5-an2nAsxfp_EIBcxeDily9K3JhvQLw1KafjP4qbvz4Sdl7PYmDHzullsMVlZnglhguciiSWs2S6hdLl_5epW1qlsCU1BNcys6E1rpZGbUhDR5eYjBFCZUqhx5vkLqpC00wVpsc2j80ZBJpOfxwySkEwM64F1lHuemLEW470t-byjAwksGZydElQdEJjzyUKPxuxJVGrDCnjhgIOKJqxIr3t7zVN7WHjLnBURB5sEtT54-UV3xTElYTKcNDp1t8K6Nv7oYKT9omJTqJdVI9-eHBt2ZvzJM1TkqP0qq5x_raK4OMUvVWjDSpQZ4SJ1-In_Foui7-lJtFzEel7oWR-UvTK7qM0W8dB6sn_LYfS1GzCvDnePNt7Djh4b6aAYFdsa5G6_e0MWmG2Z0tumoX