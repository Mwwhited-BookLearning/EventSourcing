.5;" fill="#FEFFDD"/><text x="413.818" y="103.958" fill="#000" font-size="13" textLength="288.66">A newer deployment registered OrderStatus</text><text x="413.818" y="119.09" fill="#000" font-size="13" textLength="258.483">value "PartiallyRefunded" -- this client's</text><text x="413.818" y="134.223" fill="#000" font-size="13" textLength="253.278">build predates that change (ADR-038's</text><text x="413.818" y="149.356" fill="#000" font-size="13" textLength="247.908">N-1/N+1 window: the client is running</text><text x="413.818" y="164.489" fill="#000" font-size="13" textLength="271.4">code from a still-supported prior version).</text><polygon points="550.647,209.82,560.647,213.82,550.647,217.82,554.647,213.82" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="121.498" y1="213.82" x2="556.647" y2="213.82" style="stroke:#181818;stroke-width:1;"/><text x="128.498" y="201.188" fill="#000" font-size="13" font-weight="700">1</text><text x="141.543" y="193.622" fill="#000" font-size="13" textLength="103.365">QUERY /graphql</text><text x="141.543" y="208.754" fill="#000" font-size="13" textLength="404.104">query { order(id: "demo:Order:o-1") { status statusKnown } }</text><polygon points="994.702,238.953,1004.702,242.953,994.702,246.953,998.702,242.953" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="562.647" y1="242.953" x2="1000.702" y2="242.953" style="stroke:#181818;stroke-width:1;"/><text x="569.647" y="237.887" fill="#000" font-size="13" font-weight="700">2</text><text x="582.693" y="237.887" fill="#000" font-size="13" textLength="274.568">resolve Order.status for "demo:Order:o-1"</text><polygon points="573.647,268.086,563.647,272.086,573.647,276.086,569.647,272.086" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="567.647" y1="272.086" x2="1005.702" y2="272.086" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="579.647" y="267.02" fill="#000" font-size="13" font-weight="700">3</text><text x="592.693" y="267.02" fill="#000" font-size="13" textLength="255.582">raw stored value = "PartiallyRefunded"</text><path d="M105.498,284.086 L169.94,284.086 L169.94,291.219 L159.94,301.219 L105.498,301.219 L105.498,284.086" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="105.498" y="284.086" width="847.888" height="140.469" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="120.498" y="297.153" fill="#000" font-size="13" textLength="19.443" font-weight="700">alt</text><text x="184.94" y="296.296" fill="#000" font-size="11" textLength="500.387" font-weight="700">[raw value is a recognized OrderStatus member for this client's schema version]</text><polygon points="132.498,328.352,122.498,332.352,132.498,336.352,128.498,332.352" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="126.498" y1="332.352" x2="561.647" y2="332.352" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="138.498" y="327.286" fill="#000" font-size="13" font-weight="700">4</text><text x="151.543" y="327.286" fill="#000" font-size="13" textLength="265.072">{ status: "Shipped", statusKnown: true }</text><line x1="105.498" y1="341.352" x2="953.386" y2="341.352" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="110.498" y="353.562" fill="#000" font-size="11" textLength="341.059" font-weight="700">[raw value is not a recognized member (this scenario)]</text><polygon points="132.498,376.289,122.498,380.289,132.498,384.289,128.498,380.289" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="126.498" y1="380.289" x2="561.647" y2="380.289" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="138.498" y="375.223" fill="#000" font-size="13" font-weight="700">5</text><text x="151.543" y="375.223" fill="#000" font-size="13" textLength="331.792">{ status: "PartiallyRefunded", statusKnown: false }</text><path d="M567.647,364.156 L567.647,419.156 L931.647,419.156 L931.647,374.156 L921.647,364.156 L567.647,364.156" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M921.647,364.156 L921.647,374.156 L931.647,374.156 L921.647,364.156" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="573.647" y="381.223" fill="#000" font-size="13" textLength="343.738">ADR-038's declared contract -- the raw string travels</text><text x="573.647" y="396.356" fill="#000" font-size="13" textLength="333.963">alongside a "known" flag, never a thrown error and</text><text x="573.647" y="411.489" fill="#000" font-size="13" textLength="261.898">never a silently substituted wrong value</text><line x1="121.498" y1="489.953" x2="163.498" y2="489.953" style="stroke:#181818;stroke-width:1;"/><line x1="163.498" y1="489.953" x2="163.498" y2="502.953" style="stroke:#181818;stroke-width:1;"/><line x1="122.498" y1="502.953" x2="163.498" y2="502.953" style="stroke:#181818;stroke-width:1;"/><polygon points="132.498,498.953,122.498,502.953,132.498,506.953,128.498,502.953" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="128.498" y="469.754" fill="#000" font-size="13" font-weight="700">6</text><text x="141.543" y="454.622" fill="#000" font-size="13" textLength="323.458">exhaustive switch on OrderStatus has no case for</text><text x="141.543" y="469.754" fill="#000" font-size="13" textLength="396.462">an unrecognized string -- branches on statusKnown == false</text><text x="141.543" y="484.887" fill="#000" font-size="13" textLength="403.743">instead of throwing (ADR-038's required client-side discipline)</text><?plantuml-src XLHDRzD04BtxLuny8H5rIyK5HIfI1LKFe9Qsue2KoyGxiLTiPjtzY0ae_vtPjHCSYiGfZlVjp7jltXXZi1mtAt95XoxeMdV80Sfxe-23qSHXoJD5dR4xKh2YjNK4zqwHUmeOebzoWvhb286fXosQIFCIq4ETRvzMlNNOjG-VuHO3zRZBk6PuBXG6NA4dA6yuwB23fo2zCeJoY_o_AD