<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:936px;height:441px;background:#FFFFFF;" width="936px" height="441px" viewBox="0 0 936 441" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--class ff--><g class="entity" data-qualified-name="ff" id="ent0001" data-source-line="4"><rect x="88.26" y="54.45" width="447.483" height="140.078" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="262.506" y="72.445" fill="#000" font-size="14" textLength="98.991">FilterableField</text><line x1="89.26" y1="80.747" x2="534.743" y2="80.747" style="stroke:#181818;stroke-width:0.5;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="99.26" cy="94.395" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="108.26" y="97.742" fill="#000" font-size="14" textLength="84.089">Id : int «PK»</text><line x1="89.26" y1="105.044" x2="534.743" y2="105.044" style="stroke:#181818;stroke-width:1;"/><text x="94.26" y="122.039" fill="#000" font-size="14" textLength="208.366">EventTypeName : string «FK»</text><text x="94.26" y="138.336" fill="#000" font-size="14" textLength="197.695">EventTypeVersion : int «FK»</text><text x="94.26" y="154.633" fill="#000" font-size="14" textLength="114.051">JsonPath : string</text><text x="94.26" y="170.929" fill="#000" font-size="14" textLength="435.483">DataType : enum {String, Number, Boolean, DateTimeOffset}</text><text x="94.26" y="187.226" fill="#000" font-size="14" textLength="111.234">IsIndexed : bool</text></g><!--class event--><g class="entity" data-qualified-name="event" id="ent0002" data-source-line="14"><rect x="189.98" y="302.99" width="244.032" height="123.781" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="268.844" y="320.985" fill="#000" font-size="14" textLength="86.304">StoredEvent</text><line x1="190.98" y1="329.287" x2="433.012" y2="329.287" style="stroke:#181818;stroke-width:0.5;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="200.98" cy="342.935" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="209.98" y="346.282" fill="#000" font-size="14" textLength="218.032">SequenceNumber : bigint «PK»</text><line x1="190.98" y1="353.584" x2="433.012" y2="353.584" style="stroke:#181818;stroke-width:1;"/><text x="195.98" y="370.579" fill="#000" font-size="14" textLength="128.249">EventType : string</text><text x="195.98" y="386.876" fill="#000" font-size="14" textLength="140.725">SchemaVersion : int</text><text x="195.98" y="403.173" fill="#000" font-size="14" textLength="96.722">Payload : text</text><text x="195.98" y="419.469" fill="#000" font-size="14" textLength="196">OccurredAt : datetimeoffset</text></g><g class="entity" data-qualified-name="GMN4" id="ent0005" data-source-line="26"><path d="M570.83,6 L570.83,120.77 L535.99,124.77 L570.83,128.77 L570.83,242.992 A0,0 0 0 0 570.83,242.992 L921.165,242.992 A0,0 0 0 0 921.165,242.992 L921.165,16 L911.165,6 L570.83,6 A0,0 0 0 0 570.83,6" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M911.165,6 L911.165,16 L921.165,16 L911.165,6" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="576.83" y="23.067" fill="#000" font-size="13" textLength="288.006">IsIndexed = true triggers a provider-specific</text><text x="576.83" y="38.2" fill="#000" font-size="13" textLength="329.335">expression index / computed column over Payload</text><text x="576.83" y="53.333" fill="#000" font-size="13" textLength="266.773">for this JsonPath (see 02-data-model.md,</text><text x="576.83" y="68.465" fill="#000" font-size="13" textLength="272.422">"Per-provider index strategy"). The where</text><text x="576.83" y="83.598" fill="#000" font-size="13" textLength="297.876">argument's static EventFilterInput type (a flat</text><text x="576.83" y="98.731" fill="#000" font-size="13" textLength="266.589">{ field, eq, neq, gt, gte, lt, lte, contains }</text><text x="576.83" y="113.864" fill="#000" font-size="13" textLength="314.933">shape) can syntactically NAME any field string --</text><text x="576.83" y="128.997" fill="#000" font-size="13" textLength="315.402">it is GraphQlFilterPredicateBuilder that looks the</text><text x="576.83" y="144.129" fill="#000" font-size="13" textLength="319.801">name up against THIS event type's own declared</text><text x="576.83" y="159.262" fill="#000" font-size="13" textLength="248.936">rows at resolver runtime and throws a</text><text x="576.83" y="174.395" fill="#000" font-size="13" textLength="286.66">GraphQLException if it isn't one of them. An</text><text x="576.83" y="189.528" fill="#000" font-size="13" textLength="315.364">honest, named narrowing from ADR-037's literal</text><text x="576.83" y="204.661" fill="#000" font-size="13" textLength="318.557">schema-shape guarantee for filtering specifically</text><text x="576.83" y="219.793" fill="#000" font-size="13" textLength="291.262">(still true for the subscription field name and</text><text x="576.83" y="234.926" fill="#000" font-size="13" textLength="274.873">payload fields -- see follow-subscribe.md).</text></g><!--link ff to event--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk3" data-source-line="23" data-link-type="dependency"><path d="M312,194.99 C312,229.07 312,264.62 312,297.56" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="ff-to-event" codeLine="23"/><polygon points="312,302.56,316,293.56,312,297.56,308,293.56,312,302.56" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="27.176" y="214.837" fill="#000" font-size="13" textLength="264.063">JsonPath is evaluated against Payload at</text><text x="11.945" y="229.97" fill="#000" font-size="13" textLength="294.525">query time via json_extract/->>/JSON_VALUE</text><text x="7" y="245.103" fill="#000" font-size="13" textLength="304.415">-- NOT a DB relationship, Payload is plain TEXT</text></g><?plantuml-src VLJ1RjD04BtdAqQvqA8uhU20L9L8gPf2Iaa32OW3KhLPZ-sbwrrtTzmsglhllBNJ01SEjgpPUJDlthnrPN8cROAsF8YtnZKgg9giSIpRXia7gVnWm4wCR6buOQnmK1lB5uPjFYGLgIZeQK3qckOvdP1nGgUdoq-J2M9PXjVi7kWrYYrKpSY84emhaNJH9-tFltE8nhjzaTtvPVHkgQJQGn4xLw8I135sRKrFg-vaH8kstd0OqPdtbfKRfKnUcvglYoAoF0CxZtENyoCdjXka3Px_pBSI7pZl67MpSVhQZRVYkvQTvhv50floFzF-JNUbAwxLF_CXkbHRwrMY8VoO0jTQjm7zfu9O3k82uhuZdaX2wF5uikDqGiEzC2OHLRO58YTLAkEYxAih-Ub0F6mfLQDxe-WNW3Te6PIMesmoERfSNIzkla-llir-kYoZnVMQ59sVKM2h19HZPPhHlYBQDHPDQ3txiHuE1iuBKp1b9UGBsE4VZT-JX9RnCcM9-L6t2VuUfWjPR5YRmcZaysCJE7Rgc0Ia8zA-RjeqaFQshHtvUuY-em14uGD91Ifx5GuYCns_oI2SocgVintN-GYfmoMQlNJTrSTge5Qv7HwEQLqnFLGS6Bagb6qDVLz5f61stI-qz_tSWH5rz-90KG5jW7YY8bs54V7TY5nwbP8U7f6LzE13UoTfAvJy5olLy25fvIXk4TVeegpTqcBwUKRARVk2B_UaSvMHfFg7e9hgY-t9B64K08NFMcFJO58f8UlzRSHdciMb-zOsUqUiFyvNE_Ua6J2YVt2KixOAjG08_W4B4gmzUfla3gthJADSZfhzCV9w7bUpHysDT3ihUeRk5IpWEDa05EenJHtIAuGYf4XyShm32gN9Yk1hcfv_pOxVlWCPQzAlnIQ5kkkITK9HsUAFv0IxJIilkjaJ-iKzIJfW3g8OQtkpzTvWYkqcwc1wZhsedIOO1uXcP-Vk849dYbqJQ_r3jeDk61uw7EF_02Xi_Xi0?></g></svg>