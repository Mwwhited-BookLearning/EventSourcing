23.022" height="30.297" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="668.991" y="60.995" fill="#000" font-size="14" textLength="209.022">GraphQlFilterPredicateBuilder</text><rect x="1194.249" y="24.703" width="149.707" height="46.594" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1201.249" y="44.698" fill="#000" font-size="14" textLength="135.707">IJsonPathTranslator</text><text x="1203.091" y="60.995" fill="#000" font-size="14" textLength="132.022">(impl per provider)</text><rect x="1353.956" y="41" width="68.059" height="30.297" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1360.956" y="60.995" fill="#000" font-size="14" textLength="54.059">EF Core</text><text x="1640.796" y="68.995" fill="#000" font-size="14" textLength="231.752">SQLite / PostgreSQL / SQL Server</text><path d="M1741.672,20 C1741.672,10 1759.672,10 1759.672,10 C1759.672,10 1777.672,10 1777.672,20 L1777.672,46 C1777.672,56 1759.672,56 1759.672,56 C1759.672,56 1741.672,56 1741.672,46 L1741.672,20" style="stroke:#181818;stroke-width:0.5;" fill="#E2E2F0"/><path d="M1741.672,20 C1741.672,30 1759.672,30 1759.672,30 C1759.672,30 1777.672,30 1777.672,20" style="stroke:#181818;stroke-width:0.5;" fill="none"/><rect x="190.547" y="885.477" width="142.058" height="46.594" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="197.547" y="905.472" fill="#000" font-size="14" textLength="128.058">GraphQL Gateway</text><text x="208.799" y="921.769" fill="#000" font-size="14" textLength="105.554">(HotChocolate)</text><rect x="661.991" y="885.477" width="223.022" height="30.297" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="668.991" y="905.472" fill="#000" font-size="14" textLength="209.022">GraphQlFilterPredicateBuilder</text><rect x="1194.249" y="885.477" width="149.707" height="46.594" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1201.249" y="905.472" fill="#000" font-size="14" textLength="135.707">IJsonPathTranslator</text><text x="1203.091" y="921.769" fill="#000" font-size="14" textLength="132.022">(impl per provider)</text><rect x="1353.956" y="885.477" width="68.059" height="30.297" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1360.956" y="905.472" fill="#000" font-size="14" textLength="54.059">EF Core</text><text x="1640.796" y="898.472" fill="#000" font-size="14" textLength="231.752">SQLite / PostgreSQL / SQL Server</text><path d="M1741.672,911.773 C1741.672,901.773 1759.672,901.773 1759.672,901.773 C1759.672,901.773 1777.672,901.773 1777.672,911.773 L1777.672,937.773 C1777.672,947.773 1759.672,947.773 1759.672,947.773 C1759.672,947.773 1741.672,947.773 1741.672,937.773 L1741.672,911.773" style="stroke:#181818;stroke-width:0.5;" fill="#E2E2F0"/><path d="M1741.672,911.773 C1741.672,921.773 1759.672,921.773 1759.672,921.773 C1759.672,921.773 1777.672,921.773 1777.672,911.773" style="stroke:#181818;stroke-width:0.5;" fill="none"/><path d="M15,85.297 L15,337.297 L508,337.297 L508,95.297 L498,85.297 L15,85.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M498,85.297 L498,95.297 L508,95.297 L498,85.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="21" y="102.364" fill="#000" font-size="13" textLength="472.151">Filtering is NOT built on HotChocolate's own [UseFiltering] middleware --</text><text x="21" y="117.497" fill="#000" font-size="13" textLength="459.05">a fully dynamic, per-AppId ObjectType (ADR-037's own per-event-type</text><text x="21" y="132.629" fill="#000" font-size="13" textLength="464.356">Subscription payload shape) has no bound CLR type for [UseFiltering]'s</text><text x="21" y="147.762" fill="#000" font-size="13" textLength="469.777">reflection-based inference to work against. Instead the where argument</text><text x="21" y="162.895" fill="#000" font-size="13" textLength="346.912">is a static, hand-written `[EventFilterInput!]` list type</text><text x="21" y="178.028" fill="#000" font-size="13" textLength="457.196">(EventFilterInput.cs), and an undeclared Field name is caught here, at</text><text x="21" y="193.161" fill="#000" font-size="13" textLength="428.759">RESOLVER RUNTIME, by GraphQlFilterPredicateBuilder throwing a</text><text x="21" y="208.293" fill="#000" font-size="13" textLength="454.784">GraphQLException -- not rejected earlier as a schema-validation error</text><text x="21" y="223.426" fill="#000" font-size="13" textLength="433.056">before the resolver runs. This is an honest, named narrowing from</text><text x="21" y="238.559" fill="#000" font-size="13" textLength="418.126">ADR-037's literal "cannot even construct a query referencing an</text><text x="21" y="253.692" fill="#000" font-size="13" textLength="450.931">undeclared field" schema-shape guarantee for FILTERING specifically</text><text x="21" y="268.825" fill="#000" font-size="13" textLength="442.514">(that guarantee still holds in full for the subscription field NAME and</text><text x="21" y="283.958" fill="#000" font-size="13" textLength="456.638">its PAYLOAD fields, which genuinely differ per registered event type --</text><text x="21" y="299.09" fill="#000" font-size="13" textLength="441.01">see follow-subscribe.md); functionally equivalent safety (ADR-003's</text><text x="21" y="314.223" fill="#000" font-size="13" textLength="347.401">original rule), just enforced one step later. Flagged in</text><text x="21" y="329.356" fill="#000" font-size="13" textLength="261.327">08-build-plan.md, not silently narrowed.</text><polygon points="761.502,389.82,771.502,393.82,761.502,397.82,765.502,393.82" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="261.576" y1="393.82" x2="767.502" y2="393.82" style="stroke:#181818;stroke-width:1;"/><text x="268.576" y="373.622" fill="#000" font-size="13" font-weight="700">1</text><text x="281.621" y="358.489" fill="#000" font-size="13" textLength="336.045">Build(fields, where: [{ field: "Amount", gt: "100" }])</text><text x="281.621" y="373.622" fill="#000" font-size="13" textLength="414.146">(a flat list of EventFilterInput clauses, AND-combined across list</text><text x="281.621" y="388.754" fill="#000" font-size="13" textLength="474.881">entries -- no and/or combinator nesting, see EventFilterInput's own note)</text><line x1="773.502" y1="438.086" x2="815.502" y2="438.086" style="stroke:#181818;stroke-width:1;"/><line x1="815.502" y1="438.086" x2="815.502" y2="451.086" style="stroke:#181818;stroke-width:1;"/><line x1="774.502" y1="451.086" x2="815.502" y2="451.086" style="stroke:#181818;stroke-width:1;"/><polygon points="784.502,447.086,774.502,451.086,784.502,455.086,780.502,451.086" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="780.502" y="425.454" fill="#000" font-size="13" font-weight="700">2</text><text x="793.547" y="417.887" fill="#000" font-size="13" textLength="340.12">look up "Amount" against this event type's declared</text><text x="793.547" y="433.02" fill="#000" font-size="13" textLength="317.034">FilterableFields -- GraphQLException if not found</text><line x1="773.502" y1="510.484" x2="815.502" y2="510.484" style="stroke:#181818;stroke-width:1;"/><line x1="815.502" y1="510.484" x2="815.502" y2="523.484" style="stroke:#181818;stroke-width:1;"/><line x1="774.502" y1="523.484" x2="815.502" y2="523.484" style="stroke:#181818;stroke-width:1;"/><polygon points="784.502,519.484,774.502,523.484,784.502,527.484,780.502,523.484" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="780.502" y="490.286" fill="#000" font-size="13" font-weight="700">3</text><text x="793.547" y="475.153" fill="#000" font-size="13" textLength="293.668">build Expression&lt;Func&lt;StoredEvent,bool>></text><text x="793.547" y="490.286" fill="#000" font-size="13" textLength="408.154">(reuses FilterPredicateBuilder's own property-access/constant-</text><text x="793.547" y="505.418" fill="#000" font-size="13" textLength="177.309">expression building blocks)</text><polygon points="1257.102,594.016,1267.102,598.016,1257.102,602.016,1261.102,598.016" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="773.502" y1="598.016" x2="1263.102" y2="598.016" style="stroke:#181818;stroke-width:1;"/><text x="780.502" y="570.25" fill="#000" font-size="13" font-weight="700">4</text><text x="793.547" y="547.551" fill="#000" font-size="13" textLength="370.246">JsonFunctions.JsonValueAsNumber(Payload, "$.Amount")</text><text x="793.547" y="562.684" fill="#000" font-size="13" textLength="458.555">(one marker method per FilterableFieldType --String/Number/Boolean/</text><text x="793.547" y="577.817" fill="#000" font-size="13" textLength="425.039">DateTimeOffset -- dispatched via JsonFunctions.MethodNameFor,</text><text x="793.547" y="592.95" fill="#000" font-size="13" textLength="255.779">not a single generic JsonValue method)</text><path d="M1274.102,611.016 L1274.102,666.016 L1597.102,666.016 L1597.102,621.016 L1587.102,611.016 L1274.102,611.016" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1587.102,611.016 L1587.102,621.016 L1597.102,621.016 L1587.102,611.016" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="1280.102" y="628.083" fill="#000" font-size="13" textLength="287.225">SQLite:     json_extract(Payload, '$.Amount')</text><text x="1280.102" y="643.215" fill="#000" font-size="13" textLength="281.487">PostgreSQL: (Payload::jsonb ->> 'Amount')</text><text x="1280.102" y="658.348" fill="#000" font-size="13" textLength="302.631">SQL Server: JSON_VALUE(Payload, '$.Amount')</text><line x1="773.502" y1="692.547" x2="815.502" y2="692.547" style="stroke:#181818;stroke-width:1;"/><line x1="815.502" y1="692.547" x2="815.502" y2="705.547" style="stroke:#181818;stroke-width:1;"/><line x1="774.502" y1="705.547" x2="815.502" y2="705.547" style="stroke:#181818;stroke-width:1;"/><polygon points="784.502,701.547,774.502,705.547,784.502,709.547,780.502,705.547" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="780.502" y="687.481" fill="#000" font-size="13" font-weight="700">5</text><text x="793.547" y="687.481" fill="#000" font-size="13" textLength="311.2">CAST extracted text to FilterableField.DataType</text><polygon points="1375.985,730.68,1385.985,734.68,1375.985,738.68,1379.985,734.68" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="773.502" y1="734.68" x2="1381.985" y2="734.68" style="stroke:#181818;stroke-width:1;"/><text x="780.502" y="729.614" fill="#000" font-size="13" font-weight="700">6</text><text x="793.547" y="729.614" fill="#000" font-size="13" textLength="257.569">Expression&lt;Func&lt;StoredEvent,bool>></text><polygon points="1747.672,759.813,1757.672,763.813,1747.672,767.813,1751.672,763.813" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1387.985" y1="763.813" x2="1753.672" y2="763.813" style="stroke:#181818;stroke-width:1;"/><text x="1394.985" y="758.747" fill="#000" font-size="13" font-weight="700">7</text><text x="1408.03" y="758.747" fill="#000" font-size="13" textLength="334.642">SELECT ... WHERE &lt;native JSON extraction> > 100</text><polygon points="1398.985,804.078,1388.985,808.078,1398.985,812.078,1394.985,808.078" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1392.985" y1="808.078" x2="1758.672" y2="808.078" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="1404.985" y="795.446" fill="#000" font-size="13" font-weight="700">8</text><text x="1418.03" y="787.879" fill="#000" font-size="13" textLength="280.052">matching StoredEvent rows, full row shape</text><text x="1418.03" y="803.012" fill="#000" font-size="13" textLength="206.496">(index used if IsIndexed = true)</text><polygon points="272.576,863.477,262.576,867.477,272.576,871.477,268.576,867.477" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="266.576" y1="867.477" x2="1386.985" y2="867.477" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="278.576" y="847.278" fill="#000" font-size="13" font-weight="700">9</text><text x="291.621" y="832.145" fill="#000" font-size="13" textLength="386.344">matching StoredEvent(s) -- payload field selection happens</text><text x="291.621" y="847.278" fill="#000" font-size="13" textLength="431.095">later, in the dynamically-built resolvers (see follow-subscribe.md),</text><text x="291.621" y="862.411" fill="#000" font-size="13" textLength="303.374">not via a database-level SELECT-list narrowing</text><?plantuml-src ZLPXRnf74FtEhvYYIZOIXrtbGokQMY8sJgY8xHYIgegZPBcRWqsMtSlkdcrKzR_tpTw17UfKjMJ4SRCpyzwycLbLHsVhzO9zfr8-wbnNoaRgllIgMhsPqaiL-KvjRkpXAnTFLovt1h_qkgG2BPjtJnqqvzf4zbUU2vt3x4MjJS4-7IlJAssNtnwS_1wSlL9nDVVA1aHn7b7rkZ9KiQVAkriD5qtepwtjjox6vtJgF2SBBZk5YcgX0bDtzcQg8zCHNRaGbvxnZ0VvdB6_RVCg5fsETJ1p-6K7ZkXyco_fG1UNSre0J2HdwJ4b1u7SdQNtRmFl3doWjIuA0p-UASlWIr5P6xEXOcFLMkTzWPQDgcfIqENYC-TnlgcO3aTdrzdnivzRdsB3jsnZ5l4MNcRr8kHULr4ZYKfjZ5C5XPMgk4Sh8B6E5gws1PrEhqdEKEdyNce70OuybmP1uIOJeWhIjcJFDcUAZkwS_q9ggRGDSK0JV3BYn1NJtGfMfFooNYCjE08pYa9KKJ2jb2soEwzZP4kVteybzIRmn5Pr_E739p8wH6hH7EuR3FBGwnESu9y0WtC30WiKWar188ubNgxgvIgIP09ZIU9wFBkSlXjVq_NRY_dazRXFYmtzfnu1nhixAQt2-LRpu_kS6sgp35H6i2ILGGAilD4ufHBQVCLhbTqgeo4qCMVldOUV1ODkJaHv3iw8d7njmu3cAoGkN5bQESiXzXCS0UNRH4hlrl3ne003vNfbg9ihAzc84YXtg8QlyuX4ljRiDrBALBa4niB38-9A8QwxpJW9XPQrGfz5RhHnFfdEnzUJYvSKAivr2P8WKobENAduo3X4RGoIDmM0sAJcv430XiUoJ37fOlHwB9KKYSH0LwC_fvUZi-Pbw4D7Eb_HacsjBKjRwBAKNXV2U0cDiAIVjD_eE3LHI4aRu-woDkI21-kYzolIiKdDaZpnrrgZEd8sg9BZfkshusT9-yxhfOObIcCOUljSGv9i0IP7