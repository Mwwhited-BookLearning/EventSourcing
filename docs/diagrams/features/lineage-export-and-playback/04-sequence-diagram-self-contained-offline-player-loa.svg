<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SEQUENCE" style="width:1030px;height:787px;background:#FFFFFF;" width="1030px" height="787px" viewBox="0 0 1030 787" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="121.718" y="231.258" width="888.843" height="348.078" fill="none" style="stroke:#000;stroke-width:1.5;"/><g><title>Litigation reviewer</title><rect x="134.218" y="102.594" width="8" height="581.273" fill="#000" fill-opacity="0"/><line x1="137.718" y1="102.594" x2="137.718" y2="683.867" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>offline-player.html</title><rect x="538.234" y="102.594" width="8" height="581.273" fill="#000" fill-opacity="0"/><line x1="541.734" y1="102.594" x2="541.734" y2="683.867" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><text x="69.329" y="82.995" fill="#000" font-size="14" textLength="130.778">Litigation reviewer</text><text x="10" y="99.292" fill="#000" font-size="14" textLength="249.437">(no access to the live system at all)</text><ellipse cx="137.718" cy="18.5" rx="8" ry="8" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;"/><path d="M137.718,26.5 L137.718,53.5 M124.718,34.5 L150.718,34.5 M137.718,53.5 L124.718,68.5 M137.718,53.5 L150.718,68.5" style="stroke:#181818;stroke-width:0.5;" fill="none"/><rect x="413.591" y="22.406" width="256.286" height="79.188" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="477.189" y="42.401" fill="#000" font-size="14" textLength="129.09">offline-player.html</text><text x="448.342" y="58.698" fill="#000" font-size="14" textLength="186.785">(vite-plugin-singlefile build</text><text x="420.591" y="74.995" fill="#000" font-size="14" textLength="242.286">of mvvm-client.md's Vue playback</text><text x="464.023" y="91.292" fill="#000" font-size="14" textLength="155.422">component, ADR-068)</text><text x="69.329" y="696.862" fill="#000" font-size="14" textLength="130.778">Litigation reviewer</text><text x="10" y="713.159" fill="#000" font-size="14" textLength="249.437">(no access to the live system at all)</text><ellipse cx="137.718" cy="724.961" rx="8" ry="8" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;"/><path d="M137.718,732.961 L137.718,759.961 M124.718,740.961 L150.718,740.961 M137.718,759.961 L124.718,774.961 M137.718,759.961 L150.718,774.961" style="stroke:#181818;stroke-width:0.5;" fill="none"/><rect x="413.591" y="683.867" width="256.286" height="79.188" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="477.189" y="703.862" fill="#000" font-size="14" textLength="129.09">offline-player.html</text><text x="448.342" y="720.159" fill="#000" font-size="14" textLength="186.785">(vite-plugin-singlefile build</text><text x="420.591" y="736.456" fill="#000" font-size="14" textLength="242.286">of mvvm-client.md's Vue playback</text><text x="464.023" y="752.753" fill="#000" font-size="14" textLength="155.422">component, ADR-068)</text><polygon points="529.734,142.859,539.734,146.859,529.734,150.859,533.734,146.859" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="137.718" y1="146.859" x2="535.734" y2="146.859" style="stroke:#181818;stroke-width:1;"/><text x="144.718" y="134.227" fill="#000" font-size="13" font-weight="700">1</text><text x="157.764" y="126.661" fill="#000" font-size="13" textLength="202.046">double-click offline-player.html</text><text x="157.764" y="141.793" fill="#000" font-size="13" textLength="220.505">(no server, no install, no network)</text><line x1="541.734" y1="206.258" x2="583.734" y2="206.258" style="stroke:#181818;stroke-width:1;"/><line x1="583.734" y1="206.258" x2="583.734" y2="219.258" style="stroke:#181818;stroke-width:1;"/><line x1="542.734" y1="219.258" x2="583.734" y2="219.258" style="stroke:#181818;stroke-width:1;"/><polygon points="552.734,215.258,542.734,219.258,552.734,223.258,548.734,219.258" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="548.734" y="186.059" fill="#000" font-size="13" font-weight="700">2</text><text x="561.78" y="170.926" fill="#000" font-size="13" textLength="268.112">on load: recompute ChainHash sequence</text><text x="561.78" y="186.059" fill="#000" font-size="13" textLength="307.48">from the embedded bundle's event data alone,</text><text x="561.78" y="201.192" fill="#000" font-size="13" textLength="442.787">and recompute the manifest hash the same way (ADR-019 formula)</text><path d="M121.718,231.258 L186.161,231.258 L186.161,238.391 L176.161,248.391 L121.718,248.391 L121.718,231.258" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="121.718" y="231.258" width="888.843" height="348.078" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="136.718" y="244.325" fill="#000" font-size="13" textLength="19.443" font-weight="700">alt</text><text x="201.161" y="243.468" fill="#000" font-size="11" textLength="364.504" font-weight="700">[every exported event's fields are unmasked in the bundle</text><text x="201.161" y="256.273" fill="#000" font-size="11" textLength="272.927" font-weight="700">(exporting actor held every relevant claim)]</text><polygon points="148.718,316.398,138.718,320.398,148.718,324.398,144.718,320.398" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="142.718" y1="320.398" x2="540.734" y2="320.398" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="154.718" y="300.2" fill="#000" font-size="13" font-weight="700">3</text><text x="167.764" y="285.067" fill="#000" font-size="13" textLength="206.94">"Fully independently verified" --</text><text x="167.764" y="300.2" fill="#000" font-size="13" textLength="250.136">exact re-derivation, no reliance on the</text><text x="167.764" y="315.333" fill="#000" font-size="13" textLength="211.491">exporting party's own testimony</text><line x1="121.718" y1="329.398" x2="1010.562" y2="329.398" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="126.718" y="341.609" fill="#000" font-size="11" textLength="344.905" font-weight="700">[at least one field was masked because the EXPORTING</text><text x="126.718" y="354.414" fill="#000" font-size="11" textLength="267.056" font-weight="700">actor themselves lacked its requiredClaim]</text><line x1="541.734" y1="426.539" x2="583.734" y2="426.539" style="stroke:#181818;stroke-width:1;"/><line x1="583.734" y1="426.539" x2="583.734" y2="439.539" style="stroke:#181818;stroke-width:1;"/><line x1="542.734" y1="439.539" x2="583.734" y2="439.539" style="stroke:#181818;stroke-width:1;"/><polygon points="552.734,435.539,542.734,439.539,552.734,443.539,548.734,439.539" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="548.734" y="398.774" fill="#000" font-size="13" font-weight="700">4</text><text x="561.78" y="376.075" fill="#000" font-size="13" textLength="357.843">PayloadHash/ChainHash for that event were computed</text><text x="561.78" y="391.208" fill="#000" font-size="13" textLength="386.699">ONCE, at original publish time, over the real stored bytes --</text><text x="561.78" y="406.34" fill="#000" font-size="13" textLength="387.169">a {"masked": ...} wrapper is not those bytes, so re-hashing</text><text x="561.78" y="421.473" fill="#000" font-size="13" textLength="425.782">the bundle's redacted content cannot reproduce them (ADR-068)</text><line x1="541.734" y1="514.07" x2="583.734" y2="514.07" style="stroke:#181818;stroke-width:1;"/><line x1="583.734" y1="514.07" x2="583.734" y2="527.07" style="stroke:#181818;stroke-width:1;"/><line x1="542.734" y1="527.07" x2="583.734" y2="527.07" style="stroke:#181818;stroke-width:1;"/><polygon points="552.734,523.07,542.734,527.07,552.734,531.07,548.734,527.07" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="548.734" y="486.305" fill="#000" font-size="13" font-weight="700">5</text><text x="561.78" y="463.606" fill="#000" font-size="13" textLength="258.521">still verify STRUCTURAL chain linkage --</text><text x="561.78" y="478.739" fill="#000" font-size="13" textLength="416.47">each event's own ChainHash/PayloadHash (envelope metadata,</text><text x="561.78" y="493.872" fill="#000" font-size="13" textLength="362.458">unaffected by masking) correctly derives from the prior</text><text x="561.78" y="509.004" fill="#000" font-size="13" textLength="203.639">event's, per ADR-019's formula</text><polygon points="148.718,567.336,138.718,571.336,148.718,575.336,144.718,571.336" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="142.718" y1="571.336" x2="540.734" y2="571.336" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="154.718" y="558.704" fill="#000" font-size="13" font-weight="700">6</text><text x="167.764" y="551.137" fill="#000" font-size="13" textLength="226.224">"Verified except N masked fields --</text><text x="167.764" y="566.27" fill="#000" font-size="13" textLength="366.971">chain linkage intact" -- NOT an undifferentiated pass/fail</text><path d="M546.734,598.336 L546.734,668.336 L935.734,668.336 L935.734,608.336 L925.734,598.336 L546.734,598.336" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M925.734,598.336 L925.734,608.336 L935.734,608.336 L925.734,598.336" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="552.734" y="615.403" fill="#000" font-size="13" textLength="312.686">No masking/claims logic runs in the player itself</text><text x="552.734" y="630.536" fill="#000" font-size="13" textLength="347.579">(ADR-068) -- enforcement already happened once, at</text><text x="552.734" y="645.668" fill="#000" font-size="13" textLength="318.506">export time; the player renders exactly what's in</text><text x="552.734" y="660.801" fill="#000" font-size="13" textLength="368.685">the bundle, masked/erased branches included verbatim.</text><?plantuml-src TLHBZzis4BxhLmnysJNWHtifsYqG8DYc3o3m1jjDq8ClOsfa4QP8XQJa24N_UxwHPAyB99U5Lz8CloUvoy5tpK5YmIQ7I8ltDjiZPniyHUcjd2Nk_RqFnCP8IfG3vLh8sLue3IbBGvo9dLikYDDrfcWvPcjiopxJ8bILirxMhUD1ugREZSFItcPzr1sjNoVhZqugwuGEdNNbteUAchvlriPPyNdJb7U9FdL2kkF0vhJt9ZHjy7YvehU_FQz_-Edd2SDqIb5SiD3wpVpiWShG7PpeKdEYRyC2roInbxWY_BG-PR0RVtl9vn1Fos8QkDqBkLpWyW42AAmk2ptMRFsVd6gi-zo9DxBtLGpDg9z0yxAK4cnzwGJSf0SJAZapr0IjrTwpBs_swLZ3tbQICjMwLvyaReJEFD3zgC6Flr0LOjCvNXRiicwD0ycNDiICqyP3S5XbnPM9E0frlk5qmZlhnuKJ8EWm3S4Ncg9HOsJU5yL9hyuQnxPP5aGNHI39HVO7MlpUEJTWSIcju8_F-0yBB8ul5_Xux-KBbcDaNU9nF-Pkb1edM8PaAYnGwOSND9gi0Hp26Q-WXMs27mfnIJI9JXZoGB-98wH9D1CyYE4kJKA---V3q_FBNxi_eFB83W-R9AwNH0xfKZsonlbpPwEKZyhpXkQhyHzuKEFLv-shuzMuaVFiAjGGcdr4j9zsZ-zM2ZP4Y_2penQfjEgeRMH50HgDAAFWNG8yHJ-0xAWPqx-BYTBYWJQRpNzqZjoscB49scMC1j0S1rQKLCorvWNYxVshnNTAhmHxB3V1PmLgsEk2A6qCPMT6hPevMgZNDnM00yvDjWxqzylpnyUNZyzltvDHDN1H-1CVPJARJNsDeDft5Mnx8oFTY-_5XHPnbypQ27IXyrnLCe8z3AEZeBC4y8Y6QAx6046XQyNQQ0Fkhlcy5Qb0SqUq0LDBlXlTJtDCqHqZRQRT9KLpTPJF_nbQdo6cnffsJo_47jKgBK170B2io5jEQLknTGNgK41fM6oFDO9GNMujebsuqDkEzK8Wmz4QYfrFbvBEc15HSHLchWxfwU91paYZXh93Xie1zmK2uW4Xe5IQFGnDbHepz-ljrgXTZRYHj9jGzemWt-dHc7cDpseMP2kHaxeIqTTQz3lZEhtQ48a36jribAq6Kxu2?></g></svg>