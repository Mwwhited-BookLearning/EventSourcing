60"><path d="M763.37,81.93 L763.37,105.64 L728.47,109.64 L763.37,113.64 L763.37,137.328 A0,0 0 0 0 763.37,137.328 L1173.938,137.328 A0,0 0 0 0 1173.938,137.328 L1173.938,91.93 L1163.938,81.93 L763.37,81.93 A0,0 0 0 0 763.37,81.93" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1163.938,81.93 L1163.938,91.93 L1173.938,91.93 L1163.938,81.93" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="769.37" y="98.997" fill="#000" font-size="13" textLength="389.568">OriginalSequenceNumber/OriginalChainHash/ImportedFrom</text><text x="769.37" y="114.13" fill="#000" font-size="13" textLength="305.462">are ADR-068's own decided shape, reflected in</text><text x="769.37" y="129.263" fill="#000" font-size="13" textLength="274.968">../data/event-log.md's StoredEvent listing.</text></g><!--link event to accessLog--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk5" data-source-line="55" data-link-type="dependency"><path d="M474.85,109.64 C373.28,109.64 247.66,109.64 247.66,109.64 C247.66,109.64 247.66,204.07 247.66,275.15" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="event-to-accessLog" codeLine="55"/><polygon points="247.66,280.15,251.66,271.15,247.66,275.15,243.66,271.15,247.66,280.15" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="21.101" y="75.707" fill="#000" font-size="13" textLength="240.462">every export or playback read writes</text><text x="7" y="90.84" fill="#000" font-size="13" textLength="268.665">one AccessLogEntry (ADR-045), logically,</text><text x="103.04" y="105.973" fill="#000" font-size="13" textLength="76.584">not a DB FK</text></g><!--link event to manifest--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk6" data-source-line="56" data-link-type="dependency"><path d="M601.66,212.46 C601.66,232.4 601.66,248 601.66,267.01" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" fill="none" i