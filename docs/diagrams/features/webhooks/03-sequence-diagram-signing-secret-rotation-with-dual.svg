ll="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="385.634" y="74.995" fill="#000" font-size="14" textLength="223.651">Webhook Subscription Endpoint</text><text x="874.662" y="82.995" fill="#000" font-size="14" textLength="152.441">WebhookSubscription</text><path d="M935.882,34 C935.882,24 953.882,24 953.882,24 C953.882,24 971.882,24 971.882,34 L971.882,60 C971.882,70 953.882,70 953.882,70 C953.882,70 935.882,70 935.882,60 L935.882,34" style="stroke:#181818;stroke-width:0.5;" fill="#E2E2F0"/><path d="M935.882,34 C935.882,44 953.882,44 953.882,44 C953.882,44 971.882,44 971.882,34" style="stroke:#181818;stroke-width:0.5;" fill="none"/><rect x="1043.103" y="55" width="170.413" height="30.297" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1050.103" y="74.995" fill="#000" font-size="14" textLength="156.413">WebhookOutboxPump</text><rect x="1499.095" y="55" width="129.78" height="30.297" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1506.095" y="74.995" fill="#000" font-size="14" textLength="115.78">Webhook Target</text><text x="10" y="677.823" fill="#000" font-size="14" textLength="117.482">Ops / App Admin</text><ellipse cx="71.741" cy="689.625" rx="8" ry="8" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;"/><path d="M71.741,697.625 L71.741,724.625 M58.741,705.625 L84.741,705.625 M71.741,724.625 L58.741,739.625 M71.741,724.625 L84.741,739.625" style="stroke:#181818;stroke-width:0.5;" fill="none"/><rect x="378.634" y="664.828" width="237.651" height="30.297" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="385.634" y="684.823" fill="#000" font-size="14" textLength="223.651">Webhook Subscription Endpoint</text><text x="874.662" y="677.823" fill="#000" font-size="14" textLength="152.441">WebhookSubscription</text><path d="M935.882,691.125 C935.882,681.125 953.882,681.125 953.882,681.125 C953.882,681.125 971.882,681.125 971.882,691.125 L971.882,717.125 C971.882,727.125 953.882,727.125 953.882,727.125 C953.882,727.125 935.882,727.125 935.882,717.125 L935.882,691.125" style="stroke:#181818;stroke-width:0.5;" fill="#E2E2F0"/><path d="M935.882,691.125 C935.882,701.125 953.882,701.125 953.882,701.125 C953.882,701.125 971.882,701.125 971.882,691.125" style="stroke:#181818;stroke-width:0.5;" fill="none"/><rect x="1043.103" y="664.828" width="170.413" height="30.297" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1050.103" y="684.823" fill="#000" font-size="14" textLength="156.413">WebhookOutboxPump</text><rect x="1499.095" y="664.828" width="129.78" height="30.297" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1506.095" y="684.823" fill="#000" font-size="14" textLength="115.78">Webhook Target</text><polygon points="485.46,126.563,495.46,130.563,485.46,134.563,489.46,130.563" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="71.741" y1="130.563" x2="491.46" y2="130.563" style="stroke:#181818;stroke-width:1;"/><text x="78.741" y="117.93" fill="#000" font-size="13" font-weight="700">1</text><text x="91.787" y="110.364" fill="#000" font-size="13" textLength="320.227">POST /webhooks/subscriptions/{id}/rotate-secret</text><text x="91.787" y="125.497" fill="#000" font-size="13" textLength="148.872">{ newSigningSecret? }</text><polygon points="941.882,185.961,951.882,189.961,941.882,193.961,945.882,189.961" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="497.46" y1="189.961" x2="947.882" y2="189.961" style="stroke:#181818;stroke-width:1;"/><text x="504.46" y="169.762" fill="#000" font-size="13" font-weight="700">2</text><text x="517.505" y="154.629" fill="#000" font-size="13" textLength="198.098">UPDATE WebhookSubscription</text><text x="517.505" y="169.762" fill="#000" font-size="13" textLength="287.873">SET PreviousSigningSecret = SigningSecret,</text><text x="534.035" y="184.895" fill="#000" font-size="13" textLength="284.87">SigningSecret = new (generated if omitted)</text><path d="M958.882,202.961 L958.882,287.961 L1315.882,287.961 L1315.882,212.961 L1305.882,202.961 L958.882,202.961" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1305.882,202.961 L1305.882,212.961 L1315.882,212.961 L1305.882,202.961" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="964.882" y="220.028" fill="#000" font-size="13" textLength="336.68">A schema-level current+previous PAIR (ADR-093) --</text><text x="964.882" y="235.161" fill="#000" font-size="13" textLength="316.424">not a config toggle. Without this second column,</text><text x="964.882" y="250.293" fill="#000" font-size="13" textLength="295.49">no operational discipline could rotate without</text><text x="964.882" y="265.426" fill="#000" font-size="13" textLength="300.403">either breaking in-flight verification on the old</text><text x="964.882" y="280.559" fill="#000" font-size="13" textLength="178.401">key or never rotating at all.</text><text x="667.795" y="317.835" fill="#000" font-size="11" textLength="303.633">ops-configured overlap window (rotation cadence itself</text><text x="668.888" y="330.64" fill="#000" font-size="11" textLength="294.454">stays deployment policy, ADR-093 -- not shown here)</text><path d="M1112.31,351.234 L1188.934,351.234 L1188.934,358.367 L1178.934,368.367 L1112.31,368.367 L1112.31,351.234" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="1112.31" y="351.234" width="810.339" height="216.195" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="1127.31" y="364.301" fill="#000" font-size="13" textLength="31.624" font-weight="700">loop</text><text x="1203.934" y="363.445" fill="#000" font-size="11" textLength="311.862" font-weight="700">[each delivery while PreviousSigningSecret is set]</text><line x1="1128.31" y1="429.766" x2="1170.31" y2="429.766" style="stroke:#181818;stroke-width:1;"/><line x1="1170.31" y1="429.766" x2="1170.31" y2="442.766" style="stroke:#181818;stroke-width:1;"/><line x1="1129.31" y1="442.766" x2="1170.31" y2="442.766" style="stroke:#181818;stroke-width:1;"/><polygon points="1139.31,438.766,1129.31,442.766,1139.31,446.766,1135.31,442.766" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1135.31" y="409.567" fill="#000" font-size="13" font-weight="700">3</text><text x="1148.355" y="394.434" fill="#000" font-size="13" textLength="178.452">compute TWO signatures --</text><text x="1148.355" y="409.567" fill="#000" font-size="13" textLength="405.031">one against SigningSecret, one against PreviousSigningSecret</text><text x="1148.355" y="424.7" fill="#000" font-size="13" textLength="408.63">(Standard Webhooks' own documented multi-signature shape)</text><polygon points="1551.985,483.031,1561.985,487.031,1551.985,491.031,1555.985,487.031" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1128.31" y1="487.031" x2="1557.985" y2="487.031" style="stroke:#181818;stroke-width:1;"/><text x="1135.31" y="474.399" fill="#000" font-size="13" font-weight="700">4</text><text x="1148.355" y="466.833" fill="#000" font-size="13" textLength="50.794">POST ...</text><text x="1148.355" y="481.965" fill="#000" font-size="13" textLength="371.109">webhook-signature: v1,&lt;sig-current> v1,&lt;sig-previous></text><line x1="1563.985" y1="546.43" x2="1605.985" y2="546.43" style="stroke:#181818;stroke-width:1;"/><line x1="1605.985" y1="546.43" x2="1605.985" y2="559.43" style="stroke:#181818;stroke-width:1;"/><line x1="1564.985" y1="559.43" x2="1605.985" y2="559.43" style="stroke:#181818;stroke-width:1;"/><polygon points="1574.985,555.43,1564.985,559.43,1574.985,563.43,1570.985,559.43" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1570.985" y="526.231" fill="#000" font-size="13" font-weight="700">5</text><text x="1584.031" y="511.098" fill="#000" font-size="13" textLength="215.173">verifies against whichever secret</text><text x="1584.031" y="526.231" fill="#000" font-size="13" textLength="315.618">it still has cached locally -- tolerates the rotation</text><text x="1584.031" y="541.364" fill="#000" font-size="13" textLength="263.771">without a synchronized cutover moment</text><polygon points="485.46,613.695,495.46,617.695,485.46,621.695,489.46,617.695" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="71.741" y1="617.695" x2="491.46" y2="617.695" style="stroke:#181818;stroke-width:1;"/><text x="78.741" y="605.063" fill="#000" font-size="13" font-weight="700">6</text><text x="91.787" y="597.497" fill="#000" font-size="13" textLength="388.673">POST /webhooks/subscriptions/{id}/discard-previous-secret</text><text x="91.787" y="612.629" fill="#000" font-size="13" textLength="336.724">(once ops decides the overlap window has elapsed)</text><polygon points="941.882,642.828,951.882,646.828,941.882,650.828,945.882,646.828" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="497.46" y1="646.828" x2="947.882" y2="646.828" style="stroke:#181818;stroke-width:1;"/><text x="504.46" y="641.762" fill="#000" font-size="13" font-weight="700">7</text><text x="517.505" y="641.762" fill="#000" font-size="13" textLength="419.377">UPDATE WebhookSubscription SET PreviousSigningSecret = null</text><?plantuml-src dLJ1Zjem4BtdAqPxAQW4MlLKr6w5j7le2RHGxOMBiOV4McV6iXqeNVNVEqw0iYjQLKL8EC5lvhqtprPjOcgR3OP2wSG1RkO-mWHctiFCD9PkG4LGULLu5PBLrYjASFE8cvhv2PRj9kfWVR9CS4_6iwNKWV3uK1YLr4P5F8CkCTrMixbQVDwc3NzVj8tlTdbPN2UnKg72lclgbaNHKORozanZ2elvSWMJVO-9atZ18awUhVav2PnKmZAY3fZMz0o4-wMjo5ArxDvzWP_5gM0kRZPJ-BQucwtkuOgsDItlLx08kBFSnXU5u3EyU1wj2UJpUe_qXq65X45u6R1RuCOcMGuBueGGR5Kdu6rs4606KTVOgDBX3XteDWIazDOV2S1YzlK11hExX_BTnmz3A4l1I1bGe9csjeB4LULm38