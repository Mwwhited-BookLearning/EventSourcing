ified-name="GMN4" id="ent0005" data-source-line="33"><path d="M754.24,52.25 L754.24,113.94 L719.26,117.94 L754.24,121.94 L754.24,183.313 A0,0 0 0 0 754.24,183.313 L1091.76,183.313 A0,0 0 0 0 1091.76,183.313 L1091.76,62.25 L1081.76,52.25 L754.24,52.25 A0,0 0 0 0 754.24,52.25" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1081.76,52.25 L1081.76,62.25 L1091.76,62.25 L1081.76,52.25" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="760.24" y="69.317" fill="#000" font-size="13" textLength="260.127">Registering a new version inserts a new</text><text x="760.24" y="84.45" fill="#000" font-size="13" textLength="310.648">(AppId, Name, Version) row (ADR-030) and flips</text><text x="760.24" y="99.583" fill="#000" font-size="13" textLength="275.298">IsActive on the prior version for that same</text><text x="760.24" y="114.715" fill="#000" font-size="13" textLength="316.52">(AppId, Name) -- old versions are never mutated</text><text x="760.24" y="129.848" fill="#000" font-size="13" textLength="298.27">or deleted (see 05-schema-registry-and-spec-</text><text x="760.24" y="144.981" fill="#000" font-size="13" textLength="267.154">generation.md, "Versioning policy"). Two</text><text x="760.24" y="160.114" fill="#000" font-size="13" textLength="282.198">different AppIds can register "OrderPlaced"</text><text x="760.24" y="175.247" fill="#000" font-size="13" textLength="218.226">independently with zero collision.</text></g><!--link etd to ff--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk3" data-source-line="30" data-link-type="crowfoot"><path d="M537,236.8 C537,256.9 537,251.47 537,270.39" style="stroke:#181818;stroke-width:1;" fill="none" id="etd-ff" codeLine="30"/><line x1="533" y1="232.8" x2="541" y2="232.8" style="stroke:#181818;stroke-width:1;"/><line x1="533" y1="235.8" x2="541" y2="235.8" style="stroke:#181818;stroke-width:1;"/><line x1="537" y1="236.8" x2="537" y2="228.8" style="stroke:#181818;stroke-width:1;"/><