<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:592px;height:621px;background:#FFFFFF;" width="592px" height="621px" viewBox="0 0 592 621" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--class etd--><g class="entity" data-qualified-name="etd" id="ent0001" data-source-line="4"><rect x="7" y="260.5" width="160.313" height="91.188" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="16.039" y="278.495" fill="#000" font-size="14" textLength="142.235">EventTypeDefinition</text><line x1="8" y1="286.797" x2="166.313" y2="286.797" style="stroke:#181818;stroke-width:0.5;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="18" cy="300.445" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="27" y="303.792" fill="#000" font-size="14" textLength="134.313">Name : string «PK»</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="18" cy="316.742" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="27" y="320.089" fill="#000" font-size="14" textLength="123.642">Version : int «PK»</text><line x1="8" y1="327.391" x2="166.313" y2="327.391" style="stroke:#181818;stroke-width:1;"/><text x="13" y="344.386" fill="#000" font-size="14" textLength="126.643">JsonSchema : text</text></g><g class="entity" data-qualified-name="GMN2" id="ent0003" data-source-line="12"><path d="M202.65,6 L202.65,302.18 L167.56,306.18 L202.65,310.18 L202.65,606.18 A0,0 0 0 0 202.65,606.18 L577.671,606.18 A0,0 0 0 0 577.671,606.18 L577.671,16 L567.671,6 L202.65,6 A0,0 0 0 0 202.65,6" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M567.671,6 L567.671,16 L577.671,16 L567.671,6" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="208.65" y="23.067" fill="#000" font-size="13" textLength="273.99">Masking rules have no entity or column of</text><text x="208.65" y="38.2" fill="#000" font-size="13" textLength="250.244">their own. They live entirely inside the</text><text x="208.65" y="53.333" fill="#000" font-size="13" textLength="296.093">JsonSchema text, as an x-masking extension:</text><text x="208.65" y="68.465" fill="#000" font-size="13"> </text><text x="208.65" y="83.598" fill="#000" font-size="13" textLength="127.575">"CustomerTaxId": {</text><text x="216.915" y="98.731" fill="#000" font-size="13" textLength="102.921">"type": "string",</text><text x="216.915" y="113.864" fill="#000" font-size="13" textLength="96.161">"x-masking": {</text><text x="225.179" y="128.997" fill="#000" font-size="13" textLength="178.325">"requiredClaim": "pii:view",</text><text x="225.179" y="144.129" fill="#000" font-size="13" textLength="162.525">"strategy": "FixedValue",</text><text x="225.179" y="159.262" fill="#000" font-size="13" textLength="143.952">"maskedValue": "***",</text><text x="225.179" y="174.395" fill="#000" font-size="13" textLength="211.529">"regulatoryClassification": "PHI",</text><text x="225.179" y="189.528" fill="#000" font-size="13" textLength="206.737">"governanceBody": "HHS/OCR",</text><text x="225.179" y="204.661" fill="#000" font-size="13" textLength="337.492">"regulationReference": "HIPAA 45 CFR §164.514(b)"</text><text x="216.915" y="219.793" fill="#000" font-size="13">}</text><text x="208.65" y="234.926" fill="#000" font-size="13">}</text><text x="208.65" y="250.059" fill="#000" font-size="13"> </text><text x="208.65" y="265.192" fill="#000" font-size="13" textLength="324.27">strategy is "FixedValue" | "PartialReveal" | "Hash"</text><text x="208.65" y="280.325" fill="#000" font-size="13" textLength="306.205">(ADR-009) -- PartialReveal/Hash take their own</text><text x="208.65" y="295.458" fill="#000" font-size="13" textLength="319.382">config shape instead of maskedValue (showFirst/</text><text x="208.65" y="310.59" fill="#000" font-size="13" textLength="333.55">showLast/maskChar/preserveSeparators, or keyId).</text><text x="208.65" y="325.723" fill="#000" font-size="13" textLength="329.589">An optional erasureScope (JSON Pointer, ADR-057)</text><text x="208.65" y="340.856" fill="#000" font-size="13" textLength="330.738">names a different EntityId whose crypto-shredding</text><text x="208.65" y="355.989" fill="#000" font-size="13" textLength="305.665">key protects this field, when it isn't the event's</text><text x="208.65" y="371.122" fill="#000" font-size="13" textLength="317.148">own -- absent means "this event's own EntityId."</text><text x="208.65" y="386.254" fill="#000" font-size="13"> </text><text x="208.65" y="401.387" fill="#000" font-size="13" textLength="271.927">regulatoryClassification/governanceBody/</text><text x="208.65" y="416.52" fill="#000" font-size="13" textLength="278.649">regulationReference are optional, schema-</text><text x="208.65" y="431.653" fill="#000" font-size="13" textLength="268.334">only documentation -- read by nothing at</text><text x="208.65" y="446.786" fill="#000" font-size="13" textLength="344.151">runtime, never in the value/masked/erased wrapper.</text><text x="208.65" y="461.918" fill="#000" font-size="13"> </text><text x="208.65" y="477.051" fill="#000" font-size="13" textLength="267.617">No constraint on the property's own type</text><text x="208.65" y="492.184" fill="#000" font-size="13" textLength="276.263">or required-ness -- CustomerTaxId may be</text><text x="208.65" y="507.317" fill="#000" font-size="13" textLength="229.474">required. Registration rejects (400)</text><text x="208.65" y="522.45" fill="#000" font-size="13" textLength="257.213">x-masking placed directly on an object-</text><text x="208.65" y="537.583" fill="#000" font-size="13" textLength="245.54">or array-typed property (only a scalar</text><text x="208.65" y="552.715" fill="#000" font-size="13" textLength="240.018">node, or an array's scalar items, or a</text><text x="208.65" y="567.848" fill="#000" font-size="13" textLength="263.345">property nested inside a complex-object</text><text x="208.65" y="582.981" fill="#000" font-size="13" textLength="269.966">items schema, is valid), and rejects (400)</text><text x="208.65" y="598.114" fill="#000" font-size="13" textLength="306.738">any strategy value other than the three above.</text></g><?plantuml-src TLNRRXit47tNLmpq4idGnG7i5ZM20AuImqfJnv2Cl8-M8othNN9BKh8MRRwd_z4lwnckB4K8-c11ufpXd3bpXYwj4IfiA2hfnMVh6WvSKsMTfBOHyY6LljSJbsnggVznXszF27oGjNKsMU_wn94a6VghHtH13rmBtL1CmReDlNlt-DlxzpdmLK84737hqYam7kFZK_HkMPHICy99zgdthTTpFWa5koaJ-RLM0F1tLeuR2jjA8fMy4tAU3knyeC9Nsze13smgnGRoBsv2JwMqw0beXGQfMf28sZb0v_Mr-aXROaVxSNseXqDnIl-c1tX_jet9rnAUU3yt_PlSEevLCVpgTyttHztfyPOZ48T1_jo2Y9bLR6lDQQozsLbvEMHHleMJR5gDtjczcAzSRUKKrrjV3m6vkBWunO9ijXKd7reKYD6kRS5vM00-tizFm8tVIN3i2ldLcrpg_duv_J9R_70NiXUobY30PjpyyVQMhgvfThUWV_zv-zFLvFhjrM0rxEV4RptzmyTh6sJZMH_qDwXmI9QhXUo4gtnopx7K2mQt7nRZoyjVXZ08dS6c2g74ptAQC18AxzPsGx5ak1R3JS96VVETIZI8fN-vio6cgHB3Zy-CxmgPbHocJP0eOITBqIs0Ud6afdgMTcw64wJSmbgDAi4LIU2u3R8iF0eEFYs_FD2ZXxKbZ2YJl_vvY1I7VO2PoDXr5Y_Hn-pMkQ6NqaViNcYRvCUnX1iCN88S5AGcmFv5YcWImgsjL6Q4375a4wHqRvAsJw8B-IOY2JAeLhoAMgGMTj0x9nym6V5QVDBNsVoVJQRdjfYUeD-xW3Z8KOyHnRn0kixUOS6CBxOr2kSSPHPq8giM2mjMs2bEUkqMX6ePaGFBWC7bhdOwhcatkgaABL0hSDD8c2Zl1w_pLcVfM-Ax92Y6U6eFdUeoAfT0hxisTXAZCZbRNpYafPNa5ZlSX1QoiTctIZt87taGWwlBIvtewLLeAYx0p22fI6WPOBmQVgNuSLURG-1sh5pCaI0Dia0CnRZYe2RnHhBLa9upq4CNnBIbxcp801wlG2i9LnvUCOOSTLF9VjmL1pBd7MOoqjs3fjOCyRGvyqDBxDhJdcRn2KF2F5B9dRW9zaIT5NmnmNy3erEK_m00?></g></svg>