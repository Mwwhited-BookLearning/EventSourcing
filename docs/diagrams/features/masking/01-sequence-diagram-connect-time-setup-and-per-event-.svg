 style="stroke:#181818;stroke-width:1;"/><line x1="1122.139" y1="495.422" x2="1163.139" y2="495.422" style="stroke:#181818;stroke-width:1;"/><polygon points="1132.139,491.422,1122.139,495.422,1132.139,499.422,1128.139,495.422" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1128.139" y="462.223" fill="#000" font-size="13" font-weight="700">8</text><text x="1141.185" y="447.09" fill="#000" font-size="13" textLength="357.468">walk schema recursively; wherever x-masking is found</text><text x="1141.185" y="462.223" fill="#000" font-size="13" textLength="406.51">(a scalar property, a scalar array's items, or a property nested</text><text x="1141.185" y="477.356" fill="#000" font-size="13" textLength="412.61">inside a complex-object items schema), wrap that node's value</text><path d="M1105.139,507.422 L1169.582,507.422 L1169.582,514.555 L1159.582,524.555 L1105.139,524.555 L1105.139,507.422" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="1105.139" y="507.422" width="452.535" height="216.883" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="1120.139" y="520.489" fill="#000" font-size="13" textLength="19.443" font-weight="700">alt</text><text x="1184.582" y="519.632" fill="#000" font-size="11" textLength="357.092" font-weight="700">[caller holds requiredClaim and the field's DEK is still live</text><text x="1184.582" y="532.437" fill="#000" font-size="11" textLength="185.228" font-weight="700">(IErasureKeyStore, ADR-057)]</text><line x1="1121.139" y1="566.297" x2="1163.139" y2="566.297" style="stroke:#181818;stroke-width:1;"/><line x1="1163.139" y1="566.297" x2="1163.139" y2="579.297" style="stroke:#181818;stroke-width:1;"/><line x1="1122.139" y1="579.297" x2="1163.139" y2="579.297" style="stroke:#181818;stroke-width:1;"/><polygon points="1132.139,575.297,1122.139,579.297,1132.139,583.297,1128.139,579.297" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miter