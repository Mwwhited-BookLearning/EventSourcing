<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:678px;height:643px;background:#FFFFFF;" width="678px" height="643px" viewBox="0 0 678 643" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--class etd--><g class="entity" data-qualified-name="etd" id="ent0001" data-source-line="4"><rect x="99.84" y="7" width="160.313" height="107.484" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="108.879" y="24.995" fill="#000" font-size="14" textLength="142.235">EventTypeDefinition</text><line x1="100.84" y1="33.297" x2="259.153" y2="33.297" style="stroke:#181818;stroke-width:0.5;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="110.84" cy="46.945" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="119.84" y="50.292" fill="#000" font-size="14" textLength="134.313">Name : string «PK»</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="110.84" cy="63.242" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="119.84" y="66.589" fill="#000" font-size="14" textLength="123.642">Version : int «PK»</text><line x1="100.84" y1="73.891" x2="259.153" y2="73.891" style="stroke:#181818;stroke-width:1;"/><text x="105.84" y="90.886" fill="#000" font-size="14" textLength="138.236">ChangeKind : string</text><text x="105.84" y="107.183" fill="#000" font-size="14" textLength="141.025">EntityIdField : string</text></g><!--class event--><g class="entity" data-qualified-name="event" id="ent0002" data-source-line="12"><rect x="57.98" y="174.49" width="244.032" height="221.563" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="136.844" y="192.485" fill="#000" font-size="14" textLength="86.304">StoredEvent</text><line x1="58.98" y1="200.787" x2="301.012" y2="200.787" style="stroke:#181818;stroke-width:0.5;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="68.98" cy="214.435" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="77.98" y="217.782" fill="#000" font-size="14" textLength="218.032">SequenceNumber : bigint «PK»</text><line x1="58.98" y1="225.084" x2="301.012" y2="225.084" style="stroke:#181818;stroke-width:1;"/><text x="63.98" y="242.079" fill="#000" font-size="14" textLength="166.852">EventId : uuid «unique»</text><text x="63.98" y="258.376" fill="#000" font-size="14" textLength="146.508">EntityId : string «FK»</text><text x="63.98" y="274.673" fill="#000" font-size="14" textLength="128.249">EventType : string</text><text x="63.98" y="290.969" fill="#000" font-size="14" textLength="178.849">ExpectedVersion : bigint?</text><text x="63.98" y="307.266" fill="#000" font-size="14" textLength="126.041">ConflictFlag : bool</text><text x="63.98" y="323.563" fill="#000" font-size="14" textLength="149.146">LateArrivalFlag : bool</text><text x="63.98" y="339.86" fill="#000" font-size="14" textLength="196">OccurredAt : datetimeoffset</text><text x="63.98" y="356.157" fill="#000" font-size="14" textLength="162.135">SchemaStatus : string?</text><text x="63.98" y="372.454" fill="#000" font-size="14" textLength="98.417">Status : string</text><text x="63.98" y="388.751" fill="#000" font-size="14" textLength="96.722">Payload : text</text></g><!--class entityStore--><g class="entity" data-qualified-name="entityStore" id="ent0003" data-source-line="27"><rect x="32.79" y="456.05" width="294.427" height="172.672" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="126.04" y="474.045" fill="#000" font-size="14" textLength="107.926">EntityStoreRow</text><line x1="33.79" y1="482.347" x2="326.217" y2="482.347" style="stroke:#181818;stroke-width:0.5;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="43.79" cy="495.995" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="52.79" y="499.342" fill="#000" font-size="14" textLength="146.897">EntityId : string «PK»</text><line x1="33.79" y1="506.644" x2="326.217" y2="506.644" style="stroke:#181818;stroke-width:1;"/><text x="38.79" y="523.639" fill="#000" font-size="14" textLength="129.015">EntityType : string</text><text x="38.79" y="539.936" fill="#000" font-size="14" textLength="106.101">Version : bigint</text><text x="38.79" y="556.233" fill="#000" font-size="14" textLength="74.922">Data : text</text><text x="38.79" y="572.529" fill="#000" font-size="14" textLength="117.517">Extensions : text</text><text x="38.79" y="588.826" fill="#000" font-size="14" textLength="140.725">SchemaVersion : int</text><text x="38.79" y="605.123" fill="#000" font-size="14" textLength="260.62">LastAppliedSequenceNumber : bigint</text><text x="38.79" y="621.42" fill="#000" font-size="14" textLength="282.427">LastAppliedLogicalTime : datetimeoffset</text></g><g class="entity" data-qualified-name="GMN6" id="ent0007" data-source-line="43"><path d="M362.09,484.42 L362.09,538.72 L327.51,542.72 L362.09,546.72 L362.09,600.35 A0,0 0 0 0 362.09,600.35 L663.904,600.35 A0,0 0 0 0 663.904,600.35 L663.904,494.42 L653.904,484.42 L362.09,484.42 A0,0 0 0 0 362.09,484.42" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M653.904,484.42 L653.904,494.42 L663.904,494.42 L653.904,484.42" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="368.09" y="501.487" fill="#000" font-size="13" textLength="254.687">One row per EntityId, always present --</text><text x="368.09" y="516.62" fill="#000" font-size="13" textLength="273.286">not opt-in like a custom CQRS read model</text><text x="368.09" y="531.753" fill="#000" font-size="13" textLength="278.046">(ProjectionSnapshot/OrderSummary live in</text><text x="368.09" y="546.885" fill="#000" font-size="13" textLength="277.545">a separate ProjectionsDbContext entirely).</text><text x="368.09" y="562.018" fill="#000" font-size="13" textLength="258.635">Version bumps only when Data actually</text><text x="368.09" y="577.151" fill="#000" font-size="13" textLength="274.06">changes; ExpectedVersion on the event is</text><text x="368.09" y="592.284" fill="#000" font-size="13" textLength="280.814">compared against this column at fold time.</text></g><g class="entity" data-qualified-name="GMN9" id="ent0010" data-source-line="53"><path d="M337.41,181.9 L337.41,281.72 L302.17,285.72 L337.41,289.72 L337.41,388.627 A0,0 0 0 0 337.41,388.627 L654.585,388.627 A0,0 0 0 0 654.585,388.627 L654.585,191.9 L644.585,181.9 L337.41,181.9 A0,0 0 0 0 337.41,181.9" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M644.585,181.9 L644.585,191.9 L654.585,191.9 L644.585,181.9" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="343.41" y="198.967" fill="#000" font-size="13" textLength="286.324">ConflictFlag and LateArrivalFlag answer two</text><text x="343.41" y="214.1" fill="#000" font-size="13" textLength="273.013">different questions at fold time (ADR-029;</text><text x="343.41" y="229.233" fill="#000" font-size="13" textLength="261.536">see also docs/patterns/interactions/fold-</text><text x="343.41" y="244.365" fill="#000" font-size="13" textLength="251.475">ordering-and-conflict.md): ConflictFlag</text><text x="343.41" y="259.498" fill="#000" font-size="13" textLength="229.734">compares ExpectedVersion against</text><text x="343.41" y="274.631" fill="#000" font-size="13" textLength="251.748">EntityStoreRow.Version (a stale causal</text><text x="343.41" y="289.764" fill="#000" font-size="13" textLength="220.257">basis) and never blocks the write.</text><text x="343.41" y="304.897" fill="#000" font-size="13" textLength="296.175">LateArrivalFlag compares OccurredAt against</text><text x="343.41" y="320.029" fill="#000" font-size="13" textLength="275.469">EntityStoreRow.LastAppliedLogicalTime (a</text><text x="343.41" y="335.162" fill="#000" font-size="13" textLength="250.136">chronologically-stale event) and DOES</text><text x="343.41" y="350.295" fill="#000" font-size="13" textLength="249.787">withhold that event's change from the</text><text x="343.41" y="365.428" fill="#000" font-size="13" textLength="266.1">affected property. A single event can set</text><text x="343.41" y="380.561" fill="#000" font-size="13" textLength="135.421">both, independently.</text></g><!--link etd to event--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk4" data-source-line="39" data-link-type="dependency"><path d="M180,114.81 C180,132.84 180,148.65 180,169.39" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="etd-to-event" codeLine="39"/><polygon points="180,174.39,184,165.39,180,169.39,176,165.39,180,174.39" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="23.44" y="110.667" fill="#000" font-size="13" textLength="139.268">EntityIdField resolves</text><text x="28.442" y="125.8" fill="#000" font-size="13" textLength="129.264">EntityId at fold time</text><text x="7" y="140.933" fill="#000" font-size="13" textLength="172.148">-- logical only, not a DB FK</text></g><!--link event to entityStore--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk5" data-source-line="40" data-link-type="dependency"><path d="M180,396.55 C180,416.36 180,431.73 180,450.74" style="stroke:#181818;stroke-width:1;" fill="none" id="event-to-entityStore" codeLine="40"/><polygon points="180,455.74,184,446.74,180,450.74,176,446.74,180,455.74" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="197.653" y="407.207" fill="#000" font-size="13" textLength="201.303">folds into, in OccurredAt order,</text><text x="181" y="422.34" fill="#000" font-size="13" textLength="234.609">never the other direction (ADR-021)</text><text x="173.824" y="416.23" fill="#000" font-size="13">*</text><text x="171.68" y="445.016" fill="#000" font-size="13">1</text></g