<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SEQUENCE" style="width:1582px;height:1001px;background:#FFFFFF;" width="1582px" height="1001px" viewBox="0 0 1582 1001" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="74.383" y="114.594" width="1031.024" height="285.797" fill="none" style="stroke:#000;stroke-width:1.5;"/><g><title>SPA . backend service</title><rect x="86.883" y="102.594" width="8" height="795.586" fill="#000" fill-opacity="0"/><line x1="90.383" y1="102.594" x2="90.383" y2="898.18" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>EventStore.DevIdp</title><rect x="597.336" y="102.594" width="8" height="795.586" fill="#000" fill-opacity="0"/><line x1="600.836" y1="102.594" x2="600.836" y2="898.18" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>.video src. . .img src.</title><rect x="1231.38" y="102.594" width="8" height="795.586" fill="#000" fill-opacity="0"/><line x1="1234.88" y1="102.594" x2="1234.88" y2="898.18" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><text x="10" y="82.995" fill="#000" font-size="14" textLength="154.766">SPA / backend service</text><text x="27.168" y="99.292" fill="#000" font-size="14" textLength="120.429">(header-capable)</text><ellipse cx="90.383" cy="18.5" rx="8" ry="8" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;"/><path d="M90.383,26.5 L90.383,53.5 M77.383,34.5 L103.383,34.5 M90.383,53.5 L77.383,68.5 M90.383,53.5 L103.383,68.5" style="stroke:#181818;stroke-width:0.5;" fill="none"/><rect x="514.81" y="55" width="172.054" height="46.594" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="535.112" y="74.995" fill="#000" font-size="14" textLength="131.448">EventStore.DevIdp</text><text x="521.81" y="91.292" fill="#000" font-size="14" textLength="158.054">(OpenIddict, ADR-006)</text><rect x="1114.407" y="55" width="240.946" height="46.594" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1121.407" y="74.995" fill="#000" font-size="14" textLength="96.065">&lt;video src> /</text><text x="1221.923" y="74.995" fill="#000" font-size="14" textLength="126.431" font-family="monospace">(Cannot decode)</text><text x="1168.285" y="91.292" fill="#000" font-size="14" textLength="133.191">(header-incapable)</text><text x="10" y="911.175" fill="#000" font-size="14" textLength="154.766">SPA / backend service</text><text x="27.168" y="927.472" fill="#000" font-size="14" textLength="120.429">(header-capable)</text><ellipse cx="90.383" cy="939.273" rx="8" ry="8" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;"/><path d="M90.383,947.273 L90.383,974.273 M77.383,955.273 L103.383,955.273 M90.383,974.273 L77.383,989.273 M90.383,974.273 L103.383,989.273" style="stroke:#181818;stroke-width:0.5;" fill="none"/><rect x="514.81" y="898.18" width="172.054" height="46.594" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="535.112" y="918.175" fill="#000" font-size="14" textLength="131.448">EventStore.DevIdp</text><text x="521.81" y="934.472" fill="#000" font-size="14" textLength="158.054">(OpenIddict, ADR-006)</text><rect x="1114.407" y="898.18" width="240.946" height="46.594" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1121.407" y="918.175" fill="#000" font-size="14" textLength="96.065">&lt;video src> /</text><text x="1221.923" y="918.175" fill="#000" font-size="14" textLength="126.431" font-family="monospace">(Cannot decode)</text><text x="1168.285" y="934.472" fill="#000" font-size="14" textLength="133.191">(header-incapable)</text><path d="M74.383,114.594 L138.826,114.594 L138.826,121.727 L128.826,131.727 L74.383,131.727 L74.383,114.594" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="74.383" y="114.594" width="1031.024" height="285.797" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="89.383" y="127.661" fill="#000" font-size="13" textLength="19.443" font-weight="700">alt</text><text x="153.826" y="126.804" fill="#000" font-size="11" textLength="392.326" font-weight="700">[caller uses a registered client_id (routed through OpenIddict)]</text><polygon points="588.836,264.789,598.836,268.789,588.836,272.789,592.836,268.789" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="90.383" y1="268.789" x2="594.836" y2="268.789" style="stroke:#181818;stroke-width:1;"/><text x="97.383" y="210.758" fill="#000" font-size="13" font-weight="700">1</text><text x="110.428" y="157.793" fill="#000" font-size="13" textLength="135.795">POST /connect/token</text><text x="110.428" y="172.926" fill="#000" font-size="13" textLength="448.538">Authorization: Bearer &lt;JWT>, DPoP: &lt;proof> (ADR-017, unchanged)</text><text x="110.428" y="188.059" fill="#000" font-size="13" textLength="406.472">grant_type=urn:ietf:params:oauth:grant-type:token-exchange</text><text x="110.428" y="203.192" fill="#000" font-size="13" textLength="217.204">subject_token=&lt;the JWT above></text><text x="110.428" y="218.325" fill="#000" font-size="13" textLength="446.005">subject_token_type=urn:ietf:params:oauth:token-type:access_token</text><text x="110.428" y="233.458" fill="#000" font-size="13" textLength="367.885">requested_token_type=urn:eventstore:token-type:ticket</text><text x="110.428" y="248.59" fill="#000" font-size="13" textLength="193.254">client_id=&lt;registered client></text><text x="110.428" y="263.723" fill="#000" font-size="13" textLength="246.016">client_secret=&lt;its registered secret></text><path d="M605.836,146.727 L605.836,216.727 L1083.836,216.727 L1083.836,156.727 L1073.836,146.727 L605.836,146.727" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1073.836,146.727 L1073.836,156.727 L1083.836,156.727 L1073.836,146.727" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="611.836" y="163.793" fill="#000" font-size="13" textLength="373.058">OpenIddict's own /connect/token pipeline unconditionally</text><text x="611.836" y="178.926" fill="#000" font-size="13" textLength="425.674">requires client_id + client_secret for ANY grant type reaching it --</text><text x="611.836" y="194.059" fill="#000" font-size="13" textLength="457.571">genuinely incompatible with the one_time_secret path below, which is</text><text x="611.836" y="209.192" fill="#000" font-size="13" textLength="440.127">handled by a separate, non-OpenIddict endpoint instead (ADR-040)</text><line x1="74.383" y1="277.789" x2="1105.407" y2="277.789" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="79.383" y="290" fill="#000" font-size="11" textLength="412.527" font-weight="700">[caller uses a fresh one_time_secret (never a registered client_id)]</text><polygon points="588.836,388.391,598.836,392.391,588.836,396.391,592.836,392.391" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="90.383" y1="392.391" x2="594.836" y2="392.391" style="stroke:#181818;stroke-width:1;"/><text x="97.383" y="349.493" fill="#000" font-size="13" font-weight="700">2</text><text x="110.428" y="311.661" fill="#000" font-size="13" textLength="189.357">POST /oauth/ticket-exchange</text><text x="110.428" y="326.793" fill="#000" font-size="13" textLength="338.679">DPoP: &lt;proof> (ADR-017 still applies in full; a plain,</text><text x="110.428" y="341.926" fill="#000" font-size="13" textLength="473.408">non-OpenIddict minimal-API endpoint, no Authorization header required)</text><text x="110.428" y="357.059" fill="#000" font-size="13" textLength="217.204">subject_token=&lt;the JWT above></text><text x="110.428" y="372.192" fill="#000" font-size="13" textLength="440.185">one_time_secret=&lt;caller-generated random value, never persisted</text><text x="110.428" y="387.325" fill="#000" font-size="13" textLength="367.739">anywhere except this Ticket's own secretRef, ADR-040></text><line x1="600.836" y1="435.523" x2="642.836" y2="435.523" style="stroke:#181818;stroke-width:1;"/><line x1="642.836" y1="435.523" x2="642.836" y2="448.523" style="stroke:#181818;stroke-width:1;"/><line x1="601.836" y1="448.523" x2="642.836" y2="448.523" style="stroke:#181818;stroke-width:1;"/><polygon points="611.836,444.523,601.836,448.523,611.836,452.523,607.836,448.523" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="607.836" y="430.458" fill="#000" font-size="13" font-weight="700">3</text><text x="620.882" y="430.458" fill="#000" font-size="13" textLength="444.107">validate subject_token (ordinary bearer+DPoP check, ADR-006/017)</text><line x1="600.836" y1="507.922" x2="642.836" y2="507.922" style="stroke:#181818;stroke-width:1;"/><line x1="642.836" y1="507.922" x2="642.836" y2="520.922" style="stroke:#181818;stroke-width:1;"/><line x1="601.836" y1="520.922" x2="642.836" y2="520.922" style="stroke:#181818;stroke-width:1;"/><polygon points="611.836,516.922,601.836,520.922,611.836,524.922,607.836,520.922" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="607.836" y="487.723" fill="#000" font-size="13" font-weight="700">4</text><text x="620.882" y="472.59" fill="#000" font-size="13" textLength="244.397">generate ticket -- opaque, single-use,</text><text x="620.882" y="487.723" fill="#000" font-size="13" textLength="248.892">cryptographically random, NOT a JWT,</text><text x="620.882" y="502.856" fill="#000" font-size="13" textLength="212.266">not self-describing (deliberately)</text><line x1="600.836" y1="625.719" x2="642.836" y2="625.719" style="stroke:#181818;stroke-width:1;"/><line x1="642.836" y1="625.719" x2="642.836" y2="638.719" style="stroke:#181818;stroke-width:1;"/><line x1="601.836" y1="638.719" x2="642.836" y2="638.719" style="stroke:#181818;stroke-width:1;"/><polygon points="611.836,634.719,601.836,638.719,611.836,642.719,607.836,638.719" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="607.836" y="582.821" fill="#000" font-size="13" font-weight="700">5</text><text x="620.882" y="544.989" fill="#000" font-size="13" textLength="296.531">store Ticket record, in-process/non-persistent</text><text x="620.882" y="560.122" fill="#000" font-size="13" textLength="316.704">{ ticket, clientIdOrOneTimeSecretRef, expiresAt,</text><text x="629.146" y="575.254" fill="#000" font-size="13" textLength="259.327">consumed: false, originalTokenClaims }</text><text x="620.882" y="590.387" fill="#000" font-size="13" textLength="291.307">-- same InMemory OpenIddict-adjacent store</text><text x="620.882" y="605.52" fill="#000" font-size="13" textLength="361.417">auth.md already documents client/token state living in,</text><text x="620.882" y="620.653" fill="#000" font-size="13" textLength="358.211">NOT EventStoreContext (ADR-040's own consequence)</text><polygon points="101.383,663.852,91.383,667.852,101.383,671.852,97.383,667.852" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="95.383" y1="667.852" x2="599.836" y2="667.852" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="107.383" y="662.786" fill="#000" font-size="13" font-weight="700">6</text><text x="120.428" y="662.786" fill="#000" font-size="13" textLength="158.241">200 { ticket, expiresIn }</text><line x1="90.383" y1="742.383" x2="132.383" y2="742.383" style="stroke:#181818;stroke-width:1;"/><line x1="132.383" y1="742.383" x2="132.383" y2="755.383" style="stroke:#181818;stroke-width:1;"/><line x1="91.383" y1="755.383" x2="132.383" y2="755.383" style="stroke:#181818;stroke-width:1;"/><polygon points="101.383,751.383,91.383,755.383,101.383,759.383,97.383,755.383" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="97.383" y="714.618" fill="#000" font-size="13" font-weight="700">7</text><text x="110.428" y="691.918" fill="#000" font-size="13" textLength="349.35">sig = base64url(HMAC-SHA256(ticket, sharedSecret))</text><text x="110.428" y="707.051" fill="#000" font-size="13" textLength="386.433">sharedSecret = the registered client_secret (client_id path)</text><text x="110.428" y="722.184" fill="#000" font-size="13" textLength="379.856">OR the one_time_secret generated in the request above --</text><text x="110.428" y="737.317" fill="#000" font-size="13" textLength="374.118">never a value transmitted over the header-incapable hop</text><polygon points="1222.88,780.516,1232.88,784.516,1222.88,788.516,1226.88,784.516" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="90.383" y1="784.516" x2="1228.88" y2="784.516" style="stroke:#181818;stroke-width:1;"/><text x="97.383" y="779.45" fill="#000" font-size="13" font-weight="700">8</text><text x="110.428" y="779.45" fill="#000" font-size="13" textLength="459.907">set src = "https://.../stream/vitals-s0091?ticket=&lt;ticket>&amp;sig=&lt;sig>"</text><path d="M1239.88,797.516 L1239.88,882.516 L1565.88,882.516 L1565.88,807.516 L1555.88,797.516 L1239.88,797.516" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1555.88,797.516 L1555.88,807.516 L1565.88,807.516 L1555.88,797.516" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="1245.88" y="814.583" fill="#000" font-size="13" textLength="283.88">Only ticket+sig reach the header-incapable</text><text x="1245.88" y="829.715" fill="#000" font-size="13" textLength="280.795">element -- never the bearer JWT, never the</text><text x="1245.88" y="844.848" fill="#000" font-size="13" textLength="285.829">shared secret. Leaking this URL alone is the</text><text x="1245.88" y="859.981" fill="#000" font-size="13" textLength="305.652">bounded residual risk ADR-040 states honestly</text><text x="1245.88" y="875.114" fill="#000" font-size="13" textLength="302.618">(see "Resolution" diagram below for the limit).</text><?plantuml-src XLLjZnet4FxEhnZneGM51H9Thoe5AffKobL9EDrTLLL2Efdrm3hdjJUsbmkjyj_xU7TX3t9flzmBs3Fpl8r56QmfypMxZaY3TTIzlLxGYDOYVM0ZoRFRgPHNffUnaEoIL1HYhRdV9U4f5LhZPY5SKAagX0dK_Mt79joY50_VyEvA5hYxBDXSIQdICA35cvjaFBwi2oXPdDwUxfHaIzwbSqmnLVcs-hljhyp91AmvHxzEH-ZGZ4EbPq-276-L3-nOKgeL3jqhIJrdou1FGeO_jXcra_KxT2YGpEDW4xfUtjxHABN6S1f6mOAHbLcK8RDE_Is2icP2lx9mk3Bz_S-x-O3UNDlh2KqBP-rcJhqAwyiV1rIQD1DcoxA_Cbi7fFTXN_2iT6QYE6mcu43aVc85Ya-g0qayCAbw9lovlhqolbn_n2ptrUUpQSYOq9Z4skvuVlRrVxMewrOjH9goz_SDEiUVIWPhyhm6HrbzbFNfPGZtm65bZWJFfb_HFZz-xJbr76PJ5VnJTUgFv-3VsC3ar3OBaoVAVE_9Ffep8QXG1MjbE79hZLHH3iYthp4e1m-qih-Wan5e0wSlFln55TKKeM0WaMRAR4a5IXB8nAP4URqdMCxc1VI6w-XHXOmYxzRmVL0v7qhYG4PhrlPnG8-PIZDIVcMWczJ0kDx3aPwZ284706gI5Y0XQOLLc4GPS29auvoBSR_3slEPiJV0bdtLlsSWaVk6xxzfxieEerh69pvxtiVaWzAQH56WBi9hQ5Dg_JDw5beeCrYPCrovCYeNEbbSNnqnHl1q4YAgeqsDRZ4Z_-FpC-opQOqjWMOS2PO4NQNDQITq6Uckg2dO-SYCN1bXzeyPA290vW8Eo9Idkug5ncrrvHlUD1lhOZpl0487t1qfH7KbqOvEngMUTL8PuVQmGrmEBoARb6QSFXpNtmXqza-A7MQdMWnua6mXFiNnFMofEO7ye3Xr-o9O6BU0oQBX6wm3-h04Gv6dIeW027gJIFQfK-jex9v4ODPL4xq_RLu5ko40EgH0C82-2GmGjyCewdgWpo3l_pHJ3XgBNScbMng-WoQtBN7ykOWvN0GC1FzPo9gpdD16mDG3WW6su4dVHTPUmq6vfoyh0-1Uv4nNvZtd5YosXag4_2XIzAi7XexmqJ2N93JYA_SaRLh6z-2G_MPN-129rMfNvJiQDNBLlbIlhGdyEHnZrtWWJXpteKcveGjyrLQRqAlnc5eQ6gXNXhvqsg0TpdgrfHdULC-N5wNJlRVl5w-JsxUBLpzSzWuLV0Qlo9gzVep0a_znEKRWwsGVijzkkhY6S7jvy-oIQWE2yDObgtrV9wlQUuSrKaM70ipbSnNY5Hk_Y9VEdsBARF44TVCc0pOwulN6zDqiXC9FHgFXS3Zo0MBbevqAy47Yn-EVNlvIiu2aLx_dtu6nsHG_vjrE-oYGtHmVVAAbWVVhyoyYmTK2VtO-76wknLJL0EEvEfvLOjfFSRYclba1Gth7uY4QfreIVzoyWzl0AzPxStnjIoFZpc6lP2aqXlKFXwrHUy-38WEUzHxdUvwPkZVihIxZ_kkIL0A1pkldetgSudXQWVZ-CAwTwcNy5m00?></g></svg>