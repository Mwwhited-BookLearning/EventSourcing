</text><text x="408.72" y="209.44" fill="#000" font-size="13" textLength="254.617">StoredEvent, not gated by whether the</text><text x="408.72" y="224.573" fill="#000" font-size="13" textLength="284.896">request type declared ExpectedResponse --</text><text x="408.72" y="239.705" fill="#000" font-size="13" textLength="251.932">the correlation itself is always generic;</text><text x="408.72" y="254.838" fill="#000" font-size="13" textLength="256.541">only the TRACKING is opt-in (ADR-094).</text></g><!--link etd to event--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk5" data-source-line="45" data-link-type="dependency"><path d="M245.67,98.35 C245.67,116.66 245.67,133.04 245.67,152.72" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="etd-to-event" codeLine="45"/><polygon points="245.67,157.72,249.67,148.72,245.67,152.72,241.67,148.72,245.67,157.72" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="29.67" y="94.107" fill="#000" font-size="13" textLength="215.103">logical only -- ExpectedResponse</text><text x="31.174" y="109.24" fill="#000" font-size="13" textLength="212.094">names which EventType/Version</text><text x="61.31" y="124.373" fill="#000" font-size="13" textLength="151.823">this governs (ADR-094)</text></g><!--link event to tracker--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk6" data-source-line="46" data-link-type="association"><path d="M205,290.28 C205,309.1 205,307 205,326.73" style="stroke:#181818;stroke-width:1;" fill="none" id="event-tracker" codeLine="46"/><line x1="201" y1="286.28" x2="209" y2="286.28" style="stroke:#181818;stroke-width:1;"/><line x1="201" y1="289.28" x2="209" y2="289.28" style="stroke:#181818;stroke-width:1;"/><line x1="205" y1="290.28" x2="205" y2="282.28" style="stroke:#181818;stroke-width:1;"/><line x1="205" y1="330.73" x2="205" y2="341.73" style="stroke:#181818;stroke-width:1;"/><ellipse cx="2