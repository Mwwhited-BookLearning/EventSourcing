<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:998px;height:353px;background:#FFFFFF;" width="998px" height="353px" viewBox="0 0 998 353" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--class policy--><g class="entity" data-qualified-name="policy" id="ent0001" data-source-line="4"><rect x="121.06" y="7" width="505.89" height="140.078" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="295.573" y="24.995" fill="#000" font-size="14" textLength="156.864">TenantRateLimitPolicy</text><line x1="122.06" y1="33.297" x2="625.95" y2="33.297" style="stroke:#181818;stroke-width:0.5;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="132.06" cy="46.945" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="141.06" y="50.292" fill="#000" font-size="14" textLength="133.376">AppId : string «PK»</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="132.06" cy="63.242" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="141.06" y="66.589" fill="#000" font-size="14" textLength="408.536">ResourceKind : enum {Publish, Subscription, Query} «PK»</text><line x1="122.06" y1="73.891" x2="625.95" y2="73.891" style="stroke:#181818;stroke-width:1;"/><text x="127.06" y="90.886" fill="#000" font-size="14" textLength="493.89">Algorithm : enum {TokenBucket, ConcurrencyLimiter, SlidingWindow}</text><text x="127.06" y="107.183" fill="#000" font-size="14" textLength="112.403">PermitLimit : int</text><text x="127.06" y="123.479" fill="#000" font-size="14" textLength="294.239">WindowOrReplenishmentPeriod : duration</text><text x="127.06" y="139.776" fill="#000" font-size="14" textLength="112.567">QueueLimit : int</text></g><!--class etd--><g class="entity" data-qualified-name="etd" id="ent0002" data-source-line="14"><rect x="161.84" y="227.01" width="160.313" height="91.188" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="170.879" y="245.005" fill="#000" font-size="14" textLength="142.235">EventTypeDefinition</text><line x1="162.84" y1="253.307" x2="321.153" y2="253.307" style="stroke:#181818;stroke-width:0.5;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="172.84" cy="266.955" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="181.84" y="270.302" fill="#000" font-size="14" textLength="133.376">AppId : string «PK»</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="172.84" cy="283.252" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="181.84" y="286.599" fill="#000" font-size="14" textLength="134.313">Name : string «PK»</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="172.84" cy="299.549" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="181.84" y="302.896" fill="#000" font-size="14" textLength="123.642">Version : int «PK»</text><line x1="162.84" y1="310.198" x2="321.153" y2="310.198" style="stroke:#181818;stroke-width:0.5;"/></g><g class="entity" data-qualified-name="GMN4" id="ent0005" data-source-line="23"><path d="M662.39,19.07 L662.39,73.14 L627.37,77.14 L662.39,81.14 L662.39,135 A0,0 0 0 0 662.39,135 L983.615,135 A0,0 0 0 0 983.615,135 L983.615,29.07 L973.615,19.07 L662.39,19.07 A0,0 0 0 0 662.39,19.07" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M973.615,19.07 L973.615,29.07 L983.615,29.07 L973.615,19.07" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="668.39" y="36.137" fill="#000" font-size="13" textLength="287.511">Ordinary Microsoft.Extensions.Configuration</text><text x="668.39" y="51.27" fill="#000" font-size="13" textLength="262.387">values (ADR-041), read per-AppId at the</text><text x="668.39" y="66.403" fill="#000" font-size="13" textLength="260.254">Gateway -- ADR-058 deliberately leaves</text><text x="668.39" y="81.535" fill="#000" font-size="13" textLength="256.902">whether this is a config-file section or a</text><text x="668.39" y="96.668" fill="#000" font-size="13" textLength="288.292">DB-backed record as a build-time detail, not</text><text x="668.39" y="111.801" fill="#000" font-size="13" textLength="300.225">a settled schema. Shown here as an entity for</text><text x="668.39" y="126.934" fill="#000" font-size="13" textLength="257.626">clarity; it may never be an actual table.</text></g><g class="entity" data-qualified-name="GMN7" id="ent0008" data-source-line="33"><path d="M356.91,207.08 L356.91,338.143 A0,0 0 0 0 356.91,338.143 L657.093,338.143 A0,0 0 0 0 657.093,338.143 L657.093,217.08 L647.093,207.08 L495.93,207.08 L491.93,147.37 L487.93,207.08 L356.91,207.08 A0,0 0 0 0 356.91,207.08" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M647.093,207.08 L647.093,217.08 L657.093,217.08 L647.093,207.08" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="362.91" y="224.147" fill="#000" font-size="13" textLength="239.161">In-flight limiter STATE (current token</text><text x="362.91" y="239.28" fill="#000" font-size="13" textLength="249.628">count, open connection count, current</text><text x="362.91" y="254.413" fill="#000" font-size="13" textLength="255.468">window's request count) is deliberately</text><text x="362.91" y="269.545" fill="#000" font-size="13" textLength="209.206">NOT shown here -- it lives in the</text><text x="362.91" y="284.678" fill="#000" font-size="13" textLength="279.183">RateLimiting middleware's own in-memory</text><text x="362.91" y="299.811" fill="#000" font-size="13" textLength="241.998">partition state at the Gateway, never</text><text x="362.91" y="314.944" fill="#000" font-size="13" textLength="269.249">persisted. Only the configured LIMITS are</text><text x="362.91" y="330.077" fill="#000" font-size="13" textLength="278.675">data; the counters enforcing them are not.</text