alified-name="ff" id="ent0002" data-source-line="14"><rect x="637.27" y="207.08" width="220.366" height="123.781" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="697.958" y="225.075" fill="#000" font-size="14" textLength="98.991">FilterableField</text><line x1="638.27" y1="233.377" x2="856.636" y2="233.377" style="stroke:#181818;stroke-width:0.5;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="648.27" cy="247.025" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="657.27" y="250.372" fill="#000" font-size="14" textLength="84.089">Id : int «PK»</text><line x1="638.27" y1="257.674" x2="856.636" y2="257.674" style="stroke:#181818;stroke-width:1;"/><text x="643.27" y="274.669" fill="#000" font-size="14" textLength="132.986">AppId : string «FK»</text><text x="643.27" y="290.966" fill="#000" font-size="14" textLength="208.366">EventTypeName : string «FK»</text><text x="643.27" y="307.263" fill="#000" font-size="14" textLength="197.695">EventTypeVersion : int «FK»</text><text x="643.27" y="323.559" fill="#000" font-size="14" textLength="114.051">JsonPath : string</text></g><!--class esr--><g class="entity" data-qualified-name="esr" id="ent0003" data-source-line="23"><rect x="7" y="215.23" width="172.897" height="107.484" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="39.486" y="233.225" fill="#000" font-size="14" textLength="107.926">EntityStoreRow</text><line x1="8" y1="241.527" x2="178.897" y2="241.527" style="stroke:#181818;stroke-width:0.5;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="18" cy="255.175" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="27" y="258.522" fill="#000" font-size="14" textLength="146.897">EntityId : string «PK»</text><line x1="8" y1="265.824" x2="178.897" y2="265.824" style="stroke:#181818;stroke-width:1;"/><text x="13" y="282.819" fill="#000" font-size="14" textLength="129.015">EntityType : string</text><text x="13" y="299.116" fill="#000" font-size="14" textLength="74.922">Data : text</text><text x="13" y="315.413" fill="#000" font-size="14" textLength="106.101">Version : bigint</text></g><g class="entity" data-qualified-name="GMN6" id="ent0007" data-source-line="35"><path d="M597.54,34.21 L597.54,72.86 L562.96,76.86 L597.54,80.86 L597.54,119.874 A0,0 0 0 0 597.54,119.874 L945.349,119.874 A0,0 0 0 0 945.349,119.874 L945.349,44.21 L935.349,34.21 L597.54,34.21 A0,0 0 0 0 597.54,34.21" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M935.349,34.21 L935.349,44.21 L945.349,44.21 L935.349,34.21" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="603.54" y="51.277" fill="#000" font-size="13" textLength="296.258">Composite key is (AppId, Name, Version), not</text><text x="603.54" y="66.41" fill="#000" font-size="13" textLength="326.809">(Name, Version) -- ADR-030. Two AppIds can each</text><text x="603.54" y="81.543" fill="#000" font-size="13" textLength="314.171">register "OrderPlaced" independently; these are</text><text x="603.54" y="96.675" fill="#000" font-size="13" textLength="318.17">different rows with no shared identity, no shared</text><text x="603.54" y="111.808" fill="#000" font-size="13" textLength="306.452">version sequence, and no cross-row validation.</text></g><g class="entity" data-qualified-name="GMN9" id="ent0010" data-source-line="43"><path d="M214.81,226.14 L214.81,264.86 L180.36,268.86 L214.81,272.86 L214.81,311.804 A0,0 0 0 0 214.81,311.804 L602.082,311.804 A0,0 0 0 0 602.082,311.804 L602.082,236.14 L592.082,226.14 L214.81,226.14 A0,0 0 0 0 214.81,226.14" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M592.082,226.14 L592.082,236.14 L602.082,236.14 L592.082,226.14" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="220.81" y="243.207" fill="#000" font-size="13" textLength="366.272">EntityId = {appId}:{entityType}:{uniqueId} (ADR-021).</text><text x="220.81" y="258.34" fill="#000" font-size="13" textLength="299.305">AppId is baked directly into the PK string -- no</text><text x="220.81" y="273.473" fill="#000" font-size="13" textLength="320.455">separate AppId column needed at this layer. Two</text><text x="220.81" y="288.605" fill="#000" font-size="13" textLength="335.791">AppIds publishing under the same uniqueId still get</text><text x="220.81" y="303.738" fill="#000" font-size="13" textLength="265.123">two entirely distinct EntityStoreRow PKs.</text></g><!--link etd to ff--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk4" data-source-line="31" data-link-type="crowfoot"><path d="M570.92,133.86 C659.04,133.86 747.45,133.86 747.45,133.86 C747.45,133.86 747.45,153.43 747.45,188.95" style="stroke:#181818;stroke-width:1;" fill="none" id="etd-ff" codeLine="31"/><line x1="566.92" y1="137.86" x2="566.92" y2="129.86" style="stroke:#181818;stroke-width:1;"/><line x1="569.92" y1="137.86" x2="569.92" y2="129.86" style="stroke:#181818;stroke-width:1;"/><line x1="570.92" y1="133.86" x2="562.92" y2="133.86" style="stroke:#181818;stroke-width:1;"/><line x1="747.45" y1="198.95" x2="753.45" y2="206.95" style="stroke:#181818;stroke-width:1;"/><line x1="747.45" y1="198.95" x2="741.45" y2="206.95" style="stroke:#181818;stroke-width:1;"/><line x1="747.45" y1="198.95" x2="747.45" y2="206.95" style="stroke:#181818;stroke-width:1;"/><ellipse cx="747.45" cy="192.95" rx="4" ry="4" fill="none" style="stroke:#181818;stroke-width:1;"/><text x="754.344" y="146.927" fill="#000" font-size="13" textLength="166.347">(AppId, Name, Version) =</text><text x="692.73" y="162.06" fill="#000" font-size="13" textLength="289.574">(AppId, EventTypeName, EventTypeVersion)</text></g><!--link etd to esr--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk5" data-source-line="32" data-link-type="crowfoot"><path d="M420.45,147.26 C420.45,183.77 420.45,220.86 420.45,220.86 C420.45,220.86 295.1,220.86 198.22,220.86" style="stroke:#181818;stro