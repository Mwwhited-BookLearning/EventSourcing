nt-size="13" textLength="264.469">non-authoritative-capture.md for the full</text><text x="805.054" y="324.598" fill="#000" font-size="13" textLength="307.703">AuthorityStatus mechanic; not re-derived here.</text><line x1="348.85" y1="338.664" x2="1406.681" y2="338.664" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="353.85" y="350.875" fill="#000" font-size="11" textLength="378.85" font-weight="700">[this integration's schema choice: discrete, one-shot reading</text><text x="353.85" y="363.679" fill="#000" font-size="11" textLength="170.484" font-weight="700">(e.g. an instrument result)]</text><polygon points="914.101,401.539,924.101,405.539,914.101,409.539,918.101,405.539" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="364.85" y1="405.539" x2="920.101" y2="405.539" style="stroke:#181818;stroke-width:1;"/><text x="371.85" y="392.907" fill="#000" font-size="13" font-weight="700">3</text><text x="384.896" y="385.34" fill="#000" font-size="13" textLength="189.789">publish ordinary StoredEvent</text><text x="384.896" y="400.473" fill="#000" font-size="13" textLength="215.052">(ordinary publish path, ADR-023)</text><path d="M910.101,417.539 L974.543,417.539 L974.543,424.672 L964.543,434.672 L910.101,434.672 L910.101,417.539" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="910.101" y="417.539" width="471.581" height="145.336" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="925.101" y="430.606" fill="#000" font-size="13" textLength="19.443" font-weight="700">alt</text><text x="989.543" y="429.75" fill="#000" font-size="11" textLength="376.138" font-weight="700">[device carries a self-attested DID/UCAN identity (ADR-036)]</text><line x1="926.101" y1="480.938" x2="968.101" y2="480.938" style="stroke:#181818;stroke-width:1;"/><line x1="968.101" y1="480.938" x2="968.101" y2="493.938" style="stroke:#181818;stroke-width:1;"/><line x1="927.101" y1="493.938" x2="968.101" y2="49