oke-width:1;"/></g><text x="27" y="217.782" fill="#000" font-size="14" textLength="163.112">ChannelId : string «FK»</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="18" cy="230.732" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="27" y="234.079" fill="#000" font-size="14" textLength="195.214">Timestamp : datetimeoffset</text><line x1="8" y1="241.381" x2="321.481" y2="241.381" style="stroke:#181818;stroke-width:1;"/><text x="13" y="258.376" fill="#000" font-size="14" textLength="303.481">MonotonicElapsedMicros : bigint «nullable»</text><text x="13" y="274.673" fill="#000" font-size="14" textLength="91.718">Value : bytes</text><text x="13" y="290.969" fill="#000" font-size="14" textLength="149.146">LateArrivalFlag : bool</text></g><!--class event--><g class="entity" data-qualified-name="event" id="ent0003" data-source-line="23"><rect x="684.72" y="190.79" width="244.032" height="91.188" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="763.584" y="208.785" fill="#000" font-size="14" textLength="86.304">StoredEvent</text><line x1="685.72" y1="217.087" x2="927.752" y2="217.087" style="stroke:#181818;stroke-width:0.5;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="695.72" cy="230.735" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="704.72" y="234.082" fill="#000" font-size="14" textLength="218.032">SequenceNumber : bigint «PK»</text><line x1="685.72" y1="241.384" x2="927.752" y2="241.384" style="stroke:#181818;stroke-width:1;"/><text x="690.72" y="258.379" fill="#000" font-size="14" textLength="163.215">AuthorityStatus : string</text><text x="690.72" y="274.676" fill="#000" font-size="14" textLength="225.087">AttestedClaims : text «nullable»</text></g><g class="entity" data-qualified-name="GMN6" id="ent0007" data-source-line="36"><path d="M357.92,178.41 L357.92,232.27 L322.83,236.27 L357.92,240.27 L357.92,294.34 A0,0 0 0 0 357.92,294.34 L649.552,294.34 A0,0 0 0 0 649.552,294.34 L649.552,188.41 L639.552,178.41 L357.92,178.41 A0,0 0 0 0 357.92,178.41" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M639.552,178.41 L639.552,188.41 L649.552,188.41 L639.552,178.41" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="363.92" y="195.477" fill="#000" font-size="13" textLength="245.375">MonotonicElapsedMicros is optional --</text><text x="363.92" y="210.61" fill="#000" font-size="13" textLength="241.554">not every producer has a meaningful</text><text x="363.92" y="225.743" fill="#000" font-size="13" textLength="270.632">monotonic session concept. Populated by</text><text x="363.92" y="240.875" fill="#000" font-size="13" textLength="230.998">the recording agent (the client-side</text><text x="363.92" y="256.008" fill="#000" font-size="13" textLength="265.707">component owning the capture session),</text><text x="363.92" y="271.141" fill="#000" font-size="13" textLength="248.358">not the raw device sensor and not the</text><text x="363.92" y="286.274" fill="#000" font-size="13" textLength="117">server (ADR-083).</text></g><g class="entity" data-qualified-name="GMN9" id="ent0010" data-source-line="46"><path d="M963.62,193.55 L963.62,279.214 L1251.863,279.214 L1251.863,203.55 L1241.863,193.55 L963.62,193.55" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1241.863,193.55 L1241.863,203.55 L1251.863,203.55 L1241.863,193.55" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="969.62" y="210.617" fill="#000" font-size="13" textLength="260.114">Unchanged from mvvm-client.md's own</text><text x="969.62" y="225.75" fill="#000" font-size="13" textLength="261.2">ClientOutboxEntry -- device input writes</text><text x="969.62" y="240.883" fill="#000" font-size="13" textLength="249.653">into the identical outbox row shape as</text><text x="969.62" y="256.015" fill="#000" font-size="13" textLength="267.243">any other client-originated command; no</text><text x="969.62" y="271.148" fill="#000" font-size="13" textLength="229.995">new client-side durability primitive.</text></g><!--link outbox to sample--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk4" data-source-line="32" data-link-type="association"><path d="M709.23,60.27 C529.64,60.27 164.74,60.27 164.74,60.27 C164.74,60.27 164.74,123.59 164.74,174.29" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="outbox-sample" codeLine="32"/><text x="139.98" y="26.337" fill="#000" font-size="13" textLength="239.764">continuous mapping (per-integration</text><text x="163.46" y="41.47" fill="#000" font-size="13" textLength="192.804">choice) -- flush delivers into a</text><text x="164.545" y="56.603" fill="#000" font-size="13" textLength="190.633">Streaming Channel, ADR-031</text></g><!--link outbox to event--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk5" data-source-line="33" data-link-type="association"><path d="M806.74,114.88 C806.74,139.07 806.74,167.27 806.74,190.42" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="outbox-event" codeLine="33"/><text x="585.74" y="118.717" fill="#000" font-size="13" textLength="220.492">discrete mapping (per-integration</text><text x="600.546" y="133.85" fill="#000" font-size="13" textLength="190.88">choice) -- flush delivers as an</text><text x="610.375" y="148.983" fill="#000" font-size="13" textLength="171.222">ordinary publish, ADR-023</text></g><!--link outbox to GMN9--><g class="link" data-entity-1="ent0001" data-entity-2="ent0010" id="lnk11" data-source-line="46" data-link-type="association"><path d="M904.05,60.27 C991.99,60.27 1107.74,60.27 1107.74,60.27 C1107.74,60.27 1107.74,141.16 1107.74,193.3" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="outbox-GMN9"/></g><?plantuml-src dLHDZnGt4BtFhoZDXLsqFOAi8Y50IAlD8g64P9K1JbngtDNJ5hQhuuyPHX7_FS_zmKw0N79fsLrVhrwzSczR8MEZSR9AdsmOEB8dPuFaqo2aCVUwMad8DfzeVUiiZd-KlDFFTo77qveuaOvt-dj5z9Xkr