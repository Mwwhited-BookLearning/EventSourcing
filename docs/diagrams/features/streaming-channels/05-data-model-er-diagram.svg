K</text></g><!--link channel to channel--><g class="link" data-entity-1="ent0001" data-entity-2="ent0001" id="lnk8" data-source-line="51" data-link-type="dependency"><path d="M612.56,174.116 C612.56,151.596 612.56,134.936 612.56,134.936 C612.56,134.936 380.24,134.936 380.24,134.936 C380.24,134.936 380.24,451.936 380.24,451.936 C380.24,451.936 576.11,451.936 576.11,451.936 C576.11,451.936 576.11,440.276 576.11,417.756" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="channel-to-channel-1" codeLine="51"/><polygon points="576.11,412.756,572.11,421.756,576.11,417.756,580.11,421.756,576.11,412.756" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="45.254" y="236.273" fill="#000" font-size="13" textLength="321.82">ThreadId -- multiple channels registered together</text><text x="37.24" y="251.406" fill="#000" font-size="13" textLength="337.848">share one ThreadId value; a denormalized grouping</text><text x="102.846" y="266.538" fill="#000" font-size="13" textLength="206.635">key (ADR-081), not a normal FK</text></g><!--link event to channel--><g class="link" data-entity-1="ent0004" data-entity-2="ent0001" id="lnk9" data-source-line="52" data-link-type="dependency"><path d="M773.21,114.896 C773.21,132.346 773.21,148.126 773.21,169.226" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="event-to-channel" codeLine="52"/><polygon points="773.21,174.226,777.21,165.226,773.21,169.226,769.21,165.226,773.21,174.226" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="447.262" y="19.633" fill="#000" font-size="13" textLength="277.583">TelemetryPointer.ChannelId -- logical only,</text><text x="452.778" y="34.766" fill="#000" font-size="13" textLength="266.551">NOT a DB FK; TelemetryPointer itself is a</text><text x="425.816" y="49.898" fill="#000" font-size="13" textLength="320.474">column on StoredEvent, defined in event-log.md.</text><text x="438.861" y="65.031" fill="#000" font-size="13" textLength="294.385">JSON-serialized List&lt;TelemetryPointerEntry></text><text x="399.21" y="80.164" fill="#000" font-size="13" textLength="373.687">{ChannelId, ThreadId?, FromTimestamp, ToTimestamp?}</text><text x="429.533" y="95.297" fill="#000" font-size="13" textLength="313.041">per entry (ADR-081) -- one entry for an ordinary</text><text x="422.83" y="110.43" fill="#000" font-size="13" textLength="326.447">single-channel detection, multiple for a correlated</text><text x="423.674" y="125.563" fill="#000" font-size="13" textLength="324.759">multi-channel one; ThreadId is denormalized onto</text><text x="431.24" y="140.695" fill="#000" font-size="13" textLength="309.626">each entry too, not just onto TelemetryChannel</text></g><?plantuml-src ZLPRKnit57xdLsXuWiokIQ3fj265eG7QN20CzlIbxeEyUxohefLSIKlY4FvxloDvruiXcRnulDAvVEVs7TMg954eLsZQyZVABAIJZT3AK5WkI5WNQhkrHIQei1JR4zBKK73BDxKqXlIsa5uKwR-usnBYcLZTl2t5A-63KwOIhrzVlJywmcsUu-TaiHXSuk0i6dzuziQQ0AVlbU5ZCcqZxgxbft4XjNIPmD_VbP5kcOaBAfMyXyfODWjD4qRTQPnhAyFFFsNYhGa7-_V7aBfGJIUJd1ttgX0YTolrXIgSzH2OgKgPm08V7V_jxQRFJ9oIKxTKilT9xKYMWo2YNTkwWlgC-Fxoxt_uUkAayNFhceTXaezmCd6kD11bugIg75Kou2Yg5BQa6Cmr_TSgH-KRBLN3rkzEyLa4PG4k7jwpf_id2fX2ZlLBxhvVFe199Nmc9iYW3z21H0bG0TzsFlSKDWhzbzGjvtcs3EJn_G729muPa_fSouflhDL3TDTKoY9GUIrDbR2vU89uVXZUkRFD3qESs6-BRkPts9xZu21RBTSeVXFRfpINhGxRV5_RJ-VA-G21LGlnqGSvFBcG_WRnE9nWX1mVNJdow44Q4yzXiCu_aQKnpgaykyLtp17nlrL-na1Cfg3BjfcHwtju8-oe6tFOjgh4PMiKzA90to5NLl5031eQ6BfP__erp-rTrpglnFQwC7cEgacDYcHJ0snksOdDI5jJUH6iaAAa0gDCPKSVsxtjqGYMruNVD3vNf4lXQuaXtZavlSwV7xpOXIkUlvpB9tmxyqXL6zKROhlADrCZCMLzvP8PvDjgZ31g8gAjb_j384SzkG75esa66DbnG2_eQ4wEI-2dnXfcKD6WNi97xKxC7q9rrJfQ-G3ynWQS6T11JDutOVHC0_SD-arnQZkpS5_1775YWwqerEIc1ia20aRJAz_oS1x6EYINwWjKAcVR1J1DpGqjLzdz1TaLZy2bfjk4jj4xemU5qxPIu6_Wq4l4U_bnmkdx7UOE7tUT2fxqN2WlvDGKLhUDWQ8Oz7u6w7FigLYx22U7Xr5JZgRctVZZPOv9KgkuFY0dhpTzOE-uvT7KtFKeipu_nzb38ic6L75yFpKBO2GsiCuInyWvJiVWTI61sPLnKQ48oAkcl4jNIQ5ZwhwAKKSKrZdI