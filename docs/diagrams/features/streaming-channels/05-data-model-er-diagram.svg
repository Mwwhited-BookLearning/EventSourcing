ext x="671.19" y="66.618" fill="#000" font-size="14" textLength="218.032">SequenceNumber : bigint «PK»</text><line x1="652.19" y1="73.92" x2="894.222" y2="73.92" style="stroke:#181818;stroke-width:1;"/><text x="657.19" y="90.915" fill="#000" font-size="14" textLength="166.852">EventId : uuid «unique»</text><text x="657.19" y="107.212" fill="#000" font-size="14" textLength="182.314">TelemetryPointer : string?</text></g><g class="entity" data-qualified-name="GMN10" id="ent0011" data-source-line="55"><path d="M302.71,531.596 L302.71,562.936 L267.8,566.936 L302.71,570.936 L302.71,602.127 A0,0 0 0 0 302.71,602.127 L589.715,602.127 A0,0 0 0 0 589.715,602.127 L589.715,541.596 L579.715,531.596 L302.71,531.596 A0,0 0 0 0 302.71,531.596" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M579.715,531.596 L579.715,541.596 L589.715,541.596 L579.715,531.596" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="308.71" y="548.663" fill="#000" font-size="13" textLength="254.973">Composite PK (ChannelId, Timestamp).</text><text x="308.71" y="563.796" fill="#000" font-size="13" textLength="266.005">No ChainHash, no JsonSchema check, no</text><text x="308.71" y="578.928" fill="#000" font-size="13" textLength="255.366">Entity Store fold -- exactly the per-item</text><text x="308.71" y="594.061" fill="#000" font-size="13" textLength="231.442">cost this data plane exists to avoid.</text></g><g class="entity" data-qualified-name="GMN13" id="ent0014" data-source-line="62"><path d="M585.02,721.346 L585.02,912.94 A0,0 0 0 0 585.02,912.94 L961.4,912.94 A0,0 0 0 0 961.4,912.94 L961.4,731.346 L951.4,721.346 L777.21,721.346 L773.21,661.836 L769.21,721.346 L585.02,721.346 A0,0 0 0 0 585.02,721.346" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M951.4,721.346 L951.4,731.346 L961.4,731.346 L951.4,721.346" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="591.02" y="738.413" fill="#000" font-size="13" textLength="205.251">Field shape named in ADR-031.</text><text x="591.02" y="753.546" fill="#000" font-size="13" textLength="266.64">The read-time transform that substitutes</text><text x="591.02" y="768.678" fill="#000" font-size="13" textLength="283.918">zero-fill/tone/blank-frame content (Strategy</text><text x="591.02" y="783.811" fill="#000" font-size="13" textLength="330.313">"Default", per ContentKind) or a format-preserving</text><text x="591.02" y="798.944" fill="#000" font-size="13" textLength="310.051">partial reveal (Strategy "PartialReveal", reusing</text><text x="591.02" y="814.077" fill="#000" font-size="13" textLength="336.159">PartialRevealMaskingStrategy -- ADR-009) over this</text><text x="591.02" y="829.21" fill="#000" font-size="13" textLength="196.574">span is resolved in ADR-052 --</text><text x="591.02" y="844.343" fill="#000" font-size="13" textLength="355.38">see comparisons/streaming-redaction-mechanism.md.</text><text x="591.02" y="859.475" fill="#000" font-size="13" textLength="316.259">Every application also sets a sideband existence</text><text x="591.02" y="874.608" fill="#000" font-size="13" textLength="323.458">flag at the read boundary (ADR-052) -- not shown</text><text x="591.02" y="889.741" fill="#000" font-size="13" textLength="283.601">as its own column, structurally the same as</text><text x="591.02" y="904.874" fill="#000" font-size="13" textLength="221.432">TelemetrySample.LateArrivalFlag.</text></g><g class="entity" data-qualified-name="GMN16" id="ent0017" data-source-line="77"><path d="M956.26,524.026 L956.26,609.69 A0,0 0 0 0 956.26,609.69 L1308.157,609.69 A0,0 0 0 0 1308.157,609.69 L1308.157,534.026 L1298.157,524.026 L987.69,524.026 L983.69,412.576 L979.69,524.026 L956.26,524.026 A0,0 0 0 0 956.26,524.026" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1298.157,524.026 L1298.157,534.026 L1308.157,534.026 L1298.157,524.026" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="962.26" y="541.093" fill="#000" font-size="13" textLength="317.637">ThreadId groups multiple simultaneous channels</text><text x="962.26" y="556.226" fill="#000" font-size="13" textLength="276.897">registered together as one logical session/</text><text x="962.26" y="571.358" fill="#000" font-size="13" textLength="306.249">recording (e.g. a 32-electrode EEG montage) --</text><text x="962.26" y="586.491" fill="#000" font-size="13" textLength="330.897">ADR-081. No meaning of its own beyond grouping;</text><text x="962.26" y="601.624" fill="#000" font-size="13" textLength="255.373">not an EntityId, a channel, or a stream.</text></g><!--link channel to sample--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk5" data-source-line="48" data-link-type="crowfoot"><path d="M548.9,420.706 C548.9,476.106 548.9,521.936 548.9,521.936 C548.9,521.936 406.34,521.936 285.75,521.936" style="stroke:#181818;stroke-width:1;" fill="none" id="channel-sample" codeLine="48"/><line x1="544.9" y1="416.706" x2="552.9" y2="416.706" style="stroke:#181818;stroke-width:1;"/><line x1="544.9" y1="419.706" x2="552.9" y2="419.706" style="stroke:#181818;stroke-width:1;"/><line x1="548.9" y1="420.706" x2="548.9" y2="412.706" style="stroke:#181818;stroke-width:1;"/><line x1="275.75" y1="521.936" x2="267.75" y2="527.936" style="stroke:#181818;stroke-width:1;"/><line x1="275.75" y1="521.936" x2="267.75" y2="515.936" style="stroke:#181818;stroke-width:1;"/><line x1="275.75" y1="521.936" x2="267.75" y2="521.936" style="stroke:#181818;stroke-width:1;"/><ellipse cx="281.75" cy="521.936" rx="4" ry="4" fill="none" style="stroke:#181818;stroke-width:1;"/><text x="252.242" y="503.003" fill="#000" font-size="13" textLength="132.292">ChannelId -- real FK,</text><text x="173.94" y="518.136" fill="#000" font-size="13" textLength="288.895">every sample belongs to a declared channel</text></g><!--link channel to redaction--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk6" data-source-line="49" data-link-type="crowfoot">