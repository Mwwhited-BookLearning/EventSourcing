le="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="551.569" y1="144.563" x2="1167.513" y2="144.563" style="stroke:#181818;stroke-width:1;"/><text x="558.569" y="139.497" fill="#000" font-size="13" font-weight="700">2</text><text x="571.614" y="139.497" fill="#000" font-size="13" textLength="535.666">SELECT TelemetrySample WHERE ChannelId = 'eeg-ch1' AND Timestamp >= &lt;t></text><polygon points="1161.513,184.828,1171.513,188.828,1161.513,192.828,1165.513,188.828" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="551.569" y1="188.828" x2="1167.513" y2="188.828" style="stroke:#181818;stroke-width:1;"/><text x="558.569" y="176.196" fill="#000" font-size="13" font-weight="700">3</text><text x="571.614" y="168.629" fill="#000" font-size="13" textLength="357.018">SELECT RedactedRange WHERE ChannelId = 'eeg-ch1'</text><text x="571.614" y="183.762" fill="#000" font-size="13" textLength="429.698">AND [FromTimestamp, ToTimestamp] overlaps requested window</text><polygon points="562.569,213.961,552.569,217.961,562.569,221.961,558.569,217.961" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="556.569" y1="217.961" x2="1172.513" y2="217.961" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="568.569" y="212.895" fill="#000" font-size="13" font-weight="700">4</text><text x="581.614" y="212.895" fill="#000" font-size="13" textLength="584.898">overlapping RedactedRange { FromTimestamp, ToTimestamp, RequiredClaim, Strategy }</text><polygon points="912.551,243.094,922.551,247.094,912.551,251.094,916.551,247.094" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="551.569" y1="247.094" x2="918.551" y2="247.094" style="stroke:#181818;stroke-width:1;"/><text x="558.569" y="242.028" fill="#000" font-size="13" font-weight="700">5</text><text x="571.614" y="242.028" fill="#000" font-size="13" textLength="335.937">does Follower hold RedactedRange.RequiredClaim?</text><path d="M26.391,259.094 L90.834,259.094 L90.834,266.227 L80.834,276.227 L26.391,276.227 L26.391,259.094" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="26.391" y="259.094" width="1332.425" height="341.797" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="41.391" y="272.161" fill="#000" font-size="13" textLength="19.443" font-weight="700">alt</text><text x="105.834" y="271.304" fill="#000" font-size="11" textLength="161.836" font-weight="700">[Follower holds the claim]</text><polygon points="562.569,303.359,552.569,307.359,562.569,311.359,558.569,307.359" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="556.569" y1="307.359" x2="923.551" y2="307.359" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="568.569" y="302.293" fill="#000" font-size="13" font-weight="700">6</text><text x="581.614" y="302.293" fill="#000" font-size="13" textLength="161.319">authorized for this range</text><polygon points="53.391,347.625,43.391,351.625,53.391,355.625,49.391,351.625" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="47.391" y1="351.625" x2="550.569" y2="351.625" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="59.391" y="338.993" fill="#000" font-size="13" font-weight="700">7</text><text x="72.437" y="331.426" fill="#000" font-size="13" textLength="251.964">real sample values for the full window,</text><text x="72.437" y="346.559" fill="#000" font-size="13" textLength="227.398">including the RedactedRange span</text><line x1="26.391" y1="360.625" x2="1358.816" y2="360.625" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="31.391" y="372.835" fill="#000" font-size="11" textLength="159.833" font-weight="700">[Follower lacks the claim]</text><polygon points="562.569,395.563,552.569,399.563,562.569,403.563,558.569,399.563" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="556.569" y1="399.563" x2="923.551" y2="399.563" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="568.569" y="394.497" fill="#000" font-size="13" font-weight="700">8</text><text x="581.614" y="394.497" fill="#000" font-size="13" textLength="186.742">not authorized for this range</text><polygon points="1330.816,470.094,1340.816,474.094,1330.816,478.094,1334.816,474.094" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="551.569" y1="474.094" x2="1336.816" y2="474.094" style="stroke:#181818;stroke-width:1;"/><text x="558.569" y="446.329" fill="#000" font-size="13" font-weight="700">9</text><text x="571.614" y="423.629" fill="#000" font-size="13" textLength="322.874">resolve the configured IStreamRedactionStrategy</text><text x="571.614" y="438.762" fill="#000" font-size="13" textLength="508.352">(Strategy == "Default" -> ZeroFillStrategy/ToneStrategy/BlankFrameStrategy</text><text x="571.614" y="453.895" fill="#000" font-size="13" textLength="364.99">per ContentKind; Strategy == "PartialReveal" -> reuses</text><text x="571.614" y="469.028" fill="#000" font-size="13" textLength="469.066">PartialRevealMaskingStrategy's reveal computation, ADR-009/ADR-052)</text><polygon points="562.569,514.359,552.569,518.359,562.569,522.359,558.569,518.359" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="556.569" y1="518.359" x2="1341.816" y2="518.359" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="568.569" y="505.727" fill="#000" font-size="13" textLength="18.091" font-weight="700">10</text><text x="590.66" y="498.161" fill="#000" font-size="13" textLength="335.207">substituted bytes for the RedactedRange span only</text><text x="590.66" y="513.293" fill="#000" font-size="13" textLength="340.685">(samples outside the span are returned unmodified)</text><polygon points="53.391,588.891,43.391,592.891,53.391,596.891,49.391,592.891" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="47.391" y1="592.891" x2="550.569" y2="592.891" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="59.391" y="565.125" fill="#000" font-size="13" textLength="18.091" font-weight="700">11</text><text x="81.482" y="542.426" fill="#000" font-size="13" textLength="359.004">samples for the window, with the RedactedRange span</text><text x="81.482" y="557.559" fill="#000" font-size="13" textLength="410.795">replaced by the substitution AND a sideband existence flag set</text><text x="81.482" y="572.692" fill="#000" font-size="13" textLength="342.723">(same shape as TelemetrySample.LateArrivalFlag) --</text><text x="81.482" y="587.825" fill="#000" font-size="13" textLength="463.087">never a response indistinguishable from "no redaction happened here"</text><?plantuml-src ZLHDRnCn4BtlhnZbGAb8ceB4WK1IfMa2XOAg958b20VlUfAruhMt_aW9YF_EUB_8bhRYjF9w_ERDcpV3lDFAPp6QY2LE6-ZCj9Jw3aq7c8LrTOXoPfn8HCwKWyuI9MRep1xco3YCho-BO4E7Tk3OktIbdd-yMS8vCeC6Na0YcSWWIJ7P7XVF60L5d3aMCuk7u0lYWqM8ut4R-7BXA5isHqwiXLPqP0utUqeslfZtJb-_Ah5jzJ-AwagWDog83k3zT0bzLsVh8svwIVgoRrcMIxHdcUOuD9XBjd-sDZfRYWojeylXEpUA0aI08cO3M4olffCbDCmN1GJSV9ZEfp19cL8eBpaCuQXASWJZBnVG8C9e28-1bYKYdpErUH9ofGBcjzaXrIuiTNFu3dg7Hh8yTEhMqq_aS2SKrtSHPOHUeqmLbmkrkPV_5poEtwNOMoyCyabeSHVgfi3lfhBGwm5mZHPgdq6g9M-dEMa1dKLCkdOuEIB5qaaH5A07xCDH6_6JgbkJeLqggE00Iw4b3mgjxJ08loIKJOSTawHBzGnXxQMi5Egkb529z3ne4kxQkbYoPOII_Dlmb2pPFibJQVSVN4UDXmDLg-KEIr2jrcBZIIHuOXYQ5Wo7qBd0DVFITGBeLpHw9gIi0_fBhR0vd4kcjZF3CloBbLDD4wqSAlU997aBBUphC9rCpd57SdRA8VCMxKgrRZupkoK5wwT7mOhXFvMJvTwnGByBnGYVlkdNeqnYr28Sw6TzR9rmFjWuthk3lltR6z1A1ZsguGRjdHMyLBAuf-L4iCuRHMXUqV2BjK1-_B1dQfWwOUKH-bA77sQmKiKkIGgoPTwQFzLSx0C6WLFC50Vy8MWyLK8Ub6m35br9dbwbBCUmskvjcvChqcTiZ20Fp-ZDCL5UqPQWKIPWSawk5TcJY18ojS0BGeh9ys6tGKTfYgd