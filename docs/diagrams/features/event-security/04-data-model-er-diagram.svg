288.23,169.1" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M760.057,169.1 L760.057,179.1 L770.057,179.1 L760.057,169.1" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="294.23" y="186.167" fill="#000" font-size="13" textLength="460.827">RequiredClaims generalizes RequiredPublishClaim/RequiredReadClaim</text><text x="294.23" y="201.3" fill="#000" font-size="13" textLength="405.501">from one fixed claim per direction to a list (ADR-050). Multiple</text><text x="294.23" y="216.433" fill="#000" font-size="13" textLength="399.636">entries for the same Direction are OR'ed by default -- holding</text><text x="294.23" y="231.565" fill="#000" font-size="13" textLength="416.222">ANY ONE of them satisfies the gate; ADR-008's original "exactly</text><text x="294.23" y="246.698" fill="#000" font-size="13" textLength="342.602">one claim per direction" limitation no longer applies.</text></g><!--link etd to rc--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk4" data-source-line="26" data-link-type="crowfoot"><path d="M528.14,106.64 C528.14,136.8 528.14,162.67 528.14,162.67 C528.14,162.67 388.48,162.67 271.62,162.67" style="stroke:#181818;stroke-width:1;" fill="none" id="etd-rc" codeLine="26"/><line x1="524.14" y1="102.64" x2="532.14" y2="102.64" style="stroke:#181818;stroke-width:1;"/><line x1="524.14" y1="105.64" x2="532.14" y2="105.64" style="stroke:#181818;stroke-width:1;"/><line x1="528.14" y1="106.64" x2="528.14" y2="98.64" style="stroke:#181818;stroke-width:1;"/><line x1="261.62" y1="162.67" x2="253.62" y2="168.67" style="stroke:#181818;stroke-width:1;"/><line x1="261.62" y1="162.67" x2="253.62" y2="156.67" style="stroke:#181818;stroke-width:1;"/><line x1="261.62" y1="162.67" x2="253.62" y2="162.67" style="stroke:#181818;stroke-width:1;"/><ellipse cx="267.62" cy="162.67" rx="4" ry="4" fill="none" style="stroke:#181818;stroke-width:1;"/><text x="423.9" y="158.737" fill="#000" font-size="13" textLength="368.558">(Na