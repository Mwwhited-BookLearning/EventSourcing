t-size="14" textLength="72.782">(ADR-068)</text><text x="1356.75" y="827.675" fill="#000" font-size="14" textLength="69.809">Event Log</text><path d="M1376.654,840.977 C1376.654,830.977 1394.654,830.977 1394.654,830.977 C1394.654,830.977 1412.654,830.977 1412.654,840.977 L1412.654,866.977 C1412.654,876.977 1394.654,876.977 1394.654,876.977 C1394.654,876.977 1376.654,876.977 1376.654,866.977 L1376.654,840.977" style="stroke:#181818;stroke-width:0.5;" fill="#E2E2F0"/><path d="M1376.654,840.977 C1376.654,850.977 1394.654,850.977 1394.654,850.977 C1394.654,850.977 1412.654,850.977 1412.654,840.977" style="stroke:#181818;stroke-width:0.5;" fill="none"/><polygon points="568.194,141.695,578.194,145.695,568.194,149.695,572.194,145.695" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="111.089" y1="145.695" x2="574.194" y2="145.695" style="stroke:#181818;stroke-width:1;"/><text x="118.089" y="125.497" fill="#000" font-size="13" font-weight="700">1</text><text x="131.134" y="110.364" fill="#000" font-size="13" textLength="200.586">QUERY { icsrSystemTimeAsOf(</text><text x="139.399" y="125.497" fill="#000" font-size="13" textLength="423.795">entityId: "pv:IcsrCase:icsr-2031", asOfSequenceNumber: 4102) {</text><text x="139.399" y="140.629" fill="#000" font-size="13" textLength="347.217">sequenceNumber occurredAt lateArrivalFlag data } }</text><polygon points="871.758,170.828,881.758,174.828,871.758,178.828,875.758,174.828" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="580.194" y1="174.828" x2="877.758" y2="174.828" style="stroke:#181818;stroke-width:1;"/><text x="587.194" y="169.762" fill="#000" font-size="13" font-weight="700">2</text><text x="600.239" y="169.762" fill="#000" font-size="13" textLength="232.445">reconstruct(entityId, cutoff = 4102)</text><polygon points="1382.654,245.359,1392.654,249.359,1382.654,253.359,1386.654,249.359" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="883.758" y1="249.359" x2="1388.654" y2="249.359" style="stroke:#181818;stroke-width:1;"/><text x="890.758" y="221.594" fill="#000" font-size="13" font-weight="700">3</text><text x="903.804" y="198.895" fill="#000" font-size="13" textLength="185.936">SELECT * FROM StoredEvent</text><text x="903.804" y="214.028" fill="#000" font-size="13" textLength="273.647">WHERE EntityId = "pv:IcsrCase:icsr-2031"</text><text x="903.804" y="229.161" fill="#000" font-size="13" textLength="212.24">AND SequenceNumber &lt;= 4102</text><text x="903.804" y="244.293" fill="#000" font-size="13" textLength="187.992">ORDER BY SequenceNumber</text><polygon points="894.758,319.891,884.758,323.891,894.758,327.891,890.758,323.891" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="888.758" y1="323.891" x2="1393.654" y2="323.891" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="900.758" y="296.125" fill="#000" font-size="13" font-weight="700">4</text><text x="913.804" y="273.426" fill="#000" font-size="13" textLength="293.731">[ IcsrReported(seq=4088, OccurredAt=Jan 3,</text><text x="930.333" y="288.559" fill="#000" font-size="13" textLength="185.828">Seriousness="non-serious"),</text><text x="922.068" y="303.692" fill="#000" font-size="13" textLength="283.607">IcsrFollowUp(seq=4102, OccurredAt=Jan 2,</text><text x="930.333" y="318.825" fill="#000" font-size="13" textLength="305.69">LateArrivalFlag=true, Seriousness="serious") ]</text><path d="M848.758,335.891 L925.382,335.891 L925.382,343.023 L915.382,353.023 L848.758,353.023 L848.758,335.891" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="848.758" y="335.891" width="479.991" height="240.328" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="863.758" y="348.958" fill="#000" font-size="13" textLength="31.624" font-weight="700">loop</text><text x="940.382" y="348.101" fill="#000" font-size="11" textLength="372.367" font-weight="700">[for each event, strictly in SequenceNumber (arrival) order]</text><line x1="883.758" y1="399.289" x2="925.758" y2="399.289" style="stroke:#181818;stroke-width:1;"/><line x1="925.758" y1="399.289" x2="925.758" y2="412.289" style="stroke:#181818;stroke-width:1;"/><line x1="884.758" y1="412.289" x2="925.758" y2="412.289" style="stroke:#181818;stroke-width:1;"/><polygon points="894.758,408.289,884.758,412.289,894.758,416.289,890.758,412.289" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="890.758" y="386.657" fill="#000" font-size="13" font-weight="700">5</text><text x="903.804" y="379.09" fill="#000" font-size="13" textLength="210.203">apply verbatim -- no OccurredAt</text><text x="903.804" y="394.223" fill="#000" font-size="13" textLength="220.968">re-ordering, unlike ADR-029's fold</text><path d="M867.758,424.289 L932.201,424.289 L932.201,431.422 L922.201,441.422 L867.758,441.422 L867.758,424.289" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="867.758" y="424.289" width="346.423" height="137.93" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="882.758" y="437.356" fill="#000" font-size="13" textLength="19.443" font-weight="700">alt</text><text x="947.201" y="436.5" fill="#000" font-size="11" textLength="233.546" font-weight="700">[event carries LateArrivalFlag = true]</text><path d="M888.758,456.422 L888.758,556.422 L1192.758,556.422 L1192.758,466.422 L1182.758,456.422 L888.758,456.422" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1182.758,456.422 L1182.758,466.422 L1192.758,466.422 L1182.758,456.422" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="894.758" y="473.489" fill="#000" font-size="13" textLength="268.88">The correction (Seriousness -> "serious")</text><text x="894.758" y="488.622" fill="#000" font-size="13" textLength="272.295">lands IN PLACE, right here at seq=4102 --</text><text x="894.758" y="503.754" fill="#000" font-size="13" textLength="240.76">even though its OccurredAt (Jan 2) is</text><text x="894.758" y="518.887" fill="#000" font-size="13" textLength="273">earlier than the seq=4088 event's. This is</text><text x="894.758" y="534.02" fill="#000" font-size="13" textLength="283.423">what the reviewer actually saw at the time,</text><text x="894.758" y="549.153" fill="#000" font-size="13" textLength="204.813">not the hindsight-clean picture.</text><path d="M888.758,595.219 L888.758,665.219 L1272.758,665.219 L1272.758,605.219 L1262.758,595.219 L888.758,595.219" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1262.758,595.219 L1262.758,605.219 L1272.758,605.219 L1262.758,595.219" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="894.758" y="612.286" fill="#000" font-size="13" textLength="290.247">Same masking/RequiredClaims enforcement</text><text x="894.758" y="627.418" fill="#000" font-size="13" textLength="363.53">(ADR-008/ADR-009/ADR-050) and AccessLogEntry write</text><text x="894.758" y="642.551" fill="#000" font-size="13" textLength="292.633">(ADR-045) as any other read -- no bypass for</text><text x="894.758" y="657.684" fill="#000" font-size="13" textLength="188.024">a playback query (ADR-068).</text><polygon points="591.194,718.148,581.194,722.148,591.194,726.148,587.194,722.148" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="585.194" y1="722.148" x2="882.758" y2="722.148" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="597.194" y="701.95" fill="#000" font-size="13" font-weight="700">6</text><text x="610.239" y="686.817" fill="#000" font-size="13" textLength="159.586">stepwise reconstruction,</text><text x="610.239" y="701.95" fill="#000" font-size="13" textLength="226.021">one position per SequenceNumber</text><text x="610.239" y="717.083" fill="#000" font-size="13" textLength="266.519">(VCR play/rewind/fast-forward, ADR-068)</text><polygon points="122.089,792.68,112.089,796.68,122.089,800.68,118.089,796.68" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="116.089" y1="796.68" x2="579.194" y2="796.68" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="128.089" y="768.915" fill="#000" font-size="13" font-weight="700">7</text><text x="141.134" y="746.215" fill="#000" font-size="13" textLength="314.799">[ { sequenceNumber: 4088, occurredAt: "Jan 3",</text><text x="157.664" y="761.348" fill="#000" font-size="13" textLength="395.529">lateArrivalFlag: false, data: { Seriousness: "non-serious" } },</text><text x="149.399" y="776.481" fill="#000" font-size="13" textLength="305.595">{ sequenceNumber: 4102, occurredAt: "Jan 2",</text><text x="157.664" y="791.614" fill="#000" font-size="13" textLength="367.231">lateArrivalFlag: true, data: { Seriousness: "serious" } } ]</text><?plantuml-src TLHTZzeu57tFhxZYfL31GEcqcg9b9PR9jBDYXpPCjwfA7unpGwmnTcex83JgV--rammVxI114d9zpht7nuULJgjoiq8JCUwqWLQ2wr8oVzk71SlGxI71hS0TcXOm2wnC1RsD2cQSuA9Woa7hlM55_ca67vXAPLsOL_UdXOkzTRZftOiDmaV9zYl67mZVQhb5irJjoNNI6xozwWI4eYw8KkROYbc4Lhn5WfdfTIX0_qGFKLHt1Rs_6zuHVFeS9r_X4GItfkBrj1CxpzfB1K1BXTlVfYDe5TlHBHLDYMBagtl3mUjNhIvHpBC5_YXHSRmBAetWyjLWs857Zs1FNe7cl3G6qua34X0dneWjapUIhS4F03_XPrGtv_jifXk1GQwLTQRahjrqrGLEMvDbCAuOewRSBstc7i4YdiNJUtW9DydyFrYG19W6ZPRgouSuYI6kyGZdcJ6NQd9t3QTZmbyLxLBDa-iuWN--dXL4JGlGEndb6tY610jj7APjKcXyERYwwiByIPpnlqp1wwuN40ZL25rQXTQEMqghdgt-Q7L2WGUxqLBgtUUY0gEcVWCRrc2pKzN7f2XsJocUuE5x9BKk82FJ8EDvfMaNQ1i4Tt8FGfrhqcOLTWUqIKa2WECzEMZ0YeBMavzNp8aD2GHA7xMyL0Px0K6eTHTA9SK3GZ3-yDqBInt9bB2PT5LFm3qlslFnQ4VzW96VN6c7OCGwTw2pmxc1yBdF4RWcSkw4Lj0-4iGtVj2ahfVaKGktT_1nDfd6tHetHuF073IxG7FLzRvBSBakrpa8Puz6XNROdWu8szGo8mLfwUWWq0z2uv1grXVsWjeLzh1WbnEdBpHr207bLCaaAMpP3kgNf3DswnMaHVWl5pI6Rxt79H9RGVjQ6hm8PQZI85eKRYF_VLR31QEmsZ3xGFlLJyWJWeQRIYOsb42A3CHnGxrJPHLVWwj-TNrNNTyCEa2ImeHpafpE39r9iuUT4O6_MdJvfXFILUr1K_U6vcLfxPtLlc3M6yD