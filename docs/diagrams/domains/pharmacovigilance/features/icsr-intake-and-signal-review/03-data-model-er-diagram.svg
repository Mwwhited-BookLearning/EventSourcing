ext x="251.51" y="322.94" fill="#000" font-size="13" textLength="229.982">moment IcsrReported is received --</text><text x="251.51" y="338.073" fill="#000" font-size="13" textLength="285.27">AuthorityStatus "pending_review", wrapped</text><text x="251.51" y="353.205" fill="#000" font-size="13" textLength="271.166">isAuthoritative:false at the query surface.</text></g><g class="entity" data-qualified-name="GMN11" id="ent0012" data-source-line="50"><path d="M893.87,290.74 L893.87,321.75 L859.28,325.75 L893.87,329.75 L893.87,361.271 A0,0 0 0 0 893.87,361.271 L1191.425,361.271 A0,0 0 0 0 1191.425,361.271 L1191.425,300.74 L1181.425,290.74 L893.87,290.74 A0,0 0 0 0 893.87,290.74" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1181.425,290.74 L1181.425,300.74 L1191.425,300.74 L1181.425,290.74" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="899.87" y="307.807" fill="#000" font-size="13" textLength="276.555">The SAME EntityId only appears here once</text><text x="899.87" y="322.94" fill="#000" font-size="13" textLength="252.484">an authorityDecision{accepted} event</text><text x="899.87" y="338.073" fill="#000" font-size="13" textLength="252.846">brings AuthorityStatus to "accepted" --</text><text x="899.87" y="353.205" fill="#000" font-size="13" textLength="272.016">a rejected case never appears here at all.</text></g><!--link event to parent--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk5" data-source-line="39" data-link-type="dependency"><path d="M983.14,109.75 C1148.16,109.75 1330.65,109.75 1330.65,109.75 C1330.65,109.75 1330.65,221.38 1330.65,283.34" style="stroke:#181818;stroke-width:1;" fill="none" id="event-to-parent" codeLine="39"/><polygon points="1330.65,288.34,1334.65,279.34,1330.65,283.34,1326.65,279.34,1330.65,288.34" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1072.826" y="60.817" fill="#000" font-size="13" textLength="112.792">an IcsrFollowUp's</text><text x="1036.708" y="75.95" fill="#000" font-size="13" textLength="185.028">ParentEventId = the original</text><text x="1013.19" y="91.083" fill="#000" font-size="13" textLength="232.064">IcsrReported's EventId (ADR-005) --</text><text x="1039.358" y="106.215" fill="#000" font-size="13" textLength="179.728">a causal DAG, never a copy</text><text x="990.996" y="106.6" fill="#000" font-size="13">1</text><text x="1304.584" y="277.374" fill="#000" font-size="13" textLength="24.807">0..1</text></g><!--link event to live--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk6" data-source-line="40" data-link-type="dependency"><path d="M507.12,212.74 C507.12,249.39 507.12,281.75 507.12,281.75 C507.12,281.75 333.81,281.75 215.74,281.75" style="stroke:#181818;stroke-width:1;" fill="none" id="event-to-live" codeLine="40"/><polygon points="210.74,281.75,219.74,285.75,215.74,281.75,219.74,277.75,210.74,281.75" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="243.44" y="262.817" fill="#000" font-size="13" textLength="149.633">folds into immediately,</text><text x="252.438" y="277.95" fill="#000" font-size="13" textLength="131.638">gate-free (ADR-042)</text><text x="486.455" y="232.243" fill="#000" font-size="13">*</text><text x="218.209" y="275.182" fill="#000" font-size="13">1</text></g><!--link event to auth--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk7" data-source-line="41" data-link-type="dependency"><path d="M722.65,212.75 C722.65,233.21 722.65,248.92 722.65,266.93" style="stroke:#181818;stroke-width:1;" fill="none" id="event-to-auth" codeLine="41"/><polygon points="722.65,271.93,726.65,262.93,722.65,266.93,718.65,262.93,722.65,271.93" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="734.774" y="255.407" fill="#000" font-size="13" textLength="134.945">folds into ONLY once</text><text x="723.6