<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:1142px;height:628px;background:#FFFFFF;" width="1142px" height="628px" viewBox="0 0 1142 628" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="entity" data-qualified-name="Raised" id="ent0001" data-source-line="3"><rect x="746.39" y="95.39" width="380.746" height="68.891" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="746.39" y1="154.281" x2="1127.136" y2="154.281" style="stroke:#181818;stroke-width:0.5;"/><text x="756.39" y="113.385" fill="#000" font-size="14" textLength="46.99">Raised</text><text x="756.39" y="129.682" fill="#000" font-size="14" textLength="203.055">(AuthorityStatus: accepted --</text><text x="756.39" y="145.979" fill="#000" font-size="14" textLength="360.746">high-confidence detector publish, ADR-042 default)</text></g><g class="entity" data-qualified-name="PendingReview" id="ent0002" data-source-line="4"><rect x="7" y="87.24" width="285.535" height="85.188" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="7" y1="162.428" x2="292.535" y2="162.428" style="stroke:#181818;stroke-width:0.5;"/><text x="17" y="105.235" fill="#000" font-size="14" textLength="107.044">PendingReview</text><text x="17" y="121.532" fill="#000" font-size="14" textLength="249.108">(AuthorityStatus: pending_review --</text><text x="17" y="137.829" fill="#000" font-size="14" textLength="228.648">low-confidence detector publish,</text><text x="17" y="154.126" fill="#000" font-size="14" textLength="265.535">review-pending marker set, ADR-042)</text></g><g class="entity" data-qualified-name="Accepted" id="ent0003" data-source-line="5"><rect x="260.35" y="264.67" width="330.837" height="68.891" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="260.35" y1="323.561" x2="591.187" y2="323.561" style="stroke:#181818;stroke-width:0.5;"/><text x="270.35" y="282.665" fill="#000" font-size="14" textLength="65.461">Accepted</text><text x="270.35" y="298.962" fill="#000" font-size="14" textLength="250.031">(authoritative Entity Store updated,</text><text x="270.35" y="315.259" fill="#000" font-size="14" textLength="310.837">ADR-042 catch-up; webhook fires, ADR-060)</text></g><g class="entity" data-qualified-name="Dismissed" id="ent0004" data-source-line="6"><rect x="47.79" y="363.56" width="263.947" height="68.891" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="47.79" y1="422.451" x2="311.737" y2="422.451" style="stroke:#181818;stroke-width:0.5;"/><text x="57.79" y="381.555" fill="#000" font-size="14" textLength="71.579">Dismissed</text><text x="57.79" y="397.852" fill="#000" font-size="14" textLength="196.15">(AuthorityStatus: rejected --</text><text x="57.79" y="414.149" fill="#000" font-size="14" textLength="243.947">authorityDecision event, ADR-035)</text></g><g class="entity" data-qualified-name="WorkOrderDispatched" id="ent0005" data-source-line="7"><rect x="254.48" y="462.45" width="326.578" height="68.891" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="254.48" y1="521.341" x2="581.058" y2="521.341" style="stroke:#181818;stroke-width:0.5;"/><text x="264.48" y="480.445" fill="#000" font-size="14" textLength="155.292">WorkOrderDispatched</text><text x="264.48" y="496.742" fill="#000" font-size="14" textLength="225.723">(app-specific downstream state,</text><text x="264.48" y="513.039" fill="#000" font-size="14" textLength="306.578">CMMS/ERP-owned, out of framework scope)</text></g><g class="start_entity" data-qualified-name=".start." id="ent0006" data-source-line="1"><ellipse cx="936.77" cy="16" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="end_entity" data-qualified-name=".end." id="ent0012" data-source-line="13"><ellipse cx="214.77" cy="603.34" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="214.77" cy="603.34" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN15" id="ent0016" data-source-line="17"><path d="M327.85,87 L327.85,125.84 L292.85,129.84 L327.85,133.84 L327.85,172.664 A0,0 0 0 0 327.85,172.664 L711.682,172.664 A0,0 0 0 0 711.682,172.664 L711.682,97 L701.682,87 L327.85,87 A0,0 0 0 0 327.85,87" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M701.682,87 L701.682,97 L711.682,97 L701.682,87" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="333.85" y="104.067" fill="#000" font-size="13" textLength="300.625">Never blocks the Event Log write (ADR-023) --</text><text x="333.85" y="119.2" fill="#000" font-size="13" textLength="309.258">this state only gates the AUTHORITATIVE Entity</text><text x="333.85" y="134.333" fill="#000" font-size="13" textLength="362.832">Store fold and the webhook match (ADR-042/ADR-060).</text><text x="333.85" y="149.465" fill="#000" font-size="13" textLength="327.761">The Live View reflects Raised/PendingReview data</text><text x="333.85" y="164.598" fill="#000" font-size="13" textLength="352.898">immediately either way, labeled isAuthoritative: false.</text></g><!--link *start* to Raised--><g class="link" data-entity-1="ent0006" data-entity-2="ent0001" id="lnk7" data-source-line="1" data-link-type="dependency"><path d="M936.77,26.16 C936.77,41.02 936.77,66.15 936.77,89.95" style="stroke:#181818;stroke-width:1;" fill="none" id="*start*-to-Raised"/><polygon points="936.77,94.95,940.77,85.95,936.77,89.95,932.77,85.95,936.77,94.95" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Raised to Accepted--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk8" data-source-line="9" data-link-type="dependency"><path d