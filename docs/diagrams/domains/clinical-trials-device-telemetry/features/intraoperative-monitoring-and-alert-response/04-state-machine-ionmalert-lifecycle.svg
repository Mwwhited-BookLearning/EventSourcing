roke-miterlimit:10;"/><text x="74.02" y="382.754" fill="#000" font-size="13" textLength="280.877">IonmAlertAcknowledged within the window</text></g><!--link AwaitingAck to Escalated--><g class="link" data-entity-1="ent0007" data-entity-2="ent0011" id="lnk12" data-source-line="8" data-link-type="dependency"><path d="M133.41,278.258 C188.13,296.028 275.53,325.118 350.02,353.188 C354.51,354.878 354.526,354.846 359.166,356.696" style="stroke:#181818;stroke-width:1;" fill="none" id="AwaitingAck-to-Escalated"/><polygon points="363.81,358.548,356.931,351.499,359.166,356.696,353.969,358.93,363.81,358.548" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="364.126" y="316.254" fill="#000" font-size="13" textLength="201.76">deadline elapses with no ack --</text><text x="299.78" y="331.387" fill="#000" font-size="13" textLength="330.453">ExpectedResponseMissing published, exactly once</text></g><!--link Escalated to Acknowledged--><g class="link" data-entity-1="ent0011" data-entity-2="ent0009" id="lnk13" data-source-line="9" data-link-type="dependency"><path d="M363.81,397.828 C359.17,399.678 354.51,401.498 350.02,403.188 C279.12,429.908 201.284,455.998 146.294,473.918" style="stroke:#181818;stroke-width:1;" fill="none" id="Escalated-to-Acknowledged"/><polygon points="141.54,475.468,151.336,476.482,146.294,473.918,148.858,468.876,141.54,475.468" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="333.902" y="434.254" fill="#000" font-size="13" textLength="226.135">a late IonmAlertAcknowledged still</text><text x="299.78" y="449.387" fill="#000" font-size="13" textLength="294.379">arrives -- recorded, never an error (ADR-094)</text></g></g><g class="entity" data-qualified-name="Accepted" id="ent0002" data-source-line="15"><rect x="42.66" y="634.33" width="249.913" height="85.188" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="42.66" y1="660.627" x2="292.573" y2="660.627" style="stroke:#181818;stroke-width:0.5;"/><text x="134.886" y="652.325" fill="#000" font-size="14" textLength="65.461">Accepted</text><text x="47.66" y="678.622" fill="#000" font-size="14" textLength="194.503">AuthorityStatus = accepted</text><text x="47.66" y="694.919" fill="#000" font-size="14" textLength="197.285">folded into the authoritative</text><text x="47.66" y="711.216" fill="#000" font-size="14" textLength="229.913">Entity Store (catch-up, ADR-042)</text></g><g class="entity" data-qualified-name="Rejected" id="ent0003" data-source-line="19"><rect x="327.52" y="626.19" width="346.184" height="101.484" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="327.52" y1="652.487" x2="673.704" y2="652.487" style="stroke:#181818;stroke-width:0.5;"/><text x="469.847" y="644.185" fill="#000" font-size="14" textLength="61.53">Rejected</text><text x="332.52" y="670.482" fill="#000" font-size="14" textLength="187.599">AuthorityStatus = rejected</text><text x="332.52" y="686.779" fill="#000" font-size="14" textLength="222.264">never reaches the authoritative</text><text x="332.52" y="703.076" fill="#000" font-size="14" textLength="232.415">Entity Store -- stays visible in the</text><text x="332.52" y="719.373" fill="#000" font-size="14" textLength="326.184">Event Log and Live View, re-labeled "rejected"</text></g><g class="start_entity" data-qualified-name=".start." id="ent0004" data-source-line="1"><ellipse cx="333.62" cy="16" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="end_entity" data-qualified-name=".end." id="ent0016" data-source-line="17"><ellipse cx="333.62" cy="799.67" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="333.62" cy="799.67" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN19" id="ent0020" data-source-line="24"><path d="M694.84,260.19 L694.84,306.59 L66