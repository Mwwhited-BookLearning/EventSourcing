y="480.847" fill="#000" font-size="14" textLength="180.701">EncryptedFieldIndexEntry</text><text x="816.421" y="497.144" fill="#000" font-size="14" textLength="72.782">(ADR-096)</text><path d="M837.812,510.445 C837.812,500.445 855.812,500.445 855.812,500.445 C855.812,500.445 873.812,500.445 873.812,510.445 L873.812,536.445 C873.812,546.445 855.812,546.445 855.812,546.445 C855.812,546.445 837.812,546.445 837.812,536.445 L837.812,510.445" style="stroke:#181818;stroke-width:0.5;" fill="#E2E2F0"/><path d="M837.812,510.445 C837.812,520.445 855.812,520.445 855.812,520.445 C855.812,520.445 873.812,520.445 873.812,510.445" style="stroke:#181818;stroke-width:0.5;" fill="none"/><text x="959.163" y="480.847" fill="#000" font-size="14" textLength="82.633">Entity Store</text><path d="M985.479,494.148 C985.479,484.148 1003.479,484.148 1003.479,484.148 C1003.479,484.148 1021.479,484.148 1021.479,494.148 L1021.479,520.148 C1021.479,530.148 1003.479,530.148 1003.479,530.148 C1003.479,530.148 985.479,530.148 985.479,520.148 L985.479,494.148" style="stroke:#181818;stroke-width:0.5;" fill="#E2E2F0"/><path d="M985.479,494.148 C985.479,504.148 1003.479,504.148 1003.479,504.148 C1003.479,504.148 1021.479,504.148 1021.479,494.148" style="stroke:#181818;stroke-width:0.5;" fill="none"/><polygon points="465.231,173.125,475.231,177.125,465.231,181.125,469.231,177.125" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="97.038" y1="177.125" x2="471.231" y2="177.125" style="stroke:#181818;stroke-width:1;"/><text x="104.038" y="149.36" fill="#000" font-size="13" font-weight="700">1</text><text x="117.083" y="126.661" fill="#000" font-size="13" textLength="271.077">subscription { on_trial1_PatientScreened(</text><text x="125.348" y="141.793" fill="#000" font-size="13" textLength="334.883">where: [{ field: "LegalName", eq: "Jordan Reyes" },</text><text x="158.406" y="156.926" fill="#000" font-size="13" textLength="293.503">{ field: "DateOfBirth", eq: "1988-04-02" }]) {</text><text x="125.348" y="172.059" fill="#000" font-size="13" textLength="123.709">subjectId siteId } }</text><polygon points="843.812,232.523,853.812,236.523,843.812,240.523,847.812,236.523" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="477.231" y1="236.523" x2="849.812" y2="236.523" style="stroke:#181818;stroke-width:1;"/><text x="484.231" y="216.325" fill="#000" font-size="13" font-weight="700">2</text><text x="497.276" y="201.192" fill="#000" font-size="13" textLength="302.98">resolve matching SequenceNumbers for BOTH</text><text x="497.276" y="216.325" fill="#000" font-size="13" textLength="341.536">clauses (AND-combined, ADR-096) -- never decrypts</text><text x="497.276" y="231.458" fill="#000" font-size="13" textLength="129.924">Payload to compare</text><polygon points="488.231,261.656,478.231,265.656,488.231,269.656,484.231,265.656" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="482.231" y1="265.656" x2="854.812" y2="265.656" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="494.231" y="260.59" fill="#000" font-size="13" font-weight="700">3</text><text x="507.276" y="260.59" fill="#000" font-size="13" textLength="243.096">matching SequenceNumber(s), if any</text><polygon points="991.479,290.789,1001.479,294.789,991.479,298.789,995.479,294.789" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="477.231" y1="294.789" x2="997.479" y2="294.789" style="stroke:#181818;stroke-width:1;"/><text x="484.231" y="289.723" fill="#000" font-size="13" font-weight="700">4</text><text x="497.276" y="289.723" fill="#000" font-size="13" textLength="268.042">fetch matched StoredEvent(s) for display</text><polygon points="108.038,335.055,98.038,339.055,108.038,343.055,104.038,339.055" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="102.038" y1="339.055" x2="476.231" y2="339.055" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="114.038" y="326.422" fill="#000" font-size="13" font-weight="700">5</text><text x="127.083" y="318.856" fill="#000" font-size="13" textLength="270.296">0 or more matches -- a match means this</text><text x="127.083" y="333.989" fill="#000" font-size="13" textLength="275.704">person is already screened at another site</text><path d="M102.038,352.055 L102.038,452.055 L489.038,452.055 L489.038,362.055 L479.038,352.055 L102.038,352.055" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M479.038,352.055 L479.038,362.055 L489.038,362.055 L479.038,352.055" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="108.038" y="369.122" fill="#000" font-size="13" textLength="353.698">Zero matches doesn't guarantee no duplicate exists --</text><text x="108.038" y="384.254" fill="#000" font-size="13" textLength="362.273">it means no OTHER already-enrolled patient shares this</text><text x="108.038" y="399.387" fill="#000" font-size="13" textLength="360.813">exact (LegalName, DateOfBirth) pair under the Shared-</text><text x="108.038" y="414.52" fill="#000" font-size="13" textLength="366.495">scope key. A coordinator still exercises judgment (name</text><text x="108.038" y="429.653" fill="#000" font-size="13" textLength="323.108">variants, transcription differences) -- this narrows</text><text x="108.038" y="444.786" fill="#000" font-size="13" textLength="207.353">the search, it doesn't replace it.</text><?plantuml-src TLF1Jjj04BtxAvvo8P5Y5DggWXmgGKafLGMKzDIcGfFTSRpKsJMxQy12_7jddGJCeRxOEvutxysyMMgYiyrwoJuZ5Pt7O6uYuxDpNXjB4jaBK9LX6nTsg58uVpyQW2JwcfFLvADHfYORCJZpL9S_lkEC8ZzGsoMlDj-PfaXB2ep1p2hVrf7r5yELFhUQ7sSs-bPeZa-lyydHnmsDIN_UuAA9BUP2orq2Tu7kd6KzKSW_xMYd2CqoA6_gQ9p54vozYTvGTN1pHJ4rDrUUsR8UBYpmKBBdANu_eKZQfXXyvnLL5xJcmHXy9u5lGaCMrzno6E1vd62xvnLsAlINnOdniTm13uuE3_F9XtpoJc1_HdXAI55toogUQmIPlhoUyPnjjQSskXbC