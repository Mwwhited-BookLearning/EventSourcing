<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:602px;height:790px;background:#FFFFFF;" width="602px" height="790px" viewBox="0 0 602 790" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="entity" data-qualified-name="Erased" id="ent0001" data-source-line="9"><rect x="7" y="559" width="324.657" height="134.078" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="7" y1="585.297" x2="331.657" y2="585.297" style="stroke:#181818;stroke-width:0.5;"/><text x="145.341" y="576.995" fill="#000" font-size="14" textLength="47.975">Erased</text><text x="12" y="603.292" fill="#000" font-size="14" textLength="185.411">classified PHI fields render</text><text x="12" y="619.589" fill="#000" font-size="14" textLength="304.657">{"erased": true} on every subsequent read</text><text x="12" y="635.886" fill="#000" font-size="14" textLength="221.683">non-PHI structural/clinical fields</text><text x="12" y="652.183" fill="#000" font-size="14" textLength="292.455">remain fully readable (ICH-GCP retention)</text><text x="12" y="668.479" fill="#000" font-size="14" textLength="261.468">the EVENTS themselves, and the fact</text><text x="12" y="684.776" fill="#000" font-size="14" textLength="221.396">of erasure, are retained forever</text></g><g class="start_entity" data-qualified-name=".start." id="ent0002" data-source-line="1"><ellipse cx="169.33" cy="16" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="Active" id="ent0003" data-source-line="1"><rect x="137.55" y="118" width="63.552" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="137.55" y1="144.297" x2="201.102" y2="144.297" style="stroke:#181818;stroke-width:0.5;"/><text x="147.55" y="135.995" fill