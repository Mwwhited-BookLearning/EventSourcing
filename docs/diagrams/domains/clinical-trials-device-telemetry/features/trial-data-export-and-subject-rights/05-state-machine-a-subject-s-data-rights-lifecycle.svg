y-2="ent0003" id="lnk5" data-source-line="3" data-link-type="dependency"><path d="M201.28,130.37 C219.36,127.91 236.1,132.12 236.1,143 C236.1,153.89 224.314,158.777 206.234,156.307" style="stroke:#181818;stroke-width:1;" fill="none" id="Active-to-Active"/><polygon points="201.28,155.63,209.656,160.811,206.234,156.307,210.739,152.885,201.28,155.63" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="242.1" y="140.067" fill="#000" font-size="13" textLength="315.897">exported (ADR-068) or played back (ADR-068) --</text><text x="262.558" y="155.2" fill="#000" font-size="13" textLength="274.98">a READ, never changes this lifecycle state</text></g><!--link Active to Withdrawn--><g class="link" data-entity-1="ent0003" data-entity-2="ent0006" id="lnk7" data-source-line="4" data-link-type="dependency"><path d="M169.33,168.39 C169.33,194.08 169.33,229.31 169.33,254.9" style="stroke:#181818;stroke-width:1;" fill="none" id="Active-to-Withdrawn"/><polygon points="169.33,259.9,173.33,250.9,169.33,254.9,165.33,250.9,169.33,259.9" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="170.33" y="211.067" fill="#000" font-size="13" textLength="190.976">ConsentWithdrawn published</text><text x="176.655" y="226.2" fill="#000" font-size="13" textLength="178.325">(retained forever, ICH-GCP)</text></g><!--link Withdrawn to ErasureRequested--><g class="link" data-entity-1="ent0006" data-entity-2="ent0008" id="lnk9" data-source-line="6" data-link-type="dependency"><path d="M169.33,310.22 C169.33,339.25 169.33,382.63 169.33,411.7" style="stroke:#181818;stroke-width:1;" fill="none" id="Withdrawn-to-ErasureRequested"/><polygon points="169.33,416.7,173.33,407.7,169.33,411.7,165.33,407.7,169.33,416.7" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="170.33" y="353.067" fill="#000" font-size="13" textLength="224.834">EntityErasureReq