 points="1264.074,352.594,1274.074,356.594,1264.074,360.594,1268.074,356.594" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="855.341" y1="356.594" x2="1270.074" y2="356.594" style="stroke:#181818;stroke-width:1;"/><text x="862.341" y="336.395" fill="#000" font-size="13" font-weight="700">5</text><text x="875.386" y="321.262" fill="#000" font-size="13" textLength="203.519">walk Lineage DAG (ADR-005) --</text><text x="875.386" y="336.395" fill="#000" font-size="13" textLength="310.661">gather ae-1042's AdverseEventReported event,</text><text x="875.386" y="351.528" fill="#000" font-size="13" textLength="335.15">its accessGrant "grant-1", and its authorityDecision</text><polygon points="866.341,381.727,856.341,385.727,866.341,389.727,862.341,385.727" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="860.341" y1="385.727" x2="1275.074" y2="385.727" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="872.341" y="380.661" fill="#000" font-size="13" font-weight="700">6</text><text x="885.386" y="380.661" fill="#000" font-size="13" textLength="278.611">StoredEvent rows, SequenceNumber order</text><polygon points="1373.871,425.992,1383.871,429.992,1373.871,433.992,1377.871,429.992" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="855.341" y1="429.992" x2="1379.871" y2="429.992" style="stroke:#181818;stroke-width:1;"/><text x="862.341" y="417.36" fill="#000" font-size="13" font-weight="700">7</text><text x="875.386" y="409.793" fill="#000" font-size="13" textLength="362.477">mask/decrypt each Payload per auditor-3's OWN claims</text><text x="875.386" y="424.926" fill="#000" font-size="13" textLength="361.924">(ADR-009 claims check, ADR-057 erased-branch check)</text><polygon points="866.341,455.125,856.341,459.125,866.341,463.125,862.341,459.125" fill="#181818" style="stroke:#181818;