th="322.785">ExportManifest / SystemTimePlayback results are</text><text x="357.89" y="283.37" fill="#000" font-size="13" textLength="343.891">produced ARTIFACTS, not persisted rows -- shown as</text><text x="357.89" y="298.503" fill="#000" font-size="13" textLength="347.293">C# DTOs below, not in this ER diagram, since neither</text><text x="357.89" y="313.635" fill="#000" font-size="13" textLength="357.227">is a new database table (ADR-068's own "v1 computes</text><text x="357.89" y="328.768" fill="#000" font-size="13" textLength="320.995">this on demand" decision for playback; an export</text><text x="357.89" y="343.901" fill="#000" font-size="13" textLength="287.777">bundle is likewise never stored server-side).</text></g><!--link event to erasureKey--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk5" data-source-line="47" data-link-type="dependency"><path d="M533.33,163.72 C533.33,198.61 533.33,231.94 533.33,231.94 C533.33,231.94 417.19,231.94 322.07,231.94" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="event-to-erasureKey" codeLine="47"/><polygon points="317.07,231.94,326.07,235.94,322.07,231.94,326.07,227.94,317.07,231.94" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="463.093" y="198.007" fill="#000" font-size="13" textLength="199.97">EntityId -- the DEK this entity's</text><text x="460.31" y="213.14" fill="#000" font-size="13" textLength="205.537">classified fields were encrypted</text><text x="508.184" y="228.273" fill="#000" font-size="13" textLength="109.789">under (ADR-057)</text></g><!--link erasureKey to entityStore--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk6" data-source-line="48" data-link-type="dependency"><path d="M205,380.04 C205,400.23 205,416.31 205,434.26" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="erasureKey-to-entityStore" codeLine="48"/><polygon points="205,439.26,209,430.26,205,434.26,201,430.26,205,439.26" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="46.409" y="422.717" fill="#000" font-size="13" textLength="118.625">DestroyedAt set --</text><text x="7" y="437.85" fill="#000" font-size="13" textLength="197.444">subsequent reads of classified</text><text x="22.828" y="452.983" fill="#000" font-size="13" textLength="165.788">fields render erased: true</text></g><!--link event to accessLog--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk7" data-source-line="49" data-link-type="dependency"><path d="M614.67,163.66 C614.67,204.06 614.67,244.94 614.67,244.94 C614.67,244.94 682.72,244.94 759.9,244.94" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="event-to-accessLog" codeLine="49"/><polygon points="764.9,244.94,755.9,240.94,759.9,244.94,755.9,248.94,764.9,244.94" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="669.377" y="211.007" fill="#000" font-size="13" textLength="227.906">an export or playback query writes</text><text x="650.15" y="226.14" fill="#000" font-size="13" textLength="266.36">one AccessLogEntry per read (ADR-045),</text><text x="714.176" y="241.273" fill="#000" font-size="13" textLength="138.309">logically, not a DB FK</text></g><?plantuml-src bLLTJoCv47pFhsZb7XPE-O3Jxd77hbW50be4jui2qhxanHbtPYmSUyxs98mG__tAdWcPB7lIdOJ2JEpkhgwgxXHACcNAPPfx_b6PKZYn8gqCXxfaiYuKjjTZ4rIegNyVh6DvkSPxduGdZa_qt2FwbUxvxufDnb-hrO8TdT92vGgddpxTtPoTuSfmY8yKUornN5LAuh0o2d7fmcMgaWvzSCha-EuTuKdeuzCx4HH2J--7HqSd9tHmOOt7-tSL2kd4nWpQy4idVELu5j7umFBmOpVBHAxPUKueJWKFZu_U_qRZdzNuyvWE-Aa40Ip7fHOrIrg8xF5msyH3vAU3z4xKsee8Fl1JI4KpBRnNIuLGV6ZfSJiI6AdBL5cmYrV9WZKIDBsy8NvIFdWwc4ndmwCF9x7OHI6K-I9yqIrsAm9Fd5DheQ-qo2FRrkhFgQfZpMjXObvTqz8wYl0ZzdUUH1Cqj4v2fANLiYts-n-7lPUTqdjatd0zDw-O6kLVJrhvtuZtW_2JijnNzhiJPSbooeyHVHtO9_G6dd8K2gP7v5wXpwWDgU1PBv4AtbopRtfJXgvt49CvaMFxU8wEsSW8SSzGcq9b1LZAGJL7DNxCa