ice to channel--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk6" data-source-line="49" data-link-type="dependency"><path d="M243,147.43 C243,170.79 243,192.78 243,217.96" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="device-to-channel" codeLine="49"/><polygon points="243,222.96,247,213.96,243,217.96,239,213.96,243,222.96" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="17.947" y="198.267" fill="#000" font-size="13" textLength="213.402">PairedToSubjectId -- logical only;</text><text x="18.911" y="213.4" fill="#000" font-size="13" textLength="211.472">the device and the channel both</text><text x="7" y="228.533" fill="#000" font-size="13" textLength="235.295">resolve to the SAME patient EntityId</text></g><!--link event to channel--><g class="link" data-entity-1="ent0004" data-entity-2="ent0002" id="lnk7" data-source-line="50" data-link-type="dependency"><path d="M451.33,163.71 C451.33,182.93 451.33,198.61 451.33,218.18" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="event-to-channel" codeLine="50"/><polygon points="451.33,223.18,455.33,214.18,451.33,218.18,447.33,214.18,451.33,223.18" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="452.33" y="206.517" fill="#000" font-size="13" textLength="277.583">TelemetryPointer.ChannelId -- logical only,</text><text x="513.667" y="221.65" fill="#000" font-size="13" textLength="154.908">NOT a DB FK (ADR-031)</text></g><?plantuml-src VLHBRzim3BxxLn2vj1dieDs60KkB3baVMDUr3U9WfruOYqcqoP8doMc3jlzzbEouMRRrab3cyoFvSIa5GI5jeIXnFwMkq689Ichowuh0MByqIKBQIx-6tddypxsnD37tTth_Z5Qoe7uFq868CZmc06-WiRmKC0JdhTGBE3uUNvsSi3BB-AVHJqEEZGL__KxMIQFvqqmkfFRywGmzyjlJGtZjGPFnKgIjT6q4gHGkjISxnuAkf6RT6AKbCJLvFVj1XG_ckVJHhL6DVFByWcjAYahoTdswHAr9HJn58xU0Mit_4OsgQalPGVppsnwmXEfmE4OlEVimpmuEFXvo1F1BWl5eUdb-Cqr16ny_j3tT7vrDieDtXtqESMeOglO19qScNPVmEC7xl425DWKMFqkDTf