.731" fill="#000" font-size="13" textLength="277.856">(the erasure-vs-broad-consent tension this</text><text x="491.13" y="337.864" fill="#000" font-size="13" textLength="276.942">raises is named in ../README.md's Special</text><text x="491.13" y="352.997" fill="#000" font-size="13" textLength="272.638">concerns, deliberately not resolved here).</text></g><!--link *start* to Collected--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk3" data-source-line="3" data-link-type="dependency"><path d="M419.97,26.38 C419.97,43.11 419.97,73.59 419.97,97.62" style="stroke:#181818;stroke-width:1;" fill="none" id="*start*-to-Collected"/><polygon points="419.97,102.62,423.97,93.62,419.97,97.62,415.97,93.62,419.97,102.62" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="420.97" y="69.067" fill="#000" font-size="13" textLength="124.909">SpecimenCollected</text></g><!--link Collected to Stored--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk5" data-source-line="4" data-link-type="dependency"><path d="M419.97,153.42 C419.97,184.81 419.97,233.97 419.97,265.27" style="stroke:#181818;stroke-width:1;" fill="none" id="Collected-to-Stored"/><polygon points="419.97,270.27,423.97,261.27,419.97,265.27,415.97,261.27,419.97,270.27" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="420.97" y="196.067" fill="#000" font-size="13" textLength="107.06">SpecimenStored</text></g><!--link Stored to Derived--><g class="link" data-entity-1="ent0004" data-entity-2="ent0006" id="lnk7" data-source-line="5" data-link-type="dependency"><path d="M389.69,298.94 C304.42,306.41 65.47,332.32 18.97,391.06 C6,407.44 7.01,420.93 18.97,438.06 C44.41,474.51 92.35,485.882 127.26,489.732" style="stroke:#181818;stroke-width:1;" fill="none" id="Stored-to-Derived"/><polygon points="132.23,490.28,123.723,485.318,127.26,489.732,122.846,493.269,132.23,490.28" fill="#1