-class cursor--><g class="entity" data-qualified-name="cursor" id="ent0004" data-source-line="29"><rect x="685.31" y="7" width="284.316" height="123.781" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="771.875" y="24.995" fill="#000" font-size="14" textLength="111.187">PeerSyncCursor</text><line x1="686.31" y1="33.297" x2="968.626" y2="33.297" style="stroke:#181818;stroke-width:0.5;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="696.31" cy="46.945" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="705.31" y="50.292" fill="#000" font-size="14" textLength="137.45">PeerId : string «PK»</text><line x1="686.31" y1="57.594" x2="968.626" y2="57.594" style="stroke:#181818;stroke-width:1;"/><text x="691.31" y="74.589" fill="#000" font-size="14" textLength="272.316">LastReceivedSequenceNumber : bigint</text><text x="691.31" y="90.886" fill="#000" font-size="14" textLength="250.872">LastAckedSequenceNumber : bigint</text><text x="691.31" y="107.183" fill="#000" font-size="14" textLength="251.788">LastSyncAttemptAt : datetimeoffset</text><text x="691.31" y="123.479" fill="#000" font-size="14" textLength="250.961">LastSyncSuccessAt : datetimeoffset</text></g><g class="entity" data-qualified-name="GMN9" id="ent0010" data-source-line="44"><path d="M245.18,423.45 L245.18,492.65 L210.15,496.65 L245.18,500.65 L245.18,569.645 A0,0 0 0 0 245.18,569.645 L541.738,569.645 A0,0 0 0 0 541.738,569.645 L541.738,433.45 L531.738,423.45 L245.18,423.45 A0,0 0 0 0 245.18,423.45" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M531.738,423.45 L531.738,433.45 L541.738,433.45 L531.738,423.45" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="251.18" y="440.517" fill="#000" font-size="13" textLength="196.035">One row per EntityId, per site.</text><text x="251.18" y="455.65" fill="#000" font-size="13" textLength="205.366">Data holds CURRENT state only</text><text x="251.18" y="470.783" fill="#000" font-size="13" textLength="236.571">(CurrentCustodian, CurrentLocation,</text><text x="251.18" y="485.915" fill="#000" font-size="13" textLength="219.61">HandoffCount, ExceptionCount) --</text><text x="251.18" y="501.048" fill="#000" font-size="13" textLength="231.175">the full handoff/exception history is</text><text x="251.18" y="516.181" fill="#000" font-size="13" textLength="211.542">read from the Event Log directly</text><text x="251.18" y="531.314" fill="#000" font-size="13" textLength="217.166">(entityHistory) or the Lineage API</text><text x="251.18" y="546.447" fill="#000" font-size="13" textLength="275.558">(parents/children/ancestors/descendants),</text><text x="251.18" y="561.579" fill="#000" font-size="13" textLength="178.172">never duplicated into Data.</text></g><g class="entity" data-qualified-name="GMN12" id="ent0013" data-source-line="56"><path d="M845.19,234.29 L845.19,319.954 A0,0 0 0 0 845.19,319.954 L1089.729,319.954 A0,0 0 0 0 1089.729,319.954 L1089.729,244.29 L1079.729,234.29 L911.41,234.29 L907.41,131.09 L903.41,234.29 L845.19,234.29 A0,0 0 0 0 845.19,234.29" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1079.729,234.29 L1079.729,244.29 L1089.729,244.29 L1079.729,234.29" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="851.19" y="251.357" fill="#000" font-size="13" textLength="220.638">One row per remote peer this site</text><text x="851.19" y="266.49" fill="#000" font-size="13" textLength="199.875">gossip-syncs with (ADR-033) --</text><text x="851.19" y="281.623" fill="#000" font-size="13" textLength="223.539">durable, not an in-memory queue,</text><text x="851.19" y="296.755" fill="#000" font-size="13" textLength="198.313">so an unclean restart resumes</text><text x="851.19" y="311.888" fill="#000" font-size="13" textLength="176.325">exactly where sync left off.</text></g><!--link event to parent--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk5" data-source-line="38" data-link-type="crowfoot"><path d="M651.14,371.84 C651.14,404.79 651.14,414.63 651.14,440.75" style="stroke:#181818;stroke-width:1;" fill="none" id="event-parent" codeLine="38"/><line x1="647.14" y1="367.84" x2="655.14" y2="367.84" style="stroke:#181818;stroke-width:1;"/><line x1="647.14" y1="370.84" x2="655.14" y2="370.84" style="stroke:#181818;stroke-width:1;"/><line x1="651.14" y1="371.84" x2="651.14" y2="363.84" style="stroke:#181818;stroke-width:1;"/><line x1="651.14" y1="450.75" x2="657.14" y2="458.75" style="stroke:#181818;stroke-width:1;"/><line x1="651.14" y1="450.75" x2="645.14" y2="458.75" style="stroke:#181818;stroke-width:1;"/><line x1="651.14" y1="450.75" x2="651.14" y2="458.75" style="stroke:#181818;stroke-width:1;"/><ellipse cx="651.14" cy="444.75" rx="4" ry="4" fill="none" style="stroke:#181818;stroke-width:1;"/><text x="456.202" y="392.367" fill="#000" font-size="13" textLength="148.954">ChildEventId -- real FK,</text><text x="411.14" y="407.5" fill="#000" font-size="13" textLength="239.078">the child always exists at insert time</text></g><!--link event to parent--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk6" data-source-line="39" data-link-type="crowfoot"><path d="M725.78,363.84 C725.78,396.79 725.78,414.63 725.78,440.75" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="event-to-parent" codeLine="39"/><line x1="725.78" y1="450.75" x2="731.78" y2="458.75" style="stroke:#181818;stroke-width:1;"/><line x1="725.78" y1="450.75" x2="719.78" y2="458.75" style="stroke:#181818;stroke-width:1;"/><line x1="725.78" y1="450.75" x2="725.78" y2="458.75" style="stroke:#181818;stroke-width:1;"/><ellipse cx="725.78" cy="444.75" rx="4" ry="4" fill="none" style="stroke:#181818;stroke-width:1;"/><text x="749.276" y="377.367" fill="#000" font-size="13" textLength="174.567">ParentEventId -- NO db FK;</text><text x="726.78" y="392.5" fill="#000" font-size="13" textLength="219.559">must tolerate dangling refs under</text><t