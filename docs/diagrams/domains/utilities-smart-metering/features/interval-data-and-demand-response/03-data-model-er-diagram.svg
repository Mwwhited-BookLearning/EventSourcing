<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:834px;height:755px;background:#FFFFFF;" width="834px" height="755px" viewBox="0 0 834 755" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--class channel--><g class="entity" data-qualified-name="channel" id="ent0001" data-source-line="4"><rect x="120.23" y="7" width="247.532" height="156.375" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="179.533" y="24.995" fill="#000" font-size="14" textLength="128.926">TelemetryChannel</text><line x1="121.23" y1="33.297" x2="366.762" y2="33.297" style="stroke:#181818;stroke-width:0.5;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="131.23" cy="46.945" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="140.23" y="50.292" fill="#000" font-size="14" textLength="163.502">ChannelId : string «PK»</text><line x1="121.23" y1="57.594" x2="366.762" y2="57.594" style="stroke:#181818;stroke-width:1;"/><text x="126.23" y="74.589" fill="#000" font-size="14" textLength="94.172">AppId : string</text><text x="126.23" y="90.886" fill="#000" font-size="14" textLength="107.693">EntityId : string</text><text x="126.23" y="107.183" fill="#000" font-size="14" textLength="235.532">ContentKind : enum {RawScalar}</text><text x="126.23" y="123.479" fill="#000" font-size="14" textLength="215.1">SampleType : enum {Float64}</text><text x="126.23" y="139.776" fill="#000" font-size="14" textLength="204.921">SampleIntervalMicros : bigint</text><text x="126.23" y="156.073" fill="#000" font-size="14" textLength="160.508">Origin : enum {Origin}</text></g><!--class event--><g class="entity" data-qualified-name="event" id="ent0002" data-source-line="15"><rect x="121.98" y="223.37" width="244.032" height="172.672" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="200.844" y="241.365" fill="#000" font-size="14" textLength="86.304">StoredEvent</text><line x1="122.98" y1="249.667" x2="365.012" y2="249.667" style="stroke:#181818;stroke-width:0.5;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="132.98" cy="263.315" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="141.98" y="266.662" fill="#000" font-size="14" textLength="218.032">SequenceNumber : bigint «PK»</text><line x1="122.98" y1="273.964" x2="365.012" y2="273.964" style="stroke:#181818;stroke-width:1;"/><text x="127.98" y="290.959" fill="#000" font-size="14" textLength="166.852">EventId : uuid «unique»</text><text x="127.98" y="307.256" fill="#000" font-size="14" textLength="107.693">EntityId : string</text><text x="127.98" y="323.553" fill="#000" font-size="14" textLength="128.249">EventType : string</text><text x="127.98" y="339.849" fill="#000" font-size="14" textLength="182.314">TelemetryPointer : string?</text><text x="127.98" y="356.146" fill="#000" font-size="14" textLength="163.215">AuthorityStatus : string</text><text x="127.98" y="372.443" fill="#000" font-size="14" textLength="199.24">AuthorityDecisionRef : uuid?</text><text x="127.98" y="388.74" fill="#000" font-size="14" textLength="103.906">ActorId : string</text></g><!--class entityStore--><g class="entity" data-qualified-name="entityStore" id="ent0003" data-source-line="27"><rect x="107.69" y="456.04" width="272.62" height="123.781" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="169.762" y="474.035" fill="#000" font-size="14" textLength="148.477">MeterEntityStoreRow</text><line x1="108.69" y1="482.337" x2="379.31" y2="482.337" style="stroke:#181818;stroke-width:0.5;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="118.69" cy="495.985" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="127.69" y="499.332" fill="#000" font-size="14" textLength="146.897">EntityId : string «PK»</text><line x1="108.69" y1="506.634" x2="379.31" y2="506.634" style="stroke:#181818;stroke-width:1;"/><text x="113.69" y="523.629" fill="#000" font-size="14" textLength="129.015">EntityType : string</text><text x="113.69" y="539.926" fill="#000" font-size="14" textLength="106.101">Version : bigint</text><text x="113.69" y="556.223" fill="#000" font-size="14" textLength="74.922">Data : text</text><text x="113.69" y="572.519" fill="#000" font-size="14" textLength="260.62">LastAppliedSequenceNumber : bigint</text></g><g class="entity" data-qualified-name="GMN6" id="ent0007" data-source-line="40"><path d="M402.71,42.35 L402.71,81.62 L368.25,85.62 L402.71,89.62 L402.71,128.014 A0,0 0 0 0 402.71,128.014 L819.283,128.014 A0,0 0 0 0 819.283,128.014 L819.283,52.35 L809.283,42.35 L402.71,42.35 A0,0 0 0 0 402.71,42.35" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M809.283,42.35 L809.283,52.35 L819.283,52.35 L809.283,42.35" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="408.71" y="59.417" fill="#000" font-size="13" textLength="349.908">ChannelId "meter-482-kwh-interval", AppId "gridops",</text><text x="408.71" y="74.55" fill="#000" font-size="13" textLength="278.999">EntityId "gridops:Meter:m-482" (ADR-021).</text><text x="408.71" y="89.683" fill="#000" font-size="13" textLength="395.573">SampleIntervalMicros = 900000000 (15 min) doubles as this</text><text x="408.71" y="104.815" fill="#000" font-size="13" textLength="360.833">channel's ExpectedInterArrivalInterval for lag detection</text><text x="408.71" y="119.948" fill="#000" font-size="13" textLength="203.106">(ADR-031) -- one field, not two.</text></g><g class="entity" data-qualified-name="GMN9" id="ent0010" data-source-line="48"><path d="M400.71,259.31 L400.71,305.62 L366.29,309.62 L400.71,313.62 L400.71,360.107 A0,0 0 0 0 400.71,360.107 L805.299,360.107 A0,0 0 0 0 805.299,360.107 L805.299,269.31 L795.299,259.31 L400.71,259.31 A0,0 0 0 0 400.71,259.31" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M795.299,259.31 L795.299,269.31 L805.299,269.31 L795.299,259.31" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="406.71" y="276.377" fill="#000" font-size="13" textLength="383.589">This is the DemandResponseTriggered StoredEvent shape.</text><text x="406.71" y="291.51" fill="#000" font-size="13" textLength="371.338">AuthorityStatus starts "pending_review" here specifically</text><text x="406.71" y="306.643" fill="#000" font-size="13" textLength="359.677">because the publish declared a review-pending marker</text><text x="406.71" y="321.775" fill="#000" font-size="13" textLength="372.544">(ADR-042's "unvalidated detector output" trigger case) --</text><text x="406.71" y="336.908" fill="#000" font-size="13" textLength="353.622">it does NOT default to "accepted" the way an ordinary</text><text x="406.71" y="352.041" fill="#000" font-size="13" textLength="189.014">authenticated publish would.</text></g><g class="entity" data-qualified-name="GMN12" id="ent0013" data-source-line="57"><path d="M28.58,639.82 L28.58,740.617 A0,0 0 0 0 28.58,740.617 L459.41,740.617 A0,0 0 0 0 459.41,740.617 L459.41,649.82 L449.41,639.82 L248,639.82 L244,580.13 L240,639.82 L28.58,639.82 A0,0 0 0 0 28.58,639.82" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M449.41,639.82 L449.41,649.82 L459.41,649.82 L449.41,639.82" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="34.58" y="656.887" fill="#000" font-size="13" textLength="318.538">Full column list is in ../../../data/entity-store.md --</text><text x="34.58" y="672.02" fill="#000" font-size="13" textLength="380.561">this is that same generic EntityStoreRow shape, scoped to</text><text x="34.58" y="687.153" fill="#000" font-size="13" textLength="383.475">meter entities for this doc. An ungated LiveEntityStoreRow</text><text x="34.58" y="702.285" fill="#000" font-size="13" textLength="409.83">counterpart (ADR-042) folds every DemandResponseTriggered</text><text x="34.58" y="717.418" fill="#000" font-size="13" textLength="357.659">event immediately, pending_review included, wrapped</text><text x="34.58" y="732.551" fill="#000" font-size="13" textLength="391.822">isAuthoritative: false -- not drawn here, see entity-store.md.</text></g><!--link channel to event--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk4" data-source-line="36" data-link-type="crowfoot"><path d="M244,171.71 C244,190.93 244,185.61 244,205.18" style="stroke:#181818;stroke-width:1;" fill="none" id="channel-event" codeLine="36"/><line x1="240" y1="167.71" x2="248" y2="167.71" style="stroke:#181818;stroke-width:1;"/><line x1="240" y1="170.71" x2="248" y2="170.71" style="stroke:#181818;stroke-width:1;"/><line x1="244" y1="171.71" x2="244" y2="163.71" style="stroke:#181818;stroke-width:1;"/><line x1="244" y1="215.18" x2="250" y2="223.18" style="stroke:#181818;stroke-width:1;"/><line x1="244" y1="215.18" x2="238" y2="223.18" style="stroke:#181818;stroke-width:1;"/><line x1="244" y1="215.18" x2="244" y2="223.18" style="stroke:#181818;stroke-width:1;"/><ellipse cx="244" cy="209.18" rx="4" ry="4" fill="none" style="stroke:#181818;stroke-width:1;"/><text x="27.712" y="206.517" fill="#000" font-size="13" textLength="195.533">TelemetryPointer.ChannelId --</text><text x="7" y="221.65" fill="#000" font-size="13" textLength="236.958">logical only, NOT a DB FK (ADR-031)</text></g><!--link event to entityStore--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk5" data-source-line="37" data-link-type="dependency"><path d="M244,396.5 C244,416.37 244,432.1 244,450.69" style="stroke:#181818;stroke-width:1;" fill="none" id="event-to-entityStore" codeLine="37"/><polygon points="244,455.69,248,446.69,244,450.69,240,446.69,244,455.69" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="321.911" y="407.167" fill="#000" font-size="13" textLength="139.077">folds int