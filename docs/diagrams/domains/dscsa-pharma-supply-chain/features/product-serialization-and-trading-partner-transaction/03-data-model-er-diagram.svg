xt><text x="423.07" y="74.55" fill="#000" font-size="13" textLength="187.186">the interchange wire format,</text><text x="423.07" y="89.683" fill="#000" font-size="13" textLength="194.752">never persisted as-is; it exists</text><text x="423.07" y="104.815" fill="#000" font-size="13" textLength="244.861">only between adapterOut's transform</text><text x="423.07" y="119.948" fill="#000" font-size="13" textLength="227.392">and adapterIn's reverse transform.</text></g><!--reverse link unit to txn--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk5" data-source-line="50" data-link-type="dependency"><path d="M260.53,384.98 C260.53,404.47 260.53,420.23 260.53,439.31" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="unit-backto-txn" codeLine="50"/><polygon points="260.53,379.98,256.53,388.98,260.53,384.98,264.53,388.98,260.53,379.98" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="300.492" y="375.717" fill="#000" font-size="13" textLength="112.512">parentEventIds --</text><text x="261.53" y="390.85" fill="#000" font-size="13" textLength="190.436">aggregation of scanned units</text><text x="261.774" y="405.983" fill="#000" font-size="13" textLength="189.947">into one shipment (ADR-005)</text></g><!--link txn to epcis--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk6" data-source-line="51" data-link-type="dependency"><path d="M349.65,439.67 C349.65,363.71 349.65,247.8 349.65,168.7" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="txn-to-epcis" codeLine="51"/><polygon points="349.65,163.7,345.65,172.7,349.65,168.7,353.65,172.7,349.65,163.7" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="350.65" y="267.757" fill="#000" font-size="13" textLength="245.369">Gs1EpcisAdapter outbound transform</text><text x="369.823" y="282.89" fill="#000" font-size="13" textLength=