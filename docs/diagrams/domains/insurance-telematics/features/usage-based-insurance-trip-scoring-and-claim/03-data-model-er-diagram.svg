n --</text><text x="997.44" y="297.91" fill="#000" font-size="13" textLength="370.068">the same shape ADR-021's EntityId already uses, reused</text><text x="997.44" y="313.043" fill="#000" font-size="13" textLength="369.713">as a claim-narrowing dimension, not a second ID format.</text></g><!--link trip to parent--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk6" data-source-line="54" data-link-type="crowfoot"><path d="M311,171.61 C311,203.08 311,211.9 311,237.54" style="stroke:#181818;stroke-width:1;" fill="none" id="trip-parent" codeLine="54"/><line x1="307" y1="167.61" x2="315" y2="167.61" style="stroke:#181818;stroke-width:1;"/><line x1="307" y1="170.61" x2="315" y2="170.61" style="stroke:#181818;stroke-width:1;"/><line x1="311" y1="171.61" x2="311" y2="163.61" style="stroke:#181818;stroke-width:1;"/><line x1="311" y1="247.54" x2="317" y2="255.54" style="stroke:#181818;stroke-width:1;"/><line x1="311" y1="247.54" x2="305" y2="255.54" style="stroke:#181818;stroke-width:1;"/><line x1="311" y1="247.54" x2="311" y2="255.54" style="stroke:#181818;stroke-width:1;"/><ellipse cx="311" cy="241.54" rx="4" ry="4" fill="none" style="stroke:#181818;stroke-width:1;"/><text x="7" y="190.637" fill="#000" font-size="13" textLength="303.424">ParentEventId -- ClaimFiled's causal derivation</text><text x="59.362" y="205.77" fill="#000" font-size="13" textLength="198.701">point TO this TripScored event</text></g><!--link claim to parent--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk7" data-source-line="55" data-link-type="crowfoot"><path d="M759.87,147.36 C759.87,209.07 759.87,293.45 759.87,293.45 C759.87,293.45 645.27,293.45 544.27,293.45" style="stroke:#181818;stroke-width:1;" fill="none" id="claim-parent" codeLine="55"/><line x1="755.87" y1="143.36" x2="763.87" y2="143.36" style="stroke:#181818;stroke-width:1;"/><line x1="755.87" y1="146.36" x2="763.87" y2="146.36" style="stroke:#181818;stroke-width:1;"/><line x1="759.87" y1="14