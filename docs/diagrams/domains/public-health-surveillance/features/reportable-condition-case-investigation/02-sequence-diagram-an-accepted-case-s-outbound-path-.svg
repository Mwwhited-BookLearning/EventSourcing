" textLength="343.396">filter candidate destination peers by AllowedRegions</text><text x="488.953" y="215.192" fill="#000" font-size="13" textLength="459.259">BEFORE building each sync batch (ADR-061 -- not a query-time check)</text><path d="M452.908,245.258 L517.351,245.258 L517.351,252.391 L507.351,262.391 L452.908,262.391 L452.908,245.258" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="452.908" y="245.258" width="812.817" height="256" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="467.908" y="258.325" fill="#000" font-size="13" textLength="19.443" font-weight="700">alt</text><text x="532.351" y="257.468" fill="#000" font-size="11" textLength="493.937" font-weight="700">[destination peer tagged with an allowed region (Site EastRegional, "us-east")]</text><polygon points="943.212,289.523,953.212,293.523,943.212,297.523,947.212,293.523" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="468.908" y1="293.523" x2="949.212" y2="293.523" style="stroke:#181818;stroke-width:1;"/><text x="475.908" y="288.458" fill="#000" font-size="13" font-weight="700">3</text><text x="488.953" y="288.458" fill="#000" font-size="13" textLength="439.309">include "case-9001" event in the batch bound for Site EastRegional</text><polygon points="1237.725,318.656,1247.725,322.656,1237.725,326.656,1241.725,322.656" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="955.212" y1="322.656" x2="1243.725" y2="322.656" style="stroke:#181818;stroke-width:1;"/><text x="962.212" y="317.59" fill="#000" font-size="13" font-weight="700">4</text><text x="975.258" y="317.59" fill="#000" font-size="13" textLength="257.467">push batch (ADR-033 gossip exchange)</text><polygon points="966.212,347.789,956.212,351.789,966.212,355.789,962.212,351.789" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="960.212" y1="351.789" x2="1248.725" y2="351.789" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="972.212" y="346.723" fill="#000" font-size="13" font-weight="700">5</text><text x="985.258" y="346.723" fill="#000" font-size="13" textLength="208.781">ack up to this SequenceNumber</text><line x1="452.908" y1="360.789" x2="1265.725" y2="360.789" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="457.908" y="373" fill="#000" font-size="11" textLength="511.693" font-weight="700">[destination peer tagged with a disallowed region (Site WestRegional, "us-west")]</text><line x1="468.908" y1="414.859" x2="510.908" y2="414.859" style="stroke:#181818;stroke-width:1;"/><line x1="510.908" y1="414.859" x2="510.908" y2="427.859" style="stroke:#181818;stroke-width:1;"/><line x1="469.908" y1="427.859" x2="510.908" y2="427.859" style="stroke:#181818;stroke-width:1;"/><polygon points="479.908,423.859,469.908,427.859,479.908,431.859,475.908,427.859" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="475.908" y="402.227" fill="#000" font-size="13" font-weight="700">6</text><text x="488.953" y="394.661" fill="#000" font-size="13" textLength="282.921">"case-9001" event is simply never included</text><text x="488.953" y="409.793" fill="#000" font-size="13" textLength="270.404">in any batch bound for Site WestRegional</text><path d="M473.908,440.859 L473.908,495.859 L902.908,495.859 L902.908,450.859 L892.908,440.859 L473.908,440.859" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M892.908,440.859 L892.908,450.859 L902.908,450.859 L892.908,440.859" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="479.908" y="457.926" fill="#000" font-size="13" textLength="378.987">Filtered at the outbox itself, at the point sync destinations</text><text x="479.908" y="473.059" fill="#000" font-size="13" textLength="408.04">are already being selected (ADR-033) -- no separate residency</text><text x="479.908" y="488.192" fill="#000" font-size="13" textLength="245.242">component, no read/query-time gate.</text><rect x="10" y="535.824" width="2827.816" height="3" fill="#EEE" style="stroke:#EEE;stroke-width:1;"/><line x1="10" y1="535.824" x2="2837.816" y2="535.824" style="stroke:#000;stroke-width:1;"/><line x1="10" y1="538.824" x2="2837.816" y2="538.824" style="stroke:#000;stroke-width:1;"/><rect x="1101.398" y="525.258" width="645.021" height="23.133" fill="#EEE" style="stroke:#000;stroke-width:2;"/><text x="1107.398" y="541.325" fill="#000" font-size="13" textLength="626.495" font-weight="700">Upward regulatory reporting via interchange adapter + webhook (ADR-072/ADR-060)</text><polygon points="1535.11,590.656,1545.11,594.656,1535.11,598.656,1539.11,594.656" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="63.647" y1="594.656" x2="1541.11" y2="594.656" style="stroke:#181818;stroke-width:1;"/><text x="70.647" y="582.024" fill="#000" font-size="13" font-weight="700">7</text><text x="83.693" y="574.458" fill="#000" font-size="13" textLength="245.864">enqueue accepted "case-9001" event</text><text x="83.693" y="589.59" fill="#000" font-size="13" textLength="377.92">matching WebhookSubscription "notify-state-health-dept"</text><polygon points="1925.27,634.922,1935.27,638.922,1925.27,642.922,1929.27,638.922" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1547.11" y1="638.922" x2="1931.27" y2="638.922" style="stroke:#181818;stroke-width:1;"/><text x="1554.11" y="626.29" fill="#000" font-size="13" font-weight="700">8</text><text x="1567.156" y="618.723" fill="#000" font-size="13" textLength="265.034">transform CaseReported payload into an</text><text x="1567.156" y="633.856" fill="#000" font-size="13" textLength="353.114">HL7v2 case-report message (Hl7V2Adapter, ADR-072)</text><polygon points="2324.925,679.188,2334.925,683.188,2324.925,687.188,2328.925,683.188" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1937.27" y1="683.188" x2="2330.925" y2="683.188" style="stroke:#181818;stroke-width:1;"/><text x="1944.27" y="670.555" fill="#000" font-size="13" font-weight="700">9</text><text x="1957.315" y="662.989" fill="#000" font-size="13" textLength="144.542">deliver over MLLP/TCP</text><text x="1957.315" y="678.122" fill="#000" font-size="13" textLength="362.61">(HL7v2's real transport -- NOT an HTTP POST, ADR-072)</text><polygon points="1948.27,708.32,1938.27,712.32,1948.27,716.32,1944.27,712.32" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1942.27" y1="712.32" x2="2335.925" y2="712.32" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="1954.27" y="707.254" fill="#000" font-size="13" textLength="18.091" font-weight="700">10</text><text x="1976.36" y="707.254" fill="#000" font-size="13" textLength="140.01">MLLP application ACK</text><path d="M2341.925,725.32 L2341.925,825.32 L2831.925,825.32 L2831.925,735.32 L2821.925,725.32 L2341.925,725.32" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M2821.925,725.32 L2821.925,735.32 L2831.925,735.32 L2821.925,725.32" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="2347.925" y="742.387" fill="#000" font-size="13" textLength="435.081">A FhirAdapter subscription would instead POST a FHIR Bundle over</text><text x="2347.925" y="757.52" fill="#000" font-size="13" textLength="469.892">ordinary HTTP with webhook-id/webhook-timestamp/webhook-signature</text><text x="2347.925" y="772.653" fill="#000" font-size="13" textLength="437.404">headers (Standard Webhooks, ADR-060) -- FHIR is HTTP-native and</text><text x="2347.925" y="787.786" fill="#000" font-size="13" textLength="432.447">needs no MLLP bridge. Both adapters compose ahead of the same</text><text x="2347.925" y="802.918" fill="#000" font-size="13" textLength="444.126">webhook delivery step; this diagram shows the HL7v2 path since its</text><text x="2347.925" y="818.051" fill="#000" font-size="13" textLength="346.195">transport is the one easy to misrepresent (ADR-072).</text><?plantuml-src ZLPTJ-j647tthnZbfKJ5mBr8HKr59Q0WKBaG4ThxKFemyKxi5VQkwrqJ_EyxisiJ1uBQF4IElVDnpfmv3hRUchPQKfCezBX4Hp2vD5xx3XRUDlHazh3rXMsqHwzVQ3e1T43XH3YGrDXudUaQZOV9dAY1HMSok6_zqhvo-5bTtwWPE8wdb5wngalQXxFV7jAZu-EOpd50FFzPjWKrBpgZjzFzx-tZ2-q9Bj7v1ygrDLXozNWvWzQbn4zYlPhpohaTuT_fi_0rZSFbt7RuTreMrZwFW0l4duvYp3e-tONokZpvy-kPmjfJCuITV8rXHNdIFtdNgx09y-kRExWn_7I56KCtkJOoiM-tj_F3nuivbDfvCjJqD4lGekDRLPASda84bzRQ6581LIhSGaDrgJCUjpNGe_WoXTFJP3HsI7yTZMt6YlYdfPO0iuouNGMJZBMK_dnqz6K2zCAHiB8DM3dU6XLY1t70P4iS4rP7MTergTYWcy5Vatv-ax-doQRi-oPMkcGk84EZj1A254z9cuX4y3bOTk-IFvdpowlxXqjOjhfKskH0c1KXBIpHy-L00QGf6Ei1WQ4sNUfrHP0Lb3rF4opzXsBWCS-PYRNs1Q01Z7MPtZmm-q6k-_06Sve0VCJPgtu6scHbgsW7oTg0BwZlF58jl7-erUVlCqg1OIbcKBUksC9-V0ovTKxNGAzPWIOdwMy8O5xUjOVPCxGrUCkzQCVBouIPZEwYqL3fw3_80gNTJhh6wndfahNyXAv15ZjOucNGhBKE3Dze1ZxLas7-q7Ix-HiNvuAi1O96vuK7knfx6F3dAaYHsqSV1c9ZPzexAbVxmztQQkucQ6r4Y0iPa9SCouPGSJiamkHGocItXgbCeoJv0Pk3wBqXfnLJtOKCcQrgQnZllXoIJ8SZvUOSSC3dY24A5Dvk5MpXZtgDJU2zBP5tlHD3i6m-tCABHYQBaKKP04PpWXy7WuF1lmu7-zjX75jc-7-yuybKCX3feBVPHRjqMQFh8A09zwzNNHfjf23UnY9Ld6kIR9MIsXj7dO5lq3WURmKNNF0Xe1GdnAwqg0IePJKycUlRavUl49gAL415pY7ZtnkRT_zMO-zEDbM263V6E-D1breqP-LhS6gsmb3a1oTpAcDdeH9F-Ex-KVpZ-l5n3lFxnUEepYXpMCCnEiaDM6-y_EpYz-ITQ4Tl180pk2fqC_JjnWolRLiA8NoIYP4cU4clhcyUu9nNfAI0XbFOXYqKMJAXsR3C_GHIhGw7Iz4VbwxgjpjEvwpzblzE0F3yb5Zr7h_aZ18fzZDtFN0H5TCIolCcIwdKX7ydJ9EIpIHIJZGVA5WsMkLq0ETMh2MYSt4vs8XGoWaNieyEA-bWq78_gevvelgNQ6PAOzvW1QwmQnU2eZfgvEoEZOHaoJd9PeGwdkDLv7UBwyGNA-rOIRokuaPlh_o3P5Z6Vm40?></g></svg>