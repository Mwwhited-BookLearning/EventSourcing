<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:1974px;height:562px;background:#FFFFFF;" width="1974px" height="562px" viewBox="0 0 1974 562" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--class reported--><g class="entity" data-qualified-name="reported" id="ent0001" data-source-line="4"><rect x="504.91" y="141.89" width="611.963" height="172.672" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="710.653" y="159.885" fill="#000" font-size="14" textLength="200.478">StoredEvent (CaseReported)</text><line x1="505.91" y1="168.187" x2="1115.873" y2="168.187" style="stroke:#181818;stroke-width:0.5;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="515.91" cy="181.835" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="524.91" y="185.182" fill="#000" font-size="14" textLength="218.032">SequenceNumber : bigint «PK»</text><line x1="505.91" y1="192.484" x2="1115.873" y2="192.484" style="stroke:#181818;stroke-width:1;"/><text x="510.91" y="209.479" fill="#000" font-size="14" textLength="166.852">EventId : uuid «unique»</text><text x="510.91" y="225.776" fill="#000" font-size="14" textLength="342.474">EntityId : string  ' state-example:Case:case-9001</text><text x="510.91" y="242.073" fill="#000" font-size="14" textLength="257.127">EventType : string  ' "CaseReported"</text><text x="510.91" y="258.369" fill="#000" font-size="14" textLength="408.167">ActorId : string  ' verified reporting clinician/lab (ADR-064)</text><text x="510.91" y="274.666" fill="#000" font-size="14" textLength="599.963">Payload : text  ' ConditionCode, PatientIdentifier, ReportingFacility, JurisdictionRegion</text><text x="510.91" y="290.963" fill="#000" font-size="14" textLength="427.451">AuthorityStatus : string {pending_review|accepted|rejected}</text><text x="510.91" y="307.26" fill="#000" font-size="14" textLength="199.24">AuthorityDecisionRef : uuid?</text></g><!--class caseRow--><g class="entity" data-qualified-name="caseRow" id="ent0002" data-source-line="16"><rect x="7" y="374.56" width="621.779" height="172.672" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="246.796" y="392.555" fill="#000" font-size="14" textLength="142.188">CaseEntityStoreRow</text><line x1="8" y1="400.857" x2="627.779" y2="400.857" style="stroke:#181818;stroke-width:0.5;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="18" cy="414.505" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="27" y="417.852" fill="#000" font-size="14" textLength="146.897">EntityId : string «PK»</text><line x1="8" y1="425.154" x2="627.779" y2="425.154" style="stroke:#181818;stroke-width:1;"/><text x="13" y="442.149" fill="#000" font-size="14" textLength="193.354">EntityType : string  ' "Case"</text><text x="13" y="458.446" fill="#000" font-size="14" textLength="310.133">ConditionCode : string  ' e.g. ICD-10 "A36.9"</text><text x="13" y="474.743" fill="#000" font-size="14" textLength="413.034">ClassificationStatus : string {Confirmed|Probable|Suspect}</text><text x="13" y="491.039" fill="#000" font-size="14" textLength="609.779">JurisdictionRegion : string  ' denormalized, matches AppId's AllowedRegions (ADR-061)</text><text x="13" y="507.336" fill="#000" font-size="14" textLength="172.266">ReportingFacility : string</text><text x="13" y="523.633" fill="#000" font-size="14" textLength="476.807">AuthorityStatus : string  ' always "accepted" here -- gated, ADR-042</text><text x="13" y="539.93" fill="#000" font-size="14" textLength="106.101">Version : bigint</text></g><!--class liveRow--><g class="entity" data-qualified-name="liveRow" id="ent0003" data-source-line="28"><rect x="1054.83" y="399" width="498.117" height="123.781" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1218.501" y="416.995" fill="#000" font-size="14" textLength="170.775">CaseLiveEntityStoreRow</text><line x1="1055.83" y1="425.297" x2="1551.947" y2="425.297" style="stroke:#181818;stroke-width:0.5;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="1065.83" cy="438.945" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="1074.83" y="442.292" fill="#000" font-size="14" textLength="146.897">EntityId : string «PK»</text><line x1="1055.83" y1="449.594" x2="1551.947" y2="449.594" style="stroke:#181818;stroke-width:1;"/><text x="1060.83" y="466.589" fill="#000" font-size="14" textLength="156.454">ConditionCode : string</text><text x="1060.83" y="482.886" fill="#000" font-size="14" textLength="486.117">ClassificationStatus : string {Confirmed|Probable|Suspect|NotACase}</text><text x="1060.83" y="499.183" fill="#000" font-size="14" textLength="427.451">AuthorityStatus : string {pending_review|accepted|rejected}</text><text x="1060.83" y="515.479" fill="#000" font-size="14" textLength="172.266">ReportingFacility : string</text></g><!--class contactLink--><g class="entity" data-qualified-name="contactLink" id="ent0004" data-source-line="37"><rect x="491.7" y="7" width="638.37" height="74.891" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="692.582" y="24.995" fill="#000" font-size="14" textLength="236.605">ContactTracingLink (EventParent)</text><line x1="492.7" y1="33.297" x2="1129.07" y2="33.297" style="stroke:#181818;stroke-width:0.5;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="502.7" cy="46.945" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="511.7" y="50.292" fill="#000" font-size="14" textLength="612.37">ChildEventId : uuid «PK, FK»  ' the contact's own CaseReported/ContactIdentified event</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="502.7" cy="63.242" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="511.7" y="66.589" fill="#000" font-size="14" textLength="474.093">ParentEventId : uuid «PK»     ' the index case's CaseReported event</text><line x1="492.7" y1="73.891" x2="1129.07" y2="73.891" style="stroke:#181818;stroke-width:0.5;"/></g><g class="entity" data-qualified-name="GMN8" id="ent0009" data-source-line="47"><path d="M664.08,433.19 L664.08,457.23 L629.14,461.23 L664.08,465.23 L664.08,488.588 A0,0 0 0 0 664.08,488.588 L1019.69,488.588 A0,0 0 0 0 1019.69,488.588 L1019.69,443.19 L1009.69,433.19 L664.08,433.19 A0,0 0 0 0 664.08,433.19" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1009.69,433.19 L1009.69,443.19 L1019.69,443.19 L1009.69,433.19" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="670.08" y="450.257" fill="#000" font-size="13" textLength="334.61">ClassificationStatus never holds "NotACase" here --</text><text x="670.08" y="465.39" fill="#000" font-size="13" textLength="328.123">a not-a-case decision is AuthorityStatus "rejected"</text><text x="670.08" y="480.523" fill="#000" font-size="13" textLength="289.745">and never reaches this row at all (ADR-042).</text></g><g class="entity" data-qualified-name="GMN11" id="ent0012" data-source-line="53"><path d="M1588.05,440.76 L1588.05,457.23 L1553.34,461.23 L1588.05,465.23 L1588.05,481.026 A0,0 0 0 0 1588.05,481.026 L1959.72,481.026 A0,0 0 0 0 1959.72,481.026 L1959.72,450.76 L1949.72,440.76 L1588.05,440.76 A0,0 0 0 0 1588.05,440.76" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1949.72,440.76 L1949.72,450.76 L1959.72,450.76 L1949.72,440.76" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="1594.05" y="457.827" fill="#000" font-size="13" textLength="350.67">The only place "NotACase" is ever visible -- relabeled,</text><text x="1594.05" y="472.96" fill="#000" font-size="13" textLength="349.629">never deleted, per README.md's governing principle.</text></g><!--link reported to caseRow--><g class="link" data-entity-1="ent0001" dat