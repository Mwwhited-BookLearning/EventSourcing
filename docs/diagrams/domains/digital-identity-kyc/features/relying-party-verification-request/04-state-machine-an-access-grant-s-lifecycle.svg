<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:1087px;height:635px;background:#FFFFFF;" width="1087px" height="635px" viewBox="0 0 1087 635" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="start_entity" data-qualified-name=".start." id="ent0001" data-source-line="1"><ellipse cx="312.58" cy="16" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="Issued" id="ent0002" data-source-line="1"><rect x="280.04" y="133" width="65.09" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="280.04" y1="159.297" x2="345.13" y2="159.297" style="stroke:#181818;stroke-width:0.5;"/><text x="290.04" y="150.995" fill="#000" font-size="14" textLength="45.09">Issued</text></g><g class="entity" data-qualified-name="Active" id="ent0004" data-source-line="2"><rect x="280.81" y="300.26" width="63.552" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="280.81" y1="326.557" x2="344.362" y2="326.557" style="stroke:#181818;stroke-width:0.5;"/><text x="290.81" y="318.255" fill="#000" font-size="14" textLength="43.552">Active</text></g><g class="entity" data-qualified-name="Expired" id="ent0007" data-source-line="4"><rect x="7" y="477.79" width="73.163" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="7" y1="504.087" x2="80.163" y2="504.087" style="stroke:#181818;stroke-width:0.5;"/><text x="17" y="495.785" fill="#000" font-size="14" textLength="53.163">Expired</text></g><g class="entity" data-qualified-name="Revoked" id="ent0009" data-source-line="5"><rect x="541.18" y="477.79" width="80.799" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="541.18" y1="504.087" x2="621.979" y2="504.087" style="stroke:#181818;stroke-width:0.5;"/><text x="551.18" y="495.785" fill="#000" font-size="14" textLength="60.799">Revoked</text></g><g class="end_entity" data-qualified-name=".end." id="ent0011" data-source-line="6"><ellipse cx="311.58" cy="610.06" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="311.58" cy="610.06" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN14" id="ent0015" data-source-line="10"><path d="M684.18,290 L684.18,321.26 L344.64,325.26 L684.18,329.26 L684.18,360.531 A0,0 0 0 0 684.18,360.531 L1072.989,360.531 A0,0 0 0 0 1072.989,360.531 L1072.989,300 L1062.989,290 L684.18,290 A0,0 0 0 0 684.18,290" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1062.989,290 L1062.989,300 L1072.989,300 L1062.989,290" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="690.18" y="307.067" fill="#000" font-size="13" textLength="314.342">Every successful read under this grant writes its</text><text x="690.18" y="322.2" fill="#000" font-size="13" textLength="367.809">own AccessLogEntry (ADR-045) -- the grant's OWN state</text><text x="690.18" y="337.333" fill="#000" font-size="13" textLength="344.919">here is unaffected by how many times it's used; only</text><text x="690.18" y="352.465" fill="#000" font-size="13" textLength="314.209">time and an explicit revocation move it forward.</text></g><g class="entity" data-qualified-name="GMN17" id="ent0018" data-source-line="17"><path d="M115.22,467.53 L115.22,498.79 L80.61,502.79 L115.22,506.79 L115.22,538.061 A0,0 0 0 0 115.22,538.061 L505.952,538.061 A0,0 0 0 0 505.952,538.061 L505.952,477.53 L495.952,467.53 L115.22,467.53 A0,0 0 0 0 115.22,467.53" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M495.952,467.53 L495.952,477.53 L505.952,477.53 L495.952,467.53" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="121.22" y="484.597" fill="#000" font-size="13" textLength="369.732">A token-exchange attempt against an expired grant fails</text><text x="121.22" y="499.73" fill="#000" font-size="13" textLength="346.366">with invalid_grant (ADR-036's mechanics) before any</text><text x="121.22" y="514.863" fill="#000" font-size="13" textLength="358.554">GraphQL read is ever reached -- no AccessLogEntry for</text><text x="121.22" y="529.995" fill="#000" font-size="13" textLength="347.591">a failed exchange, only for an actual read (ADR-045).</text></g><!--link *start* to Issued--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk3" data-source-line="1" data-link-type="dependency"><path d="M312.58,26.18 C312.58,47.54 312.58,96.09 312.58,127.66" style="stroke:#181818;stroke-width:1;" fill="none" id="*start*-to-Issued"/><polygon points="312.58,132.66,316.58,123.66,312.58,127.66,308.58,123.66,312.58,132.66" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="377.336" y="69.067" fill="#000" font-size="13" textLength="147.888">accessGrant published</text><text x="357.376" y="84.2" fill="#000" font-size="13" textLength="187.808">(customer delegates a UCAN</text><text x="313.58" y="99.333" fill="#000" font-size="13" textLength="275.399">capped at their own claim level, ADR-043)</text></g><!--link Issued to Active--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk5" data-source-line="2" data-link-type="dependency"><path d="M312.58,183.38 C312.58,214.63 312.58,263.48 312.58,294.78" style="stroke:#181818;stroke-width:1;" fill="none" id="Issued-to-Active"/><polygon points="312.58,299.78,316.58,290.78,312.58,294.78,308.58,290.78,312.58,299.78" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="314.456" y="226.067" fill="#000" font-size="13" textLength="270.823">delivered to the relying party out-of-band</text><text x="333.813" y="241.2" fill="#000" font-size="13" textLength="232.108">(not a state change in this design --</text><text x="313.58" y="256.333" fill="#000" font-size="13" textLength="272.575">the UCAN itself is self-verifying, ADR-036)</text></g><!--link Active to Active--><g class="link" data-entity-1="ent0004" data-entity-2="ent0004" id="lnk6" data-source-line="3" data-link-type="dependency"><path d="M344.53,309.47 C362.61,306.39 379.36,311.65 379.36,325.26 C379.36,338.87 367.539,344.982 349.459,341.892" style="stroke:#181818;stroke-width:1;" fill="none" id="Active-to-Active"/><polygon points="344.53,341.05,352.728,346.509,349.459,341.892,354.075,338.623,344.53,341.05" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="394.463" y="314.827" fill="#000" font-size="13" textLength="257.467">relying party exchanges + reads again,</text><text x="385.36" y="329.96" fill="#000" font-size="13" textLength="275.672">before ExpiresAt (a grant is not consumed</text><text x="389.556" y="345.093" fill="#000" font-size="13" textLength="267.281">by one use -- multiple reads are allowed)</text></g><!--link Active to Expired--><g class="link" data-entity-1="ent0004" data-entity-2="ent0007" id="lnk8" data-source-line="4" data-link-type="dependency"><path d="M280.48,335.16 C247.2,345.3 194.54,363.98 154.58,390.53 C117.76,414.99 86.286,449.205 65.796,473.855" style="stroke:#181818;stroke-width:1;" fill="none" id="Active-to-Expired"/><polygon points="62.6,477.7,71.429,473.336,65.796,473.855,65.277,468.222,62.6,477.7" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="176.035" y="403.597" fill="#000" font-size="13" textLength="303.697">ExpiresAt passes with no accessGrantRevoked</text><text x="156.827" y="418.73" fill="#000" font-size="13" textLength="342.113">(checked live, at each token-exchange/introspection</text><text x="155.58" y="433.863" fill="#000" font-size="13" textLength="344.608">call -- ADR-043's own revocation-check requirement)</text></g><!--link Active to Revoked--><g class="link" data-entity-1="ent0004" data-entity-2="ent0009" id="lnk10" data-source-line="5" data-link-type="dependency"><path d="M344.71,330.63 C385.37,337.5 455.96,354.01 504.58,390.53 C535.2,413.53 555.807,447.876 568.367,473.046" style="stroke:#181818;stroke-width:1;" fill="none" id="Active-to-Revoked"/><polygon points="570.6,477.52,570.161,467.681,568.367,473.046,563.002,471.253,570.6,477.52" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="547.6" y="411.097" fill="#000" font-size="13" textLength="319.37">accessGrantRevoked published by the customer,</text><text x="625.975" y="426.23" fill="#000" font-size="13" textLength="162.621">before natural expiration</text></g><!--link Expired to *end*--><g class="link" data-entity-1="ent0007" data-entity-2="ent0011" id="lnk12" data-source-line="6" data-link-type="dependency"><path d="M79.49,528.27 C85.4,531.81 91.56,535.2 97.58,538.06 C172.21,573.46 264.344,597.55 296.134,605.34" style="stroke:#181818;stroke-width:1;" fill="none" id="Expired-to-*end*"/><polygon points="300.99,606.53,293.201,600.503,296.134,605.34,291.297,608.273,300.99,606.53" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Revoked to *end*--><g class="link" data-entity-1="ent0009" data-entity-2="ent0011" id="lnk13" data-source-line="7" data-link-type="dependency"><path d="M542.87,528.17 C536.54,531.71 529.96,535.14 523.58,538.06 C449.08,572.08 358.209,596.992 326.859,605.142" style="stroke:#181818;stroke-width:1;" fill="none" id="Revoked-to-*end*"/><polygon points="322.02,606.4,331.737,608.007,326.859,605.142,329.724,600.264,322.02,606.4" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><?plantuml-src NLDDRzD05BpdLxmRIOa1gS019AG8AeHK5L49SMWgj5a_swkkTyr-9Cs_PzxQRfiSejXhlvbvC-ExYtkggY_q8yRCDNqYfJN7-3qebsZ8EsjYn_NMBNMEoVSSg6