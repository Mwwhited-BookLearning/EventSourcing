"71.297" width="126.458" height="46.594" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="618.072" y="91.292" fill="#000" font-size="14" textLength="112.458">PublishEndpoint</text><text x="649.47" y="107.589" fill="#000" font-size="14" textLength="49.663">(Inbox)</text><text x="1098.145" y="115.589" fill="#000" font-size="14" textLength="69.809">Event Log</text><path d="M1118.049,66.594 C1118.049,56.594 1136.049,56.594 1136.049,56.594 C1136.049,56.594 1154.049,56.594 1154.049,66.594 L1154.049,92.594 C1154.049,102.594 1136.049,102.594 1136.049,102.594 C1136.049,102.594 1118.049,102.594 1118.049,92.594 L1118.049,66.594" style="stroke:#181818;stroke-width:0.5;" fill="#E2E2F0"/><path d="M1118.049,66.594 C1118.049,76.594 1136.049,76.594 1136.049,76.594 C1136.049,76.594 1154.049,76.594 1154.049,66.594" style="stroke:#181818;stroke-width:0.5;" fill="none"/><text x="1278.484" y="99.292" fill="#000" font-size="14" textLength="93.611">Relying party</text><text x="1183.954" y="115.589" fill="#000" font-size="14" textLength="282.673">(acme-bank, DID: did:key:z6MkBank1...)</text><ellipse cx="1328.29" cy="34.797" rx="8" ry="8" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;"/><path d="M1328.29,42.797 L1328.29,69.797 M1315.29,50.797 L1341.29,50.797 M1328.29,69.797 L1315.29,84.797 M1328.29,69.797 L1341.29,84.797" style="stroke:#181818;stroke-width:0.5;" fill="none"/><text x="112.925" y="600.94" fill="#000" font-size="14" textLength="110.906">Customer client</text><text x="54.447" y="617.237" fill="#000" font-size="14" textLength="227.862">(holds own DID + baseline claim</text><text x="10" y="633.534" fill="#000" font-size="14" textLength="316.757">identity:self-view, entityScope=own EntityId)</text><ellipse cx="171.378" cy="645.336" rx="8" ry="8" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;"/><path d="M171.378,653.336 L171.378,680.336 M158.378,661.336 L184.378,661.336 M171.378,680.336 L158.378,695.336 M171.378,680.336 L184.378,695.336" style="stroke:#181818;stroke-width:0.5;" fill="none"/><rect x="611.072" y="587.945" width="126.458" height="46.594" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="618.072" y="607.94" fill="#000" font-size="14" textLength="112.458">PublishEndpoint</text><text x="649.47" y="624.237" fill="#000" font-size="14" textLength="49.663">(Inbox)</text><text x="1098.145" y="600.94" fill="#000" font-size="14" textLength="69.809">Event Log</text><path d="M1118.049,614.242 C1118.049,604.242 1136.049,604.242 1136.049,604.242 C1136.049,604.242 1154.049,604.242 1154.049,614.242 L1154.049,640.242 C1154.049,650.242 1136.049,650.242 1136.049,650.242 C1136.049,650.242 1118.049,650.242 1118.049,640.242 L1118.049,614.242" style="stroke:#181818;stroke-width:0.5;" fill="#E2E2F0"/><path d="M1118.049,614.242 C1118.049,624.242 1136.049,624.242 1136.049,624.242 C1136.049,624.242 1154.049,624.242 1154.049,614.242" style="stroke:#181818;stroke-width:0.5;" fill="none"/><text x="1278.484" y="600.94" fill="#000" font-size="14" textLength="93.611">Relying party</text><text x="1183.954" y="617.237" fill="#000" font-size="14" textLength="282.673">(acme-bank, DID: did:key:z6MkBank1...)</text><ellipse cx="1328.29" cy="629.039" rx="8" ry="8" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;"/><path d="M1328.29,637.039 L1328.29,664.039 M1315.29,645.039 L1341.29,645.039 M1328.29,664.039 L1315.29,679.039 M1328.29,664.039 L1341.29,679.039" style="stroke:#181818;stroke-width:0.5;" fill="none"/><line x1="171.378" y1="253.953" x2="213.378" y2="253.953" style="stroke:#181818;stroke-width:1;"/><line x1="213.378" y1="253.953" x2="213.378" y2="266.953" style="stroke:#181818;stroke-width:1;"/><line x1="172.378" y1="266.953" x2="213.378" y2="266.953" style="stroke:#181818;stroke-width:1;"/><polygon points="182.378,262.953,172.378,266.953,182.378,270.953,178.378,266.953" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="178.378" y="195.922" fill="#000" font-size="13" font-weight="700">1</text><text x="191.424" y="142.958" fill="#000" font-size="13" textLength="213.649">mint a UCAN delegation naming:</text><text x="191.424" y="158.09" fill="#000" font-size="13" textLength="235.473">- grantee DID: did:key:z6MkBank1...</text><text x="191.424" y="173.223" fill="#000" font-size="13" textLength="339.263">- delegated claim: "identity:verification-status:read"</text><text x="199.688" y="188.356" fill="#000" font-size="13" textLength="425.28">(a SUBSET of customer's own identity:self-view -- ADR-043's cap)</text><text x="191.424" y="203.489" fill="#000" font-size="13" textLength="346.576">- entityScope: "kyc:ApplicantIdentity:applicant-1001"</text><text x="191.424" y="218.622" fill="#000" font-size="13" textLength="149.76">- expiresAt: now + 24h</text><text x="191.424" y="233.754" fill="#000" font-size="13" textLength="475.877">(self-verifying, signed with customer's own DID key -- ADR-036/ADR-043,</text><text x="191.424" y="248.887" fill="#000" font-size="13" textLength="395.643">no server round-trip needed to CREATE the delegation itself)</text><polygon points="662.301,352.617,672.301,356.617,662.301,360.617,666.301,356.617" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="171.378" y1="356.617" x2="668.301" y2="356.617" style="stroke:#181818;stroke-width:1;"/><text x="178.378" y="321.286" fill="#000" font-size="13" font-weight="700">2</text><text x="191.424" y="291.02" fill="#000" font-size="13" textLength="174.662">POST /publish/accessGrant</text><text x="191.424" y="306.153" fill="#000" font-size="13" textLength="454.34">{ payload: { GrantId: "grant-7001", GranterActorId: "applicant-1001",</text><text x="199.688" y="321.286" fill="#000" font-size="13" textLength="238.45">GranteeDid: "did:key:z6MkBank1...",</text><text x="199.688" y="336.418" fill="#000" font-size="13" textLength="334.128">DelegatedClaim: "identity:verification-status:read",</text><text x="199.688" y="351.551" fill="#000" font-size="13" textLength="432.917">EntityScope: "kyc:ApplicantIdentity:applicant-1001", ExpiresAt } }</text><polygon points="1124.049,396.883,1134.049,400.883,1124.049,404.883,1128.049,400.883" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="674.301" y1="400.883" x2="1130.049" y2="400.883" style="stroke:#181818;stroke-width:1;"/><text x="681.301" y="388.25" fill="#000" font-size="13" font-weight="700">3</text><text x="694.347" y="380.684" fill="#000" font-size="13" textLength="424.703">INSERT StoredEvent (accessGrant, AuthorityStatus: "accepted" --</text><text x="694.347" y="395.817" fill="#000" font-size="13" textLength="321.249">ordinary authenticated publish, ADR-042 default)</text><polygon points="182.378,426.016,172.378,430.016,182.378,434.016,178.378,430.016" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="176.378" y1="430.016" x2="673.301" y2="430.016" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="188.378" y="424.95" fill="#000" font-size="13" font-weight="700">4</text><text x="201.424" y="424.95" fill="#000" font-size="13" textLength="170.212">202 { status: "received" }</text><path d="M76.737,443.016 L76.737,513.016 L1229.737,513.016 L1229.737,453.016 L1219.737,443.016 L76.737,443.016" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1219.737,443.016 L1219.737,453.016 L1229.737,453.016 L1219.737,443.016" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="452.665" y="460.083" fill="#000" font-size="13" textLength="393.098">Recorded as an ordinary event, per ADR-043's own Decision</text><text x="452.665" y="475.215" fill="#000" font-size="13" textLength="382.123">("grant issuance and revocation are ordinary events, not a</text><text x="452.665" y="490.348" fill="#000" font-size="13" textLength="353.114">new persistence mechanism") -- auditable, queryable,</text><text x="452.665" y="505.481" fill="#000" font-size="13" textLength="353.19">never deleted, same as everything else in this design.</text><polygon points="1316.29,565.945,1326.29,569.945,1316.29,573.945,1320.29,569.945" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="171.378" y1="569.945" x2="1322.29" y2="569.945" style="stroke:#181818;stroke-width:1;"/><text x="178.378" y="549.747" fill="#000" font-size="13" font-weight="700">5</text><text x="191.424" y="534.614" fill="#000" font-size="13" textLength="333.5">deliver the raw UCAN delegation token out-of-band</text><text x="191.424" y="549.747" fill="#000" font-size="13" textLength="426.023">(e.g. a deep link/QR code shown in the customer's banking app --</text><text x="191.424" y="564.879" fill="#000" font-size="13" textLength="172.555">not designed further here)</text><?plantuml-src bLJ9Rjim4BtxAmQwD4ObPscG0W9Qm8s5ma2Nr4vklj3as28iaof9sLM3_7jdACjPsWBjGO14pVButfiHJR2csIxH3OGCra5otVXWj-X0LXfDM9YJqbRAWzqRc4mdy1gMmcEb3LA4qDk5qOhYT6XpEbvbEutx5BgJkRGrlkFC8dvFrJ01uK4UUWnguOAMkXOcG7BJB2ljoyAeskhOUMgMzaUNelbre4GGt1wIOaSju9DTnx_8N_JHNsA6LQlD6hX-IuM4t6As56QJyXroK5hb6sppdrUVDn_e-7mq6dLzE6Wmw052zlu8DeSjeG81TzVZBw2mmhK8sXemWdwiyuN9OEte9eX_Ry91XrHK7O4v94S6T-ZqIijOD_D1XCRd3eLA5WRWHC3yxiEyk0MxEg9wrIdpkmQGPJ2UpBApopSK8qKzvDvFTA6-crRcuxgkgAC9qxw4w4-oyxEpyoIc_QYrGpyEEHYx9mzSN9P4QzUCCJFRANYzDdIjlGxbIu1i7IBZYEhDrUa1NRemne97HuN0sSQeB3XTWq5KL2nOk9uLuzi2GebFQTU1sm-VYnLjaiFDr_ajdDQTeKw5bEZzHzPcOUx956rbXShX7kBPb5wJg5psbY-STiVencoc-FS59IdBqGNXH7F0dxJkmYQzsjV_B7RCA_vVgHIANYTuW8T198DPwSSZX-cNUJ6xXJbT35KtGoTFw4bXt8JIEkxS0QAxq--Qy2UatS9OfxGHhWL1WGn3HYSVg4uFbhiWeLQYgSAm1_5ia2xEBeXyttTmA57lkCF3mDY0ODaAVNZwEDq0CvI4W1hIg0e3HpGn98MQyXvD7ts7KdiYc79FEf51Uzy88v4AA72uivq481o-AEXJiZkDF2KRcYYgxhKFoBbRbAKmsc-J8NjQD4hJQgemXUyDkZQ-nZI-2hkMMA814Liyx2lNXf9N55QqphGXTsjFWJn2em4ICcRYkRbvD-LSJ7DH7WSdzh-jes0tICmq8RChtdcA1XL7wn5jBeLO0wtkpUct6KYh47mPjuU9rPwCBBTYTEImA3lJq