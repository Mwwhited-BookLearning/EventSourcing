="282.672" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="964.6" y="286.019" fill="#000" font-size="14" textLength="133.376">AppId : string «PK»</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="955.6" cy="298.969" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="964.6" y="302.316" fill="#000" font-size="14" textLength="165.108">RoleName : string «PK»</text><line x1="945.6" y1="309.617" x2="1134.708" y2="309.617" style="stroke:#181818;stroke-width:1;"/><text x="950.6" y="326.613" fill="#000" font-size="14" textLength="148.278">Permissions : string[]</text></g><g class="entity" data-qualified-name="GMN12" id="ent0013" data-source-line="73"><path d="M202.03,207.08 L202.03,276.43 L167.64,280.43 L202.03,284.43 L202.03,353.275 A0,0 0 0 0 202.03,353.275 L630.283,353.275 A0,0 0 0 0 630.283,353.275 L630.283,217.08 L620.283,207.08 L202.03,207.08 A0,0 0 0 0 202.03,207.08" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M620.283,207.08 L620.283,217.08 L630.283,217.08 L620.283,207.08" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="208.03" y="224.147" fill="#000" font-size="13" textLength="407.253">A caller holding EITHER identity:review OR identity:aml-review</text><text x="208.03" y="239.28" fill="#000" font-size="13" textLength="401.064">may decide ANY authorityDecision -- including ones targeting</text><text x="208.03" y="254.413" fill="#000" font-size="13" textLength="351.419">an ordinary identity-claim review. This is a deliberate,</text><text x="208.03" y="269.545" fill="#000" font-size="13" textLength="400.651">named simplification, not a gap: RequiredClaims is evaluated</text><text x="208.03" y="284.678" fill="#000" font-size="13" textLength="376.645">per EVENT TYPE, not per target-event-type-being-decided</text><text x="208.03" y="299.811" fill="#000" font-size="13" textLength="397.135">(ADR-050), and ADR-046 already declines separation-of-duty</text><text x="208.03" y="314.944" fill="#000" font-size="13" textLength="368.285">constraints by design. A finer split would need a second,</text><text x="208.03" y="330.077" fill="#000" font-size="13" textLength="381.475">narrower decision event type and a second resolver -- real</text><text x="208.03" y="345.209" fill="#000" font-size="13" textLength="379.615">framework mechanism this doc deliberately does not add.</text></g><!--link decisionEvent to screenEvent--><g class="link" data-entity-1="ent0002" data-entity-2="ent0001" id="lnk7" data-source-line="66" data-link-type="association"><path d="M787.16,537.37 C787.16,556.19 787.16,562.09 787.16,581.82" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="decisionEvent-to-screenEvent" codeLine="66"/><line x1="787.16" y1="585.82" x2="787.16" y2="596.82" style="stroke:#181818;stroke-width:1;"/><ellipse cx="787.16" cy="585.82" rx="4" ry="4" fill="none" style="stroke:#181818;stroke-width:1;"/><line x1="791.16" y1="592.82" x2="783.16" y2="592.82" style="stroke:#181818;stroke-width:1;"/><text x="559.559" y="548.167" fill="#000" font-size="13" textLength="195.444">targetEventId -- denormalized</text><text x="528.16" y="563.3" fill="#000" font-size="13" textLength="258.242">back-pointer, sets AuthorityDecisionRef</text></g><!--link sarEvent to decisionEvent--><g class="link" data-entity-1="ent0003" data-entity-2="ent0002" id="lnk8" data-source-line="67" data-link-type="association"><path d="M787.16,350.57 C787.16,370.97 787.16,378.09 787.16,397.95" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="sarEvent-to-decisionEvent" codeLine="67"/><line x1="787.16" y1="401.95" x2="787.16" y2="412.95" style="stroke:#181818;stroke-width:1;"/><ellipse cx="787.16" cy="401.95" rx="4" ry="4" fill="none" style="stroke:#181818;stroke-width:1;"/><line x1="791.16" y1="408.95" x2="783.16" y2="408.95" style="stroke:#181818;stroke-width:1;"/><text x="577.16" y="394.827" fill="#000" font-size="13" textLength="209.86">TargetScreeningEventId chain --</text><text x="586.701" y="409.96" fill="#000" font-size="13" textLength="190.779">logical only, via the accepted</text><text x="579.293" y="425.093" fill="#000" font-size="13" textLength="205.594">screening event, never a DB FK</text></g><!--link role to decisionEvent--><g class="link" data-entity-1="ent0006" data-entity-2="ent0002" id="lnk9" data-source-line="68" data-link-type="dependency"><path d="M975.74,334.31 C975.74,392.09 975.74,475.43 975.74,475.43 C975.74,475.43 950.66,475.43 914.52,475.43" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="role-to-decisionEvent" codeLine="68"/><polygon points="909.52,475.43,918.52,479.43,914.52,475.43,918.52,471.43,909.52,475.43" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1028.461" y="404.047" fill="#000" font-size="13" textLength="207.257">identity:aml-review reaches the</text><text x="1049.716" y="419.18" fill="#000" font-size="13" textLength="164.747">officer's JWT via this role,</text><text x="976.74" y="434.313" fill="#000" font-size="13" textLength="310.699">satisfying etdDecision's OR (ADR-046/ADR-050)</text></g><!--link etdDecision to decisionEvent--><g class="link" data-entity-1="ent0004" data-entity-2="ent0002" id="lnk10" data-source-line="69" data-link-type="dependency"><path d="M87.16,342.49 C87.16,399.63 87.16,475.43 87.16,475.43 C87.16,475.43 459.17,475.43 659.83,475.43" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="etdDecision-to-decisionEvent" codeLine="69"/><polygon points="664.83,475.43,655.83,471.43,659.83,475.43,655.83,479.43,664.83,475.43" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="80.52" y="471.497" fill="#000" font-size="13" textLength="228.903">governs which claim(s) can publish</text></g><!--link etdSar to sarEvent--><g class="link" data-entity-1="ent0005" data-entity-2="ent0003" id=