"stroke:#181818;stroke-width:1;"/><line x1="170.081" y1="132.859" x2="170.081" y2="145.859" style="stroke:#181818;stroke-width:1;"/><line x1="129.081" y1="145.859" x2="170.081" y2="145.859" style="stroke:#181818;stroke-width:1;"/><polygon points="139.081,141.859,129.081,145.859,139.081,149.859,135.081,145.859" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="135.081" y="120.227" fill="#000" font-size="13" font-weight="700">1</text><text x="148.126" y="112.661" fill="#000" font-size="13" textLength="270.455">pull latest OFAC SDN list; re-screen every</text><text x="148.126" y="127.793" fill="#000" font-size="13" textLength="291.084">active "ApplicantIdentity" entity on schedule</text><path d="M112.081,157.859 L176.523,157.859 L176.523,164.992 L166.523,174.992 L112.081,174.992 L112.081,157.859" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="112.081" y="157.859" width="2234.869" height="547.125" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="127.081" y="170.926" fill="#000" font-size="13" textLength="19.443" font-weight="700">alt</text><text x="191.523" y="170.07" fill="#000" font-size="11" textLength="265.472" font-weight="700">[no match found (routine clear screening)]</text><polygon points="564.257,232.391,574.257,236.391,564.257,240.391,568.257,236.391" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="128.081" y1="236.391" x2="570.257" y2="236.391" style="stroke:#181818;stroke-width:1;"/><text x="135.081" y="216.192" fill="#000" font-size="13" font-weight="700">2</text><text x="148.126" y="201.059" fill="#000" font-size="13" textLength="290.469">POST /publish/SanctionsScreeningPerformed</text><text x="148.126" y="216.192" fill="#000" font-size="13" textLength="385.112">{ payload: { ApplicantId: "applicant-1001", ScreeningDate,</text><text x="156.391" y="231.325" fill="#000" font-size="13" textLength="337.048">ListsChecked: ["OFAC-SDN"], MatchFound: false } }</text><polygon points="1068.351,276.656,1078.351,280.656,1068.351,284.656,1072.351,280.656" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="576.257" y1="280.656" x2="1074.351" y2="280.656" style="stroke:#181818;stroke-width:1;"/><text x="583.257" y="268.024" fill="#000" font-size="13" font-weight="700">3</text><text x="596.303" y="260.458" fill="#000" font-size="13" textLength="335.912">INSERT StoredEvent (AuthorityStatus: "accepted" --</text><text x="596.303" y="275.59" fill="#000" font-size="13" textLength="297.546">ordinary default, ADR-042, nothing to review)</text><polygon points="1884.486,305.789,1894.486,309.789,1884.486,313.789,1888.486,309.789" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1080.351" y1="309.789" x2="1890.486" y2="309.789" style="stroke:#181818;stroke-width:1;"/><text x="1087.351" y="304.723" fill="#000" font-size="13" font-weight="700">4</text><text x="1100.396" y="304.723" fill="#000" font-size="13" textLength="291.884">folds immediately -- routine, no gate to clear</text><path d="M1901.486,322.789 L1901.486,362.789 L2325.486,362.789 L2325.486,332.789 L2315.486,322.789 L1901.486,322.789" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M2315.486,322.789 L2315.486,332.789 L2325.486,332.789 L2315.486,322.789" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="1907.486" y="339.856" fill="#000" font-size="13" textLength="364.768">A clean screening result folds straight through, same as</text><text x="1907.486" y="354.989" fill="#000" font-size="13" textLength="403.463">any other ordinary authenticated publish (ADR-042's default).</text><line x1="112.081" y1="369.055" x2="2346.949" y2="369.055" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="117.081" y="381.265" fill="#000" font-size="11" textLength="270.623" font-weight="700">[match found (candidate hit, unconfirmed)]</text><polygon points="564.257,464.523,574.257,468.523,564.257,472.523,568.257,468.523" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="128.081" y1="468.523" x2="570.257" y2="468.523" style="stroke:#181818;stroke-width:1;"/><text x="135.081" y="433.192" fill="#000" font-size="13" font-weight="700">5</text><text x="148.126" y="402.926" fill="#000" font-size="13" textLength="290.469">POST /publish/SanctionsScreeningPerformed</text><text x="148.126" y="418.059" fill="#000" font-size="13" textLength="385.112">{ payload: { ApplicantId: "applicant-1001", ScreeningDate,</text><text x="156.391" y="433.192" fill="#000" font-size="13" textLength="312.127">ListsChecked: ["OFAC-SDN"], MatchFound: true,</text><text x="156.391" y="448.325" fill="#000" font-size="13" textLength="402.867">MatchConfidence: 0.87, MatchedName, MatchedListEntryId },</text><text x="156.391" y="463.458" fill="#000" font-size="13" textLength="143.305">reviewPending: true }</text><polygon points="1068.351,508.789,1078.351,512.789,1068.351,516.789,1072.351,512.789" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="576.257" y1="512.789" x2="1074.351" y2="512.789" style="stroke:#181818;stroke-width:1;"/><text x="583.257" y="500.157" fill="#000" font-size="13" font-weight="700">6</text><text x="596.303" y="492.59" fill="#000" font-size="13" textLength="378.676">INSERT StoredEvent (AuthorityStatus: "pending_review" --</text><text x="596.303" y="507.723" fill="#000" font-size="13" textLength="467.048">explicit review-pending marker, ADR-042's automated-detector trigger)</text><polygon points="1235.983,537.922,1245.983,541.922,1235.983,545.922,1239.983,541.922" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="576.257" y1="541.922" x2="1241.983" y2="541.922" style="stroke:#181818;stroke-width:1;"/><text x="583.257" y="536.856" fill="#000" font-size="13" font-weight="700">7</text><text x="596.303" y="536.856" fill="#000" font-size="13" textLength="222.72">fold into Live View only (ADR-042)</text><polygon points="1784.554,582.188,1794.554,586.188,1784.554,590.188,1788.554,586.188" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1247.983" y1="586.188" x2="1790.554" y2="586.188" style="stroke:#181818;stroke-width:1;"/><text x="1254.983" y="573.555" fill="#000" font-size="13" font-weight="700">8</text><text x="1268.028" y="565.989" fill="#000" font-size="13" textLength="339.911">UPSERT LiveEntityStoreRow (merged Data including</text><text x="1268.028" y="581.122" fill="#000" font-size="13" textLength="511.526">MatchFound: true, MatchConfidence: 0.87, AuthorityStatus: "pending_review")</text><path d="M1801.554,599.188 L1801.554,699.188 L2210.554,699.188 L2210.554,609.188 L2200.554,599.188 L1801.554,599.188" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M2200.554,599.188 L2200.554,609.188 L2210.554,609.188 L2200.554,599.188" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="1807.554" y="616.254" fill="#000" font-size="13" textLength="346.36">Visible to a compliance officer immediately, wrapped</text><text x="1807.554" y="631.387" fill="#000" font-size="13" textLength="353.012">isAuthoritative: false. A hit is NEVER auto-confirmed --</text><text x="1807.554" y="646.52" fill="#000" font-size="13" textLength="331.792">it always starts pending_review, unlike an ordinary</text><text x="1807.554" y="661.653" fill="#000" font-size="13" textLength="343.789">publish's ADR-042 default, because the publish itself</text><text x="1807.554" y="676.786" fill="#000" font-size="13" textLength="388.718">declares the review-pending marker whenever MatchFound</text><text x="1807.554" y="691.918" fill="#000" font-size="13" textLength="213.865">is true, regardless of confidence.</text><?plantuml-src rLLDR-