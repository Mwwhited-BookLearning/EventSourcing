<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:1350px;height:747px;background:#FFFFFF;" width="1350px" height="747px" viewBox="0 0 1350 747" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="start_entity" data-qualified-name=".start." id="ent0001" data-source-line="1"><ellipse cx="679.93" cy="16" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="ScreeningClear" id="ent0002" data-source-line="1"><rect x="896.58" y="293.93" width="126.702" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="896.58" y1="320.227" x2="1023.282" y2="320.227" style="stroke:#181818;stroke-width:0.5;"/><text x="906.58" y="311.925" fill="#000" font-size="14" textLength="106.702">ScreeningClear</text></g><g class="entity" data-qualified-name="PendingSanctionsReview" id="ent0004" data-source-line="2"><rect x="302.34" y="180.96" width="195.191" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="302.34" y1="207.257" x2="497.531" y2="207.257" style="stroke:#181818;stroke-width:0.5;"/><text x="312.34" y="198.955" fill="#000" font-size="14" textLength="175.191">PendingSanctionsReview</text></g><g class="entity" data-qualified-name="FalsePositiveCleared" id="ent0006" data-source-line="3"><rect x="79.43" y="453.93" width="165.011" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="79.43" y1="480.227" x2="244.441" y2="480.227" style="stroke:#181818;stroke-width:0.5;"/><text x="89.43" y="471.925" fill="#000" font-size="14" textLength="145.011">FalsePositiveCleared</text></g><g class="entity" data-qualified-name="ConfirmedHit" id="ent0008" data-source-line="4"><rect x="441.52" y="373.93" width="112.832" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="441.52" y1="400.227" x2="554.352" y2="400.227" style="stroke:#181818;stroke-width:0.5;"/><text x="451.52" y="391.925" fill="#000" font-size="14" textLength="92.832">ConfirmedHit</text></g><g class="entity" data-qualified-name="SarFiled" id="ent0010" data-source-line="5"><rect x="422.66" y="544.19" width="76.554" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="422.66" y1="570.487" x2="499.214" y2="570.487" style="stroke:#181818;stroke-width:0.5;"/><text x="432.66" y="562.185" fill="#000" font-size="14" textLength="56.554">SarFiled</text></g><g class="end_entity" data-qualified-name=".end." id="ent0012" data-source-line="6"><ellipse cx="460.93" cy="722.46" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="460.93" cy="722.46" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN16" id="ent0017" data-source-line="11"><path d="M532.66,148 L532.66,201.96 L497.75,205.96 L532.66,209.96 L532.66,263.93 A0,0 0 0 0 532.66,263.93 L907.199,263.93 A0,0 0 0 0 907.199,263.93 L907.199,158 L897.199,148 L532.66,148 A0,0 0 0 0 532.66,148" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M897.199,148 L897.199,158 L907.199,158 L897.199,148" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="538.66" y="165.067" fill="#000" font-size="13" textLength="317.707">Deliberately never auto-confirmed, regardless of</text><text x="538.66" y="180.2" fill="#000" font-size="13" textLength="339.568">MatchConfidence -- unlike document-and-biometric-</text><text x="538.66" y="195.333" fill="#000" font-size="13" textLength="339.435">capture.md's liveness check (which DOES default to</text><text x="538.66" y="210.465" fill="#000" font-size="13" textLength="323.661">"accepted" on a confident "pass"), a sanctions hit</text><text x="538.66" y="225.598" fill="#000" font-size="13" textLength="339.739">always requires an explicit human decision. Domain</text><text x="538.66" y="240.731" fill="#000" font-size="13" textLength="327.317">policy, not a framework rule -- the review-pending</text><text x="538.66" y="255.864" fill="#000" font-size="13" textLength="353.539">marker is simply always set when MatchFound is true.</text></g><g class="entity" data-qualified-name="GMN19" id="ent0020" data-source-line="21"><path d="M534.61,533.93 L534.61,565.19 L499.53,569.19 L534.61,573.19 L534.61,604.461 A0,0 0 0 0 534.61,604.461 L907.251,604.461 A0,0 0 0 0 907.251,604.461 L907.251,543.93 L897.251,533.93 L534.61,533.93 A0,0 0 0 0 534.61,533.93" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M897.251,533.93 L897.251,543.93 L907.251,543.93 L897.251,533.93" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="540.61" y="550.997" fill="#000" font-size="13" textLength="349.686">This state machine describes ONE screening cycle for</text><text x="540.61" y="566.13" fill="#000" font-size="13" textLength="351.641">one identity. PeriodicScreeningWorker re-enters at [*]</text><text x="540.61" y="581.263" fill="#000" font-size="13" textLength="322.156">for the SAME applicant on its next scheduled run,</text><text x="540.61" y="596.395" fill="#000" font-size="13" textLength="276.656">independent of where a prior cycle ended.</text></g><!--link *start* to ScreeningClear--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk3" data-source-line="1" data-link-type="dependency"><path d="M690.37,17.12 C732.33,17.82 888.03,22.67 920.93,56 C984.89,120.77 974.069,237.108 965.499,288.728" style="stroke:#181818;stroke-width:1;" fill="none" id="*start*-to-ScreeningClear"/><polygon points="964.68,293.66,970.1,285.437,965.499,288.728,962.208,284.126,964.68,293.66" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="979.983" y="76.567" fill="#000" font-size="13" textLength="332.141">SanctionsScreeningPerformed{MatchFound: false}</text><text x="1020.401" y="91.7" fill="#000" font-size="13" textLength="251.304">published by PeriodicScreeningWorker</text><text x="957.75" y="106.833" fill="#000" font-size="13" textLength="376.606">(AuthorityStatus accepted immediately, ADR-042 default)</text></g><!--link *start* to PendingSanctionsReview--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk5" data-source-line="2" data-link-type="dependency"><path d="M670.17,19.24 C650.58,24 605.47,36.34 571.93,56 C511.95,91.16 456.605,144.765 425.705,177.095" style="stroke:#181818;stroke-width:1;" fill="none" id="*start*-to-PendingSanctionsReview"/><polygon points="422.25,180.71,431.36,176.968,425.705,177.095,425.577,171.44,422.25,180.71" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="580.773" y="69.067" fill="#000" font-size="13" textLength="327.895">SanctionsScreeningPerformed{MatchFound: true}</text><text x="580.976" y="84.2" fill="#000" font-size="13" textLength="327.488">published with the explicit review-pending marker</text><text x="599.984" y="99.333" fill="#000" font-size="13" textLength="289.472">(AuthorityStatus pending_review, ADR-042's</text><text x="572.93" y="114.465" fill="#000" font-size="13" textLength="343.58">automated-detector trigger -- NEVER auto-accepted)</text></g><!--link PendingSanctionsReview to FalsePositiveCleared--><g class="link" data-entity-1="ent0004" data-entity-2="ent0006" id="lnk7" data-source-line="3" data-link-type="dependency"><path d="M302.09,217.69 C209.12,230.15 79.03,254.22 47.93,293.93 C6,347.48 76.388,414.241 123.558,450.541" style="stroke:#181818;stroke-width:1;" fill="none" id="PendingSanctionsReview-to-FalsePositiveCleared"/><polygon points="127.52,453.59,122.827,444.931,123.558,450.541,117.948,451.271,127.52,453.59" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="141.155" y="308.497" fill="#000" font-size="13" textLength="258.635">authorityDecision{decision: "rejected"}</text><text x="120.043" y="323.63" fill="#000" font-size="13" textLength="300.86">published by a caller holding "identity:review"</text><text x="48.93" y="338.763" fill="#000" font-size="13" textLength="443.085">OR "identity:aml-review" (ADR-050's OR-evaluated RequiredClaims)</text></g><!--link PendingSanctionsReview to ConfirmedHit--><g class="link" data-entity-1="ent0004" data-entity-2="ent0008" id="lnk9" data-source-line="4" data-link-type="dependency"><path d="M442.74,231.32 C464.51,246.29 488.88,267.64 500.93,293.93 C512.53,319.21 510.114,346.816 505.534,368.706" style="stroke:#181818;stroke-width:1;" fill="none" id="PendingSanctionsReview-to-ConfirmedHit"/><polygon points="504.51,373.6,510.268,365.61,505.534,368.706,502.438,363.972,504.51,373.6" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="533.797" y="315.997" fill="#000" font-size="13" textLength="265.046">authorityDecision{decision: "accepted"}</text><text x="509.79" y="331.13" fill="#000" font-size="13" textLength="313.06">published by a caller holding either claim above</text></g><!--link ConfirmedHit to SarFiled--><g class="link" data-entity-1="ent0008" data-entity-2="ent0010" id="lnk11" data-source-line="5" data-link-type="dependency"><path d="M492.55,424.4 C485.54,456.3 474.414,506.897 467.394,538.817" style="stroke:#181818;stroke-width:1;" fill="none" id="ConfirmedHit-to-SarFiled"/><polygon points="466.32,543.7,472.16,535.769,467.394,538.817,464.346,534.051,466.32,543.7" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="515.595" y="468.497" fill="#000" font-size="13" textLength="257.696">SarFilingRecorded published by a caller</text><text x="486.97" y="483.63" fill="#000" font-size="13" textLength="314.945">holding "identity:aml-review", RFC 9470 step-up</text><text x="514.408" y="498.763" fill="#000" font-size="13" textLength="260.07">satisfied, Signature captured (ADR-066)</text></g><!--link ScreeningClear to *end*--><g class="link" data-entity-1="ent0002" data-entity-2="ent0012" id="lnk13" data-source-line="6" data-link-type="dependency"><path d="M963.68,344.07 C970.45,396.37 979.42,522.05 924.93,604.46 C887.26,661.44 856.71,659.81 791.93,681.46 C671.71,721.64 519.949,722.425 477.139,721.785" style="stroke:#181818;stroke-width:1;" fill="none" id="ScreeningClear-to-*end*"/><polygon points="472.14,721.71,481.079,725.844,477.139,721.785,481.199,717.845,472.14,721.71" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link FalsePositiveCleared to *end*--><g class="link" data-entity-1="ent0006" data-entity-2="ent0012" id="lnk14" data-source-line="7" data-link-type="dependency"><path d="M192.25,504.42 C258.76,558.15 410.7,680.878 448.62,711.508" style="stroke:#181818;stroke-width:1;" fill="none" id="FalsePositiveCleared-to-*end*"/><polygon points="452.51,714.65,448.022,705.883,448.62,711.508,442.995,712.106,452.51,714.65" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link SarFiled to *end*--><g class="link" data-entity-1="ent0010" data-entity-2="ent0012" id="lnk15" data-source-line="8" data-link-type="dependency"><path d="M460.93,594.5 C460.93,628.07 460.93,682.19 460.93,706.05" style="stroke:#181818;stroke-width:1;" fill="none" id="SarFiled-to-*end*"/><polygon points="460.93,711.05,464.93,702.05,460.93,706.05,456.93,702.05,460.93,711.05" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="488.676" y="647.527" fill="#000" font-size="13" textLength="267.82">FinCEN BSA E-Filing submission itself is a</text><text x="494.471" y="662.66" fill="#000" font-size="13" textLength="256.229">separate, out-of-scope step (ADR-072's</text><text x="461.93" y="677.793" fill="#00