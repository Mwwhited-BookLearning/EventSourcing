="700">1</text><text x="102.372" y="112.661" fill="#000" font-size="13" textLength="306.681">subscription { on_kyc_IdentityClaimSubmitted(</text><text x="110.637" y="127.793" fill="#000" font-size="13" textLength="321.579">where: [{ field: "DateOfBirth", gte: "1900-01-01",</text><text x="151.96" y="142.926" fill="#000" font-size="13" textLength="248.847">lte: "2008-08-28" }]) { applicantId } }</text><path d="M87.327,160.992 L87.327,230.992 L511.327,230.992 L511.327,170.992 L501.327,160.992 L87.327,160.992" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M501.327,160.992 L501.327,170.992 L511.327,170.992 L501.327,160.992" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="93.327" y="178.059" fill="#000" font-size="13" textLength="324.143">A real applicant-eligibility cutoff (18th birthday as</text><text x="93.327" y="193.192" fill="#000" font-size="13" textLength="363.162">of today) expressed as a bounded range -- both bounds</text><text x="93.327" y="208.325" fill="#000" font-size="13" textLength="380.313">required (ADR-096); an open-ended "born before X" query</text><text x="93.327" y="223.458" fill="#000" font-size="13" textLength="403.939">is refused rather than enumerating an unbounded bucket set.</text><polygon points="960.085,268.789,970.085,272.789,960.085,276.789,964.085,272.789" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="449.215" y1="272.789" x2="966.085" y2="272.789" style="stroke:#181818;stroke-width:1;"/><text x="456.215" y="260.157" fill="#000" font-size="13" font-weight="700">2</text><text x="469.261" y="252.59" fill="#000" font-size="13" textLength="287.784">narrow via bucket lookup (Year/Month/Day),</text><text x="469.261" y="267.723" fill="#000" font-size="13" textLength="485.824">then exact-match the remainder (IEncryptedPredicateEvaluator, ADR-098)</text><polygon points="460.215,313.055,450.215,317.055,460.215,321.055,456.215,317.055" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="454.215" y1="317.055" x2="971.085" y2="317.055" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="466.215" y="304.422" fill="#000" font-size="13" font-weight="700">3</text><text x="479.261" y="296.856" fill="#000" font-size="13" textLength="255.614">matching ApplicantIds -- Payload never</text><text x="479.261" y="311.989" fill="#000" font-size="13" textLength="312.317">extracted as plaintext to evaluate the predicate</text><polygon points="93.327,342.188,83.327,346.188,93.327,350.188,89.327,346.188" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="87.327" y1="346.188" x2="448.215" y2="346.188" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="99.327" y="341.122" fill="#000" font-size="13" font-weight="700">4</text><text x="112.372" y="341.122" fill="#000" font-size="13" textLength="211.586">applicants eligible for full review</text><?plantuml-src JL9DZzf03BtdLrWvWKIwi8UAfL8bMkWAgTLksqkhKgsSn24ZXfcium6Y5V-zJi97epbax7b-zdl68Dw5NKeSOIQU8NvogKVEZTl0tA5jQea1Qy3-FwgGnMIcGYSGFp9MvVUly8X21sowXvl-FyfHCCMQ85wwZ9jAAFzYoEOhbzDnwOIRjHlC5p-IySFxOOSqRIQApaoGVBpKca4TqZfZKudn3jx0kvTjaxsiSd9YfFbiqUn-XdHdH5a6QmTmA8bf1d_Ue6X9Pn0ljDPJyScmbF48DgBPUF8m7YVZYPvurA9kd-toz-FnDD5pFutXz7Uep5XLrcGw_2g74vmYvuM0pQOKyCLL980vCA6zFK_8cer9ZTLs8LFHYm86awcKaBOTvTYe0ehJ8kBrDWGwLanrJNcdFgG-g3mvCBeDGP9ee0MtqHR7z1eCQ_ugwGVj1dn5Bg4E6AUU7QHKU2Ru5SDh86uKQMe55w7kQelA1b8gadGhI0Fj7kWrk4i3QSYs952Jl8kqChGAH6UZMiyw5sVWaDaVO6_mWh3URqC5Wz-4VFVDEodl5Zge2g-iIdZK1KnsA5cf7QYejCEs5iDWTTsWPnrHzHHQxj46r8KTGJ_mT1Xrp2hDVtlJbUjM-UPRtQhtZ8trgDtJddZjw2YizBtObQwJ4msf5K0z4NKzLHVwsy3ATdPzTdExXjvkIw1oGn6irNdsXWx_0000?></g></svg>