<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:1132px;height:657px;background:#FFFFFF;" width="1132px" height="657px" viewBox="0 0 1132 657" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="start_entity" data-qualified-name=".start." id="ent0001" data-source-line="1"><ellipse cx="342.73" cy="16" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="Unattested" id="ent0002" data-source-line="1"><rect x="293.94" y="121.5" width="97.574" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="293.94" y1="147.797" x2="391.514" y2="147.797" style="stroke:#181818;stroke-width:0.5;"/><text x="303.94" y="139.495" fill="#000" font-size="14" textLength="77.574">Unattested</text></g><g class="entity" data-qualified-name="PendingReview" id="ent0005" data-source-line="3"><rect x="279.21" y="292.27" width="127.044" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="279.21" y1="318.567" x2="406.254" y2="318.567" style="stroke:#181818;stroke-width:0.5;"/><text x="289.21" y="310.265" fill="#000" font-size="14" textLength="107.044">PendingReview</text></g><g class="entity" data-qualified-name="Accepted" id="ent0007" data-source-line="4"><rect x="7" y="484.93" width="85.461" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="7" y1="511.227" x2="92.461" y2="511.227" style="stroke:#181818;stroke-width:0.5;"/><text x="17" y="502.925" fill="#000" font-size="14" textLength="65.461">Accepted</text></g><g class="entity" data-qualified-name="Rejected" id="ent0009" data-source-line="5"><rect x="596.97" y="484.93" width="81.53" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="596.97" y1="511.227" x2="678.5" y2="511.227" style="stroke:#181818;stroke-width:0.5;"/><text x="606.97" y="502.925" fill="#000" font-size="14" textLength="61.53">Rejected</text></g><g class="end_entity" data-qualified-name=".end." id="ent0011" data-source-line="6"><ellipse cx="342.73" cy="632.33" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="342.73" cy="632.33" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN14" id="ent0015" data-source-line="10"><path d="M703.28,118.8 L703.28,142.5 L391.87,146.5 L703.28,150.5 L703.28,174.198 A0,0 0 0 0 703.28,174.198 L1070.189,174.198 A0,0 0 0 0 1070.189,174.198 L1070.189,128.8 L1060.189,118.8 L703.28,118.8 A0,0 0 0 0 703.28,118.8" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1060.189,118.8 L1060.189,128.8 L1070.189,128.8 L1060.189,118.8" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="709.28" y="135.867" fill="#000" font-size="13" textLength="342.113">A syntactically/cryptographically invalid UCAN never</text><text x="709.28" y="151" fill="#000" font-size="13" textLength="345.909">blocks or discards the claim (ADR-023) -- it just stays</text><text x="709.28" y="166.133" fill="#000" font-size="13" textLength="342.5">unattested until a later exchange attempt succeeds.</text></g><g class="entity" data-qualified-name="GMN17" id="ent0018" data-source-line="16"><path d="M441.37,282 L441.37,313.27 L406.7,317.27 L441.37,321.27 L441.37,352.531 A0,0 0 0 0 441.37,352.531 L862.088,352.531 A0,0 0 0 0 862.088,352.531 L862.088,292 L852.088,282 L441.37,282 A0,0 0 0 0 441.37,282" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M852.088,282 L852.088,292 L862.088,292 L852.088,282" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="447.37" y="299.067" fill="#000" font-size="13" textLength="347.312">Visible immediately via LiveEntityStoreRow, wrapped</text><text x="447.37" y="314.2" fill="#000" font-size="13" textLength="333.411">isAuthoritative: false (ADR-042) -- the authoritative</text><text x="447.37" y="329.333" fill="#000" font-size="13" textLength="340.869">Entity Store does not reflect this applicant at all yet.</text><text x="447.37" y="344.465" fill="#000" font-size="13" textLength="399.718">A valid token exchange is NOT authority approval (ADR-036).</text></g><g class="entity" data-qualified-name="GMN20" id="ent0021" data-source-line="23"><path d="M127.57,459.53 L127.57,505.93 L92.94,509.93 L127.57,513.93 L127.57,560.327 A0,0 0 0 0 127.57,560.327 L561.891,560.327 A0,0 0 0 0 561.891,560.327 L561.891,469.53 L551.891,459.53 L127.57,459.53 A0,0 0 0 0 127.57,459.53" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M551.891,459.53 L551.891,469.53 L561.891,469.53 L551.891,459.53" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="133.57" y="476.597" fill="#000" font-size="13" textLength="343.637">Unlocks: the authoritative Entity Store now folds this</text><text x="133.57" y="491.73" fill="#000" font-size="13" textLength="344.792">claim (ADR-042). The applicant is now a real, claims-</text><text x="133.57" y="506.863" fill="#000" font-size="13" textLength="331.741">bearing identity record other reads and the relying</text><text x="133.57" y="521.995" fill="#000" font-size="13" textLength="330.986">party's webhook (ADR-060) can rely on -- gated by</text><text x="133.57" y="537.128" fill="#000" font-size="13" textLength="413.321">RequiredClaims (Read direction)/the caller's flattened claim set</text><text x="133.57" y="552.261" fill="#000" font-size="13" textLength="360.737">(ADR-046/ADR-050), same as any other classified data.</text></g><g class="entity" data-qualified-name="GMN23" id="ent0024" data-source-line="32"><path d="M713.71,474.67 L713.71,505.93 L678.72,509.93 L713.71,513.93 L713.71,545.201 A0,0 0 0 0 713.71,545.201 L1117.753,545.201 A0,0 0 0 0 1117.753,545.201 L1117.753,484.67 L1107.753,474.67 L713.71,474.67 A0,0 0 0 0 713.71,474.67" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1107.753,474.67 L1107.753,484.67 L1117.753,484.67 L1107.753,474.67" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="719.71" y="491.737" fill="#000" font-size="13" textLength="364.584">Never reaches the authoritative Entity Store (ADR-042).</text><text x="719.71" y="506.87" fill="#000" font-size="13" textLength="383.043">Payload stays unchanged (Annotate, ADR-035's default for</text><text x="719.71" y="522.003" fill="#000" font-size="13" textLength="328.155">this event type) -- still visible in the Event Log and</text><text x="719.71" y="537.135" fill="#000" font-size="13" textLength="296.391">Live View, re-labeled rejected, never deleted.</text></g><!--link *start* to Unattested--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk3" data-source-line="1" data-link-type="dependency"><path d="M342.73,26.24 C342.73,45.87 342.73,87.25 342.73,116.05" style="stroke:#181818;stroke-width:1;" fill="none" id="*start*-to-Unattested"/><polygon points="342.73,121.05,346.73,112.05,342.73,116.05,338.73,112.05,342.73,121.05" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="373.891" y="69.067" fill="#000" font-size="13" textLength="221.578">IdentityClaimSubmitted published</text><text x="343.73" y="84.2" fill="#000" font-size="13" textLength="281.899">with AttestedClaims (raw UCAN) (ADR-035)</text></g><!--link Unattested to Unattested--><g class="link" data-entity-1="ent0002" data-entity-2="ent0002" id="lnk4" data-source-line="2" data-link-type="dependency"><path d="M391.79,132.59 C410.75,131.97 426.52,136.61 426.52,146.5 C426.52,156.4 415.747,161.191 396.787,160.581" style="stroke:#181818;stroke-width:1;" fill="none" id="Unattested-to-Unattested"/><polygon points="391.79,160.42,400.657,164.707,396.787,160.581,400.914,156.711,391.79,160.42" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="465.817" y="136.067" fill="#000" font-size="13" textLength="181.168">token exchange attempted,</text><text x="458.71" y="151.2" fill="#000" font-size="13" textLength="195.381">UCAN chain invalid (ADR-036)</text><text x="432.52" y="166.333" fill="#000" font-size="13" textLength="247.762">-- retried on next connectivity window</text></g><!--link Unattested to PendingReview--><g class="link" data-entity-1="ent0002" data-entity-2="ent0005" id="lnk6" data-source-line="3" data-link-type="dependency"><path d="M342.73,171.68 C342.73,203.67 342.73,254.75 342.73,286.86" style="stroke:#181818;stroke-width:1;" fill="none" id="Unattested-to-PendingReview"/><polygon points="342.73,291.86,346.73,282.86,342.73,286.86,338.73,282.86,342.73,291.86" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="374.005" y="218.067" fill="#000" font-size="13" textLength="168.943">token exchange succeeds</text><text x="343.73" y="233.2" fill="#000" font-size="13" textLength="229.493">(JWT: provenance/authority_status/</text><text x="352.531" y="248.333" fill="#000" font-size="13" textLength="211.891">delegation_chain_ref) (ADR-036)</text></g><!--link PendingReview to Accepted--><g class="link" data-entity-1="ent0005" data-entity-2="ent0007" id="lnk8" data-source-line="4" data-link-type="dependency"><path d="M298.16,342.74 C250.36,369.58 172.82,414.79 109.73,459.53 C98.94,467.18 91.457,473.004 81.597,481.244" style="stroke:#181818;stroke-width:1;" fill="none" id="PendingReview-to-Accepted"/><polygon points="77.76,484.45,87.231,481.748,81.597,481.244,82.101,475.609,77.76,484.45" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="229.38" y="395.597" fill="#000" font-size="13" textLength="253.087">authorityDecision{decision: accepted}</text><text x="262.169" y="410.73" fill="#000" font-size="13" textLength="187.51">published by a caller holding</text><text x="265.457" y="425.863" fill="#000" font-size="13" textLength="180.934">"identity:review" (ADR-046)</text></g><!--link PendingReview to Rejected--><g class="link" data-entity-1="ent0005" data-entity-2="ent0009" id="lnk10" data-source-line="5" data-link-type="dependency"><path d="M400.45,342.68 C440.5,359.7 487.42,379.83 491.73,382.53 C539.16,412.29 583.31,453.469 610.73,480.969" style="stroke:#181818;stroke-width:1;" fill="none" id="PendingReview-to-Rejected"/><polygon points="614.26,484.51,610.738,475.312,610.73,480.969,605.073,480.961,614.26,484.51" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="552.32" y="395.597" fill="#000" font-size="13" textLength="246.676">authorityDecision{decision: rejected}</text><text x="581.903" y="410.73" fill="#000" font-size="13" textLength="187.51">published by a caller holding</text><text x="585.191" y="425.863" fill="#000" font-size="13" textLength="180.934">"identity:review" (ADR-046)</text></g><!--link Accepted to *end*--><g class="link" data-entity-1="ent0007" data-entity-2="ent0011" id="lnk12" data-source-line="6" data-link-type="dependency"><path d="M74.7,535.23 C84.91,544.12 97.25,553.63 109.73,560.33 C189.11,602.9 292.771,622.942 327.011,628.762" style="stroke:#181818;stroke-width:1;" fill="none" id="Accepted-to-*end*"/><polygon points="331.94,629.6,323.738,624.148,327.011,628.762,322.397,632.035,331.94,629.6" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Rejected to *end*--><g class="link" data-entity-1="ent0009" data-entity-2="ent0011" id="lnk13" data-source-line="7" data-link-type="dependency"><path d="M613.73,535.29 C603.88,544.19 591.93,553.69 579.73,560.33 C499.37,604.05 393.599,623.389 358.679,628.909" style="stroke:#181818;stroke-width:1;" fill="none" id="Rejected-to-*end*"/><polygon points="353.74,629.69,363.254,632.236,358.679,628.909,362.005,624.334,35