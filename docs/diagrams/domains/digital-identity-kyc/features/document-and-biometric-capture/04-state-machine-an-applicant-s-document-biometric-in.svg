<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:1077px;height:898px;background:#FFFFFF;" width="1077px" height="898px" viewBox="0 0 1077 898" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="start_entity" data-qualified-name=".start." id="ent0001" data-source-line="1"><ellipse cx="482.75" cy="16" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="AwaitingDocuments" id="ent0002" data-source-line="1"><rect x="402.52" y="118" width="160.458" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="402.52" y1="144.297" x2="562.978" y2="144.297" style="stroke:#181818;stroke-width:0.5;"/><text x="412.52" y="135.995" fill="#000" font-size="14" textLength="140.458">AwaitingDocuments</text></g><g class="entity" data-qualified-name="AwaitingBiometric" id="ent0004" data-source-line="2"><rect x="408.86" y="275" width="147.777" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="408.86" y1="301.297" x2="556.637" y2="301.297" style="stroke:#181818;stroke-width:0.5;"/><text x="418.86" y="292.995" fill="#000" font-size="14" textLength="127.777">AwaitingBiometric</text></g><g class="entity" data-qualified-name="ReviewPendingLiveness" id="ent0006" data-source-line="3"><rect x="129.9" y="464.83" width="187.706" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="129.9" y1="491.127" x2="317.606" y2="491.127" style="stroke:#181818;stroke-width:0.5;"/><text x="139.9" y="482.825" fill="#000" font-size="14" textLength="167.706">ReviewPendingLiveness</text></g><g class="entity" data-qualified-name="CaptureComplete" id="ent0008" data-source-line="4"><rect x="410.03" y="680.06" width="143.443" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="410.03" y1="706.357" x2="553.473" y2="706.357" style="stroke:#181818;stroke-width:0.5;"/><text x="420.03" y="698.055" fill="#000" font-size="14" textLength="123.443">CaptureComplete</text></g><g class="entity" data-qualified-name="CaptureRejected" id="ent0011" data-source-line="6"><rect x="7" y="680.06" width="137.503" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="7" y1="706.357" x2="144.503" y2="706.357" style="stroke:#181818;stroke-width:0.5;"/><text x="17" y="698.055" fill="#000" font-size="14" textLength="117.503">CaptureRejected</text></g><g class="end_entity" data-qualified-name=".end." id="ent0013" data-source-line="7"><ellipse cx="278.75" cy="873.46" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="278.75" cy="873.46" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN16" id="ent0017" data-source-line="11"><path d="M352.62,447 L352.62,485.83 L318.02,489.83 L352.62,493.83 L352.62,532.664 A0,0 0 0 0 352.62,532.664 L672.874,532.664 A0,0 0 0 0 672.874,532.664 L672.874,457 L662.874,447 L352.62,447 A0,0 0 0 0 352.62,447" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M662.874,447 L662.874,457 L672.874,457 L662.874,447" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="358.62" y="464.067" fill="#000" font-size="13" textLength="291.402">Visible in the Live View immediately, labeled</text><text x="358.62" y="479.2" fill="#000" font-size="13" textLength="294.722">isAuthoritative: false -- an analyst can see an</text><text x="358.62" y="494.333" fill="#000" font-size="13" textLength="299.254">inconclusive liveness result waiting for review</text><text x="358.62" y="509.465" fill="#000" font-size="13" textLength="287.879">well before the applicant even submits their</text><text x="358.62" y="524.598" fill="#000" font-size="13" textLength="164.582">identity claim (ADR-042).</text></g><g class="entity" data-qualified-name="GMN19" id="ent0020" data-source-line="19"><path d="M588.1,654.66 L588.1,701.06 L553.77,705.06 L588.1,709.06 L588.1,755.457 A0,0 0 0 0 588.1,755.457 L977.404,755.457 A0,0 0 0 0 977.404,755.457 L977.404,664.66 L967.404,654.66 L588.1,654.66 A0,0 0 0 0 588.1,654.66" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M967.404,654.66 L967.404,664.66 L977.404,664.66 L967.404,654.66" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="594.1" y="671.727" fill="#000" font-size="13" textLength="331.252">This state is domain-level "intake completeness" --</text><text x="594.1" y="686.86" fill="#000" font-size="13" textLength="317.751">a DIFFERENT lifecycle from AuthorityStatus itself</text><text x="594.1" y="701.993" fill="#000" font-size="13" textLength="368.304">(non-authoritative-capture.md owns that one). Reaching</text><text x="594.1" y="717.125" fill="#000" font-size="13" textLength="321.807">CaptureComplete does not set any StoredEvent's</text><text x="594.1" y="732.258" fill="#000" font-size="13" textLength="344.957">AuthorityStatus to anything new; it just means every</text><text x="594.1" y="747.391" fill="#000" font-size="13" textLength="351.717">upstream capture step this doc covers has happened.</text></g><!--link *start* to AwaitingDocuments--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk3" data-source-line="1" data-link-type="dependency"><path d="M482.75,26.39 C482.75,45.59 482.75,84.82 482.75,112.67" style="stroke:#181818;stroke-width:1;" fill="none" id="*start*-to-AwaitingDocuments"/><polygon points="482.75,117.67,486.75,108.67,482.75,112.67,478.75,108.67,482.75,117.67" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="516.996" y="69.067" fill="#000" font-size="13" textLength="185.599">applicant begins onboarding</text><text x="483.75" y="84.2" fill="#000" font-size="13" textLength="252.091">(ordinary app-session JWT, no DID yet)</text></g><!--link AwaitingDocuments to AwaitingBiometric--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk5" data-source-line="2" data-link-type="dependency"><path d="M482.75,168.22 C482.75,197.25 482.75,240.62 482.75,269.7" style="stroke:#181818;stroke-width:1;" fill="none" id="AwaitingDocuments-to-AwaitingBiometric"/><polygon points="482.75,274.7,486.75,265.7,482.75,269.7,478.75,265.7,482.75,274.7" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="506.237" y="211.067" fill="#000" font-size="13" textLength="246.333">IdentityDocumentUploaded published</text><text x="485.889" y="226.2" fill="#000" font-size="13" textLength="287.028">for BOTH "passport" and "proof_of_address"</text><text x="483.75" y="241.333" fill="#000" font-size="13" textLength="291.307">(AuthorityStatus accepted, ADR-042 default)</text></g><!--link AwaitingBiometric to ReviewPendingLiveness--><g class="link" data-entity-1="ent0004" data-entity-2="ent0006" id="lnk7" data-source-line="3" data-link-type="dependency"><path d="M449.16,325.36 C399.47,361.39 310.988,425.564 261.338,461.574" style="stroke:#181818;stroke-width:1;" fill="none" id="AwaitingBiometric-to-ReviewPendingLiveness"/><polygon points="257.29,464.51,266.924,462.464,261.338,461.574,262.227,455.988,257.29,464.51" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="427.425" y="368.067" fill="#000" font-size="13" textLength="243.661">BiometricCaptureRecorded published</text><text x="416.684" y="383.2" fill="#000" font-size="13" textLength="265.142">with LivenessCheckResult "inconclusive"</text><text x="407.22" y="398.333" fill="#000" font-size="13" textLength="284.07">(explicit review-pending marker, ADR-042's</text><text x="457.297" y="413.465" fill="#000" font-size="13" textLength="183.917">automated-detector trigger)</text></g><!--link AwaitingBiometric to CaptureComplete--><g class="link" data-entity-1="ent0004" data-entity-2="ent0008" id="lnk9" data-source-line="4" data-link-type="dependency"><path d="M557.11,310.3 C612.29,318.83 681.07,333.43 699.75,355 C778.46,445.86 796.97,531.7 720.75,624.66 C677.65,677.24 634.57,631.22 570.75,654.66 C553.17,661.12 539.205,668.174 523.815,677.184" style="stroke:#181818;stroke-width:1;" fill="none" id="AwaitingBiometric-to-CaptureComplete"/><polygon points="519.5,679.71,529.288,678.615,523.815,677.184,525.246,671.711,519.5,679.71" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="794.103" y="479.397" fill="#000" font-size="13" textLength="243.661">BiometricCaptureRecorded published</text><text x="808.613" y="494.53" fill="#000" font-size="13" textLength="214.64">with LivenessCheckResult "pass"</text><text x="770.28" y="509.663" fill="#000" font-size="13" textLength="291.307">(AuthorityStatus accepted, ADR-042 default)</text></g><!--link ReviewPendingLiveness to CaptureComplete--><g class="link" data-entity-1="ent0006" data-entity-2="ent0008" id="lnk10" data-source-line="5" data-link-type="dependency"><path d="M286.21,515.27 C322.6,530.36 364.12,549.32 378.75,562.66 C402.3,584.13 396.41,598.61 414.75,624.66 C428.35,643.98 442.256,660.585 455.836,675.845" style="stroke:#181818;stroke-width:1;" fill="none" id="ReviewPendingLiveness-to-CaptureComplete"/><polygon points="459.16,679.58,456.165,670.198,455.836,675.845,450.189,675.516,459.16,679.58" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="433.657" y="575.727" fill="#000" font-size="13" textLength="265.046">authorityDecision{decision: "accepted"}</text><text x="415.75" y="590.86" fill="#000" font-size="13" textLength="300.86">published by a caller holding "identity:review"</text><text x="420.968" y="605.993" fill="#000" font-size="13" textLength="290.424">(reuses the SAME AuthorityDecisionResolver</text><text x="425.132" y="621.125" fill="#000" font-size="13" textLength="282.096">the downstream doc's analyst review uses)</text></g><!--link ReviewPendingLiveness to CaptureRejected--><g class="link" data-entity-1="ent0006" data-entity-2="ent0011" id="lnk12" data-source-line="6" data-link-type="dependency"><path d="M131.25,515.31 C108.25,526 86.32,541.19 72.75,562.66 C50.26,598.26 57.905,644.804 66.295,674.834" style="stroke:#181818;stroke-width:1;" fill="none" id="ReviewPendingLiveness-to-CaptureRejected"/><polygon points="67.64,679.65,69.071,669.906,66.295,674.834,61.366,672.058,67.64,679.65" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="94.862" y="590.727" fill="#000" font-size="13" textLength="258.635">authorityDecision{decision: "rejected"}</text><text x="73.75" y="605.86" fill="#000" font-size="13" textLength="300.86">published by a caller holding "identity:review"</text></g><!--link CaptureComplete to *end*--><g class="link" data-entity-1="ent0008" data-entity-2="ent0013" id="lnk14" data-source-line="7" data-link-type="dependency"><path d="M481.11,730.46 C479,759.01 471.09,805.77 442.75,832.46 C420.14,853.76 327.473,866.606 294.583,870.606" style="stroke:#181818;stroke-width:1;" fill="none" id="CaptureComplete-to-*end*"/><polygon points="289.62,871.21,299.037,874.094,294.583,870.606,298.071,866.153,289.62,871.21" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="501.04" y="806.027" fill="#000" font-size="13" textLength="354.771">applicant proceeds to publish IdentityClaimSubmitted,</text><text x="471.05" y="821.16" fill="#000" font-size="13" textLength="414.75">continuing in customer-onboarding-and-identity-verification.md</text></g><!--link CaptureRejected to *end*--><g class="link" data-entity-1="ent0011" data-entity-2="ent0013" id="lnk15" data-source-line="8" data-link-type="dependency"><path d="M65.49,730.5