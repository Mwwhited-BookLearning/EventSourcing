8 L2092.298,900.938" style="stroke:#181818;stroke-width:0.5;" fill="#E2E2F0"/><path d="M2092.298,900.938 C2092.298,910.938 2110.298,910.938 2110.298,910.938 C2110.298,910.938 2128.298,910.938 2128.298,900.938" style="stroke:#181818;stroke-width:0.5;" fill="none"/><polygon points="623.6,248.789,633.6,252.789,623.6,256.789,627.6,252.789" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="142.462" y1="252.789" x2="629.6" y2="252.789" style="stroke:#181818;stroke-width:1;"/><text x="149.462" y="187.192" fill="#000" font-size="13" font-weight="700">1</text><text x="162.508" y="126.661" fill="#000" font-size="13" textLength="208.997">POST /interchange/vcard/import</text><text x="162.508" y="141.793" fill="#000" font-size="13" textLength="95.932">{ appId: "kyc",</text><text x="170.772" y="156.926" fill="#000" font-size="13" textLength="285.003">jcard: ["vcard", [ ["version",{},"text","4.0"],</text><text x="179.037" y="172.059" fill="#000" font-size="13" textLength="205.125">["fn",{},"text","Jane R. Smith"],</text><text x="179.037" y="187.192" fill="#000" font-size="13" textLength="220.333">["n",{},"text",["Smith","Jane","R",</text><text x="399.371" y="187.192" fill="#000" font-size="13" font-family="monospace">,</text><text x="407.197" y="187.192" fill="#000" font-size="13" textLength="14.276">]],</text><text x="179.037" y="202.325" fill="#000" font-size="13" textLength="399.039">["email",{"type":"work"},"text","jane.smith@example.com"],</text><text x="179.037" y="217.458" fill="#000" font-size="13" textLength="287.834">["tel",{"type":"cell"},"text","+1-555-0100"],</text><text x="179.037" y="232.59" fill="#000" font-size="13" textLength="110.449">["adr",{},"text",[</text><text x="289.486" y="232.59" fill="#000" font-size="13" font-family="monospace">,</text><text x="297.313" y="232.59" fill="#000" font-size="13" textLength="321.287">,"123 Main St","Springfield","IL","62704","USA"]],</text><text x="179.037" y="247.723" fill="#000" font-size="13" textLength="226.694">["org",{},"text","Acme Bank"] ] ] }</text><polygon points="1067.771,277.922,1077.771,281.922,1067.771,285.922,1071.771,281.922" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="635.6" y1="281.922" x2="1073.771" y2="281.922" style="stroke:#181818;stroke-width:1;"/><text x="642.6" y="276.856" fill="#000" font-size="13" font-weight="700">2</text><text x="655.645" y="276.856" fill="#000" font-size="13" textLength="407.126">ParseInboundAsync(appId: "kyc", rawMessage: &lt;jCard JSON>)</text><line x1="1079.771" y1="356.453" x2="1121.771" y2="356.453" style="stroke:#181818;stroke-width:1;"/><line x1="1121.771" y1="356.453" x2="1121.771" y2="369.453" style="stroke:#181818;stroke-width:1;"/><line x1="1080.771" y1="369.453" x2="1121.771" y2="369.453" style="stroke:#181818;stroke-width:1;"/><polygon points="1090.771,365.453,1080.771,369.453,1090.771,373.453,1086.771,369.453" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1086.771" y="328.688" fill="#000" font-size="13" font-weight="700">3</text><text x="1099.816" y="305.989" fill="#000" font-size="13" textLength="360.001">map jCard properties -> ContactProfileUpdatedPayload</text><text x="1099.816" y="321.122" fill="#000" font-size="13" textLength="336.667">(FN/N -> FormattedName/GivenName/FamilyName,</text><text x="1103.949" y="336.254" fill="#000" font-size="13" textLength="379.672">EMAIL/TEL -> Email/PhoneNumber, ADR -> PostalAddress,</text><text x="1103.949" y="351.387" fill="#000" font-size="13" textLength="179.95">ORG -> OrganizationName)</text><polygon points="646.6,424.852,636.6,428.852,646.6,432.852,642.6,428.852" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="640.6" y1="428.852" x2="1078.771" y2="428.852" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="652.6" y="408.653" fill="#000" font-size="13" font-weight="700">4</text><text x="665.645" y="393.52" fill="#000" font-size="13" textLength="177.188">InterchangeInboundResult(</text><text x="673.91" y="408.653" fill="#000" font-size="13" textLength="362.464">EventType: "ContactProfileUpdated", Payload: &lt;JSON>,</text><text x="673.91" y="423.786" fill="#000" font-size="13" textLength="139.661">ReviewPending: true)</text><path d="M1084.771,441.852 L1084.771,526.852 L1471.771,526.852 L1471.771,451.852 L1461.771,441.852 L1084.771,441.852" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1461.771,441.852 L1461.771,451.852 L1471.771,451.852 L1461.771,441.852" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="1090.771" y="458.918" fill="#000" font-size="13" textLength="366.685">ReviewPending defaults true (ADR-072's own default for</text><text x="1090.771" y="474.051" fill="#000" font-size="13" textLength="351.66">externally-sourced data, same posture Hl7V2Adapter/</text><text x="1090.771" y="489.184" fill="#000" font-size="13" textLength="352.022">FhirAdapter already apply to EMR-sourced input) -- an</text><text x="1090.771" y="504.317" fill="#000" font-size="13" textLength="352.193">imported vCard is exactly as unverified as an inbound</text><text x="1090.771" y="519.45" fill="#000" font-size="13" textLength="343.04">HL7v2 ADT^A01 message until a human confirms it.</text><polygon points="1478.621,579.914,1488.621,583.914,1478.621,587.914,1482.621,583.914" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="635.6" y1="583.914" x2="1484.621" y2="583.914" style="stroke:#181818;stroke-width:1;"/><text x="642.6" y="563.715" fill="#000" font-size="13" font-weight="700">5</text><text x="655.645" y="548.583" fill="#000" font-size="13" textLength="240.982">POST /publish/ContactProfileUpdated</text><text x="655.645" y="563.715" fill="#000" font-size="13" textLength="386.731">{ payload, entityId: "kyc:ApplicantIdentity:applicant-1001",</text><text x="663.91" y="578.848" fill="#000" font-size="13" textLength="143.305">reviewPending: true }</text><polygon points="2014.11,639.313,2024.11,643.313,2014.11,647.313,2018.11,643.313" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1490.621" y1="643.313" x2="2020.11" y2="643.313" style="stroke:#181818;stroke-width:1;"/><text x="1497.621" y="623.114" fill="#000" font-size="13" font-weight="700">6</text><text x="1510.667" y="607.981" fill="#000" font-size="13" textLength="131.27">INSERT StoredEvent</text><text x="1510.667" y="623.114" fill="#000" font-size="13" textLength="366.349">(AuthorityStatus: "pending_review" -- ADR-042's explicit</text><text x="1514.799" y="638.247" fill="#000" font-size="13" textLength="494.311">review-pending marker, same mechanism BiometricCaptureRecorded uses)</text><polygon points="153.462,668.445,143.462,672.445,153.462,676.445,149.462,672.445" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="147.462" y1="672.445" x2="1489.621" y2="672.445" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="159.462" y="667.379" fill="#000" font-size="13" font-weight="700">7</text><text x="172.508" y="667.379" fill="#000" font-size="13" textLength="402.238">202 { status: "received", authorityStatus: "pending_review" }</text><polygon points="1738.387,697.578,1748.387,701.578,1738.387,705.578,1742.387,701.578" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1490.621" y1="701.578" x2="1744.387" y2="701.578" style="stroke:#181818;stroke-width:1;"/><text x="1497.621" y="696.512" fill="#000" font-size="13" font-weight="700">8</text><text x="1510.667" y="696.512" fill="#000" font-size="13" textLength="222.72">fold into Live View only (ADR-042)</text><polygon points="2098.298,756.977,2108.298,760.977,2098.298,764.977,2102.298,760.977