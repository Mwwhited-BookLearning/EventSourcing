3.59" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN11" id="ent0012" data-source-line="8"><path d="M408.12,133 L408.12,194.53 L373.51,198.53 L408.12,202.53 L408.12,264.063 A0,0 0 0 0 408.12,264.063 L839.331,264.063 A0,0 0 0 0 839.331,264.063 L839.331,143 L829.331,133 L408.12,133 A0,0 0 0 0 408.12,133" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M829.331,133 L829.331,143 L839.331,143 L829.331,133" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="414.12" y="150.067" fill="#000" font-size="13" textLength="347.312">Visible immediately via LiveEntityStoreRow, wrapped</text><text x="414.12" y="165.2" fill="#000" font-size="13" textLength="360.521">isAuthoritative: false (ADR-042) -- an imported vCard is</text><text x="414.12" y="180.333" fill="#000" font-size="13" textLength="378.301">exactly as unverified as inbound EMR data until reviewed.</text><text x="414.12" y="195.465" fill="#000" font-size="13" textLength="366.165">Never "unattested" -- that value is specific to ADR-036's</text><text x="414.12" y="210.598" fill="#000" font-size="13" textLength="320.963">self-attested-credential trigger, a different one of</text><text x="414.12" y="225.731" fill="#000" font-size="13" textLength="354.142">ADR-042's two named triggers than this doc exercises</text><text x="414.12" y="240.864" fill="#000" font-size="13" textLength="351.33">(the SAME "automated/external, unconfirmed" trigger</text><text x="414.12" y="255.997" fill="#000" font-size="13" textLength="410.211">document-and-biometric-capture.md's liveness detector uses).</text></g><g class="entity" data-qualified-name="GMN14" id="ent0015" data-source-line="19"><path d="M127.32,371.06 L127.32,402.32 L92.81,406.32 L127.32,410.32 L127.32,441.591 A0,0 0 0 0 127.32,441.591 L494.147,441.591 A0,0 0 0 0 494.147,441.591 L494.147,381.06 L484.147,371.06 L127.32,371.06 A0,0 0 0 0 127.32,371.06" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M484.147,371.06 L484.147,381.06 L494.147,381.06 L484.147,371.06" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="133.32" y="388.127" fill="#000" font-size="13" textLength="312.679">Unlocks: the authoritative Entity Store folds this</text><text x="133.32" y="403.26" fill="#000" font-size="13" textLength="319.896">profile's fields onto applicant-1001's existing row</text><text x="133.32" y="418.393" fill="#000" font-size="13" textLength="345.827">(ADR-042/ADR-016 Partial merge) -- now available to</text><text x="133.32" y="433.525" fill="#000" font-size="13" textLength="339.86">VCardAdapter.FormatOutboundAsync's export path.</text></g><g class="entity" data-qualified-name="GMN17" id="ent0018" data-source-line="26"><path d="M645.7,371.06 L645.7,402.32 L610.94,406.32 L645.7,410.32 L645.7,441.591 A0,0 0 0 0 645.7,441.591 L1041.751,441.591 A0,0 0 0 0 1041.751,441.591 L1041.751,381.06 L1031.751,371.06 L645.7,371.06 A0,0 0 0 0 645.7,371.06" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1031.751,371.06 L1031.751,381.06 L1041.751,381.06 L1031.751,371.06" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="651.7" y="388.127" fill="#000" font-size="13" textLength="351.774">Payload stays unchanged (Annotate, this event type's</text><text x="651.7" y="403.26" fill="#000" font-size="13" textLength="375.051">default RejectionBehavior, ADR-035) -- never reaches the</text><text x="651.7" y="418.393" fill="#000" font-size="13" textLength="363.435">authoritative Entity Store, stays visible in the Event Log</text><text x="651.7" y="433.525" fill="#000" font-size="13" textLength="168.524">and Live View, re-labeled.</text></g><!--link *start* to PendingReview--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk3" data-source-line="1" data-link-type="dependency"><path d="M309.73,26.2 C309.73,53.14 309.73,127.53 309.73,168.08" style="stroke:#181818;stroke-width:1;" fill="none" id="*start*-to-PendingReview"/><polygon points="309.73,173.08,313.73,164.08,309.73,168.08,305.73,164.08,309.73,173.08" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="352.99" y="69.067" fill="#000" font-size="13" textLength="237.612">ContactProfileUpdated published via</text><text x="360.223" y="84.2" fill="#000" font-size="13" textLength="223.146">VCardAdapter.ParseInboundAsync</text><text x="310.73" y="99.333" fill="#000" font-size="13" textLength="322.131">(ReviewPending: true, ADR-072/ADR-035 default)</text></g><!--link PendingReview to Accepted--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk5" data-source-line="2" data-link-type="dependency"><path d="M278,223.84 C253.3,242.84 218.21,269.97 187.73,294.06 C150.31,323.64 111.489,355.035 83.629,377.695" style="stroke:#181818;stroke-width:1;" fill="none" id="PendingReview-to-Accepted"/><polygon points="79.75,380.85,89.256,378.274,83.629,377.695,84.208,372.068,79.75,380.85" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="207.513" y="307.127" fill="#000" font-size="13" textLength="253.087">authorityDecision{decision: accepted}</text><text x="240.302" y="322.26" fill="#000" font-size="13" textLength="187.51">published by a caller holding</text><text x="188.73" y="337.393" fill="#000" font-size="13" textLength="290.653">"identity:review" (ADR-046, reused resolver)</text></g><!--link PendingReview to Rejected--><g class="link" data-entity-1="ent0002" data-entity-2="ent0006" id="lnk7" data-source-line="3" data-link-type="dependency"><path d="M335.38,223.95 C350.52,237.3 370.61,253.26 390.73,264.06 C429,284.59 448.19,269.09 483.73,294.06 C516.29,316.93 539.759,351.46 554.319,376.67" style="stroke:#181818;stroke-width:1;" fill="none" id="PendingReview-to-Rejected"/><polygon points="556.82,381,555.783,371.206,554.319,376.67,548.855,375.207,556.82,381" fill="#181818" style="stroke:#181818;stroke-widt