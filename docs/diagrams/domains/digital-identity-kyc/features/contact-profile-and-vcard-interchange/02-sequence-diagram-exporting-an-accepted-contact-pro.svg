 L1696.573,700.641" style="stroke:#181818;stroke-width:0.5;" fill="#E2E2F0"/><path d="M1696.573,700.641 C1696.573,710.641 1714.573,710.641 1714.573,710.641 C1714.573,710.641 1732.573,710.641 1732.573,700.641" style="stroke:#181818;stroke-width:0.5;" fill="none"/><rect x="1836.633" y="658.047" width="138.735" height="46.594" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1859.195" y="678.042" fill="#000" font-size="14" textLength="93.611">Relying party</text><text x="1843.633" y="694.339" fill="#000" font-size="14" textLength="124.735">webhook receiver</text><polygon points="1702.573,128.859,1712.573,132.859,1702.573,136.859,1706.573,132.859" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="109.572" y1="132.859" x2="1708.573" y2="132.859" style="stroke:#181818;stroke-width:1;"/><text x="116.572" y="120.227" fill="#000" font-size="13" font-weight="700">1</text><text x="129.618" y="112.661" fill="#000" font-size="13" textLength="239.364">fold accepted ContactProfileUpdated</text><text x="129.618" y="127.793" fill="#000" font-size="13" textLength="297.572">into EntityType "ApplicantIdentity" (ADR-042)</text><polygon points="520.181,188.258,530.181,192.258,520.181,196.258,524.181,192.258" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="109.572" y1="192.258" x2="526.181" y2="192.258" style="stroke:#181818;stroke-width:1;"/><text x="116.572" y="172.059" fill="#000" font-size="13" font-weight="700">2</text><text x="129.618" y="156.926" fill="#000" font-size="13" textLength="207.848">enqueue WebhookOutbox entry</text><text x="129.618" y="172.059" fill="#000" font-size="13" textLength="385.563">(matches "acme-bank"'s WebhookSubscription.EventTypes</text><text x="129.618" y="187.192" fill="#000" font-size="13" textLength="227.214">including "ContactProfileUpdated")</text><line x1="1251.818" y1="236.523" x2="1293.818" y2="236.523" style="stroke:#181818;stroke-width:1;"/><line x1="1293.818" y1="236.523" x2="1293.818" y2="249.523" style="stroke:#181818;stroke-width:1;"/><line x1="1252.818" y1="249.523" x2="1293.818" y2="249.523" style="stroke:#181818;stroke-width:1;"/><polygon points="1262.818,245.523,1252.818,249.523,1262.818,253.523,1258.818,249.523" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1258.818" y="223.891" fill="#000" font-size="13" font-weight="700">3</text><text x="1271.863" y="216.325" fill="#000" font-size="13" textLength="236.571">mask payload against subscription's</text><text x="1271.863" y="231.458" fill="#000" font-size="13" textLength="435.709">FixedClaimsSnapshot first (ADR-009, ADR-060 -- unchanged order)</text><polygon points="798.594,289.789,788.594,293.789,798.594,297.789,794.594,293.789" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="792.594" y1="293.789" x2="1250.818" y2="293.789" style="stroke:#181818;stroke-width:1;"/><text x="804.594" y="281.157" fill="#000" font-size="13" font-weight="700">4</text><text x="817.64" y="273.59" fill="#000" font-size="13" textLength="238.354">FormatOutboundAsync(appId: "kyc",</text><text x="825.904" y="288.723" fill="#000" font-size="13" textLength="418.914">eventType: "ContactProfileUpdated", payload: &lt;masked JSON>)</text><line x1="787.594" y1="353.188" x2="829.594" y2="353.188" style="stroke:#181818;stroke-width:1;"/><line x1="829.594" y1="353.188" x2="829.594" y2="366.188" style="stroke:#181818;stroke-width:1;"/><line x1="788.594" y1="366.188" x2="829.594" y2="366.188" style="stroke:#181818;stroke-width:1;"/><polygon points="798.594,362.188,788.594,366.188,798.594,370.188,794.594,366.188" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="794.594" y="332.989" fill="#000" font-size="13" font-weight="700">5</text><text x="807.64" y="317.856" fill="#000" font-size="13" textLength="312.419">compose jCard JSON from the (already-masked)</text><text x="807.64" y="332.989" fill="#000" font-size="13" textLength="318.678">fields -- masked strings pass through as ordinary</text><text x="807.64" y="348.122" fill="#000" font-size="13" textLength="374.467">jCard text values, same as any other outbound transform</text><polygon points="1239.818,391.32,1249.818,395.32,1239.818,399.32,1243.818,395.32" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="787.594" y1="395.32" x2="1245.818" y2="395.32" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="794.594" y="390.254" fill="#000" font-size="13" font-weight="700">6</text><text x="807.64" y="390.254" fill="#000" font-size="13" textLength="133.663">&lt;jCard JSON string></text><path d="M792.594,408.32 L792.594,554.32 L1228.594,554.32 L1228.594,418.32 L1218.594,408.32 L792.594,408.32" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1218.594,408.32 L1218.594,418.32 L1228.594,418.32 L1218.594,408.32" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="798.594" y="425.387" fill="#000" font-size="13" textLength="358.909">This is the FIRST genuinely bidirectional adapter in this</text><text x="798.594" y="440.52" fill="#000" font-size="13" textLength="350.937">design -- Hl7V2Adapter/FhirAdapter are inbound-only,</text><text x="798.594" y="455.653" fill="#000" font-size="13" textLength="415.638">IchE2bR3Adapter/Gs1EpcisAdapter outbound-only (each throws</text><text x="798.594" y="470.786" fill="#000" font-size="13" textLength="372.582">NotSupportedException on its unsupported direction, per</text><text x="798.594" y="485.918" fill="#000" font-size="13" textLength="406.656">ADR-072's own text). VCardAdapter implements both because</text><text x="798.594" y="501.051" fill="#000" font-size="13" textLength="377.755">vCard's own use case genuinely needs both: importing an</text><text x="798.594" y="516.184" fill="#000" font-size="13" textLength="361.55">applicant- or relying-party-supplied contact record, and</text><text x="798.594" y="531.317" fill="#000" font-size="13" textLength="393.58">exporting a verified one back out -- ADR-072's interface was</text><text x="798.594" y="546.45" fill="#000" font-size="13" textLength="385.201">already shaped to allow this, just not yet exercised by one.</text><polygon points="1894.001,606.914,1904.001,610.914,1894.001,614.914,1898.001,610.914" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1251.818" y1="610.914" x2="1900.001" y2="610.914" style="stroke:#181818;stroke-width:1;"/><text x="1258.818" y="590.715" fill="#000" font-size="13" font-weight="700">7</text><text x="1271.863" y="575.583" fill="#000" font-size="13" textLength="271.68">POST { webhook-id, webhook-timestamp,</text><text x="1280.128" y="590.715" fill="#000" font-size="13" textLength="347.591">webhook-signature }, jCard-formatted contact profile</text><text x="1271.863" y="605.848" fill="#000" font-size="13" textLength="206.902">(Standard Webhooks, ADR-060)</text><polygon points="1262.818,636.047,1252.818,640.047,1262.818,644.047,1258.818,640.047" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1256.818" y1="640.047" x2="1905.001" y2="640.047" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="1268.818" y="634.981" fill="#000" font-size="13" font-weight="700">8</text><text x="1281.863" y="634.981" fill="#000" font-size="13" textLength="47.703">200 OK</text><?plantuml-src TLNRZjis47ttLmpy4XkmjgvR9AWHB63iUbktGBomjycBNqRao68iaIn9sHQ2_dk7klWIf80VA6akPmxF76CLZAxAbDp0eWjAA8iwm71HXTmu5Ufd4iehepVaJN4ajzCZHvKdEO75yoQP_ZeR3m4zkExxVPalbER679Rwduegwciq2TI-ku___8HEBYJQq7HQhJGVH8vwJo_6bHYwRrtp3xF9JeEfGcegBI778clHO1lsGp3FobiC8cywD6NUJzkiKnima1WmHKymNEh07C0s64SStJusJnjpcW1sB65GHnftOrr2xhjlgAYLtaDyMUzqrujv4wHwJbmRynf31