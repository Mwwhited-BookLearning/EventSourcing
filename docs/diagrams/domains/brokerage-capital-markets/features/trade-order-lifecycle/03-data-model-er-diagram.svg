"250.77" fill="#000" font-size="13" textLength="341.428">SequenceNumber's ChainHash -- a single store-wide</text><text x="424.69" y="265.903" fill="#000" font-size="13" textLength="351.768">sequence, not per-EntityId (ADR-019). A control-plane</text><text x="424.69" y="281.035" fill="#000" font-size="13" textLength="348.061">SchemaRegistered/RoleGranted event (ADR-067) is a</text><text x="424.69" y="296.168" fill="#000" font-size="13" textLength="363.625">StoredEvent like any other and extends the exact same</text><text x="424.69" y="311.301" fill="#000" font-size="13" textLength="333.582">chain the OrderSubmitted..OrderSettled events do.</text></g><g class="entity" data-qualified-name="GMN12" id="ent0013" data-source-line="53"><path d="M377.23,17.91 L377.23,56.94 L342.34,60.94 L377.23,64.94 L377.23,103.574 A0,0 0 0 0 377.23,103.574 L712.775,103.574 A0,0 0 0 0 712.775,103.574 L712.775,27.91 L702.775,17.91 L377.23,17.91 A0,0 0 0 0 377.23,17.91" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M702.775,17.91 L702.775,27.91 L712.775,27.91 L702.775,17.91" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="383.23" y="34.977" fill="#000" font-size="13" textLength="216.055">A "Cvv2" property here declaring</text><text x="383.23" y="50.11" fill="#000" font-size="13" textLength="298.137">x-masking.regulatoryClassification: "PCI-SAD"</text><text x="383.23" y="65.243" fill="#000" font-size="13" textLength="275.533">is what makes registration itself reject the</text><text x="383.23" y="80.375" fill="#000" font-size="13" textLength="314.545">whole event type (400), before any StoredEvent</text><text x="383.23" y="95.508" fill="#000" font-size="13" textLength="214.373">for it could ever exist (ADR-071).</text></g><!--link event to parent--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk5" data-source-line="38" data-link-type="crowfoot"><path d="M224.68,371.94 C224.68,398.65 224.68,400.17 224.68,421.39" style="stroke:#181818;