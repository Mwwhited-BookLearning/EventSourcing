<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:961px;height:797px;background:#FFFFFF;" width="961px" height="797px" viewBox="0 0 961 797" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="entity" data-qualified-name="RetentionHold" id="ent0001" data-source-line="8"><rect x="7" y="520" width="337.119" height="85.188" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="7" y1="546.297" x2="344.119" y2="546.297" style="stroke:#181818;stroke-width:0.5;"/><text x="125.558" y="537.995" fill="#000" font-size="14" textLength="100.003">RetentionHold</text><text x="12" y="564.292" fill="#000" font-size="14" textLength="285.913">FERPA-classified fields still decrypt/mask</text><text x="12" y="580.589" fill="#000" font-size="14" textLength="302.258">normally for a claim-holder while on hold --</text><text x="12" y="596.886" fill="#000" font-size="14" textLength="317.119">only the erasure itself is deferred, not access</text></g><g class="entity" data-qualified-name="Erased" id="ent0002" data-source-line="9"><rect x="171.43" y="682.19" width="370.267" height="101.484" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="171.43" y1="708.487" x2="541.697" y2="708.487" style="stroke:#181818;stroke-width:0.5;"/><text x="332.576" y="700.185" fill="#000" font-size="14" textLength="47.975">Erased</text><text x="176.43" y="726.482" fill="#000" font-size="14" textLength="293.398">every FERPA-classified field now wraps as</text><text x="176.43" y="742.779" fill="#000" font-size="14" textLength="323.955">{"erased": true} -- irreversible (ADR-057); the</text><text x="176.43" y="759.076" fill="#000" font-size="14" textLength="350.267">non-identifying event/entity shell survives forever</text><text x="176.43" y="775.373" fill="#000" font-size="14" textLength="228.471">("never lose data", README.md)</text></g><g class="start_entity" data-qualified-name=".start." id="ent0003" data-source-line="1"><ellipse cx="359.56" cy="16" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="Issued" id="ent0004" data-source-line="1"><rect x="327.01" y="87" width="65.09" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="327.01" y1="113.297" x2="392.1" y2="113.297" style="stroke:#181818;stroke-width:0.5;"/><text x="337.01" y="104.995" fill="#000" font-size="14" textLength="45.09">Issued</text></g><g class="entity" data-qualified-name="Active" id="ent0006" data-source-line="2"><rect x="327.78" y="232.5" width="63.552" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="327.78" y1="258.797" x2="391.332" y2="258.797" style="stroke:#181818;stroke-width:0.5;"/><text x="337.78" y="250.495" fill="#000" font-size="14" textLength="43.552">Active</text></g><g class="entity" data-qualified-name="ErasureRequested" id="ent0009" data-source-line="4"><rect x="285.2" y="378" width="148.714" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="285.2" y1="404.297" x2="433.914" y2="404.297" style="stroke:#181818;stroke-width:0.5;"/><text x="295.2" y="395.995" fill="#000" font-size="14" textLength="128.714">ErasureRequested</text></g><!--link *start* to Issued--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk5" data-source-line="1" data-link-type="dependency"><path d="M359.56,26.35 C359.56,40.29 359.56,61.95 359.56,81.65" style="stroke:#181818;stroke-width:1;" fill="none" id="*start*-to-Issued"/><polygon points="359.56,86.65,363.56,77.65,359.56,81.65,355.56,77.65,359.56,86.65" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Issued to Active--><g class="link" data-entity-1="ent0004" data-entity-2="ent0006" id="lnk7" data-source-line="2" data-link-type="dependency"><path d="M359.56,137.34 C359.56,163.73 359.56,200.6 359.56,227.04" style="stroke:#181818;stroke-width:1;" fill="none" id="Issued-to-Active"/><polygon points="359.56,232.04,363.56,223.04,359.56,227.04,355.56,223.04,359.56,232.04" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="453.782" y="180.067" fill="#000" font-size="13" textLength="207.232">EntityStoreRow folds (ADR-021)</text><text x="360.56" y="195.2" fill="#000" font-size="13" textLength="393.675">AuthorityStatus stays "accepted" throughout (ADR-006/064)</text></g><!--link Active to Active--><g class="link" data-entity-1="ent0006" data-entity-2="ent0006" id="lnk8" data-source-line="3" data-link-type="dependency"><path d="M391.51,244.25 C409.59,241.66 426.34,246.08 426.34,257.5 C426.34,268.92 414.539,274.049 396.459,271.459" style="stroke:#181818;stroke-width:1;" fill="none" id="Active-to-Active"/><polygon points="391.51,270.75,399.852,275.986,396.459,271.459,400.986,268.067,391.51,270.75" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="530.475" y="247.067" fill="#000" font-size="13" textLength="148.561">Verified (repeatable) --</text><text x="489.539" y="262.2" fill="#000" font-size="13" textLength="230.433">delegated platform read (ADR-043)</text><text x="432.34" y="277.333" fill="#000" font-size="13" textLength="344.83">OR offline DID/UCAN presentation (ADR-036, reused)</text></g><!--link Active to ErasureRequested--><g class="link" data-entity-1="ent0006" data-entity-2="ent0009" id="lnk10" data-source-line="4" data-link-type="dependency"><path d="M359.56,282.84 C359.56,309.23 359.56,346.1 359.56,372.54" style="stroke:#181818;stroke-width:1;" fill="none" id="Active-to-ErasureRequested"/><polygon points="359.56,377.54,363.56,368.54,359.56,372.54,355.56,368.54,359.56,377.54" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="373.823" y="329.067" fill="#000" font-size="13" textLength="224.834">EntityErasureRequested published</text><text x="360.56" y="344.2" fill="#000" font-size="13" textLength="251.361">for this credential's EntityId (ADR-057)</text></g><!--link ErasureRequested to RetentionHold--><g class="link" data-entity-1="ent0009" data-entity-2="ent0001" id="lnk11" data-source-line="5" data-link-type="dependency"><path d="M285.03,406.47 C246.92,411.96 203.43,425.62 178.56,458 C165.35,475.19 163.395,494.178 165.565,514.728" style="stroke:#181818;stroke-width:1;" fill="none" id="ErasureRequested-to-RetentionHold"/><polygon points="166.09,519.7,169.123,510.33,165.565,514.728,161.167,511.17,166.09,519.7" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="232.001" y="471.067" fill="#000" font-size="13" textLength="233.86">institutional retention policy applies</text><text x="179.56" y="486.2" fill="#000" font-size="13" textLength="338.743">(accreditation / transcript-authenticity requirement)</text></g><!--link ErasureRequested to Erased--><g class="link" data-entity-1="ent0009" data-entity-2="ent0002" id="lnk12" data-source-line="6" data-link-type="dependency"><path d="M434.32,409.63 C466.95,416.25 502.31,429.96 522.56,458 C573.09,527.97 568.51,579.13 522.56,652.19 C515.41,663.55 510.044,670.216 499.534,678.626" style="stroke:#181818;stroke-width:1;" fill="none" id="ErasureRequested-to-Erased"/><polygon points="495.63,681.75,505.156,679.25,499.534,678.626,500.158,673.004,495.63,681.75" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="664.636" y="559.657" fill="#000" font-size="13" textLength="176.205">no retention hold applies --</text><text x="559.76" y="574.79" fill="#000" font-size="13" textLength="385.957">IErasureKeyStore destroys the DEK immediately (ADR-057)</text></g><!--link RetentionHold to Erased--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk13" data-source-line="7" data-link-type="dependency"><path d="M160.48,605.59 C157.47,621.33 157.57,638.67 166.56,652.19 C174.18,663.66 179.857,670.419 190.717,678.829" style="stroke:#181818;stroke-width:1;" fill="none" id="RetentionHold-to-Erased"/><polygon points="194.67,681.89,190.003,673.217,190.717,678.829,185.105,679.542,194.67,681.89" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="167.56" y="648.257" fill="#000" font-size="13" textLength="350.441">retention window expires -- DEK destroyed (ADR-057)</text></g><?plantuml-src TLDTZz9057tdLzpm8XWgwAwOO69212FP-16CleWFivrRc3YTwSwTmZR6_-wPKjmb6ruecSxvklVqv_DVb6NlQ2LIi-uT7-t9F8zcppIZfOicDj-Y3xps1ogyrKA3-MATJLwz76xSl8ux7zehAjP24bKZr5TvpbLatQUu2xxUxdmTEzXaEfvChuUzJk9CxGS7KnXu60IkM4LrQtc8AnkdsV9MWP4ggsBXGqc1bUuuhwzWvSkQV55OuvWMgyNu-_lvPwe22pjOCzvrTw-c8q1hONtcOHcKr0Z9TpLBqZbbV_AYgc-jaHthZOCF13H2UM0D7QFiC-bmgvEvrs-6lISaINBDCM6y-uYfGiyu0R1E9yh2O_UMAczDtf2gAcjODcw0wKBFTB7658DoaWTJnKnX7mcMmm4exceJkCJ11GlfiCtg_2F1NVBJoRNJNtNW6pvMWJGeWiUceKQBvGsPieGZBCWsZsAV9pmJV50x6ATHBRwlu3NfjOIT0kkBT3Fwi5n_dMUvLIB7sk0dzHDZj1OCUMYgE2wL_DuuXyee2tTfPue0CcMMWdAWmyvOfbFm5DWxt4pP-1YSJ1Is1M7LcWiE6Fy8CukKYYxI-n-BznoQ2yO0ED0Xg4f8OOr_-joY-ZCiiEQ_ARa1CnZ4eFWFmTycAoc2oqnRiw8nRfkqN1npspP28P4PNlTejAIKYGXbwRlqXwmNh0sVL7z4w-LyyMdvejJ3Vm00?></g></svg>