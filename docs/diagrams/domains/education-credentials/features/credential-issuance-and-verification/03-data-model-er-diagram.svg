ityStoreRow table as Credential,</text><text x="265.38" y="300.978" fill="#000" font-size="13" textLength="268.1">distinguished only by EntityType, exactly</text><text x="265.38" y="316.111" fill="#000" font-size="13" textLength="291.434">the way ADR-021 already treats every entity</text><text x="265.38" y="331.244" fill="#000" font-size="13" textLength="33.173">type.</text></g><g class="entity" data-qualified-name="GMN12" id="ent0013" data-source-line="66"><path d="M931.89,223.38 L931.89,339.31 L1273.136,339.31 L1273.136,233.38 L1263.136,223.38 L931.89,223.38" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1263.136,223.38 L1263.136,233.38 L1273.136,233.38 L1263.136,223.38" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="937.89" y="240.447" fill="#000" font-size="13" textLength="308.318">FERPA-classified fields (StudentId, DateOfBirth)</text><text x="937.89" y="255.58" fill="#000" font-size="13" textLength="320.246">carry x-masking.regulatoryClassification "FERPA"</text><text x="937.89" y="270.713" fill="#000" font-size="13" textLength="163.04">in the registered schema</text><text x="937.89" y="285.845" fill="#000" font-size="13" textLength="296.048">(../../../data/schema-registry.md) -- encrypted</text><text x="937.89" y="300.978" fill="#000" font-size="13" textLength="271.223">before Payload is ever written (ADR-057),</text><text x="937.89" y="316.111" fill="#000" font-size="13" textLength="298.391">masked at read time regardless of encryption</text><text x="937.89" y="331.244" fill="#000" font-size="13" textLength="108.78">state (ADR-009).</text></g><!--link event to credential--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk5" data-source-line="50" data-link-type="dependency"><path d="M679.11,163.56 C679.11,233.51 679.11,329.58 679.11,394.08" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="event-to-credential" codeLine="50"/><polygon points="679.11,399.08,683.11,390.08,679.1