ity" data-qualified-name="rp" id="ent0013" data-source-line="17"><rect x="630.87" y="23.3" width="107.167" height="36.297" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="637.87" y="38.295" fill="#000" font-size="14" textLength="93.167">Relying Party</text><line x1="631.87" y1="43.597" x2="737.037" y2="43.597" style="stroke:#181818;stroke-width:0.5;"/></g><g class="entity" data-qualified-name="GMN15" id="ent0016" data-source-line="21"><path d="M888.15,345.08 L888.15,436.87 L853.38,440.87 L888.15,444.87 L888.15,536.674 A0,0 0 0 0 888.15,536.674 L1166.757,536.674 A0,0 0 0 0 1166.757,536.674 L1166.757,355.08 L1156.757,345.08 L888.15,345.08 A0,0 0 0 0 888.15,345.08" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1156.757,345.08 L1156.757,355.08 L1166.757,355.08 L1156.757,345.08" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="894.15" y="362.147" fill="#000" font-size="13" textLength="257.607">ADR-039's one-event-type-per-instance</text><text x="894.15" y="377.28" fill="#000" font-size="13" textLength="222.606">model means no single client-web</text><text x="894.15" y="392.413" fill="#000" font-size="13" textLength="238.951">instance ever sees every field above</text><text x="894.15" y="407.545" fill="#000" font-size="13" textLength="202.179">at once -- each playbook's own</text><text x="894.15" y="422.678" fill="#000" font-size="13" textLength="219.534">Detail view only shows whichever</text><text x="894.15" y="437.811" fill="#000" font-size="13" textLength="192.239">ONE event type that instance</text><text x="894.15" y="452.944" fill="#000" font-size="13" textLength="224.028">subscribes to, even though all five</text><text x="894.15" y="468.077" fill="#000" font-size="13" textLength="213.205">fold onto this same authoritative</text><text x="894.15" y="483.209" fill="#000" font-size="13" textLength="181.803">entity server-side (see each</text><text x="894.15" y="498.342" fill="#000" font-size="13" textLength="240.678">playbook's own "Sequence Diagram"</text><text x="894.15" y="513.475" fill="#000" font-size="13" textLength="201.125">section for exactly which fields</text><text x="894.15" y="528.608" fill="#000" font-size="13" textLength="96.726">render where).</text></g><!--link doc to applicant--><g class="link" data-entity-1="ent0002" data-entity-2="ent0001" id="lnk7" data-source-line="9" data-link-type="dependency"><path d="M216.21,252.22 C325.91,293.29 534.637,371.437 644.217,412.457" style="stroke:#181818;stroke-width:1;" fill="none" id="doc-to-applicant" codeLine="9"/><polygon points="648.9,414.21,641.874,407.309,644.217,412.457,639.069,414.801,648.9,414.21" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="382.4" y="311.147" fill="#000" font-size="13" textLength="120.256">folds onto (Partial)</text></g><!--link biometric to applicant--><g class="link" data-entity-1="ent0003" data-entity-2="ent0001" id="lnk8" data-source-line="10" data-link-type="dependency"><path d="M459.79,252.22 C516.26,293.35 622.138,370.457 678.398,411.427" style="stroke:#181818;stroke-width:1;" fill="none" id="biometric-to-applicant" codeLine="10"/><polygon points="682.44,414.37,677.519,405.838,678.398,411.427,672.81,412.305,682.44,414.37" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="545.71" y="311.147" fill="#000" font-size="13" textLength="120.256">folds onto (Partial)</text></g><!--link claim to applicant--><g class="link" data-entity-1="ent0004" data-entity-2="ent0001" id="lnk9" data-source-line="11" data-link-type="dependency"><path d="M717.45,260.29 C717.45,303.07 717.45,370.79 717.45,409.26" style="stroke:#181818;stroke-width:1;" fill="none" id="claim-to-applicant" codeLine="11"/><polygon points="717.45,414.26,721.45,405.26,717.45,409.26,713.45,405.26,717.45,414.26" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit