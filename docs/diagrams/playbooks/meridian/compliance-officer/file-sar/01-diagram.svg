s own seed data starts here)]</text><polygon points="97.411,259.133,87.411,263.133,97.411,267.133,93.411,263.133" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="91.411" y1="263.133" x2="528.853" y2="263.133" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="103.411" y="250.5" fill="#000" font-size="13" font-weight="700">2</text><text x="116.457" y="242.934" fill="#000" font-size="13" textLength="272.81">401 WWW-Authenticate: step-up required</text><text x="116.457" y="258.067" fill="#000" font-size="13" textLength="229.328">(acr_values="urn:kyc:acr:step-up")</text><line x1="86.411" y1="322.531" x2="128.411" y2="322.531" style="stroke:#181818;stroke-width:1;"/><line x1="128.411" y1="322.531" x2="128.411" y2="335.531" style="stroke:#181818;stroke-width:1;"/><line x1="87.411" y1="335.531" x2="128.411" y2="335.531" style="stroke:#181818;stroke-width:1;"/><polygon points="97.411,331.531,87.411,335.531,97.411,339.531,93.411,335.531" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="93.411" y="302.333" fill="#000" font-size="13" font-weight="700">3</text><text x="106.457" y="287.2" fill="#000" font-size="13" textLength="334.89">re-authenticate (IdP's own mechanism, ADR-066) --</text><text x="106.457" y="302.333" fill="#000" font-size="13" textLength="333.068">Samples.Meridian.Seed simulates this by attaching</text><text x="106.457" y="317.465" fill="#000" font-size="13" textLength="385.246">"acr"/"auth_time" claims directly, no real DevIdp round trip</text><polygon points="517.853,375.797,527.853,379.797,517.853,383.797,521.853,379.797" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="86.411" y1="379.797" x2="523.853" y2="379.797" style="stroke:#181818;stroke-width:1;"/><text x="93.411" y="367.165" fill="#000" font-size="13" font-weight="700">4</text><text x="106.457" y="359.598" fill="#000" font-size="13" textLength="248.092">retry POST /publish/SarFilingRecorded</text><text x="106.457" y="374.731" fill="#000" font-size="13" textLength="406.396">(same payload, stepped-up token, Meaning: "approved filing")</text><polygon points="945.596,449.195,955.596,453.195,945.596,457.195,949.596,453.195" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="529.853" y1="453.195" x2="951.596" y2="453.195" style="stroke:#181818;stroke-width:1;"/><text x="536.853" y="432.997" fill="#000" font-size="13" font-weight="700">5</text><text x="549.898" y="417.864" fill="#000" font-size="13" textLength="263.891">INSERT StoredEvent (SarFilingRecorded)</text><text x="549.898" y="432.997" fill="#000" font-size="13" textLength="390.698">Signature: { SignerId, SignedAt, Meaning: "approved filing",</text><text x="558.163" y="448.129" fill="#000" font-size="13" textLength="181.353">Acr: "urn:kyc:acr:step-up" }</text><polygon points="1076.078,493.461,1086.078,497.461,1076.078,501.461,1080.078,497.461" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="529.853" y1="497.461" x2="1082.078" y2="497.461" style="stroke:#181818;stroke-width:1;"/><text x="536.853" y="484.829" fill="#000" font-size="13" font-weight="700">6</text><text x="549.898" y="477.262" fill="#000" font-size="13" textLength="232.642">fold (Partial) onto ApplicantIdentity,</text><text x="549.898" y="492.395" fill="#000" font-size="13" textLength="181.924">AuthorityStatus: "accepted"</text><path d="M1093.078,466.195 L1093.078,506.195 L1512.078,506.195 L1512.078,476.195 L1502.078,466.195 L1093.078,466.195" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1502.078,466.195 L1502.078,476.195 L1512.078,476.195 L1502.078,466.195" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="1099.078" y="483.262" fill="#000" font-size="13" textLength="373.89">the actual FinCEN BSA E-Filing submission is out of scope</text><text x="1099.078" y="498.395" fill="#000" font-size="13" textLength="398.303">(ADR-072's IInterchangeFormatAdapter seam, not built here)</text><rect x="10" y="532.027" width="1635.191" height="3" fill="#EEE" style="stroke:#EEE;stroke-width:1;"/><line x1="10" y1="532.027" x2="1645.191" y2="532.027" style="stroke:#000;stroke-width:1;"/><line x1="10" y1="535.027" x2="1645.191" y2="535.027" style="stroke:#000;stroke-width:1;"/><rect x="656.626" y="521.461" width="341.939" height="23.133" fill="#EEE" style="stroke:#000;stroke-width:2;"/><text x="662.626" y="537.528" fill="#000" font-size="13" textLength="323.413" font-weight="700">Later: staff browse the result via client-web</text><polygon points="1099.078,571.727,1089.078,575.727,1099.078,579.727,1095.078,575.727" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1093.078" y1="575.727" x2="1531.395" y2="575.727" style="stroke:#181818;stroke-width:1;"/><text x="1105.078" y="570.661" fill="#000" font-size="13" font-weight="700">7</text><text x="1118.123" y="570.661" fill="#000" font-size="13" textLength="407.272">(via GraphQL Subscription on_kyc_SarFilingRecorded, REPLAY)</text><polygon points="97.411,631.125,87.411,635.125,97.411,639.125,93.411,635.125" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="91.411" y1="635.125" x2="1531.395" y2="635.125" style="stroke:#181818;stroke-width:1;"/><text x="103.411" y="614.926" fill="#000" font-size="13" font-weight="700">8</text><text x="116.457" y="599.793" fill="#000" font-size="13" textLength="308.813">Detail view -- FilingReferenceId renders plainly;</text><text x="116.457" y="614.926" fill="#000" font-size="13" textLength="382.592">Narrative renders masked ("***", x-masking requiredClaim</text><text x="116.457" y="630.059" fill="#000" font-size="13" textLength="143.222">"identity:aml-review")</text><?plantuml-src XLLXQ-D64