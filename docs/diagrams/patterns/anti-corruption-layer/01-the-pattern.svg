<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SEQUENCE" style="width:764px;height:506px;background:#FFFFFF;" width="764px" height="506px" viewBox="0 0 764 506" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g><title>Foreign system</title><rect x="111.015" y="57.594" width="8" height="390.125" fill="#000" fill-opacity="0"/><line x1="114.515" y1="57.594" x2="114.515" y2="447.719" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>Anti-Corruption Layer</title><rect x="359.52" y="57.594" width="8" height="390.125" fill="#000" fill-opacity="0"/><line x1="363.02" y1="57.594" x2="363.02" y2="447.719" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>Your own domain model</title><rect x="657.959" y="57.594" width="8" height="390.125" fill="#000" fill-opacity="0"/><line x1="661.459" y1="57.594" x2="661.459" y2="447.719" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><rect x="10" y="10" width="209.029" height="46.594" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="60.665" y="29.995" fill="#000" font-size="14" textLength="107.7">Foreign system</text><text x="17" y="46.292" fill="#000" font-size="14" textLength="195.029">(different model/semantics)</text><rect x="280.623" y="10" width="164.794" height="46.594" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="287.623" y="29.995" fill="#000" font-size="14" textLength="150.794">Anti-Corruption Layer</text><text x="302.887" y="46.292" fill="#000" font-size="14" textLength="120.265">(translation only)</text><rect x="569.454" y="26.297" width="184.01" height="30.297" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="576.454" y="46.292" fill="#000" font-size="14" textLength="170.01">Your own domain model</text><rect x="10" y="447.719" width="209.029" height="46.594" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="60.665" y="467.714" fill="#000" font-size="14" textLength="107.7">Foreign system</text><text x="17" y="484.011" fill="#000" font-size="14" textLength="195.029">(different model/semantics)</text><rect x="280.623" y="447.719" width="164.794" height="46.594" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="287.623" y="467.714" fill="#000" font-size="14" textLength="150.794">Anti-Corruption Layer</text><text x="302.887" y="484.011" fill="#000" font-size="14" textLength="120.265">(translation only)</text><rect x="569.454" y="447.719" width="184.01" height="30.297" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="576.454" y="467.714" fill="#000" font-size="14" textLength="170.01">Your own domain model</text><polygon points="351.02,97.859,361.02,101.859,351.02,105.859,355.02,101.859" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="114.515" y1="101.859" x2="357.02" y2="101.859" style="stroke:#181818;stroke-width:1;"/><text x="121.515" y="89.227" fill="#000" font-size="13" font-weight="700">1</text><text x="134.56" y="81.661" fill="#000" font-size="13" textLength="211.459">message in the foreign system's</text><text x="134.56" y="96.793" fill="#000" font-size="13" textLength="146.434">own shape/vocabulary</text><line x1="363.02" y1="161.258" x2="405.02" y2="161.258" style="stroke:#181818;stroke-width:1;"/><line x1="405.02" y1="161.258" x2="405.02" y2="174.258" style="stroke:#181818;stroke-width:1;"/><line x1="364.02" y1="174.258" x2="405.02" y2="174.258" style="stroke:#181818;stroke-width:1;"/><polygon points="374.02,170.258,364.02,174.258,374.02,178.258,370.02,174.258" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="370.02" y="141.059" fill="#000" font-size="13" font-weight="700">2</text><text x="383.065" y="125.926" fill="#000" font-size="13" textLength="183.657">translate into your domain's</text><text x="383.065" y="141.059" fill="#000" font-size="13" textLength="173.653">registered shape -- foreign</text><text x="383.065" y="156.192" fill="#000" font-size="13" textLength="271.394">quirks stop here, never propagate further</text><polygon points="649.459,214.523,659.459,218.523,649.459,222.523,653.459,218.523" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="363.02" y1="218.523" x2="655.459" y2="218.523" style="stroke:#181818;stroke-width:1;"/><text x="370.02" y="205.891" fill="#000" font-size="13" font-weight="700">3</text><text x="383.065" y="198.325" fill="#000" font-size="13" textLength="171.571">publish/apply in your own,</text><text x="383.065" y="213.458" fill="#000" font-size="13" textLength="159.986">clean, unmodified shape</text><polygon points="374.02,258.789,364.02,262.789,374.02,266.789,370.02,262.789" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="368.02" y1="262.789" x2="660.459" y2="262.789" style="stroke:#181818;stroke-width:1;"/><text x="380.02" y="250.157" fill="#000" font-size="13" font-weight="700">4</text><text x="393.065" y="242.59" fill="#000" font-size="13" textLength="177.201">an outbound event, in your</text><text x="393.065" y="257.723" fill="#000" font-size="13" textLength="70.186">own shape</text><line x1="363.02" y1="307.055" x2="405.02" y2="307.055" style="stroke:#181818;stroke-width:1;"/><line x1="405.02" y1="307.055" x2="405.02" y2="320.055" style="stroke:#181818;stroke-width:1;"/><line x1="364.02" y1="320.055" x2="405.02" y2="320.055" style="stroke:#181818;stroke-width:1;"/><polygon points="374.02,316.055,364.02,320.055,374.02,324.055,370.02,320.055" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="370.02" y="294.422" fill="#000" font-size="13" font-weight="700">5</text><text x="383.065" y="286.856" fill="#000" font-size="13" textLength="195.59">translate into whatever shape</text><text x="383.065" y="301.989" fill="#000" font-size="13" textLength="180.267">the foreign system requires</text><polygon points="125.515,360.32,115.515,364.32,125.515,368.32,121.515,364.32" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="119.515" y1="364.32" x2="362.02" y2="364.32" style="stroke:#181818;stroke-width:1;"/><text x="131.515" y="351.688" fill="#000" font-size="13" font-weight="700">6</text><text x="144.56" y="344.122" fill="#000" font-size="13" textLength="197.545">deliver in the foreign system's</text><text x="144.56" y="359.254" fill="#000" font-size="13" textLength="108.17">expected format</text><path d="M263.598,377.32 L263.598,432.32 L461.598,432.32 L461.598,387.32 L451.598,377.32 L263.598,377.32" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M451.598,377.32 L451.598,387.32 L461.598,387.32 L451.598,377.32" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="269.598" y="394.387" fill="#000" font-size="13" textLength="177.842">Neither side needs to know</text><text x="269.598" y="409.52" fill="#000" font-size="13" textLength="170.65">the other's model exists --</text><text x="269.598" y="424.653" fill="#000" font-size="13" textLength="131.339">only this layer does.</text><?plantuml-src VLB1Jkmm3BptAomkWBJBtlU0X9xqJeWxKY_Urjr6f4wm4w1_ZxrjqKDFS8lYySnuRAmbSPrE94r6AQ4B6Rd0rTya5CuCEckXgUMRFWm32LbjIZt5Wz9amD3fxHMWmh3WlvCy663_9udKN49YUCIPnBYA86l4or_YE2yKsCNlxS-f2gHtXZvD67WHla2NZwPPLM5_xzr7c4WLpmG6BYDjfjOXhhLbPzCHCntUKeUd6b7cnbg_63Phpb4Ip6vXKVDseNCmAg5-OO7zVXDf-RK6UL7GaZACXja1qni9P4aPpquvL35RiWakl4V8zHI3ZWVCESxkVLu7txNSHKBUGMKRFWnX4swQDPFDDrgIjPnIvHvCbSjk8_fdwDycVH_jwNOlo9R_pm-4V4JIZMOj7y7M4hprnzZf8rDNpBoL9YmD9vDDtk9B1tYYuC60XfuiDUeLpDABERUYKoOlN-jo0a0VjWMr