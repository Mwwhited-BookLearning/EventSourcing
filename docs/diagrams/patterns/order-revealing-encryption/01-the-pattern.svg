 fill="#000" font-size="14" textLength="164.042">(stores only ciphertext)</text><path d="M316.222,576.445 C316.222,566.445 334.222,566.445 334.222,566.445 C334.222,566.445 352.222,566.445 352.222,576.445 L352.222,602.445 C352.222,612.445 334.222,612.445 334.222,612.445 C334.222,612.445 316.222,612.445 316.222,602.445 L316.222,576.445" style="stroke:#181818;stroke-width:0.5;" fill="#E2E2F0"/><path d="M316.222,576.445 C316.222,586.445 334.222,586.445 334.222,586.445 C334.222,586.445 352.222,586.445 352.222,576.445" style="stroke:#181818;stroke-width:0.5;" fill="none"/><line x1="56.112" y1="117.727" x2="98.112" y2="117.727" style="stroke:#181818;stroke-width:1;"/><line x1="98.112" y1="117.727" x2="98.112" y2="130.727" style="stroke:#181818;stroke-width:1;"/><line x1="57.112" y1="130.727" x2="98.112" y2="130.727" style="stroke:#181818;stroke-width:1;"/><polygon points="67.112,126.727,57.112,130.727,67.112,134.727,63.112,130.727" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="63.112" y="112.661" fill="#000" font-size="13" font-weight="700">1</text><text x="76.157" y="112.661" fill="#000" font-size="13" textLength="225.723">ciphertextA = ORE.Encrypt(key, a)</text><line x1="56.112" y1="159.859" x2="98.112" y2="159.859" style="stroke:#181818;stroke-width:1;"/><line x1="98.112" y1="159.859" x2="98.112" y2="172.859" style="stroke:#181818;stroke-width:1;"/><line x1="57.112" y1="172.859" x2="98.112" y2="172.859" style="stroke:#181818;stroke-width:1;"/><polygon points="67.112,168.859,57.112,172.859,67.112,176.859,63.112,172.859" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="63.112" y="154.793" fill="#000" font-size="13" font-weight="700">2</text><text x="76.157" y="154.793" fill="#000" font-size="13" textLength="226.034">ciphertextB = ORE.Encrypt(key, b)</text><polygon points="322.222,197.992,332.222,201.992,322.222,205.992,326.222,201.992" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="56.112" y1="201.992" x2="328.222" y2="201.992" style="stroke:#181818;stroke-width:1;"/><text x="63.112" y="196.926" fill="#000" font-size="13" font-weight="700">3</text><text x="76.157" y="196.926" fill="#000" font-size="13" textLength="196.333">store ciphertextA, ciphertextB</text><polygon points="322.222,242.258,332.222,246.258,322.222,250.258,326.222,246.258" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="56.112" y1="246.258" x2="328.222" y2="246.258" style="stroke:#181818;stroke-width:1;"/><text x="63.112" y="233.625" fill="#000" font-size="13" font-weight="700">4</text><text x="76.157" y="226.059" fill="#000" font-size="13" textLength="174.814">WHERE field > ciphertextX</text><text x="76.157" y="241.192" fill="#000" font-size="13" textLength="241.065">(a native comparison, no decryption)</text><line x1="334.222" y1="290.523" x2="376.222" y2="290.523" style="stroke:#181818;stroke-width:1;"/><line x1="376.222" y1="290.523" x2="376.222" y2="303.523" style="stroke:#181818;stroke-width:1;"/><line x1="335.222" y1="303.523" x2="376.222" y2="303.523" style="stroke:#181818;stroke-width:1;"/><polygon points="345.222,299.523,335.222,303.523,345.222,307.523,341.222,303.523" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="341.222" y="277.891" fill="#000" font-size="13" font-weight="700">5</text><text x="354.268" y="270.325" fill="#000" font-size="13" textLength="262.875">Compare(storedCiphertext, ciphertextX)</text><text x="354.268" y="285.458" fill="#000" font-size="13" textLength="142.975">for every indexed row</text><polygon points="67.112,343.789,57.112,347.789,67.112,351.789,63.112,347.789" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="61.112" y1="347.789" x2="333.222" y2="347.789" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="73.112" y="335.157" fill="#000" font-size="13" font-weight="700">6</text><text x="86.157" y="327.59" fill="#000" font-size="13" textLength="127.683">matching rows only</text><text x="86.157" y="342.723" fill="#000" font-size="13" textLength="103.46">(still ciphertext)</text><line x1="56.112" y1="392.055" x2="98.112" y2="392.055" style="stroke:#181818;stroke-width:1;"/><line x1="98.112" y1="392.055" x2="98.112" y2="405.055" style="stroke:#181818;stroke-width:1;"/><line x1="57.112" y1="405.055" x2="98.112" y2="405.055" style="stroke:#181818;stroke-width:1;"/><polygon points="67.112,401.055,57.112,405.055,67.112,409.055,63.112,405.055" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="63.112" y="379.422" fill="#000" font-size="13" font-weight="700">7</text><text x="76.157" y="371.856" fill="#000" font-size="13" textLength="208.197">for each matched row the caller</text><text x="76.157" y="386.989" fill="#000" font-size="13" textLength="179.734">holds the claim for: decrypt</text><path d="M339.222,418.055 L339.222,518.055 L546.222,518.055 L546.222,428.055 L536.222,418.055 L339.222,418.055" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M536.222,418.055 L536.222,428.055 L546.222,428.055 L536.222,418.055" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="345.222" y="435.122" fill="#000" font-size="13" textLength="181.422">The comparison itself never</text><text x="345.222" y="450.254" fill="#000" font-size="13" textLength="186.024">touches plaintext. Only rows</text><text x="345.222" y="465.387" fill="#000" font-size="13" textLength="185.72">that actually match are ever</text><text x="345.222" y="480.52" fill="#000" font-size="13" textLength="164.493">decrypted, and only for a</text><text x="345.222" y="495.653" fill="#000" font-size="13" textLength="173.596">caller who holds the field's</text><text x="345.222" y="510.786" fill="#000" font-size="13" textLength="39.133">claim.</text><?plantuml-src TL91JiCm4Bpd5QDUe5Bf0og1L4ebRaW82GwzRE9jRU6k8sVRajzZEsq94jmYxypip6pee44E-vfZrL9KrxYMH35Pjgrt3QaBCW5reBQj32dLr34cJ-UlZTns6Y9t2E9x9BBbgFobqq8oTLKb8kuUCdyncYznZvVNzNmjJUnRlVtaVWQQ_eD-_0jTNz6cNg3O62-OZVdL6Fh-l7vTO-lO6poCK1yf3K5IvcDI2llKX-k2p201XilcrCQqClL5QLL0F7HWLbUbyUwFwKQs8OAF77iuCVp51Z6SYiubwvwqiKvsUJ2KMQfrtezB_TrcKQN63kH156gJT_AUuqPiyAORNZovVIOiBaag2Sg8RcSLOPil1RpPSMuuxTXl8Tbvcceuf2qTsgGbsSuSB_desN4UMr9GeuUql1yi8NM3C_kybaqwivZXTya1ACq6lpZPW1_BvJutMRcOdrUSQDdqDm00?></g></svg>