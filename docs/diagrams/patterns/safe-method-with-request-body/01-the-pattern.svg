<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:967px;height:276px;background:#FFFFFF;" width="967px" height="276px" viewBox="0 0 967 276" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="entity" data-qualified-name="GET" id="ent0001" data-source-line="5"><rect x="7" y="7.33" width="262.756" height="123.75" fill="#EEE" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="108.469" y="18.469" fill="#000" font-size="12" textLength="59.818" font-style="italic">«Method»</text><text x="124.255" y="36.294" fill="#000" font-size="14" textLength="28.246">GET</text><line x1="8" y1="41.596" x2="268.756" y2="41.596" style="stroke:#181818;stroke-width:0.5;"/><text x="13" y="58.591" fill="#000" font-size="14" textLength="64.367">Safe: yes</text><text x="13" y="74.888" fill="#000" font-size="14" textLength="114.543">Idempotent: yes</text><text x="13" y="91.185" fill="#000" font-size="14" textLength="106.866">Cacheable: yes</text><text x="13" y="107.481" fill="#000" font-size="14" textLength="250.756">Request body: undefined/unreliable</text><text x="13" y="123.778" fill="#000" font-size="14" textLength="223.05">— query must live in the URL —</text></g><g class="entity" data-qualified-name="POST" id="ent0002" data-source-line="6"><rect x="304.88" y="7.33" width="258.996" height="123.75" fill="#EEE" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="404.469" y="18.469" fill="#000" font-size="12" textLength="59.818" font-style="italic">«Method»</text><text x="415.928" y="36.294" fill="#000" font-size="14" textLength="36.9">POST</text><line x1="305.88" y1="41.596" x2="562.876" y2="41.596" style="stroke:#181818;stroke-width:0.5;"/><text x="310.88" y="58.591" fill="#000" font-size="14" textLength="57.613">Safe: no</text><text x="310.88" y="74.888" fill="#000" font-size="14" textLength="107.789">Idempotent: no</text><text x="310.88" y="91.185" fill="#000" font-size="14" textLength="186.368">Cacheable: no (by default)</text><text x="310.88" y="107.481" fill="#000" font-size="14" textLength="224.417">Request body: yes, well-defined</text><text x="310.88" y="123.778" fill="#000" font-size="14" textLength="246.996">— side effects assumed possible —</text></g><g class="entity" data-qualified-name="QUERYM" id="ent0003" data-source-line="7"><rect x="598.64" y="7.33" width="353.476" height="123.75" fill="#EEE" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="745.469" y="18.469" fill="#000" font-size="12" textLength="59.818" font-style="italic">«Method»</text><text x="705.224" y="36.294" fill="#000" font-size="14" textLength="140.308">QUERY (RFC 10008)</text><line x1="599.64" y1="41.596" x2="951.116" y2="41.596" style="stroke:#181818;stroke-width:0.5;"/><text x="604.64" y="58.591" fill="#000" font-size="14" textLength="64.367">Safe: yes</text><text x="604.64" y="74.888" fill="#000" font-size="14" textLength="114.543">Idempotent: yes</text><text x="604.64" y="91.185" fill="#000" font-size="14" textLength="106.866">Cacheable: yes</text><text x="604.64" y="107.481" fill="#000" font-size="14" textLength="224.417">Request body: yes, well-defined</text><text x="604.64" y="123.778" fill="#000" font-size="14" textLength="341.476">— complex query, no URL/log/cache exposure —</text></g><g class="entity" data-qualified-name="GMN4" id="ent0005" data-source-line="28"><path d="M654.5,191.08 L654.5,261.611 A0,0 0 0 0 654.5,261.611 L896.246,261.611 A0,0 0 0 0 896.246,261.611 L896.246,201.08 L886.246,191.08 L779.38,191.08 L775.38,131.52 L771.38,191.08 L654.5,191.08 A0,0 0 0 0 654.5,191.08" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M886.246,191.08 L886.246,201.08 L896.246,201.08 L886.246,191.08" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="660.5" y="208.147" fill="#000" font-si