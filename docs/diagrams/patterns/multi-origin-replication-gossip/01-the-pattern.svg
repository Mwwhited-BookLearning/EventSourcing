<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SEQUENCE" style="width:714px;height:506px;background:#FFFFFF;" width="714px" height="506px" viewBox="0 0 714 506" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g><title>Site A</title><rect x="33.953" y="41.297" width="8" height="422.992" fill="#000" fill-opacity="0"/><line x1="37.453" y1="41.297" x2="37.453" y2="464.289" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>Site B</title><rect x="289.859" y="41.297" width="8" height="422.992" fill="#000" fill-opacity="0"/><line x1="293.359" y1="41.297" x2="293.359" y2="464.289" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>Site C</title><rect x="672.808" y="41.297" width="8" height="422.992" fill="#000" fill-opacity="0"/><line x1="676.308" y1="41.297" x2="676.308" y2="464.289" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><rect x="10" y="10" width="54.906" height="30.297" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="17" y="29.995" fill="#000" font-size="14" textLength="40.906">Site A</text><rect x="265.893" y="10" width="54.934" height="30.297" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="272.893" y="29.995" fill="#000" font-size="14" textLength="40.934">Site B</text><rect x="648.755" y="10" width="55.104" height="30.297" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="655.755" y="29.995" fill="#000" font-size="14" textLength="41.104">Site C</text><rect x="10" y="464.289" width="54.906" height="30.297" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="17" y="484.284" fill="#000" font-size="14" textLength="40.906">Site A</text><rect x="265.893" y="464.289" width="54.934" height="30.297" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="272.893" y="484.284" fill="#000" font-size="14" textLength="40.934">Site B</text><rect x="648.755" y="464.289" width="55.104" height="30.297" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="655.755" y="484.284" fill="#000" font-size="14" textLength="41.104">Site C</text><path d="M14.95,54.297 L14.95,109.297 L697.95,109.297 L697.95,64.297 L687.95,54.297 L14.95,54.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M687.95,54.297 L687.95,64.297 L697.95,64.297 L687.95,54.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="248.809" y="71.364" fill="#000" font-size="13" textLength="207.143">Each site accepts writes locally,</text><text x="248.809" y="86.497" fill="#000" font-size="13" textLength="203.684">independent of the others -- no</text><text x="248.809" y="101.629" fill="#000" font-size="13" textLength="173.018">coordination at write time.</text><line x1="37.453" y1="135.828" x2="79.453" y2="135.828" style="stroke:#181818;stroke-width:1;"/><line x1="79.453" y1="135.828" x2="79.453" y2="148.828" style="stroke:#181818;stroke-width:1;"/><line x1="38.453" y1="148.828" x2="79.453" y2="148.828" style="stroke:#181818;stroke-width:1;"/><polygon points="48.453,144.828,38.453,148.828,48.453,152.828,44.453,148.828" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="44.453" y="130.762" fill="#000" font-size="13" font-weight="700">1</text><text x="57.499" y="130.762" fill="#000" font-size="13" textLength="92.365">local write W1</text><line x1="293.359" y1="177.961" x2="335.359" y2="177.961" style="stroke:#181818;stroke-width:1;"/><line x1="335.359" y1="177.961" x2="335.359" y2="190.961" style="stroke:#181818;stroke-width:1;"/><line x1="294.359" y1="190.961" x2="335.359" y2="190.961" style="stroke:#181818;stroke-width:1;"/><polygon points="304.359,186.961,294.359,190.961,304.359,194.961,300.359,190.961" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="300.359" y="172.895" fill="#000" font-size="13" font-weight="700">2</text><text x="313.405" y="172.895" fill="#000" font-size="13" textLength="290.843">local write W2 (concurrent, unrelated to W1)</text><rect x="10" y="219.527" width="693.86" height="3" fill="#EEE" style="stroke:#EEE;stroke-width:1;"/><line x1="10" y1="219.527" x2="703.86" y2="219.527" style="stroke:#000;stroke-width:1;"/><line x1="10" y1="222.527" x2="703.86" y2="222.527" style="stroke:#000;stroke-width:1;"/><rect x="275.977" y="208.961" width="161.907" height="23.133" fill="#EEE" style="stroke:#000;stroke-width:2;"/><text x="281.977" y="225.028" fill="#000" font-size="13" textLength="143.381" font-weight="700">Later: gossip round</text><polygon points="281.359,259.227,291.359,263.227,281.359,267.227,285.359,263.227" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="37.453" y1="263.227" x2="287.359" y2="263.227" style="stroke:#181818;stroke-width:1;"/><text x="44.453" y="258.161" fill="#000" font-size="13" font-weight="700">3</text><text x="57.499" y="258.161" fill="#000" font-size="13" textLength="218.861">exchange state since last contact</text><polygon points="48.453,288.359,38.453,292.359,48.453,296.359,44.453,292.359" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="42.453" y1="292.359" x2="292.359" y2="292.359" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="54.453" y="287.293" fill="#000" font-size="13" font-weight="700">4</text><text x="67.499" y="287.293" fill="#000" font-size="13" textLength="192.975">A now has W2; B now has W1</text><polygon points="664.308,317.492,674.308,321.492,664.308,325.492,668.308,321.492" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="293.359" y1="321.492" x2="670.308" y2="321.492" style="stroke:#181818;stroke-width:1;"/><text x="300.359" y="316.426" fill="#000" font-size="13" font-weight="700">5</text><text x="313.405" y="316.426" fill="#000" font-size="13" textLength="218.861">exchange state since last contact</text><polygon points="304.359,346.625,294.359,350.625,304.359,354.625,300.359,350.625" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="298.359" y1="350.625" x2="675.308" y2="350.625" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="310.359" y="345.559" fill="#000" font-size="13" font-weight="700">6</text><text x="323.405" y="345.559" fill="#000" font-size="13" textLength="345.903">C now has W1+W2; B unaffected (already had them)</text><path d="M14.95,363.625 L14.95,448.625 L697.95,448.625 L697.95,373.625 L687.95,363.625 L14.95,363.625" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M687.95,363.625 L687.95,373.625 L697.95,373.625 L687.95,363.625" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="233.832" y="380.692" fill="#000" font-size="13" textLength="237.098">No round trip required at write time.</text><text x="233.832" y="395.825" fill="#000" font-size="13" textLength="207.74">A site that's briefly unreachable</text><text x="233.832" y="410.958" fill="#000" font-size="13" textLength="204.598">just falls behind -- it catches up</text><text x="233.832" y="426.09" fill="#000" font-size="13" textLength="232.419">on its next successful gossip round,</text><text x="233.832" y="441.223" fill="#000" font-size="13" textLength="224.866">with nothing lost in the meantime.</text><?plantuml-src ZLAnJWCn3Dtp5HOB85eaEeAAL10ROc7exClvUa5fSYGEfN_ForqbQDM19PBZv-TdFtFH6CgsaMG6Jkgi6pWeNRmx5LfT46VYCvcdCTESoJoF6MjCY8ZYboJY6MAY5xOzvOfXQsNGJBk4A9EFbhtVpu1nePL1y80lTgGzAF2aJFCvXGY4ZJ6rBh2w68XruY1rMxarAAJQrXYc-IFn_KHzmAplJ5E_cvFl1LtP66n92LrdL48IpoejQKJDjJ7B9RtY8ztJ9kRi1agneDDo