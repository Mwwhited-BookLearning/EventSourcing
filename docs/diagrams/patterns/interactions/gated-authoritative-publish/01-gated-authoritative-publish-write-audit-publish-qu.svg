Length="98.506">(Audit -- WAP)</text><rect x="698.939" y="26.297" width="280.15" height="62.891" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="749.789" y="46.292" fill="#000" font-size="14" textLength="178.452">Authoritative Entity Store</text><text x="705.939" y="62.589" fill="#000" font-size="14" textLength="266.15">(Publish, gated -- WAP + Quarantine's</text><text x="794.516" y="78.886" fill="#000" font-size="14" textLength="88.997">trusted side)</text><rect x="989.09" y="10" width="258.809" height="79.188" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1085.21" y="29.995" fill="#000" font-size="14" textLength="66.568">Live View</text><text x="1015.829" y="46.292" fill="#000" font-size="14" textLength="205.331">(Quarantine's untrusted side,</text><text x="996.09" y="62.589" fill="#000" font-size="14" textLength="244.809">made VISIBLE instead of blocked --</text><text x="996.107" y="78.886" fill="#000" font-size="14" textLength="244.774">a second Materialized View, CQRS)</text><rect x="10" y="306.383" width="244.48" height="46.594" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="97.336" y="326.378" fill="#000" font-size="14" textLength="69.809">Event Log</text><text x="17" y="342.675" fill="#000" font-size="14" textLength="230.48">(Write -- always, Event Sourcing)</text><rect x="371.518" y="306.383" width="174.467" height="46.594" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="378.518" y="326.378" fill="#000" font-size="14" textLength="160.467">AuthorityStatus review</text><text x="409.499" y="342.675" fill="#000" font-size="14" textLength="98.506">(Audit -- WAP)</text><rect x="698.939" y="306.383" width="280.15" height="62.891" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="749.789" y="326.378" fill="#000" font-size="14" textLength="178.452">Authoritative Entity Store</text><text x="705.939" y="342.675" fill="#000" font-size="14" textLength="266.15">(Publish, gated -- WAP + Quarantine's</text><text x="794.516" y="358.972" fill="#000" font-size="14" textLength="88.997">trusted side)</text><rect x="989.09" y="306.383" width="258.809" height="79.188" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1085.21" y="326.378" fill="#000" font-size="14" textLength="66.568">Live View</text><text x="1015.829" y="342.675" fill="#000" font-size="14" textLength="205.331">(Quarantine's untrusted side,</text><text x="996.09" y="358.972" fill="#000" font-size="14" textLength="244.809">made VISIBLE instead of blocked --</text><text x="996.107" y="375.269" fill="#000" font-size="14" textLength="244.774">a second Materialized View, CQRS)</text><polygon points="1106.494,115.32,1116.494,119.32,1106.494,123.32,1110.494,119.32" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="132.24" y1="119.32" x2="1112.494" y2="119.32" style="stroke:#181818;stroke-width:1;"/><text x="139.24" y="114.254" fill="#000" font-size="13" font-weight="700">1</text><text x="152.286" y="114.254" fill="#000" font-size="13" textLength="167.597">fold immediately, no gate</text><polygon points="446.751,144.453,456.751,148.453,446.751,152.453,450.751,148.453" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="132.24" y1="148.453" x2="452.751" y2="148.453" style="stroke:#181818;stroke-width:1;"/><text x="139.24" y="143.387" fill="#000" font-size="13" font-weight="700">2</text><text x="152.286" y="143.387" fill="#000" font-size="13" textLength="289.466">AuthorityStatus lifecycle runs independently</text><polygon points="827.015,173.586,837.015,177.586,827.015,181.586,831.015,177.586" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="458.751" y1="177.586" x2="833.015" y2="177.586" style="stroke:#181818;stroke-width:1;"/><text x="465.751" y="172.52" fill="#000" font-size="13" font-weight="700">3</text><text x="478.797" y="172.52" fill="#000" font-size="13" textLength="343.218">fold ONLY once accepted (the WAP/Quarantine gate)</text><path d="M972.627,190.586 L972.627,290.586 L1263.627,290.586 L1263.627,200.586 L1253.627,190.586 L972.627,190.586" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1253.627,190.586 L1253.627,200.586 L1263.627,200.586 L1253.627,190.586" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="978.627" y="207.653" fill="#000" font-size="13" textLength="258.68">This is Quarantine's "untrusted store" --</text><text x="978.627" y="222.786" fill="#000" font-size="13" textLength="201.525">but readable, explicitly labeled</text><text x="978.627" y="237.918" fill="#000" font-size="13" textLength="223.228">isAuthoritative: false, not blocked.</text><text x="978.627" y="253.051" fill="#000" font-size="13" textLength="270.734">The deliberate deviation from Quarantine</text><text x="978.627" y="268.184" fill="#000" font-size="13" textLength="222.435">is exactly this: visible-but-labeled,</text><text x="978.627" y="283.317" fill="#000" font-size="13" textLength="159.129">not hidden-until-trusted.</text><?plantuml-src RPBBRjj034Nt-Wh2coQebEwz2E0MNWHmqgGg6XJmXfgXBQAZ6M4UIjMlBqUIKIleHY-IzrwU4QReREeQyaMFFhBY7cs4pNuWkHtS-MXlNZr7Wge2D6yuXXBcOksILspFjnl00CQTrmgx55idasCTCQO0dWQcDv7R9SqnoxtkdkTPp5_-FusH1uAzZI84TNIUHE4vDOP3My8P8-b52Zx2Iq8lqspfGpZQw5F8vS2QBZwnNTiSilgFETVrDAJLU7cq7MhfVAWVFX_sm5PAgC6Te35E_Pf272r28EMiXaV9vHaD_v5AbY_XoyktUY4bdaKXlA2wdrwsS7960tSTQPP9CvPWtRJSfMqYj8NtJ0sVI8tA4FXaWyJIr9DSR3HZWJFd-sdjnUFhq-4dEAi8K2dgytutiQNCxzE__IVhsy8wENOta9yZ0tnlMKp2YZDihb3byza82kbjKfGZHusDeHBeTsy4kiG2WmqPqjB2ONNA4X5DeBnxl62zcrm9D1cMVrHYoUCWaDXPE7dNNMMP5CK9LRQ9adKB0mUM09MagHRZKlgoGyjQG5MIdasrR71N2BrSfRy0?></g></svg>