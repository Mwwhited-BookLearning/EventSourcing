<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:753px;height:398px;background:#FFFFFF;" width="753px" height="398px" viewBox="0 0 753 398" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="entity" data-qualified-name="E1" id="ent0001" data-source-line="1"><rect x="293.12" y="7" width="382.932" height="60.891" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="457.854" y="21.995" fill="#000" font-size="14" textLength="53.464">Event 1</text><line x1="294.12" y1="27.297" x2="675.052" y2="27.297" style="stroke:#181818;stroke-width:0.5;"/><text x="299.12" y="44.292" fill="#000" font-size="14" textLength="172.642">PayloadHash = "a1b2..."</text><text x="299.12" y="60.589" fill="#000" font-size="14" textLength="370.932">ChainHash = "SHA256(seed || a1b2 || 1)" = "c3d4..."</text></g><g class="entity" data-qualified-name="E2" id="ent0002" data-source-line="5"><rect x="7" y="164.85" width="381.175" height="60.891" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="170.855" y="179.845" fill="#000" font-size="14" textLength="53.464">Event 2</text><line x1="8" y1="185.147" x2="387.175" y2="185.147" style="stroke:#181818;stroke-width:0.5;"/><text x="13" y="202.142" fill="#000" font-size="14" textLength="168.718">PayloadHash = "e5f6..."</text><text x="13" y="218.439" fill="#000" font-size="14" textLength="369.175">ChainHash = "SHA256(c3d4 || e5f6 || 2)" = "g7h8..."</text></g><g class="entity" data-qualified-name="E3" id="ent0003" data-source-line="9"><rect x="12.17" y="322.69" width="370.825" height="60.891" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="170.851" y="337.685" fill="#000" font-size="14" textLength="53.464">Event 3</text><line x1="13.17" y1="342.987" x2="381.995" y2="342.987" style="stroke:#181818;stroke-width:0.5;"/><text x="18.17" y="359.982" fill="#000" font-size="14" textLength="162.955">PayloadHash = "i9j0..."</text><text x="18.17" y="376.279" fill="#000" font-size="14" textLength="358.825">ChainHash = "SHA256(g7h8 || i9j0 || 3)" = "k1l2..."</text></g><g class="entity" data-qualified-name="GMN6" id="ent0007" data-source-line="17"><path d="M423.02,144.89 L423.02,245.687 A0,0 0 0 0 423.02,245.687 L738.151,245.687 A0,0 0 0 0 738.151,245.687 L738.151,154.89 L728.151,144.89 L553.91,144.89 L502.87,68.13 L545.91,144.89 L423.02,144.89 A0,0 0 0 0 423.02,144.89" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M728.151,144.89 L728.151,154.89 L738.151,154.89 L728.151,144.89" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="429.02" y="161.957" fill="#000" font-size="13" textLength="260.089">Altering Event 1's Payload after the fact</text><text x="429.02" y="177.09" fill="#000" font-size="13" textLength="278.63">changes PayloadHash, which changes E1's</text><text x="429.02" y="192.223" fill="#000" font-size="13" textLength="251.869">ChainHash, which changes E2's, which</text><text x="429.02" y="207.355" fill="#000" font-size="13" textLength="277.018">changes E3's -- every hash downstream of</text><text x="429.02" y="222.488" fill="#000" font-size="13" textLength="294.131">a tampered record no longer matches what's</text><text x="429.02" y="237.621" fill="#000" font-size="13" textLength="277.634">stored, all the way to the end of the chain.</text></g><!--link E1 to E2--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk4" data-source-line="14" data-link-type="dependency"><path d="M412.04,68.34 C391.86,77.27 370.13,87.47 350.59,97.89 C312.5,118.2 275.344,141.743 245.264,161.733" style="stroke:#181818;stroke-width:1;" fill="none" id="E1-to-E2" codeLine="14"/><polygon points="241.1,164.5,250.81,162.85,245.264,161.733,246.382,156.187,241.1,164.5" fill="#181818" style="stroke:#181818;strok