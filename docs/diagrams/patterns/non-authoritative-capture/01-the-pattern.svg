00">6</text><text x="566.591" y="298.395" fill="#000" font-size="13" textLength="99.76">record decision</text><text x="566.591" y="313.528" fill="#000" font-size="13" textLength="136.094">(accepted | rejected)</text><path d="M541.545,331.594 L541.545,431.594 L788.545,431.594 L788.545,341.594 L778.545,331.594 L541.545,331.594" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M778.545,331.594 L778.545,341.594 L788.545,341.594 L778.545,331.594" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="547.545" y="348.661" fill="#000" font-size="13" textLength="193.743">The decision is a NEW record,</text><text x="547.545" y="363.793" fill="#000" font-size="13" textLength="207.226">never a mutation of the original</text><text x="547.545" y="378.926" fill="#000" font-size="13" textLength="226.002">claim. Whichever way the decision</text><text x="547.545" y="394.059" fill="#000" font-size="13" textLength="218.912">goes, the original submission and</text><text x="547.545" y="409.192" fill="#000" font-size="13" textLength="224.669">its non-repudiable provenance are</text><text x="547.545" y="424.325" fill="#000" font-size="13" textLength="150.382">completely unaffected.</text><?plantuml-src RLEnRXin3Dtr5KIc6B0lkujsQRDsQ0faoKBhQ1-3EqcWg3CCzEDBoNU9NNGv6DHxVE-HD1QDeKm74fTGb3qd30eFB-KmiIh9MtZ4eaCKrWk4g70XXPc4Zuo7aJOFW1doYhvlyXsJ5Y6WqAV8GHlMNulto1z5QhUjAOITK2fzwmvPez1Lelww9_sYcUbC0a-0_RjHF1geeMLvSkx36ko-hThxnJ3u4NboIxK2cieU4adchC3JHEP4QRpO75IArRAYbWnV8KcSENCCE6vS8yBkLiF7gIdtLeRp4BVsGQrV2c-1isKzGmd7A2UgOJzzL2EhxJsWzvHg6qCkmPphkWwK9uA4ELF-OceXa5UURKzFdniJod6SAOCHd5l7SXDL2FlRADUPvFz3VPGUUl8DMozZjVR77jzDdlgDioCX43uD2l6ux0tWzq0VJB3m23-VNvUMMtiFP4TbrQdOV2l6k6eSYt5YysMGvgo3ru7zqD1dl3JCsjSmfqXvUqUyZZ8tNGozOLZpltTM1q01WoV0PjUMbqQgYxSLuV7OidNEBhd-2UWl?></g></svg>