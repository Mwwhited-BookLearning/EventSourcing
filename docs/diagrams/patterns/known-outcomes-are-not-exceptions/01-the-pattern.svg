 textLength="51.741">Service</text><rect x="10" y="114.863" width="525.317" height="3" fill="#EEE" style="stroke:#EEE;stroke-width:1;"/><line x1="10" y1="114.863" x2="535.317" y2="114.863" style="stroke:#000;stroke-width:1;"/><line x1="10" y1="117.863" x2="535.317" y2="117.863" style="stroke:#000;stroke-width:1;"/><rect x="82.643" y="104.297" width="380.031" height="23.133" fill="#EEE" style="stroke:#000;stroke-width:2;"/><text x="88.643" y="120.364" fill="#000" font-size="13" textLength="361.505" font-weight="700">Known outcome modeled as an exception (avoid)</text><polygon points="232.476,154.563,242.476,158.563,232.476,162.563,236.476,158.563" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="33.251" y1="158.563" x2="238.476" y2="158.563" style="stroke:#181818;stroke-width:1;"/><text x="40.251" y="153.497" fill="#000" font-size="13" textLength="64.391">DoThing()</text><line x1="244.476" y1="202.828" x2="286.476" y2="202.828" style="stroke:#181818;stroke-width:1;"/><line x1="286.476" y1="202.828" x2="286.476" y2="215.828" style="stroke:#181818;stroke-width:1;"/><line x1="245.476" y1="215.828" x2="286.476" y2="215.828" style="stroke:#181818;stroke-width:1;"/><polygon points="255.476,211.828,245.476,215.828,255.476,219.828,251.476,215.828" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="251.476" y="182.629" fill="#000" font-size="13" textLength="196.581">outcome is a well-understood,</text><text x="251.476" y="197.762" fill="#000" font-size="13" textLength="266.348">expected case (e.g. "not registered yet")</text><polygon points="44.251,240.961,34.251,244.961,44.251,248.961,40.251,244.961" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="38.251" y1="244.961" x2="243.476" y2="244.961" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="50.251" y="239.895" fill="#000" font-size="13" textLength="181.01">throw KnownCaseException</text><path d="M249.476,228.828 L249.476,298.828 L529.476,298.828 L529.476,238.828 L519.476,228.828 L249.476,228.828" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M519.476,228.828 L519.476,238.828 L529.476,238.828 L519.476,228.828" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="255.476" y="245.895" fill="#000" font-size="13" textLength="192.105">caller must catch + inspect --</text><text x="255.476" y="261.028" fill="#000" font-size="13" textLength="259.841">a broad catch (Exception) loses the real</text><text x="255.476" y="276.161" fill="#000" font-size="13" textLength="229.062">severity, exactly what happened in</text><text x="255.476" y="291.293" fill="#000" font-size="13" textLength="214.398">RbacProjectionWorker's own bug</text><rect x="10" y="324.926" width="525.317" height="3" fill="#EEE" style="stroke:#EEE;stroke-width:1;"/><line x1="10" y1="324.926" x2="535.317" y2="324.926" style="stroke:#000;stroke-width:1;"/><line x1="10" y1="327.926" x2="535.317" y2="327.926" style="stroke:#000;stroke-width:1;"/><rect x="89.711" y="314.359" width="365.895" height="23.133" fill="#EEE" style="stroke:#000;stroke-width:2;"/><text x="95.711" y="330.426" fill="#000" font-size="13" textLength="347.369" font-weight="700">Known outcome modeled as data (this pattern)</text><polygon points="232.476,364.625,242.476,368.625,232.476,372.625,236.476,368.625" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="33.251" y1="368.625" x2="238.476" y2="368.625" style="stroke:#181818;stroke-width:1;"/><text x="40.251" y="363.559" fill="#000" font-size="13" textLength="64.391">DoThing()</text><line x1="244.476" y1="397.758" x2="286.476" y2="397.758" style="stroke:#181818;stroke-width:1;"/><line x1="286.476" y1="397.758" x2="286.476" y2="410.758" style="stroke:#181818;stroke-width:1;"/><line x1="245.476" y1="410.758" x2="286.476" y2="410.758" style