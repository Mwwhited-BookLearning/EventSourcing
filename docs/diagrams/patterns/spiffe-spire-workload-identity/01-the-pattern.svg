ID</text><text x="314.102" y="243.754" fill="#000" font-size="13" textLength="144.257">(spiffe://X/workload-a)</text><polygon points="85.374,289.086,75.374,293.086,85.374,297.086,81.374,293.086" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="79.374" y1="293.086" x2="283.057" y2="293.086" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="91.374" y="280.454" fill="#000" font-size="13" font-weight="700">5</text><text x="104.419" y="272.887" fill="#000" font-size="13" textLength="100.014">SVID delivered,</text><text x="104.419" y="288.02" fill="#000" font-size="13" textLength="172.637">auto-rotated before expiry</text><polygon points="586.044,333.352,596.044,337.352,586.044,341.352,590.044,337.352" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="74.374" y1="337.352" x2="592.044" y2="337.352" style="stroke:#181818;stroke-width:1;"/><text x="81.374" y="324.719" fill="#000" font-size="13" font-weight="700">6</text><text x="94.419" y="317.153" fill="#000" font-size="13" textLength="115.565">mTLS handshake,</text><text x="94.419" y="332.286" fill="#000" font-size="13" textLength="111.211">presents its SVID</text><line x1="598.044" y1="411.883" x2="640.044" y2="411.883" style="stroke:#181818;stroke-width:1;"/><line x1="640.044" y1="411.883" x2="640.044" y2="424.883" style="stroke:#181818;stroke-width:1;"/><line x1="599.044" y1="424.883" x2="640.044" y2="424.883" style="stroke:#181818;stroke-width:1;"/><polygon points="609.044,420.883,599.044,424.883,609.044,428.883,605.044,424.883" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="605.044" y="384.118" fill="#000" font-size="13" font-weight="700">7</text><text x="618.09" y="361.418" fill="#000" font-size="13" textLength="140.708">validate: SAN URI is a</text><text x="618.09" y="376.551" fill="#000" font-size="13" textLength="205.207