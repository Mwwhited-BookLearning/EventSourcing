<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:899px;height:482px;background:#FFFFFF;" width="899px" height="482px" viewBox="0 0 899 482" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--entity router--><g class="entity" data-qualified-name="router" id="ent0001" data-source-line="3"><rect x="381.83" y="206.18" width="137.414" height="36.297" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="391.83" y="229.175" fill="#000" font-size="14" textLength="117.414">Router / resolver</text></g><!--entity shard1--><g class="entity" data-qualified-name="shard1" id="ent0002" data-source-line="5"><path d="M6,396.46 C6,386.46 59.538,386.46 59.538,386.46 C59.538,386.46 113.076,386.46 113.076,396.46 L113.076,438.054 C113.076,448.054 59.538,448.054 59.538,448.054 C59.538,448.054 6,448.054 6,438.054 L6,396.46" style="stroke:#181818;stroke-width:0.5;" fill="#F1F1F1"/><path d="M6,396.46 C6,406.46 59.538,406.46 59.538,406.46 C59.538,406.46 113.076,406.46 113.076,396.46" style="stroke:#181818;stroke-width:0.5;" fill="none"/><text x="16" y="423.455" fill="#000" font-size="14" textLength="54.339">Shard 1</text><text x="16" y="439.752" fill="#000" font-size="14" textLength="87.076">(e.g. type A)</text></g><!--entity shard2--><g class="entity" data-qualified-name="shard2" id="ent0003" data-source-line="6"><path d="M287.99,396.46 C287.99,386.46 341.542,386.46 341.542,386.46 C341.542,386.46 395.094,386.46 395.094,396.46 L395.094,438.054 C395.094,448.054 341.542,448.054 341.542,448.054 C341.542,448.054 287.99,448.054 287.99,438.054 L287.99,396.46" style="stroke:#181818;stroke-width:0.5;" fill="#F1F1F1"/><path d="M287.99,396.46 C287.99,406.46 341.542,406.46 341.542,406.46 C341.542,406.46 395.094,406.46 395.094,396.46" style="stroke:#181818;stroke-width:0.5;" fill="none"/><text x="297.99" y="423.455" fill="#000" font-size="14" textLength="54.339">Shard 2</text><text x="297.99" y="439.752" fill="#000" font-size="14" textLength="87.104">(e.g. type B)</text></g><!--entity shard3--><g class="entity" data-qualified-name="shard3" id="ent0004" data-source-line="7"><path d="M506.9,396.46 C506.9,386.46 560.537,386.46 560.537,386.46 C560.537,386.46 614.174,386.46 614.174,396.46 L614.174,438.054 C614.174,448.054 560.537,448.054 560.537,448.054 C560.537,448.054 506.9,448.054 506.9,438.054 L506.9,396.46" style="stroke:#181818;stroke-width:0.5;" fill="#F1F1F1"/><path d="M506.9,396.46 C506.9,406.46 560.537,406.46 560.537,406.46 C560.537,406.46 614.174,406.46 614.174,396.46" style="stroke:#181818;stroke-width:0.5;" fill="none"/><text x="516.9" y="423.455" fill="#000" font-size="14" textLength="54.339">Shard 3</text><text x="516.9" y="439.752" fill="#000" font-size="14" textLength="87.274">(e.g. type C)</text></g><!--entity caller--><g class="entity" data-qualified-name="caller" id="ent0005" data-source-line="9"><ellipse cx="450.541" cy="14" rx="8" ry="8" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><path d="M450.541,22 L450.541,49 M437.541,30 L463.541,30 M450.541,49 L437.541,64 M450.541,49 L463.541,64" style="stroke:#181818;stroke-width:0.5;" fill="none"/><text x="430.29" y="78.495" fill="#000" font-size="14" textLength="40.503">Caller</text></g><g class="entity" data-qualified-name="GMN10" id="ent0011" data-source-line="17"><path d="M554.48,158.8 L554.48,220.33 L519.6,224.33 L554.48,228.33 L554.48,289.863 A0,0 0 0 0 554.48,289.863 L788.596,289.863 A0,0 0 0 0 788.596,289.863 L788.596,168.8 L778.596,158.8 L554.48,158.8 A0,0 0 0 0 554.48,158.8" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M778.596,158.8 L778.596,168.8 L788.596,168.8 L778.596,158.8" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="560.48" y="175.867" fill="#000" font-size="13" textLength="196.752">ShardKey is a pure function of</text><text x="560.48" y="191" fill="#000" font-size="13" textLength="192.08">the entity's own identity -- no</text><text x="560.48" y="206.133" fill="#000" font-size="13" textLength="171.253">lookup table needed if the</text><text x="560.48" y="221.265" fill="#000" font-size="13" textLength="179.029">function is a fixed rule (e.g.</text><text x="560.48" y="236.398" fill="#000" font-size="13" textLength="199.812">"shard by type"), a real lookup</text><text x="560.48" y="251.531" fill="#000" font-size="13" textLength="199.919">table if it's a mapping that can</text><text x="560.48" y="266.664" fill="#000" font-size="13" textLength="213.116">change over time (e.g. hash ring</text><text x="560.48" y="281.797" fill="#000" font-size="13" textLength="85.833">rebalancing).</text></g><g class="entity" data-qualified-name="GMN13" id="ent0014" data-source-line="28"><path d="M648.86,366.86 L648.86,467.657 L884.208,467.657 L884.208,376.86 L874.208,366.86 L648.86,366.86" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M874.208,366.86 L874.208,376.86 L884.208,376.86 L874.208,366.86" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="654.86" y="383.927" fill="#000" font-size="13" textLength="214.348">A query spanning more than one</text><text x="654.86" y="399.06" fill="#000" font-size="13" textLength="182.381">shard ("all entities of type X</text><text x="654.86" y="414.193" fill="#000" font-size="13" textLength="204.915">across shards") must fan out to</text><text x="654.86" y="429.325" fill="#000" font-size="13" textLength="210.495">every relevant shard and merge</text><text x="654.86" y="444.458" fill="#000" font-size="13" textLength="173.621">results -- there is no single</text><text x="654.86" y="459.591" fill="#000" font-size="13" textLength="213.04">index that already spans shards.</text></g><!--link caller to router--><g class="link" data-entity-1="ent0005" data-entity-2="ent0001" id="lnk6" data-source-line="11" data-link-type="dependency"><path d="M450.54,82.11 C450.54,120.18 450.54,172.48 450.54,200.97" style="stroke:#181818;stroke-width:1;" fill="none" id="caller-to-router"/><polygon points="450.54,205.97,454.54,196.97,450.54,200.97,446.54,196.97,450.54,205.97" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="451.54" y="124.867" fill="#000" font-size="13" textLength="126.807">read/write(EntityId)</text></g><!--link router to shard1--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk7" data-source-line="12" data-link-type="dependency"><path d="M381.37,234.61 C287,248.66 124.89,278.17 83.54,319.86 C66.29,337.25 61.135,360.022 59.665,381.292" style="stroke:#181818;stroke-width:1;" fill="none" id="router-to-shard1"/><polygon points="59.32,386.28,63.931,377.577,59.665,381.292,55.95,377.026,59.32,386.28" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="84.54" y="332.927" fill="#000" font-size="13" textLength="240.544">ShardKey(EntityId) selects this shard</text></g><!--link router to shard2--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk8" data-source-line="13" data-link-type="dependency"><path d="M416.84,242.89 C390.07,258.92 354.56,285.36 338.54,319.86 C328.94,340.52 329.528,361.505 332.988,381.265" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="router-to-shard2"/><polygon points="333.85,386.19,336.238,376.635,332.988,381.265,328.358,378.015,333.85,386.19" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="339.54" y="332.927" fill="#000" font-size="13" textLength="177.119">(not selected for this write)</text></g><!--link router to shard3--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk9" data-source-line="14" data-link-type="dependency"><path d="M465.9,242.84 C481.39,261.12 505.28,291.09 521.54,319.86 C533.53,341.08 542.041,362.02 