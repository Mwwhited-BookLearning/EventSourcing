<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:540px;height:347px;" width="540px" height="347px" viewBox="0 0 540 347" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--entity e2e--><g class="entity" data-qualified-name="e2e" id="ent0001" data-source-line="3"><rect x="7" y="7" width="210.347" height="68.891" fill="#FFD6A5" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="17" y="29.995" fill="#000" font-size="14" textLength="93.222">UI / E2E tests</text><text x="17" y="46.292" fill="#000" font-size="14" textLength="117.797">(fewest, slowest,</text><text x="17" y="62.589" fill="#000" font-size="14" textLength="190.347">most realistic, most brittle)</text></g><!--entity integration--><g class="entity" data-qualified-name="integration" id="ent0002" data-source-line="4"><rect x="12.4" y="135.89" width="199.539" height="68.891" fill="#FDFFB6" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="22.4" y="158.885" fill="#000" font-size="14" textLength="179.539">Integration / service tests</text><text x="22.4" y="175.182" fill="#000" font-size="14" textLength="103.742">(fewer, slower,</text><text x="22.4" y="191.479" fill="#000" font-size="14" textLength="134.49">real dependencies)</text></g><!--entity unit--><g class="entity" data-qualified-name="unit" id="ent0003" data-source-line="5"><rect x="34.16" y="264.78" width="156.028" height="68.891" fill="#CAFFBF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="44.16" y="287.775" fill="#000" font-size="14" textLength="67.129">Unit tests</text><text x="44.16" y="304.072" fill="#000" font-size="14" textLength="136.028">(many, fast, cheap,</text><text x="44.16" y="320.369" fill="#000" font-size="14" textLength="60.669">isolated)</text></g><g class="entity" data-qualified-name=