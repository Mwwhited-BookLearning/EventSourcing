<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:626px;height:347px;background:#FFFFFF;" width="626px" height="347px" viewBox="0 0 626 347" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="entity" data-qualified-name="req" id="ent0001" data-source-line="1"><rect x="201.08" y="7" width="164.767" height="36.297" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="208.08" y="21.995" fill="#000" font-size="14" textLength="150.767">A request/submission</text><line x1="202.08" y1="27.297" x2="364.847" y2="27.297" style="stroke:#181818;stroke-width:0.5;"/></g><g class="entity" data-qualified-name="ial" id="ent0002" data-source-line="2"><rect x="7" y="111.44" width="160.925" height="52.594" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="25.648" y="126.435" fill="#000" font-size="14" textLength="123.628">IAL: how well was</text><text x="14" y="142.732" fill="#000" font-size="14" textLength="146.925">the identity proofed?</text><line x1="8" y1="148.034" x2="166.925" y2="148.034" style="stroke:#181818;stroke-width:0.5;"/></g><g class="entity" data-qualified-name="aal" id="ent0003" data-source-line="3"><rect x="203.41" y="111.44" width="160.098" height="52.594" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="210.41" y="126.435" fill="#000" font-size="14" textLength="146.098">AAL: how strong was</text><text x="215.144" y="142.732" fill="#000" font-size="14" textLength="136.63">the authentication?</text><line x1="204.41" y1="148.034" x2="362.508" y2="148.034" style="stroke:#181818;stroke-width:0.5;"/></g><g class="entity" data-qualified-name="fal" id="ent0004" data-source-line="4"><rect x="398.83" y="103.29" width="163.256" height="68.891" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="405.83" y="118.285" fill="#000" font-size="14" textLength="149.256">FAL: how trustworthy</text><text x="426.751" y="134.582" fill="#000" font-size="14" textLength="107.413">is the assertion</text><text x="430.463" y="150.879" fill="#000" font-size="14" textLength="99.989">(if federated)?</text><line x1="399.83" y1="156.181" x2="561.086" y2="156.181" style="stroke:#181818;stroke-width:0.5;"/></g><g class="entity" data-qualified-name="GMN8" id="ent0009" data-source-line="10"><path d="M349.37,232.18 L349.37,332.977 A0,0 0 0 0 349.37,332.977 L611.549,332.977 A0,0 0 0 0 611.549,332.977 L611.549,242.18 L601.549,232.18 L484.46,232.18 L480.46,172.59 L476.46,232.18 L349.37,232.18 A0,0 0 0 0 349.37,232.18" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M601.549,232.18 L601.549,242.18 L611.549,242.18 L601.549,232.18" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="355.37" y="249.247" fill="#000" font-size="13" textLength="239.567">Three independent answers, not one</text><text x="355.37" y="264.38" fill="#000" font-size="13" textLength="213.897">collapsed score -- a relying party</text><text x="355.37" y="279.513" fill="#000" font-size="13" textLength="201.17">can require IAL2+AAL2 for one</text><text x="355.37" y="294.645" fill="#000" font-size="13" textLength="241.179">operation and only AAL1 for another,</text><text x="355.37" y="309.778" fill="#000" font-size="13" textLength="216.138">a distinction a single "trust level"</text><text x="355.37" y="324.911" fill="#000" font-size="13" textLength="167.889">field could never express.</text></g><!--link req to ial--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk5" data-source-line="6" data-link-type="dependency"><path d="M252.41,43.67 C220.24,61.82 173.995,87.914 137.315,108.604" style="stroke:#181818;stroke-width:1;" fill="none" id="req-to-ial" codeLine="6"/><polygon points="132.96,111.06,142.764,110.122,137.315,108.604,1