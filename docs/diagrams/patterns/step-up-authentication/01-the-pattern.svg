inejoin:miter;stroke-miterlimit:10;"/><line x1="28.955" y1="130.563" x2="292.496" y2="130.563" style="stroke:#181818;stroke-width:1;"/><text x="35.955" y="117.93" fill="#000" font-size="13" font-weight="700">1</text><text x="49" y="110.364" fill="#000" font-size="13" textLength="182.083">attempts a regulated action</text><text x="49" y="125.497" fill="#000" font-size="13" textLength="232.496">(e.g. approve a high-value transfer)</text><polygon points="773.184,155.695,783.184,159.695,773.184,163.695,777.184,159.695" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="298.496" y1="159.695" x2="779.184" y2="159.695" style="stroke:#181818;stroke-width:1;"/><text x="305.496" y="154.629" fill="#000" font-size="13" font-weight="700">2</text><text x="318.542" y="154.629" fill="#000" font-size="13" textLength="269.871">request, Bearer &lt;token acr=urn:...:pwd></text><line x1="785.184" y1="219.094" x2="827.184" y2="219.094" style="stroke:#181818;stroke-width:1;"/><line x1="827.184" y1="219.094" x2="827.184" y2="232.094" style="stroke:#181818;stroke-width:1;"/><line x1="786.184" y1="232.094" x2="827.184" y2="232.094" style="stroke:#181818;stroke-width:1;"/><polygon points="796.184,228.094,786.184,232.094,796.184,236.094,792.184,232.094" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="792.184" y="198.895" fill="#000" font-size="13" font-weight="700">3</text><text x="805.229" y="183.762" fill="#000" font-size="13" textLength="125.563">this action requires</text><text x="805.229" y="198.895" fill="#000" font-size="13" textLength="216.062">acr=urn:...:mfa, max_age=300 --</text><text x="805.229" y="214.028" fill="#000" font-size="13" textLength="188.462">current token doesn't qualify</text><polygon points="309.496,302.625,299.496,306.625,309.496,310.625,305.496,306.625" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><