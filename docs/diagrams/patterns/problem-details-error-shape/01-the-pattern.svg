tle, status, detail, instance,</text><text x="109.7" y="176.179" fill="#000" font-size="14" textLength="102.498">...extensions }</text></g><g class="entity" data-qualified-name="GMN8" id="ent0009" data-source-line="16"><path d="M6,296.48 L6,397.277 A0,0 0 0 0 6,397.277 L265.329,397.277 A0,0 0 0 0 265.329,397.277 L265.329,306.48 L255.329,296.48 L163.75,296.48 L211.22,189.98 L155.75,296.48 L6,296.48 A0,0 0 0 0 6,296.48" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M255.329,296.48 L255.329,306.48 L265.329,306.48 L255.329,296.48" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="12" y="313.547" fill="#000" font-size="13" textLength="221.59">One shape, every endpoint, every</text><text x="12" y="328.68" fill="#000" font-size="13" textLength="238.329">status code. Extensions carry what's</text><text x="12" y="343.813" fill="#000" font-size="13" textLength="225.253">genuinely problem-specific (a field</text><text x="12" y="358.945" fill="#000" font-size="13" textLength="205.353">name, a conflicting id, a reason</text><text x="12" y="374.078" fill="#000" font-size="13" textLength="197.641">code) without inventing a new</text><text x="12" y="389.211" fill="#000" font-size="13" textLength="172.237">top-level response format.</text></g><!--entity Caller--><g class="entity" data-qualified-name="Caller" id="ent0011" data-source-line="24"><ellipse cx="320.661" cy="317.23" rx="8" ry="8" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><path d="M320.661,325.23 L320.661,352.23 M307.661,333.23 L333.661,333.23 M320.661,352.23 L307.661,367.23 M320.661,352.23 L333.661,367.23" style="stroke:#181818;stroke-width:0.5;" fill="none"/><text x="300.41" y="381.725" fill="#000" font-size="14" textLength="40.503">Caller</text></g><!--link A to Shape--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk5" data-source-line="11" data-link-type="dependency"><path d="M124.77,59.98 C144.01,77.58 166.049,97.717 186.959,116.827" style="stro