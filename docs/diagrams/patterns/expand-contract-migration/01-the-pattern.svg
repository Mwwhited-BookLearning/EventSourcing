x2="200.564" y2="610.094" style="stroke:#181818;stroke-width:0.5;"/><text x="17" y="601.792" fill="#000" font-size="14" textLength="173.564">Contract (optional, later)</text></g><g class="entity" data-qualified-name="GMN8" id="ent0009" data-source-line="13"><path d="M174.98,201.297 L174.98,240.127 L140.3,244.127 L174.98,248.127 L174.98,286.961 A0,0 0 0 0 174.98,286.961 L360.581,286.961 A0,0 0 0 0 360.581,286.961 L360.581,211.297 L350.581,201.297 L174.98,201.297 A0,0 0 0 0 174.98,201.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M350.581,201.297 L350.581,211.297 L360.581,211.297 L350.581,201.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="180.98" y="218.364" fill="#000" font-size="13" textLength="164.601">Old code paths still work.</text><text x="180.98" y="233.497" fill="#000" font-size="13" textLength="155.575">A rollback to old code is</text><text x="180.98" y="248.629" fill="#000" font-size="13" textLength="154.477">just redeploying the old</text><text x="180.98" y="263.762" fill="#000" font-size="13" textLength="126.166">binary -- it still fully</text><text x="180.98" y="278.895" fill="#000" font-size="13" textLength="156.521">understands this shape.</text></g><g class="entity" data-qualified-name="GMN11" id="ent0012" data-source-line="21"><path d="M235.39,565.967 L235.39,604.797 L200.86,608.797 L235.39,612.797 L235.39,651.631 A0,0 0 0 0 235.39,651.631 L408.182,651.631 A0,0 0 0 0 408.182,651.631 L408.182,575.967 L398.182,565.967 L235.39,565.967 A0,0 0 0 0 235.39,565.967" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M398.182,565.967 L398.182,575.967 L408.182,575.967 L398.182,565.967" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="241.39" y="583.034" fill="#000" font-size="13" textLength="143.146">This step is where the</text><text x="241.39" y="598.167" fill="#000" font-size="13" textLength="141.451">binary-rollback safety</text><text x="241.39" y="613.299" fill="#000" font-size="13" textLength="151.792">net finally goes away --</text><text x="241.39" y="628.432" fill="#000" font-size="13" textLength="125.696">deferred as long as</text><text x="241.39" y="643.565" fill="#000" font-size="13" textLength="128.826">possible, by design.</text></g><!--link before to expand--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk5" data-source-line="8" data-link-type="dependency"><path d="M103.78,94.697 C103.78,127.637 103.78,180.987 103.78,213.857" style="stroke:#181818;stroke-width:1;" fill="none" id="before-to-expand"/><polygon points="103.78,218.857,107.78,209.857,103.78,213.857,99.78,209.857,103.78,218.857" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="105.075" y="137.364" fill="#000" font-size="13" textLength="177.195">add new column/table/field</text><text x="104.78" y="152.497" fill="#000" font-size="13" textLength="177.785">(old shape untouched, fully</text><text x="120.97" y="167.629" fill="#000" font-size="13" textLength="145.406">backward-compatible)</text></g><!--link expand to migrate--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk6" data-source-line="9" data-link-type="dependency"><path d="M103.78,269.527 C103.78,302.467 103.78,355.817 103.78,388.687" style="stroke:#181818;stroke-width:1;" fill="none" id="expand-to-migrate"/><polygon points="103.78,393.687,107.78,384.687,103.78,388.687,99.78,384.687,103.78,393.687" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="122.388" y="330.034" fill="#000" font-size="13" textLength="156.597">writers/readers cut over</text><text x="120.367" y="345.167" fill="#000" font-size="13" textLength="160.64">one at a time; may write</text><text x="104.78" y="360.299" fill="#000" font-size="13" textLength="191.813">both shapes during transition</text></g><!--link migrate to contract--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk7" data-source-line="10" data-link-type="dependency"><path d="M103.78,444.137 C103.78,480.097 103.78,542.337 103.78,578.417" style="stroke:#181818;stroke-width:1;" fill="none" id="migrate-to-contract"/><polygon points="103.78,583.417,107.78,574.417,103.78,578.417,99.78,574.417,103.78,583.417" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="113.749" y="487.034" fill="#000" font-size="13" textLength="116.962">remove old shape</text><text x="110.042" y="502.167" fill="#000" font-size="13" textLength="124.376">ONLY once nothing</text><text x="104.78" y="517.299" fill="#000" font-size="13" textLength="134.9">depends on it -- may</text><text x="127.054" y="532.432" fill="#000" font-size="13" textLength="90.353">never happen</text></g><?plantuml-src NP91ZzGm38Nl_HLFUzgLPdRk8271YXkm7BWWzU9ft3PiwbI9I-c_nqcdWyHfh7dEUv_jgjV0-4w9Gk20bv5aO5pm-SzCuiulKJHHfqsJbPJny8dxcFW1b76jvI7i3wh0jJo4htv8LbHbskj3Ejpn66VrKIYS44n9JxMxkuVlKJYVFzpCyGxa78HNwmhB91UbQ-1BxpcuLXvZSCWZpOn5D2xToEw4VWbXQ-LAtTjAoPsxECsatjuzDJVRad23j8WrUOF9byJax1VTeeY_ERKIXK4AWlg9tsEYRMyszwZZ7ftXbkHbW0qXsPS1cyExv1pZML3YoNnnfsxbzTkNduZICSGCpQKLnpEBo_Oll9f3IMr5s81WZqni6cjc93-C1jeVXm1UpRYBZc7pZXbPVGXOOtfxDl4ZKWoXR0KQAqDjzTcqNqjMexFe4BSworWnJRfweRGL3gFP7Uk2JLgah4kfq1fyteTwRWo_ZCF_SzuF3VoexSgpvMCTsQvkaVUuynqrKyzQmeGLlOaMZI7QrccbWcMIuvwJqPUFAKIZfpBJ77CkHp_XkbbBzeFyG_iB?></g></svg>