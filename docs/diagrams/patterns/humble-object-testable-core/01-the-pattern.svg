<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:796px;height:498px;background:#FFFFFF;" width="796px" height="498px" viewBox="0 0 796 498" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--cluster Hard-to-test shell (humble)--><g class="cluster" data-qualified-name="Hard-to-test shell .humble." id="ent0001" data-source-line="3"><path d="M187.58,172.35 L404.589,172.35 A3.75,3.75 0 0 1 407.089,174.85 L414.089,194.647 L518.58,194.647 A2.5,2.5 0 0 1 521.08,197.147 L521.08,257.14 A2.5,2.5 0 0 1 518.58,259.64 L187.58,259.64 A2.5,2.5 0 0 1 185.08,257.14 L185.08,174.85 A2.5,2.5 0 0 1 187.58,172.35" style="stroke:#000;stroke-width:1.5;" fill="none"/><line x1="185.08" y1="194.647" x2="414.089" y2="194.647" style="stroke:#000;stroke-width:1.5;"/><text x="189.08" y="187.345" fill="#000" font-size="14" textLength="216.009" font-weight="700">Hard-to-test shell (humble)</text></g><!--cluster Plain code (the real logic)--><g class="cluster" data-qualified-name="Plain code .the real logic." id="ent0003" data-source-line="6"><path d="M52.58,372 L256.915,372 A3.75,3.75 0 0 1 259.415,374.5 L266.415,394.297 L335.58,394.297 A2.5,2.5 0 0 1 338.08,396.797 L338.08,473.09 A2.5,2.5 0 0 1 335.58,475.59 L52.58,475.59 A2.5,2.5 0 0 1 50.08,473.09 L50.08,374.5 A2.5,2.5 0 0 1 52.58,372" style="stroke:#000;stroke-width:1.5;" fill="none"/><line x1="50.08" y1="394.297" x2="266.415" y2="394.297" style="stroke:#000;stroke-width:1.5;"/><text x="54.08" y="386.995" fill="#000" font-size="14" textLength="203.335" font-weight="700">Plain code (the real logic)</text></g><!--entity Shell--><g class="entity" data-qualified-name="Hard-to-test shell .humble..Shell" id="ent0002" data-source-line="4"><rect x="201.29" y="207.35" width="303.589" height="36.297" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="211.29" y="230.345" fill="#000" font-size="14" textLength="283.589">Hosted service / UI control / DB gateway</text></g><!--entity Core--><g class="entity" data-qualified-name="Plain code .the real logic..Core" id="ent0004" data-source-line="7"><rect x="66.45" y="407" width="255.266" height="52.594" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="76.45" y="429.995" fill="#000" font-size="14" textLength="162.531">Extracted core: explicit</text><text x="76.45" y="446.292" fill="#000" font-size="14" textLength="235.266">parameters, no container needed</text></g><!--entity Host--><g class="entity" data-qualified-name="Host" id="ent0005" data-source-line="10"><ellipse cx="353.076" cy="14" rx="8" ry="8" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><path d="M353.076,22 L353.076,49 M340.076,30 L366.076,30 M353.076,49 L340.076,64 M353.076,49 L366.076,64" style="stroke:#181818;stroke-width:0.5;" fill="none"/><text x="255.92" y="78.495" fill="#000" font-size="14" textLength="109.71">Production host</text><text x="255.92" y="94.792" fill="#000" font-size="14" textLength="194.312">(DI container, real lifecycle)</text></g><!--entity Test--><g class="entity" data-qualified-name="Test" id="ent0006" data-source-line="11"><ellipse cx="86.08" cy="187.7" rx="8" ry="8" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><path d="M86.08,195.7 L86.08,222.7 M73.08,203.7 L99.08,203.7 M86.08,222.7 L73.08,237.7 M86.08,222.7 L99.08,237.7" style="stroke:#181818;stroke-width:0.5;" fill="none"/><text x="6" y="252.195" fill="#000" font-size="14" textLength="59.835">Unit test</text><text x="6" y="268.492" fill="#000" font-size="14" textLength="160.159">(no container, no host)</text></g><g class="entity" data-qualified-name="GMN10" id="ent0011" data-source-line="18"><path d="M540.36,175.1 L540.36,221.5 L505.27,225.5 L540.36,229.5 L540.36,275.897 A0,0 0 0 0 540.36,275.897 L781.808,275.897 A0,0 0 0 0 781.808,275.897 L781.808,185.1 L771.808,175.1 L540.36,175.1 A0,0 0 0 0 540.36,175.1" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M771.808,175.1 L771.808,185.1 L781.808,185.1 L771.808,175.1" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="546.36" y="192.167" fill="#000" font-size="13" textLength="192.67">Contains only what genuinely</text><text x="546.36" y="207.3" fill="#000" font-size="13" textLength="190.379">can't be extracted: start/stop</text><text x="546.36" y="222.433" fill="#000" font-size="13" textLength="161.053">plumbing, a polling loop,</text><text x="546.36" y="237.565" fill="#000" font-size="13" textLength="205.366">resolving collaborators from DI,</text><text x="546.36" y="252.698" fill="#000" font-size="13" textLength="218.899">catching/logging the unexpected.</text><text x="546.36" y="267.831" fill="#000" font-size="13" textLength="220.448">No branching business logic here.</text></g><g class="entity" data-qualified-name="GMN13" id="ent0014" data-source-line="27"><path d="M356.76,382.89 L356.76,429.29 L322.09,433.29 L356.76,437.29 L356.76,483.687 A0,0 0 0 0 356.76,483.687 L611.392,483.687 A0,0 0 0 0 611.392,483.687 L611.392,392.89 L601.392,382.89 L356.76,382.89 A0,0 0 0 0 356.76,382.89" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M601.392,382.89 L601.392,392.89 L611.392,392.89 L601.392,382.89" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="362.76" y="399.957" fill="#000" font-size="13" textLength="208.038">Contains the real decision logic.</text><text x="362.76" y="415.09" fill="#000" font-size="13" textLength="207.156">Every dependency is an explicit</text><text x="362.76" y="430.223" fill="#000" font-size="13" textLength="233.632">(often nullable/optional) parameter,</text><text x="362.76" y="445.355" fill="#000" font-size="13" textLength="207.048">never resolved internally -- so a</text><text x="362.76" y="460.488" fill="#000" font-size="13" textLength="201.297">test substitutes exactly what it</text><text x="362.76" y="475.621" fill="#000" font-size="13" textLength="156.26">needs and nothing else.</text></g><!--link Host to Shell--><g class="link" data-entity-1="ent0005" data-entity-2="ent0002" id="lnk7" data-source-line="13" data-link-type="dependency"><path d="M353.08,98.36 C353.08,134.13 353.08,176.96 353.08,202.2" style="stroke:#181818;stroke-width:1;" fill="none" id="Host-to-Shell"/><polygon points="353.08,207.2,357.08,198.2,353.08,202.2,349.08,198.2,353.08,207.2" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="354.08" y="141.167" fill="#000" font-size="13" textLength="136.443">starts, owns lifecycle</text></g><!--link Shell to Core--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk8" data-source-line="14" data-link-type="dependency"><path d="M341.37,244.06 C324.67,268.83 292.75,315.22 263.08,352.89 C248.5,371.4 234.434,387.694 220.744,402.994" style="stroke:#181818;stroke-width:1;" fill="none" id="Shell-to-Core"/><polygon points="217.41,406.72,226.392,402.68,220.744,402.994,220.43,397.346,217.41,406.72" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="327.126" y="318.957" fill="#000" font-size="13" textLength="135.408">delegates every call,</text><text x="297.39" y="334.09" fill="#000" font-size="13" textLength="194.879">resolved collaborators passed</text><text x="322.114" y="349.223" fill="#000" font-size="13" textLength="145.431">as explicit parameters</text></g><!--link Test to Core--><g class="link" data-entity-1="ent0006" data-entity-2="ent0004" id="lnk9" data-source-line="15" data-link-type="dependency"><path d="M87.43,272.09 C89.83,297.22 95.61,328.23 109.08,352.89 C120.59,373.99 135.88,389.489 153.11,403.399" style="stroke:#181818;stroke-width:1;" fill="none" id="Test-to-Core"/><polygon points="157,406.54,152.51,397.774,153.11,403.399,147.485,403.999,157,406.54" fill="#181818" style="stroke:#18181