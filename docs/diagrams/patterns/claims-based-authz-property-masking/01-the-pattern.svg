<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:437px;height:674px;background:#FFFFFF;" width="437px" height="674px" viewBox="0 0 437 674" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><ellipse cx="212.419" cy="25" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="86.331" y="55" width="252.178" height="33.969" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="96.331" y="76.139" fill="#000" font-size="12" textLength="232.178">Caller presents a claims-bearing token</text><rect x="81.444" y="108.969" width="261.951" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="91.444" y="130.107" fill="#000" font-size="12" textLength="215.443">Coarse check -- does the caller hold</text><text x="91.444" y="144.076" fill="#000" font-size="12" textLength="241.951">the operation/type-level required claim?</text><polygon points="146.881,176.906,277.958,176.906,289.958,188.906,277.958,200.906,146.881,200.906,134.881,188.906,146.881,176.906" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="146.881" y="192.714" fill="#000" font-size="11" textLength="131.076">required claim present?</text><text x="121.18" y="186.312" fill="#000" font-size="11" textLength="13.702">no</text><text x="289.958" y="186.312" fill="#000" font-size="11" textLength="19.008">yes</text><rect x="16" y="210.906" width="181.971" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="232.045" fill="#000" font-size="12" textLength="161.971">Reject the whole operation</text><text x="26" y="246.014" fill="#000" font-size="12" textLength="139.471">(403 / not visible at all)</text><ellipse cx="106.985" cy="289.844" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="106.985" cy="289.844" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="217.971" y="210.906" width="199.766" height="33.969" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="227.971" y="232.045" fill="#000" font-size="12" textLength="179.766">Proceed to build the response</text><rect x="122.706" y="320.844" width="179.428" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="132.706" y="341.982" fill="#000" font-size="12" textLength="156.34">For each property flagged</text><text x="132.706" y="355.951" fill="#000" font-size="12" textLength="159.428">for property-level masking</text><polygon points="134.684,388.781,290.155,388.781,302.155,401.586,290.155,414.391,134.684,414.391,122.684,401.586,134.684,388.781" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="134.684" y="398.992" fill="#000" font-size="11" textLength="155.472">caller holds THAT property's</text><text x="134.684" y="411.796" fill="#000" font-size="11" textLength="111.719">own required claim?</text><text x="103.675" y="398.992" fill="#000" font-size="11" textLength="19.008">yes</text><text x="302.155" y="398.992" fill="#000" font-size="11" textLength="13.702">no</text><rect x="25.99" y="424.391" width="167.943" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="35.99" y="445.529" fill="#000" font-size="12" textLength="114.229">Emit the real value</text><text x="35.99" y="459.498" fill="#000" font-size="12" textLength="147.943">(wrapped: {"value": ...})</text><rect x="213.934" y="424.391" width="201.887" height="61.906" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="223.934" y="445.529" fill="#000" font-size="12" textLength="181.887">Emit a masked representation</text><text x="223.934" y="459.498" fill="#000" font-size="12" textLength="161.543">(wrapped: {"masked": ...},</text><text x="223.934" y="473.467" fill="#000" font-size="12" textLength="155.578">via a configured strategy)</text><polygon points="212.419,492.297,224.419,504.297,212.419,516.297,200.419,504.297,212.419,492.297" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="85.2" y="536.297" width="254.439" height="75.875" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="95.2" y="557.436" fill="#000" font-size="12" textLength="234.439">Return one uniformly-shaped response</text><text x="95.2" y="571.404" fill="#000" font-size="12" textLength="174.211">-- every caller sees the same</text><text x="95.2" y="585.373" fill="#000" font-size="12" textLength="161.461">wrapper shape, only which</text><text x="95.2" y="599.342" fill="#000" font-size="12" textLength="161.285">branch is populated differs</text><ellipse cx="212.419" cy="643.172" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="212.419" cy="643.172" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="212.419" y1="35" x2="212.419" y2="55" style="stroke:#181818;stroke-width:1;"/><polygon points="208.419,45,212.419,55,216.419,45,212.419,49" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="212.419" y1="88.969" x2="212.419" y2="108.969" style="stroke:#181818;stroke-width:1;"/><polygon points="208.419,98.969,212.419,108.969,216.419,98.969,212.419,102.969" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="106.985" y1="258.844" x2="106.985" y2="278.844" style="stroke:#181818;stroke-width:1;"/><polygon points="102.985,268.844,106.985,278.844,110.985,268.844,106.985,272.844" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/