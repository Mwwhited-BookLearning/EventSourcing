<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SEQUENCE" style="width:488px;height:591px;background:#FFFFFF;" width="488px" height="591px" viewBox="0 0 488 591" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g><title>Rejoining replica</title><rect x="71.985" y="41.297" width="8" height="507.789" fill="#000" fill-opacity="0"/><line x1="75.485" y1="41.297" x2="75.485" y2="549.086" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>Up-to-date replica</title><rect x="404.114" y="41.297" width="8" height="507.789" fill="#000" fill-opacity="0"/><line x1="407.614" y1="41.297" x2="407.614" y2="549.086" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><rect x="10" y="10" width="130.97" height="30.297" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="17" y="29.995" fill="#000" font-size="14" textLength="116.97">Rejoining replica</text><rect x="337.303" y="10" width="140.622" height="30.297" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="344.303" y="29.995" fill="#000" font-size="14" textLength="126.622">Up-to-date replica</text><rect x="10" y="549.086" width="130.97" height="30.297" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="17" y="569.081" fill="#000" font-size="14" textLength="116.97">Rejoining replica</text><rect x="337.303" y="549.086" width="140.622" height="30.297" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="344.303" y="569.081" fill="#000" font-size="14" textLength="126.622">Up-to-date replica</text><polygon points="395.614,66.43,405.614,70.43,395.614,74.43,399.614,70.43" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="75.485" y1="70.43" x2="401.614" y2="70.43" style="stroke:#181818;stroke-width:1;"/><text x="82.485" y="65.364" fill="#000" font-size="13" font-weight="700">1</text><text x="95.53" y="65.364" fill="#000" font-size="13" textLength="166.175">root hash for range [0, N)</text><polygon points="86.485,95.563,76.485,99.563,86.485,103.563,82.485,99.563" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="80.485" y1="99.563" x2="406.614" y2="99.563" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="92.485" y="94.497" fill="#000" font-size="13" font-weight="700">2</text><text x="105.53" y="94.497" fill="#000" font-size="13" textLength="174.814">its own root hash for [0, N)</text><path d="M12.587,112.563 L12.587,167.563 L469.587,167.563 L469.587,122.563 L459.587,112.563 L12.587,112.563" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M459.587,112.563 L459.587,122.563 L469.587,122.563 L459.587,112.563" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="129.71" y="129.629" fill="#000" font-size="13" textLength="174.211">Root hashes differ -- SOME</text><text x="129.71" y="144.762" fill="#000" font-size="13" textLength="214.678">range within [0, N) has diverged.</text><text x="129.71" y="159.895" fill="#000" font-size="13" textLength="153.125">Compare children next.</text><polygon points="395.614,190.094,405.614,194.094,395.614,198.094,399.614,194.094" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="75.485" y1="194.094" x2="401.614" y2="194.094" style="stroke:#181818;stroke-width:1;"/><text x="82.485" y="189.028" fill="#000" font-size="13" font-weight="700">3</text><text x="95.53" y="189.028" fill="#000" font-size="13" textLength="239.408">child hashes for [0, N/2) and [N/2, N)</text><polygon points="86.485,219.227,76.485,223.227,86.485,227.227,82.485,223.227" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="80.485" y1="223.227" x2="406.614" y2="223.227" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="92.485" y="218.161" fill="#000" font-size="13" font-weight="700">4</text><text x="105.53" y="218.161" fill="#000" font-size="13" textLength="295.083">its own child hashes for the same two ranges</text><path d="M12.587,236.227 L12.587,306.227 L469.587,306.227 L469.587,246.227 L459.587,236.227 L12.587,236.227" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M459.587,236.227 L459.587,246.227 L469.587,246.227 L459.587,236.227" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="125.657" y="253.293" fill="#000" font-size="13" textLength="222.784">[0, N/2) hashes MATCH -- that half</text><text x="125.657" y="268.426" fill="#000" font-size="13" textLength="178.223">is provably identical, skip it</text><text x="125.657" y="283.559" fill="#000" font-size="13" textLength="222.181">entirely. [N/2, N) hashes DIFFER --</text><text x="125.657" y="298.692" fill="#000" font-size="13" textLength="94.853">recurse into it.</text><polygon points="395.614,328.891,405.614,332.891,395.614,336.891,399.614,332.891" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="75.485" y1="332.891" x2="401.614" y2="332.891" style="stroke:#181818;stroke-width:1;"/><text x="82.485" y="327.825" fill="#000" font-size="13" font-weight="700">5</text><text x="95.53" y="327.825" fill="#000" font-size="13" textLength="270.055">child hashes for [N/2, 3N/4) and [3N/4, N)</text><polygon points="86.485,358.023,76.485,362.023,86.485,366.023,82.485,362.023" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="80.485" y1="362.023" x2="406.614" y2="362.023" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="92.485" y="356.958" fill="#000" font-size="13" font-weight="700">6</text><text x="105.53" y="356.958" fill="#000" font-size="13" textLength="131.555">its own child hashes</text><path d="M12.587,375.023 L12.587,460.023 L469.587,460.023 L469.587,385.023 L459.587,375.023 L12.587,375.023" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M459.587,375.023 L459.587,385.023 L469.587,385.023 L459.587,375.023" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="125.045" y="392.09" fill="#000" font-size="13" textLength="190.169">Recursion continues until the</text><text x="125.045" y="407.223" fill="#000" font-size="13" textLength="224.009">divergent range is narrowed down</text><text x="125.045" y="422.356" fill="#000" font-size="13" textLength="220.137">to individual leaves -- only THOSE</text><text x="125.045" y="437.489" fill="#000" font-size="13" textLength="218.905">leaves' actual data is transferred,</text><text x="125.045" y="452.622" fill="#000" font-size="13" textLength="175.925">not the whole [0, N) range.</text><polygon points="395.614,497.953,405.614,501.953,395.614,505.953,399.614,501.953" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="75.485" y1="501.953" x2="401.614" y2="501.953" style="stroke:#181818;stroke-width:1;"/><text x="82.485" y="489.321" fill="#000" font-size="13" font-weight="700">7</text><text x="95.53" y="481.754" fill="#000" font-size="13" textLength="174.751">request actual data for the</text><text x="95.53" y="496.887" fill="#000" font-size="13" textLength="213.948">narrow divergent leaf range only</text><polygon points="86.485,527.086,76.485,531.086,86.485,535.086,82.485,531.086" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="80.485" y1="531.086" x2="406.614" y2="531.086" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="92.485" y="526.02" fill="#000" font-size="13" font-weight="700">8</text><text x="105.53" y="526.02" fill="#000" font-size="13" textLength="187.18">the missing/diffe