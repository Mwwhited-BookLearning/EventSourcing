">2</text><text x="454.994" y="110.793" fill="#000" font-size="13" textLength="113.426">HasClaim(C) AND</text><text x="454.994" y="125.926" fill="#000" font-size="13" textLength="183.454">EntityScope(C) contains E1?</text><polygon points="169.753,169.125,159.753,173.125,169.753,177.125,165.753,173.125" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="163.753" y1="173.125" x2="433.948" y2="173.125" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="175.753" y="168.059" fill="#000" font-size="13" font-weight="700">3</text><text x="188.799" y="168.059" fill="#000" font-size="13" textLength="50.026">allowed</text><polygon points="669.917,198.258,679.917,202.258,669.917,206.258,673.917,202.258" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="434.948" y1="202.258" x2="675.917" y2="202.258" style="stroke:#181818;stroke-width:1;"/><text x="441.948" y="197.192" fill="#000" font-size="13" font-weight="700">4</text><text x="454.994" y="197.192" fill="#000" font-size="13" textLength="209.923">ordinary, unfiltered query for E1</text><polygon points="422.948,227.391,432.948,231.391,422.948,235.391,426.948,231.391" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="158.753" y1="231.391" x2="428.948" y2="231.391" style="stroke:#181818;stroke-width:1;"/><text x="165.753" y="226.325" fill="#000" font-size="13" font-weight="700">5</text><text x="178.799" y="226.325" fill="#000" font-size="13" textLength="235.282">request entity E2 (presents claim C)</text><line x1="434.948" y1="275.656" x2="476.948" y2="275.656" style="stroke:#181818;stroke-width:1;"/><line x1="476.948" y1="275.656" x2="476.948" y2="288.656" style="stroke:#181818;stroke-width:1;"/><line x1="435.948" y1="288.656" x2="476.948" y2="288.656" style="stroke:#181818;stroke-width:1;"/><polygon points="445.948,284.656,435.948,288.656,445.948,292.656,441.948,288.656" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="441.948" y="263.024" fill="#000" font-size="13" font-weight="700">6</text><text x="454.994" y="255.458" fill="#000" font-size="13" textLength="113.426">HasClaim(C) AND</text><text x="454.994" y="270.59" fill="#000" font-size="13" textLength="183.454">EntityScope(C) contains E2?</text><polygon points="169.753,313.789,159.753,317.789,169.753,321.789,165.753,317.789" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="163.753" y1="317.789" x2="433.948" y2="317.789" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="175.753" y="312.723" fill="#000" font-size="13" font-weight="700">7</text><text x="188.799" y="312.723" fill="#000" font-size="13" textLength="44.351">denied</text><path d="M439.948,330.789 L439.948,476.789 L669.948,476.789 L669.948,340.789 L659.948,330.789 L439.948,330.789" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M659.948,330.789 L659.948,340.789 L669.948,340.789 L659.948,330.789" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="445.948" y="347.856" fill="#000" font-size="13" textLength="185.961">The row-scope check runs in</text><text x="445.948" y="362.989" fill="#000" font-size="13" textLength="184.698">application code against the</text><text x="445.948" y="378.122" fill="#000" font-size="13" textLength="188.348">claim's own entity-scope list.</text><text x="445.948" y="393.254" fill="#000" font-size="13" textLength="195.698">The query issued to the store,</text><text x="445.948" y="408.387" fill="#000" font-size="13" textLength="209.828">when allowed, is ordinary SQL --</text><text x="445.948" y="423.52" fill="#000" font-size="13" textLength="204.731">no provider-native row-security</text><text x="445.948" y="438.653" fill="#000" font-size="13" textLength="193.559">feature is in play, so behavior</te